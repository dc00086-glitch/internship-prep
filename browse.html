   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The modeller needs the phase 1 data as a NONMEM dataset by Friday. What you\nhave is what you always have: a sample table from the bioanalytical lab, a\ndosing record from the pharmacy, and a demographics table from the clinical\ndatabase, all keyed on subject number and none of them in the shape the model\nneeds.</p>\n<p>This is the job. Not glamorous, entirely unavoidable, and the place where\nreal analyses go wrong. A dataset with the dose record sorted after the first\nobservation runs without complaint and produces estimates that are wrong, and\nnothing in the output says so.</p>\n<p>Today you build one, audit it, and then do the per subject NCA that the\nmodeller will compare their fit against.</p>"
   },
   {
    "key": "concept",
    "label": "Event records, and the four columns that carry the logic",
    "html": "<h2>Event records, and the four columns that carry the logic</h2>\n<p>A NONMEM dataset is not a table of observations. It is a <strong>time ordered list of\nevents</strong> for each subject, where an event is either something given or\nsomething measured. One row, one event.</p>\n<p>The required columns, with the conventional names:</p>\n<table>\n<thead>\n<tr>\n<th>Column</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>ID</code></td>\n<td>subject identifier, grouping the rows</td>\n</tr>\n<tr>\n<td><code>TIME</code></td>\n<td>hours since the subject's first event</td>\n</tr>\n<tr>\n<td><code>AMT</code></td>\n<td>amount given on a dosing row, 0 on an observation row</td>\n</tr>\n<tr>\n<td><code>DV</code></td>\n<td>the dependent variable, the measurement, 0 on a dosing row</td>\n</tr>\n<tr>\n<td><code>EVID</code></td>\n<td>event ID: 1 for a dose, 0 for an observation</td>\n</tr>\n<tr>\n<td><code>MDV</code></td>\n<td>missing dependent variable: 1 if there is no usable measurement</td>\n</tr>\n<tr>\n<td><code>CMT</code></td>\n<td>which compartment the event applies to</td>\n</tr>\n</tbody>\n</table>\n<p><strong><code>EVID</code> is the switch.</strong> <code>EVID = 1</code> means give <code>AMT</code> into compartment <code>CMT</code>\nand ignore <code>DV</code>. <code>EVID = 0</code> means compare <code>DV</code> with the model's prediction.\nOther values exist, 2 for other type events and 3 for a reset, and you will\nmeet them when you meet a study design that needs them.</p>\n<p><strong><code>MDV = 1</code> means do not use this <code>DV</code>.</strong> Dosing rows always have <code>MDV = 1</code>,\nbecause there is nothing to fit there. Observation rows get <code>MDV = 1</code> when the\nsample is missing, lost, or below the limit of quantification.</p>\n<p><strong>Sort order is part of the data.</strong> Rows are processed in the order they appear,\nso they must be sorted by <code>ID</code> then <code>TIME</code>, and <strong>at identical times the dose\nhas to come first</strong>. A pre dose sample and the dose are both at time zero, and\nif the sample is processed second it will be compared against a prediction that\nalready includes the dose. The fix is to sort with <code>EVID</code> descending within\n<code>TIME</code>:</p>\n<pre><code>df.sort_values([&quot;ID&quot;, &quot;TIME&quot;, &quot;EVID&quot;], ascending=[True, True, False])\n</code></pre>\n<p><strong>BLQ, and why it is handled twice.</strong> A sample below the LLOQ is not a\nconcentration of zero and not a missing value either, it is the information\nthat the true value lies somewhere between zero and the LLOQ. There are\nseveral conventions:</p>\n<ul>\n<li><strong>M1</strong>, drop the record, or equivalently set <code>MDV = 1</code>. The default, and what\n  you will do today,</li>\n<li><strong>M3</strong>, keep it and treat it as censored, which is more correct and needs a\n  likelihood that NONMEM can do and <code>curve_fit</code> cannot,</li>\n<li>substitute <code>LLOQ / 2</code>, common in NCA, defensible, biased,</li>\n<li>substitute zero, which is what NCA does for a pre dose sample after an oral\n  dose, where zero is not a substitution but the truth.</li>\n</ul>\n<p>Note the consequence: the same record can be <code>MDV = 1</code> for the model fit and\ntreated as a hard zero in the NCA of the same dataset. That is not an\ninconsistency, it is two analyses answering different questions, but it does\nneed writing down in the analysis plan.</p>"
   },
   {
    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>assemble the event records in the right order</td>\n<td><code>nm</code>, <code>n_rows</code>, <code>n_dose_rows</code>, <code>first_evid_per_id</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>audit it before anybody fits anything</td>\n<td><code>n_blq</code>, <code>n_mdv</code>, <code>records_per_id</code>, <code>time_monotone</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>per subject NCA, merged with the dosing and demographics</td>\n<td><code>nca</code>, <code>auc_dn_low</code>, <code>auc_dn_high</code>, <code>auc_dn_ratio</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"
   },
   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\n\nPROBLEM_ID = &quot;W8D4&quot;\nTOPIC = &quot;Population PK: event records, EVID and MDV, BLQ handling, per subject NCA with groupby&quot;\n\npd.set_option(&quot;display.width&quot;, 120)\n\nN_SUBJ = 8\nLLOQ = 0.05          # mg/L, lower limit of quantification\n_KA = 1.0\n_CL_POP = 4.2\n_V_POP = 35.0\n\n_doses = np.array([50.0] * 4 + [150.0] * 4)\n_times = np.array([0.0, 0.5, 1.0, 2.0, 4.0, 8.0, 12.0, 24.0])\n\n_rng = np.random.default_rng(8426)\n_cl = _CL_POP * _rng.lognormal(0.0, 0.30, N_SUBJ)\n_v = _V_POP * _rng.lognormal(0.0, 0.25, N_SUBJ)\n_wt = np.round(70.0 * _rng.lognormal(0.0, 0.15, N_SUBJ), 1)\n_age = _rng.integers(21, 65, N_SUBJ)\n_sex = _rng.integers(0, 2, N_SUBJ)\n\n_rows = []\nfor _i in range(N_SUBJ):\n    _k = _cl[_i] / _v[_i]\n    _c = (_doses[_i] * _KA / (_v[_i] * (_KA - _k))\n          * (np.exp(-_k * _times) - np.exp(-_KA * _times)))\n    _c = np.round(np.maximum(_c * _rng.lognormal(0.0, 0.08, _times.size), 0.0), 4)\n    for _t, _cc in zip(_times, _c):\n        _rows.append((_i + 1, float(_t), float(_cc)))\n\n# Three source tables, as they would arrive.\nsamples = pd.DataFrame(_rows, columns=[&quot;ID&quot;, &quot;TIME&quot;, &quot;CONC&quot;])\ndosing = pd.DataFrame({&quot;ID&quot;: np.arange(1, N_SUBJ + 1), &quot;AMT&quot;: _doses})\ndemog = pd.DataFrame({&quot;ID&quot;: np.arange(1, N_SUBJ + 1), &quot;WT_KG&quot;: _wt,\n                      &quot;AGE_Y&quot;: _age, &quot;SEX&quot;: _sex})\n\nNM_COLS = [&quot;ID&quot;, &quot;TIME&quot;, &quot;AMT&quot;, &quot;DV&quot;, &quot;EVID&quot;, &quot;MDV&quot;, &quot;CMT&quot;]\n\nprint(&quot;samples: %d rows&quot; % len(samples))\nprint(samples.head(10).to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;dosing:&quot;)\nprint(dosing.to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;demog:&quot;)\nprint(demog.to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;LLOQ = %.2f mg/L, and %d of the %d samples are below it&quot;\n      % (LLOQ, int((samples[&quot;CONC&quot;] &lt; LLOQ).sum()), len(samples)))\nprint(&quot;every dose is given at time 0, and every subject has a pre dose sample&quot;)</code></pre>"
   },
   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>add constant columns</td>\n<td><code>df.assign(EVID=1, MDV=1)</code></td>\n</tr>\n<tr>\n<td>a column from a condition</td>\n<td><code>np.where(df[\"CONC\"] &lt; LLOQ, 1, 0)</code></td>\n</tr>\n<tr>\n<td>stack two tables</td>\n<td><code>pd.concat([a, b], ignore_index=True)</code></td>\n</tr>\n<tr>\n<td>choose and order columns</td>\n<td><code>df[NM_COLS]</code></td>\n</tr>\n<tr>\n<td>sort, with one column descending</td>\n<td><code>df.sort_values([...], ascending=[True, True, False])</code></td>\n</tr>\n<tr>\n<td>renumber the index afterwards</td>\n<td><code>.reset_index(drop=True)</code></td>\n</tr>\n<tr>\n<td>rows per group</td>\n<td><code>df.groupby(\"ID\").size()</code></td>\n</tr>\n<tr>\n<td>the first row of each group</td>\n<td><code>df.groupby(\"ID\").first()</code></td>\n</tr>\n<tr>\n<td>is a series sorted</td>\n<td><code>s.is_monotonic_increasing</code></td>\n</tr>\n<tr>\n<td>a per group calculation returning several numbers</td>\n<td><code>df.groupby(\"ID\")[[\"TIME\", \"DV\"]].apply(fn)</code></td>\n</tr>\n<tr>\n<td>join a lookup table</td>\n<td><code>left.merge(right, on=\"ID\", validate=\"many_to_one\")</code></td>\n</tr>\n</tbody>\n</table>\n<p>The <code>groupby(\"ID\")[[\"TIME\", \"DV\"]].apply(fn)</code> form is the one to use. Selecting\nthe columns you need before <code>apply</code> keeps the group key out of the sub frame,\nwhich is what newer pandas wants and older pandas tolerates, so the same line\nworks everywhere.</p><pre class=\"code\"><code>import numpy as np\nimport pandas as pd\n\ndemo_obs = pd.DataFrame({&quot;ID&quot;: [1, 1, 1, 2, 2, 2],\n                         &quot;TIME&quot;: [0.0, 1.0, 4.0, 0.0, 1.0, 4.0],\n                         &quot;CONC&quot;: [0.0, 2.0, 0.9, 0.0, 3.0, 1.4]})\ndemo_dose = pd.DataFrame({&quot;ID&quot;: [1, 2], &quot;AMT&quot;: [10.0, 20.0]})\ndemo_lloq = 0.1\ndemo_cols = [&quot;ID&quot;, &quot;TIME&quot;, &quot;AMT&quot;, &quot;DV&quot;, &quot;EVID&quot;, &quot;MDV&quot;, &quot;CMT&quot;]\n\nprint(&quot;--- 1. assign makes the constant columns ---&quot;)\ndemo_d = demo_dose.assign(TIME=0.0, DV=0.0, EVID=1, MDV=1, CMT=1)[demo_cols]\nprint(demo_d.to_string(index=False))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. np.where makes the conditional ones ---&quot;)\ndemo_o = demo_obs.assign(AMT=0.0, DV=demo_obs[&quot;CONC&quot;], EVID=0, CMT=2,\n                         MDV=np.where(demo_obs[&quot;CONC&quot;] &lt; demo_lloq, 1, 0))[demo_cols]\nprint(demo_o.to_string(index=False))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. concat then sort, and watch the tie at time 0 ---&quot;)\ndemo_bad = pd.concat([demo_d, demo_o], ignore_index=True).sort_values([&quot;ID&quot;, &quot;TIME&quot;])\nprint(&quot;sorted by ID and TIME only, subject 1:&quot;)\nprint(demo_bad[demo_bad[&quot;ID&quot;] == 1].to_string(index=False))\ndemo_nm = (pd.concat([demo_d, demo_o], ignore_index=True)\n           .sort_values([&quot;ID&quot;, &quot;TIME&quot;, &quot;EVID&quot;], ascending=[True, True, False])\n           .reset_index(drop=True))\nprint(&quot;with EVID descending inside TIME, subject 1:&quot;)\nprint(demo_nm[demo_nm[&quot;ID&quot;] == 1].to_string(index=False))\nprint(&quot;the dose is now first, which is the only order that means what you intend&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. per group counts and checks ---&quot;)\nprint(&quot;rows per subject:&quot;)\nprint(demo_nm.groupby(&quot;ID&quot;).size().to_string())\nprint(&quot;first EVID per subject:&quot;)\nprint(demo_nm.groupby(&quot;ID&quot;)[&quot;EVID&quot;].first().to_string())\nprint(&quot;TIME non decreasing within every subject:&quot;,\n      bool(demo_nm.groupby(&quot;ID&quot;)[&quot;TIME&quot;].apply(lambda s: s.is_monotonic_increasing).all()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. a per group calculation that returns several numbers ---&quot;)\n\n\ndef demo_summary(g):\n    g = g.sort_values(&quot;TIME&quot;)\n    t = g[&quot;TIME&quot;].values\n    c = g[&quot;DV&quot;].values\n    i = int(np.argmax(c))\n    area = float(np.sum(0.5 * (c[1:] + c[:-1]) * np.diff(t)))\n    return pd.Series({&quot;CMAX&quot;: float(c[i]), &quot;TMAX&quot;: float(t[i]), &quot;AUC&quot;: area})\n\n\ndemo_only_obs = demo_nm[demo_nm[&quot;EVID&quot;] == 0]\ndemo_res = demo_only_obs.groupby(&quot;ID&quot;)[[&quot;TIME&quot;, &quot;DV&quot;]].apply(demo_summary).reset_index()\nprint(demo_res.to_string(index=False))\n\nprint(&quot;&quot;)\nprint(&quot;--- 6. merge with validate, which catches duplicate keys ---&quot;)\nprint(demo_res.merge(demo_dose, on=&quot;ID&quot;, validate=&quot;one_to_one&quot;).to_string(index=False))\ndemo_dupe = pd.concat([demo_dose, demo_dose.head(1)], ignore_index=True)\ntry:\n    demo_res.merge(demo_dupe, on=&quot;ID&quot;, validate=&quot;one_to_one&quot;)\nexcept Exception as err:\n    print(&quot;a duplicated key is caught:&quot;, str(err)[:70])\nprint(&quot;without validate, that merge silently returns extra rows&quot;)</code></pre>"
   },
   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Assemble the event records</h2>\n<p>Build <code>nm</code>, the NONMEM dataset, from <code>samples</code> and <code>dosing</code>.</p>\n<p>The dosing rows: one per subject, <code>TIME</code> 0, <code>AMT</code> from <code>dosing</code>, <code>DV</code> 0,\n<code>EVID</code> 1, <code>MDV</code> 1, <code>CMT</code> 1.</p>\n<p>The observation rows: one per sample, <code>AMT</code> 0, <code>DV</code> the concentration, <code>EVID</code>\n0, <code>CMT</code> 2, and <code>MDV</code> 1 where the concentration is below <code>LLOQ</code> and 0\notherwise.</p>\n<p>Then concatenate them, select the columns in the order <code>NM_COLS</code>, and sort by\n<code>ID</code>, <code>TIME</code>, and <code>EVID</code> <strong>descending</strong>, so that the dose comes before the pre\ndose sample at time zero. Reset the index.</p>\n<p>Record <code>n_rows</code>, the total number of rows, <code>n_dose_rows</code>, how many have\n<code>EVID</code> of 1, and <code>first_evid_per_id</code>, the <code>EVID</code> of the first row of each\nsubject as an array of eight numbers. That last one is the check that the sort\nworked: every entry must be 1. If any subject starts with a 0, that subject's\nfirst observation is being compared against a model that has not been dosed\nyet.</p>\n<p>Print the first eleven rows when you have it. You should see the dose for\nsubject 1, then the pre dose sample with <code>MDV</code> of 1, then seven usable\nobservations, then subject 2's dose.</p>\n<p>Fill in <code>nm</code>, <code>n_rows</code>, <code>n_dose_rows</code>, <code>first_evid_per_id</code>.</p>\n<p>Moves: <code>assign</code>, <code>np.where</code>, <code>pd.concat</code>, column selection, <code>sort_values</code>\nwith mixed <code>ascending</code>, <code>reset_index</code>, <code>groupby(...).first()</code>.</p><pre class=\"code\"><code># Part a. Build the dataset.\n\ndose_rows = None  # YOUR CODE: one row per subject, EVID 1, from `dosing`\nobs_rows = None   # YOUR CODE: one row per sample, EVID 0, from `samples`\n\nnm = None         # YOUR CODE: concat, select NM_COLS, sort, reset_index\n\nn_rows = None             # YOUR CODE: total rows\nn_dose_rows = None        # YOUR CODE: rows with EVID == 1\nfirst_evid_per_id = None  # YOUR CODE: EVID of the first row of each subject\n\nprint(&quot;rows: %r, of which dosing records: %r&quot; % (n_rows, n_dose_rows))\nprint(&quot;first EVID per subject:&quot;, first_evid_per_id)\nif nm is not None:\n    print(&quot;&quot;)\n    print(nm.head(11).to_string(index=False))</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Audit it</h2>\n<p>Four checks, each one line, each one catching a real class of error.</p>\n<ul>\n<li><code>n_blq</code>, how many observation rows are below the LLOQ. Count rows with\n  <code>EVID</code> of 0 and <code>MDV</code> of 1,</li>\n<li><code>n_mdv</code>, how many rows in total have <code>MDV</code> of 1. This should be <code>n_blq</code> plus\n  the eight dosing rows,</li>\n<li><code>records_per_id</code>, the number of rows for each subject, as an array of eight.\n  All eight should be 9: one dose and eight samples,</li>\n<li><code>time_monotone</code>, True if <code>TIME</code> is non decreasing within every subject.</li>\n</ul>\n<p>You should find ten BLQ records and eighteen <code>MDV</code> rows. Eight of the ten are\nthe pre dose samples, which are below the limit because the drug has not been\ngiven yet. The other two are subjects 3 and 4 at 24 hours, who cleared the\n50 mg dose fast enough to fall under the limit by the last sample. Those two\nare the ones to think about: a genuine measurement attempt that came back with\nno number, which is where the choice of BLQ method starts to matter.</p>\n<p>The counts are not busy work. A subject with eight rows instead of nine has\nlost a sample somewhere in the merge. A subject whose rows are not time ordered\nwill produce quiet nonsense. Both have happened in real submissions.</p>\n<p>Fill in <code>n_blq</code>, <code>n_mdv</code>, <code>records_per_id</code>, <code>time_monotone</code>.</p>\n<p>Moves: boolean masks and <code>.sum()</code>, <code>groupby(...).size()</code>,\n<code>is_monotonic_increasing</code>.</p><pre class=\"code\"><code># Part b. Audit the dataset.\n\nn_blq = None           # YOUR CODE: observation rows below the LLOQ\nn_mdv = None           # YOUR CODE: all rows with MDV == 1\nrecords_per_id = None  # YOUR CODE: rows per subject, as an array of 8\ntime_monotone = None   # YOUR CODE: True if TIME never decreases within a subject\n\nprint(&quot;observation rows below the LLOQ: %r&quot; % (n_blq,))\nprint(&quot;rows with MDV = 1             : %r&quot; % (n_mdv,))\nprint(&quot;rows per subject              :&quot;, records_per_id)\nprint(&quot;TIME non decreasing in every subject:&quot;, time_monotone)\nif nm is not None:\n    print(&quot;&quot;)\n    print(&quot;the BLQ observation rows:&quot;)\n    print(nm[(nm[&quot;EVID&quot;] == 0) &amp; (nm[&quot;MDV&quot;] == 1)].to_string(index=False))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Per subject NCA, and a dose proportionality trap</h2>\n<p>Now produce the NCA summary the modeller will compare their fit against.</p>\n<p>Work from the observation rows only, <code>EVID</code> of 0, and treat the <code>DV</code> column as\nit stands, so BLQ records count as zero. For a pre dose sample after an oral\ndose that is exactly right. For the two 24 hour samples it is the zero\nsubstitution convention, which here costs almost nothing because the values\nwere under 0.03 mg/L, and which you would record in the analysis plan.</p>\n<p>Write a function that takes a sub frame of <code>TIME</code> and <code>DV</code> for one subject and\nreturns a Series with <code>CMAX</code>, <code>TMAX</code> and <code>AUC</code>, the last by the linear\ntrapezoid rule over the samples as they are. Apply it with\n<code>groupby(\"ID\")[[\"TIME\", \"DV\"]].apply(...)</code>, reset the index, then merge on the\ndosing table and the demographics, using <code>validate=\"one_to_one\"</code> so that a\nduplicated key would raise rather than silently duplicate rows.</p>\n<p>Add a dose normalised column, <code>AUC</code> divided by <code>AMT</code>, and call the result\n<code>nca</code>. Then compare the two dose groups:</p>\n<ul>\n<li><code>auc_dn_low</code>, the geometric mean dose normalised AUC in the 50 mg group,</li>\n<li><code>auc_dn_high</code>, the same in the 150 mg group,</li>\n<li><code>auc_dn_ratio</code>, high divided by low.</li>\n</ul>\n<p>The ratio comes out at 1.20. Taken at face value that says exposure rises\nfaster than dose, by twenty percent over a three fold dose range, which is the\nkind of finding that gets a slide of its own and a discussion about saturable\nfirst pass metabolism.</p>\n<p>It is an artifact, and here you can prove it, because the data were simulated\nwith exposure exactly proportional to dose in every subject: <code>AUC</code> to infinity\nis <code>DOSE / CL</code> by construction. What differs between the groups is the people.\nThe four subjects who got 50 mg have a geometric mean clearance of 4.71 L/h and\nthe four who got 150 mg have 3.66 L/h, 29 percent lower, because with four\nsubjects per group that is well within the luck of the draw. The dose had\nnothing to do with it.</p>\n<p>This is why dose proportionality is assessed within subjects, in a crossover,\nwhenever it can be, and when it cannot, with a power model on the log scale and\na confidence interval wide enough to be honest about eight people.</p>\n<p>Fill in <code>nca</code>, <code>auc_dn_low</code>, <code>auc_dn_high</code>, <code>auc_dn_ratio</code>.</p>\n<p>Moves: <code>groupby(...)[[cols]].apply</code>, <code>reset_index</code>, <code>merge</code> with <code>validate</code>,\ngeometric means.</p><pre class=\"code\"><code># Part c. NCA per subject, and the dose groups compared.\n\ndef nca_one(g):\n    &quot;&quot;&quot;CMAX, TMAX and linear trapezoid AUC for one subject.&quot;&quot;&quot;\n    g = g.sort_values(&quot;TIME&quot;)\n    # YOUR CODE: pull out TIME and DV, find the peak, integrate\n    return None\n\n\nnca = None  # YOUR CODE: the per subject table, merged with dosing and demog,\n            #            with an AUC_DN column\n\nauc_dn_low = None    # YOUR CODE: geometric mean AUC_DN in the 50 mg group\nauc_dn_high = None   # YOUR CODE: geometric mean AUC_DN in the 150 mg group\nauc_dn_ratio = None  # YOUR CODE: high divided by low\n\nif nca is not None:\n    print(nca.to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;dose normalised AUC, geometric mean&quot;)\nprint(&quot;  50 mg group : %r&quot; % (auc_dn_low,))\nprint(&quot; 150 mg group : %r&quot; % (auc_dn_high,))\nprint(&quot;  ratio       : %r&quot; % (auc_dn_ratio,))</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The phase 2 dose has to be chosen this month, from five candidates given once\ndaily: 25, 50, 100, 150 and 200 mg. You have a PK model, a PD model, and\nestimates of how much both vary between people. What you do not have is any\nphase 2 data, which is the point: the decision has to be made before the study\nthat would settle it.</p>\n<p>The efficacy criterion, agreed with the clinical team, is that average\ninhibition of the target over the dosing interval should be at least 55\npercent. The safety criterion, from the thorough QT study and the phase 1\ntolerability data, is that the steady state peak concentration should stay at\nor below 3 mg/L.</p>\n<p>A patient counts as a success only if both hold. Your job is to work out, for\neach dose, what fraction of patients that is, and to recommend one.</p>\n<p>This is the last problem of the Python phase, and it uses most of it: a\npopulation drawn from lognormal distributions, a closed form steady state PK\nmodel evaluated by broadcasting, an Emax model on top, numerical integration\nover the dosing interval, and a decision read off the numbers at the end.</p>"

   {
    "key": "concept",
    "label": "Steady state, and the two things that decide a dose",
    "html": "<h2>Steady state, and the two things that decide a dose</h2>\n<p><strong>The steady state profile, in closed form.</strong> For a one compartment model with\nfirst order absorption, dosing every <code>tau</code> hours, the concentration during a\ndosing interval at steady state is</p>\n<pre><code>C_ss(t) = (DOSE * ka) / (V * (ka - k)) * ( exp(-k t) / (1 - exp(-k tau))\n                                         - exp(-ka t) / (1 - exp(-ka tau)) )\n</code></pre>\n<p>for <code>t</code> from 0 to <code>tau</code>. It is the single dose equation with each exponential\ndivided by one minus its own accumulation factor, which is what summing an\ninfinite series of doses gives you. No solver needed, so you can evaluate it\nfor four hundred subjects at five doses in one expression.</p>\n<p><strong>Average concentration is simpler than it looks.</strong> Integrate that expression\nover one interval and divide by <code>tau</code> and almost everything cancels:</p>\n<pre><code>C_avg,ss = DOSE / (CL * tau)\n</code></pre>\n<p>Clearance and the dosing interval, nothing else. Not volume, not absorption\nrate. Those two decide how far the concentration swings above and below\n<code>C_avg</code>, which is a different question, and often the more important one, since\nthe peak drives tolerability and the trough drives loss of effect.</p>\n<p><strong>Probability of target attainment.</strong> With a population rather than one\ntypical subject, the output of a simulation is not a number, it is a fraction:\nwhat proportion of subjects meet the criterion. Doing this for both an efficacy\nand a safety criterion, and requiring both at once, is standard dose selection\npractice.</p>\n<p>The thing to watch for is that <strong>the two criteria move in opposite directions\nwith dose</strong>, so the joint probability has a maximum somewhere in the middle and\nthe best dose is almost never the one that maximises efficacy. A dose that\ntreats ninety percent of patients effectively and poisons seventy percent of\nthem is not a better dose than one that treats seventy two percent and poisons\nnine.</p>\n<p><strong>Why the safety curve turns so sharply.</strong> Peak concentration is proportional\nto dose, so the whole distribution of <code>Cmax</code> slides up as the dose rises. When\nthe safety limit sits between the median <code>Cmax</code> at one dose and the median at\nthe next, a single dose step flips most of the population from one side of it\nto the other. That is why dose steps near the top of the range are small, and\nwhy the interesting question is never the mean exposure, it is where the limit\nfalls in the distribution.</p>"
   },

    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\n\nPROBLEM_ID = &quot;W8D5&quot;\nTOPIC = &quot;PK/PD: steady state exposure, probability of target attainment, joint efficacy and safety&quot;\n\nN_SUBJ = 400\nTAU = 24.0            # h, once daily dosing\nKA = 1.0              # per h, absorption, the same in everybody\n\n# Typical values and between subject variability.\nCL_POP = 4.2          # L/h\nV_POP = 35.0          # L\nIC50_POP = 0.4        # mg/L\nIMAX = 1.0            # full inhibition is achievable at high enough concentration\n\nOMEGA_CL = 0.30\nOMEGA_V = 0.25\nOMEGA_IC50 = 0.40     # PD variability is usually larger than PK variability\n\n# The decision criteria.\nEFF_TARGET = 0.55     # average inhibition over the interval must reach this\nCMAX_LIMIT = 3.0      # mg/L, steady state peak must not exceed this\n\nDOSES = np.array([25.0, 50.0, 100.0, 150.0, 200.0])\nDOSE_MID = 100.0\n\n# One dosing interval, on a fixed grid.\nt_grid = np.linspace(0.0, TAU, 241)\n\n# The virtual population, drawn once so that everyone works with the same\n# four hundred patients.\n_rng = np.random.default_rng(8501)\ncl_i = CL_POP * _rng.lognormal(0.0, OMEGA_CL, size=N_SUBJ)\nv_i = V_POP * _rng.lognormal(0.0, OMEGA_V, size=N_SUBJ)\nic50_i = IC50_POP * _rng.lognormal(0.0, OMEGA_IC50, size=N_SUBJ)\n\nprint(&quot;%d patients, dosed every %g h&quot; % (N_SUBJ, TAU))\nprint(&quot;clearance   : geometric mean %.4f L/h&quot; % np.exp(np.mean(np.log(cl_i))))\nprint(&quot;volume      : geometric mean %.4f L&quot; % np.exp(np.mean(np.log(v_i))))\nprint(&quot;IC50        : geometric mean %.4f mg/L&quot; % np.exp(np.mean(np.log(ic50_i))))\nprint(&quot;&quot;)\nprint(&quot;efficacy criterion: average inhibition over the interval at least %.0f pct&quot;\n      % (100 * EFF_TARGET))\nprint(&quot;safety criterion  : steady state Cmax at most %.1f mg/L&quot; % CMAX_LIMIT)\nprint(&quot;candidate doses   :&quot;, DOSES)\nprint(&quot;grid              : %d points over one %g h interval&quot; % (t_grid.size, TAU))</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>the steady state factor</td>\n<td><code>1 - np.exp(-k * TAU)</code></td>\n</tr>\n<tr>\n<td>one subject's profile</td>\n<td>plain arithmetic on <code>t_grid</code></td>\n</tr>\n<tr>\n<td>four hundred profiles at once</td>\n<td><code>k[:, None]</code> against <code>t_grid[None, :]</code>, giving <code>(400, 241)</code></td>\n</tr>\n<tr>\n<td>the peak for each subject</td>\n<td><code>C.max(axis=1)</code></td>\n</tr>\n<tr>\n<td>the average over an interval</td>\n<td>trapezoids along <code>axis=1</code>, divided by <code>TAU</code></td>\n</tr>\n<tr>\n<td>a fraction meeting a condition</td>\n<td><code>(x &gt;= target).mean()</code></td>\n</tr>\n<tr>\n<td>both conditions at once</td>\n<td><code>((a &gt;= x) &amp; (b &lt;= y)).mean()</code></td>\n</tr>\n<tr>\n<td>which entry is largest</td>\n<td><code>int(np.argmax(values))</code></td>\n</tr>\n</tbody>\n</table>\n<p>The trapezoid along rows is worth writing out once:</p>\n<pre><code>area = np.sum(0.5 * (C[:, 1:] + C[:, :-1]) * np.diff(t_grid)[None, :], axis=1)\n</code></pre>\n<p><code>np.diff(t_grid)</code> has 240 entries, one per interval, and <code>[None, :]</code> lines it\nup against the 400 by 240 array of trapezoid heights.</p><pre class=\"code\"><code>import numpy as np\n\nprint(&quot;--- 1. the steady state factor, and what it does ---&quot;)\ndemo_tau = 24.0\nfor demo_k in (0.03, 0.12, 0.5):\n    print(&quot;k %.2f per h, half life %5.1f h, 1 - exp(-k tau) = %.4f, so the slow term is &quot;\n          &quot;divided by that&quot; % (demo_k, np.log(2) / demo_k, 1 - np.exp(-demo_k * demo_tau)))\nprint(&quot;a long half life relative to the interval means a small divisor and real accumulation&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. one profile, then four hundred, with no loop ---&quot;)\ndemo_t = np.linspace(0.0, 24.0, 5)\ndemo_k = np.array([0.08, 0.12, 0.20])        # three subjects\ndemo_coef = np.array([3.0, 3.2, 3.4])\ndemo_one = demo_coef[1] * np.exp(-demo_k[1] * demo_t)\nprint(&quot;one subject :&quot;, np.round(demo_one, 4))\ndemo_all = demo_coef[:, None] * np.exp(-demo_k[:, None] * demo_t[None, :])\nprint(&quot;three at once, shape&quot;, demo_all.shape)\nprint(np.round(demo_all, 4))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. peaks and interval averages along rows ---&quot;)\nprint(&quot;max along axis=1 :&quot;, np.round(demo_all.max(axis=1), 4))\ndemo_area = np.sum(0.5 * (demo_all[:, 1:] + demo_all[:, :-1])\n                   * np.diff(demo_t)[None, :], axis=1)\nprint(&quot;trapezoid area   :&quot;, np.round(demo_area, 4))\nprint(&quot;average over 24 h:&quot;, np.round(demo_area / 24.0, 4))\nprint(&quot;axis=1 collapses time and leaves one number per subject&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. a fraction is just the mean of a boolean ---&quot;)\ndemo_vals = np.array([0.4, 0.6, 0.7, 0.52, 0.9])\nprint(&quot;values:&quot;, demo_vals)\nprint(&quot;fraction at or above 0.55:&quot;, float((demo_vals &gt;= 0.55).mean()))\ndemo_cmax = np.array([1.0, 2.0, 3.5, 2.9, 4.0])\nprint(&quot;fraction above a Cmax limit of 3.0:&quot;, float((demo_cmax &gt; 3.0).mean()))\nprint(&quot;both conditions:&quot;, float(((demo_vals &gt;= 0.55) &amp; (demo_cmax &lt;= 3.0)).mean()))\nprint(&quot;note the &amp; and the brackets: `and` does not work elementwise&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. picking the winner ---&quot;)\ndemo_doses = np.array([10.0, 20.0, 40.0, 80.0])\ndemo_success = np.array([0.1, 0.5, 0.42, 0.05])\ndemo_best = int(np.argmax(demo_success))\nprint(&quot;success by dose:&quot;, demo_success)\nprint(&quot;best is index %d, which is %g mg&quot; % (demo_best, demo_doses[demo_best]))\nprint(&quot;argmax gives the position, so index the dose array with it&quot;)</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. The typical subject at steady state</h2>\n<p>Work out the steady state profile over one dosing interval for a subject with\nthe typical parameters <code>CL_POP</code> and <code>V_POP</code>, at <code>DOSE_MID</code>, using the closed\nform from the concept section with <code>k = CL / V</code>.</p>\n<p>Record:</p>\n<ul>\n<li><code>c_typ</code>, the profile over <code>t_grid</code>, an array of 241 concentrations,</li>\n<li><code>cmax_ss</code>, the peak,</li>\n<li><code>cmin_ss</code>, the trough,</li>\n<li><code>cavg_ss</code>, the average over the interval, by trapezoidal integration divided\n  by <code>TAU</code>,</li>\n<li><code>cavg_identity</code>, the same quantity from <code>DOSE_MID / (CL_POP * TAU)</code>.</li>\n</ul>\n<p>The last two should agree to four decimal places, which is the arithmetic\nconfirming the algebra: average exposure at steady state is set by clearance\nand the dosing interval alone.</p>\n<p>What the numbers say. The peak is 2.285 mg/L and the trough is 0.193, a peak to\ntrough ratio of 11.8 over a day. That swing is the work of the volume and the\nabsorption rate, and it is why a once daily dose of this drug spends part of\nthe day below its IC50 of about 0.4 mg/L. A twice daily regimen at half the\ndose would have the same <code>C_avg</code>, the same total exposure, and a much smaller\nswing, which is the usual reason for splitting a dose.</p>\n<p>Fill in <code>c_typ</code>, <code>cmax_ss</code>, <code>cmin_ss</code>, <code>cavg_ss</code>, <code>cavg_identity</code>.</p>\n<p>Moves: <code>np.exp</code> on <code>t_grid</code>, <code>.max()</code>, <code>.min()</code>, trapezoids.</p><pre class=\"code\"><code># Part a. One typical subject, at steady state.\n\nk_typ = None   # YOUR CODE: CL_POP / V_POP\nc_typ = None   # YOUR CODE: the steady state profile over t_grid at DOSE_MID\n\ncmax_ss = None         # YOUR CODE: peak concentration\ncmin_ss = None         # YOUR CODE: trough concentration\ncavg_ss = None         # YOUR CODE: average over the interval, by trapezoids\ncavg_identity = None   # YOUR CODE: DOSE_MID / (CL_POP * TAU)\n\nprint(&quot;Cmax %r mg/L, Cmin %r mg/L&quot; % (cmax_ss, cmin_ss))\nif cmax_ss is not None and cmin_ss is not None:\n    print(&quot;peak to trough ratio %.4f&quot; % (cmax_ss / cmin_ss))\nprint(&quot;Cavg by integration %r mg/L&quot; % (cavg_ss,))\nprint(&quot;Cavg from DOSE / (CL * tau) %r mg/L&quot; % (cavg_identity,))\n\nif c_typ is not None:\n    fig, ax = plt.subplots(figsize=(7, 4))\n    ax.plot(t_grid, c_typ, &quot;-&quot;, color=&quot;#1f4e79&quot;)\n    ax.axhline(CMAX_LIMIT, ls=&quot;--&quot;, color=&quot;#aa0000&quot;, label=&quot;safety limit&quot;)\n    ax.axhline(IC50_POP, ls=&quot;:&quot;, color=&quot;grey&quot;, label=&quot;typical IC50&quot;)\n    if cavg_ss is not None:\n        ax.axhline(cavg_ss, ls=&quot;-.&quot;, color=&quot;#007700&quot;, label=&quot;Cavg&quot;)\n    ax.set_xlabel(&quot;time within the dosing interval (h)&quot;)\n    ax.set_ylabel(&quot;concentration (mg/L)&quot;)\n    ax.set_title(&quot;W8D5 steady state, typical subject, %g mg daily&quot; % DOSE_MID)\n    ax.legend()\n    plt.show()</code></pre>"

   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. The population at 100 mg</h2>\n<p>Write a function that takes a dose and returns two arrays of four hundred\nnumbers: each patient's steady state <code>Cmax</code>, and each patient's average\ninhibition over the dosing interval. Build the <code>(400, 241)</code> concentration\nmatrix by broadcasting, exactly as in the toolkit, rather than looping over\npatients.</p>\n<p>Inhibition for patient <code>i</code> at time <code>t</code> is</p>\n<pre><code>IMAX * C[i, t] / (ic50_i[i] + C[i, t])\n</code></pre>\n<p>and the average over the interval is the trapezoidal area along <code>axis=1</code>\ndivided by <code>TAU</code>.</p>\n<p>Call it at <code>DOSE_MID</code> and record <code>cmax_i</code> and <code>mean_inh_i</code>. Then the three\nfractions:</p>\n<ul>\n<li><code>p_eff</code>, the fraction of patients whose average inhibition reaches\n  <code>EFF_TARGET</code>,</li>\n<li><code>p_tox</code>, the fraction whose <code>Cmax</code> exceeds <code>CMAX_LIMIT</code>,</li>\n<li><code>p_success</code>, the fraction that meet the efficacy criterion <strong>and</strong> stay\n  within the safety limit.</li>\n</ul>\n<p>At 100 mg you should get 72.0 percent efficacy, 8.7 percent above the safety\nlimit, and 64.5 percent success.</p>\n<p>Note that <code>p_success</code> is not <code>p_eff</code> times one minus <code>p_tox</code>, which would be\n65.7 percent. The two criteria are not independent: a patient with a low\nclearance has both a high average exposure, which helps efficacy, and a high\npeak, which hurts safety. Multiplying marginal probabilities would overstate\nyour chances, and the only reliable way to get the joint fraction is to count\nthe patients who satisfy both, which is what the <code>&amp;</code> does.</p>\n<p>Fill in <code>cmax_i</code>, <code>mean_inh_i</code>, <code>p_eff</code>, <code>p_tox</code>, <code>p_success</code>.</p>\n<p>Moves: broadcasting with <code>[:, None]</code> and <code>[None, :]</code>, <code>.max(axis=1)</code>,\ntrapezoids along <code>axis=1</code>, <code>(condition).mean()</code>, <code>&amp;</code>.</p><pre class=\"code\"><code># Part b. Four hundred patients at the middle dose.\n\ndef population_metrics(dose):\n    &quot;&quot;&quot;Steady state Cmax and average inhibition for every patient.&quot;&quot;&quot;\n    k = None        # YOUR CODE: cl_i / v_i, one per patient\n    # YOUR CODE: build the (N_SUBJ, 241) concentration matrix by broadcasting,\n    # then the peak per patient and the average inhibition per patient\n    return None, None\n\n\ncmax_i = None       # YOUR CODE: steady state Cmax for each patient at DOSE_MID\nmean_inh_i = None   # YOUR CODE: average inhibition for each patient at DOSE_MID\n\np_eff = None        # YOUR CODE: fraction reaching EFF_TARGET\np_tox = None        # YOUR CODE: fraction above CMAX_LIMIT\np_success = None    # YOUR CODE: fraction meeting both criteria\n\nprint(&quot;at %g mg daily:&quot; % DOSE_MID)\nprint(&quot;  efficacy criterion met : %r&quot; % (p_eff,))\nprint(&quot;  above the safety limit : %r&quot; % (p_tox,))\nprint(&quot;  both at once           : %r&quot; % (p_success,))\nif p_eff is not None and p_tox is not None:\n    print(&quot;  product of the margins : %.4f  &lt;- not the same thing&quot;\n          % (p_eff * (1.0 - p_tox)))\nif cmax_i is not None:\n    print(&quot;&quot;)\n    print(&quot;  Cmax   5th, 50th, 95th percentile:&quot;, np.round(np.percentile(cmax_i, [5, 50, 95]), 4))\n    print(&quot;  mean inhibition, same percentiles:&quot;, np.round(np.percentile(mean_inh_i, [5, 50, 95]), 4))</code></pre>"

    "html": "<h2>Part c. All five doses, and the recommendation</h2>\n<p>Run the same calculation at every dose in <code>DOSES</code> and collect three arrays of\nfive numbers, <code>p_eff_by_dose</code>, <code>p_tox_by_dose</code> and <code>p_success_by_dose</code>. Then\nset <code>best_dose</code> to the dose with the highest joint success probability, found\nwith <code>np.argmax</code> on the success array and used to index <code>DOSES</code>.</p>\n<p>Here is what you have produced.</p>\n<table>\n<thead>\n<tr>\n<th>dose</th>\n<th>efficacy met</th>\n<th>above safety limit</th>\n<th>both</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>25 mg</td>\n<td>6.2 pct</td>\n<td>0.0 pct</td>\n<td>6.2 pct</td>\n</tr>\n<tr>\n<td>50 mg</td>\n<td>28.0 pct</td>\n<td>0.0 pct</td>\n<td>28.0 pct</td>\n</tr>\n<tr>\n<td>100 mg</td>\n<td>72.0 pct</td>\n<td>8.7 pct</td>\n<td>64.5 pct</td>\n</tr>\n<tr>\n<td>150 mg</td>\n<td>88.7 pct</td>\n<td>77.7 pct</td>\n<td>18.0 pct</td>\n</tr>\n<tr>\n<td>200 mg</td>\n<td>94.0 pct</td>\n<td>98.0 pct</td>\n<td>1.8 pct</td>\n</tr>\n</tbody>\n</table>\n<p>Read the columns separately and then together.</p>\n<p><strong>The efficacy column never stops improving.</strong> 200 mg treats 94 percent of\npatients effectively, the best of the five. Anyone shown only this column will\nargue for the highest dose, and they will be arguing from a real number.</p>\n<p><strong>The safety column collapses between 100 and 150 mg.</strong> 8.7 percent to 77.7\npercent for a 1.5 fold dose step. Nothing special happens to the drug there.\nThe median patient's <code>Cmax</code> is 2.32 mg/L at 100 mg and 3.48 at 150 mg, and the\nlimit is 3.0, so the step moves the limit from the upper tail of the\ndistribution to below its middle. The sensitivity of the answer to the dose is\nentirely about where the limit falls among the patients, which is why this\ncalculation cannot be done with a typical subject.</p>\n<p><strong>Together, 100 mg wins by more than a factor of two</strong> over its nearest\nrival, and it is neither the most effective dose nor the safest. That is the\nnormal shape of this problem.</p>\n<p>So the recommendation is 100 mg once daily, and the honest version of it comes\nwith three caveats you should be able to state. The criteria were given to you\nrather than derived, and the whole answer moves if the safety limit is 3.5\ninstead of 3.0. The variability estimates come from a small phase 1 study, and\nweek 8 day 3 showed how loosely a CV is known from a dozen subjects. And\nnothing here allows for the dose being split: the same daily amount given twice\ndaily would have the identical <code>C_avg</code> with half the peak, which on these two\ncriteria would beat every one of the five regimens you just tested.</p>\n<p>That last point is worth sitting with. The best answer to the question as asked\nis 100 mg once daily. The best answer to the question the team actually cares\nabout may well be 75 mg twice daily, and nothing in the five candidate doses\nwould ever have found it.</p>\n<p>Fill in <code>p_eff_by_dose</code>, <code>p_tox_by_dose</code>, <code>p_success_by_dose</code>, <code>best_dose</code>.</p>\n<p>Moves: a loop over <code>DOSES</code> calling your part b function, <code>np.array</code>,\n<code>np.argmax</code>.</p><pre class=\"code\"><code># Part c. The dose response of the decision.\n\np_eff_by_dose = None      # YOUR CODE: array of 5 efficacy fractions\np_tox_by_dose = None      # YOUR CODE: array of 5 safety exceedance fractions\np_success_by_dose = None  # YOUR CODE: array of 5 joint success fractions\n\nbest_dose = None          # YOUR CODE: the dose with the highest joint success\n\nif p_success_by_dose is not None:\n    print(&quot; dose   efficacy   over limit   both&quot;)\n    for _i, _d in enumerate(DOSES):\n        print(&quot;%5.0f %9.3f %12.3f %7.3f&quot;\n              % (_d, p_eff_by_dose[_i], p_tox_by_dose[_i], p_success_by_dose[_i]))\nprint(&quot;&quot;)\nprint(&quot;recommended dose: %r mg once daily&quot; % (best_dose,))\n\nif p_success_by_dose is not None:\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    ax.plot(DOSES, p_eff_by_dose, &quot;o-&quot;, label=&quot;efficacy criterion met&quot;)\n    ax.plot(DOSES, p_tox_by_dose, &quot;s-&quot;, label=&quot;above the safety limit&quot;)\n    ax.plot(DOSES, p_success_by_dose, &quot;^-&quot;, lw=2, color=&quot;black&quot;, label=&quot;both&quot;)\n    ax.set_xscale(&quot;log&quot;)\n    ax.set_xticks(DOSES)\n    ax.set_xticklabels([&quot;%g&quot; % _d for _d in DOSES])\n    ax.set_xlabel(&quot;daily dose (mg)&quot;)\n    ax.set_ylabel(&quot;fraction of patients&quot;)\n    ax.set_title(&quot;W8D5 dose selection in 400 virtual patients&quot;)\n    ax.legend()\n    plt.show()</code></pre>"

  const THEMES = {"1": "numpy, pandas and matplotlib", "2": "pandas in depth", "3": "scipy", "4": "scikit-image and OpenCV", "5": "scikit-learn", "6": "PyTorch basics", "7": "PK and PD applications", "8": "PK and PD applications"};

  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const tk = document.getElementById("tk");
  const tkBody = document.getElementById("tk-body");
  const tkTitle = document.getElementById("tk-title");

  const N_WEEKS = new Set(PROBLEMS.map(function (p) { return p.week; })).size;
  document.getElementById("aside-sub").textContent =
    PROBLEMS.length + " problems across " + N_WEEKS + (N_WEEKS === 1 ? " week" : " weeks");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildNav() {
    const weeks = {};
    PROBLEMS.forEach(function (p) { (weeks[p.week] = weeks[p.week] || []).push(p); });
    let html = "";
    Object.keys(weeks).sort(function (a, b) { return a - b; }).forEach(function (wk) {
      const theme = THEMES[wk] ? "<span> &middot; " + esc(THEMES[wk]) + "</span>" : "";
      html += '<div class="wk"><div class="wk-h">Week ' + wk + theme + "</div>";
      weeks[wk].forEach(function (p) {
        html += '<a class="d" data-id="' + p.id + '" href="#' + p.id + '">' +
                "<code>" + esc(p.id) + "</code>" + esc(p.title) + "</a>";
      });
      html += "</div>";
    });
    nav.innerHTML = html;
  }

  function indexOf(id) {
    for (let i = 0; i < PROBLEMS.length; i++) if (PROBLEMS[i].id === id) return i;
    return -1;
  }

  function render(id) {
    const i = indexOf(id);
    if (i < 0) return;
    const p = PROBLEMS[i];

    let html = '<span class="pid">' + esc(p.id) + "</span>" +
      '<h2 class="title">' + esc(p.title) + "</h2>" +
      '<p class="meta">' + esc(p.topic) + "<br>Week " + p.week + ", day " + p.day +
      " &middot; " + esc(p.est) + "</p>" +
      '<div class="btns">' +
        '<a class="btn" href="' + p.colab + '">Open in Colab</a>' +
        '<a class="btn ghost" href="' + p.github + '">View on GitHub</a>' +
        '<a class="btn quiet" href="' + p.solution + '">Solution</a>' +
      "</div>";

    html += '<div class="jump">';
    p.sections.forEach(function (s) {
      html += '<a href="#sec-' + s.key + '">' + esc(s.label) + "</a>";
    });
    html += "</div>";

    p.sections.forEach(function (s) {
      html += '<section class="blk" id="sec-' + s.key + '">' +
              "<h3>" + esc(s.label) + '</h3><div class="body">' + s.html + "</div></section>";
    });

    html += '<div class="pager">';
    html += i > 0
      ? '<a href="#' + PROBLEMS[i - 1].id + '">Previous, ' + esc(PROBLEMS[i - 1].id) + "</a>"
      : "<span>Previous</span>";
    html += i < PROBLEMS.length - 1
      ? '<a href="#' + PROBLEMS[i + 1].id + '">Next, ' + esc(PROBLEMS[i + 1].id) + "</a>"
      : "<span>Next</span>";
    html += "</div>";

    main.innerHTML = html;
    main.scrollTop = 0;
    window.scrollTo(0, 0);

    Array.prototype.forEach.call(nav.querySelectorAll(".d"), function (a) {
      a.classList.toggle("on", a.getAttribute("data-id") === id);
    });

    tkTitle.textContent = "Toolkit, " + p.id;
    tkBody.innerHTML = p.toolkit || "<p>This problem has no toolkit section.</p>";
    document.title = p.id + ", " + p.title;
  }

  function fromHash() {
    const id = location.hash.replace(/^#/, "");
    render(indexOf(id) >= 0 ? id : PROBLEMS[0].id);
  }

  document.getElementById("tk-btn").addEventListener("click", function () {
    tk.classList.toggle("open");
  });
  document.getElementById("tk-close").addEventListener("click", function () {
    tk.classList.remove("open");
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") tk.classList.remove("open");
  });
  window.addEventListener("hashchange", fromHash);

  buildNav();
  fromHash();
</script>
