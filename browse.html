  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a round footprint</td>\n<td><code>morphology.disk(2)</code></td>\n</tr>\n<tr>\n<td>remove small specks</td>\n<td><code>morphology.opening(mask, morphology.disk(2))</code></td>\n</tr>\n<tr>\n<td>close small gaps</td>\n<td><code>morphology.closing(mask, morphology.disk(2))</code></td>\n</tr>\n<tr>\n<td>fill enclosed holes</td>\n<td><code>ndi.binary_fill_holes(mask)</code> from <code>scipy.ndimage</code></td>\n</tr>\n<tr>\n<td>drop objects touching the edge</td>\n<td><code>segmentation.clear_border(mask)</code></td>\n</tr>\n<tr>\n<td>count objects</td>\n<td><code>int(measure.label(mask).max())</code></td>\n</tr>\n<tr>\n<td>count pixels</td>\n<td><code>int(mask.sum())</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>binary_fill_holes</code> lives in <code>scipy.ndimage</code>, imported here as <code>ndi</code>, not in\nskimage. <code>opening</code> and <code>closing</code> work on boolean masks as well as greyscale.</p>",
  "sections": [
   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Yesterday's threshold gave you a mask, and the mask has three problems that\nevery real segmentation has.</p>\n<p><strong>Speckle.</strong> Hot pixels on the sensor crossed the threshold and became\nobjects, so a field with two dozen cells reports well over a hundred.</p>\n<p><strong>Holes.</strong> The stain is weakest at the centre of each cell, where the nucleus\nsits, so many cells come out as rings rather than filled discs. Anything that\nmeasures area will undercount, and anything that counts objects may split one\nring into pieces.</p>\n<p><strong>Edge cells.</strong> Cells at the border of the field are only partly in frame. You\ncan see a sliver of them, but their area and shape are whatever the crop\nhappened to leave, and including them biases every per cell measurement\ndownward.</p>\n<p>All three are fixed with morphology, which is a small set of operations that\nreshape a binary mask based on local geometry rather than on brightness.</p>"
   },
   {
    "key": "concept",
    "label": "Morphology: reshaping a mask by what fits inside it",
    "html": "<h2>Morphology: reshaping a mask by what fits inside it</h2>\n<p>Every morphological operation slides a small shape, called the <strong>structuring\nelement</strong> or footprint, over the mask and asks a local question. In\nscikit-image <code>morphology.disk(2)</code> gives you a roughly circular footprint of\nradius 2, which is the usual choice for round objects because it treats every\ndirection the same.</p>\n<p><strong>Erosion</strong> keeps a pixel only if the whole footprint fits inside the\nforeground there. It shrinks objects and deletes anything smaller than the\nfootprint. <strong>Dilation</strong> is the opposite and grows them.</p>\n<p><strong>Opening is erosion then dilation.</strong> The erosion deletes anything too small\nto contain the footprint, and the dilation restores the survivors to roughly\ntheir original size. The net effect is that small specks vanish and real\nobjects come back nearly unchanged. This is precisely the tool for hot pixel\nspeckle, and the thing to tune is the footprint radius: big enough to swallow\nthe noise, small enough to leave the cells.</p>\n<p><strong>Closing is dilation then erosion</strong>, which fills small gaps and joins things\nthat are nearly touching. It is the obvious tool for holes, but it has a\nserious side effect: it also joins cells that are close together, turning two\ncells into one object and losing a count you cared about.</p>\n<p><strong>So for holes, prefer <code>binary_fill_holes</code>.</strong> It works topologically rather\nthan geometrically: it finds background regions that are completely surrounded\nby foreground and fills them, whatever their size or shape. A hole in the\nmiddle of a cell is enclosed and gets filled. The background around the cells\nconnects to the image border and does not. Because it is about enclosure\nrather than size, it cannot accidentally merge two separate cells, which\nclosing can. It lives in <code>scipy.ndimage</code>, not skimage, which is a small\nannoyance to remember.</p>\n<p><strong><code>clear_border</code> removes objects touching the edge.</strong> Whether you should use\nit depends on the question. For <strong>per cell</strong> measurements, area, shape,\nintensity, you must, because a partly imaged cell gives a wrong value for all\nthree. For <strong>density</strong>, cells per square millimetre, removing them biases the\ncount downward and you want a different correction instead. Think about which\nquestion you are answering before you reach for it.</p>\n<p><strong>Order matters.</strong> Clear the speckle first, so you are not filling holes in\nnoise. Fill holes next, so objects are solid. Clear the border last, when each\nobject is a single connected piece and it is unambiguous whether it touches\nthe edge.</p>"
   },
   {
    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time, and they chain in this order.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>speckle removed with an opening</td>\n<td><code>mask_open</code>, <code>n_obj_raw</code>, <code>n_obj_open</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>holes inside cells filled in</td>\n<td><code>mask_filled</code>, <code>n_hole_px</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>partly imaged cells dropped</td>\n<td><code>mask_clean</code>, <code>n_obj_clean</code>, <code>n_border_objects</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"
   },
   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nfrom skimage import draw, filters, measure, morphology, segmentation\nfrom scipy import ndimage as ndi\n\nPROBLEM_ID = &quot;W4D2&quot;\nTOPIC = &quot;scikit-image: morphological opening, filling holes, clearing the border&quot;\n\nIMG_SIZE = 256\nrng = np.random.default_rng(4201)\n\n# Build a field whose cells are RINGS, because the stain is weak at the nucleus,\n# with several cells deliberately running off the edge of the frame.\n_img = np.full((IMG_SIZE, IMG_SIZE), 45.0)\n_yy, _xx = np.mgrid[0:IMG_SIZE, 0:IMG_SIZE]\n_img += 12.0 * (_yy / IMG_SIZE)\n\n_centres = [(40, 35), (60, 120), (45, 200), (120, 60), (135, 150), (115, 225),\n            (200, 40), (190, 130), (210, 210), (90, 90), (160, 95),\n            (8, 70), (250, 160), (130, 4), (70, 252)]      # last four touch an edge\nfor _cy, _cx in _centres:\n    _r = int(rng.integers(10, 14))\n    _rr, _cc = draw.disk((_cy, _cx), _r, shape=_img.shape)\n    _img[_rr, _cc] += 150.0\n    # the nucleus stains weakly, leaving a hole in the middle\n    _rr, _cc = draw.disk((_cy, _cx), max(3, _r - 6), shape=_img.shape)\n    _img[_rr, _cc] -= 140.0\n\n_img += rng.normal(0.0, 8.0, size=_img.shape)\n_hot_y = rng.integers(0, IMG_SIZE, size=160)\n_hot_x = rng.integers(0, IMG_SIZE, size=160)\n_img[_hot_y, _hot_x] = 255.0\nfield = np.clip(_img, 0, 255).astype(np.uint8)\n\n# The starting mask, exactly as yesterday&#x27;s approach would produce it.\nmask_raw = field &gt; filters.threshold_otsu(field)\n\nprint(&quot;field:&quot;, field.shape, field.dtype)\nprint(&quot;mask_raw foreground pixels:&quot;, int(mask_raw.sum()))\nprint(&quot;connected objects in mask_raw:&quot;, int(measure.label(mask_raw).max()))\nprint(&quot;&quot;)\nprint(&quot;there are %d real cells in this field, four of them running off an edge&quot;\n      % len(_centres))\n\n_fig, _axes = plt.subplots(1, 2, figsize=(9, 4.3))\n_axes[0].imshow(field, cmap=&quot;gray&quot;, vmin=0, vmax=255); _axes[0].set_title(&quot;field&quot;)\n_axes[1].imshow(mask_raw, cmap=&quot;gray&quot;); _axes[1].set_title(&quot;mask_raw&quot;)\nfor _a in _axes: _a.axis(&quot;off&quot;)\n_fig.tight_layout()\nplt.show()</code></pre>"

(&quot;foreground pixels     :&quot;, int(demo.sum()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. opening deletes anything the footprint cannot fit inside ---&quot;)\ndemo_open = morphology.opening(demo, morphology.disk(2))\nprint(&quot;after opening, objects:&quot;, int(measure.label(demo_open).max()),\n      &quot; pixels:&quot;, int(demo_open.sum()))\nprint(&quot;the three single pixel specks are gone, the cells survive&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. filling holes versus closing ---&quot;)\ndemo_filled = ndi.binary_fill_holes(demo_open)\ndemo_closed = morphology.closing(demo_open, morphology.disk(4))\nprint(&quot;pixels after fill_holes:&quot;, int(demo_filled.sum()),\n      &quot; objects:&quot;, int(measure.label(demo_filled).max()))\nprint(&quot;pixels after closing   :&quot;, int(demo_closed.sum()),\n      &quot; objects:&quot;, int(measure.label(demo_closed).max()))\nprint(&quot;&quot;)\nprint(&quot;fill_holes targets enclosed background only, so it cannot merge two cells.&quot;)\nprint(&quot;closing with a big enough footprint can, which is why it is the wrong tool here.&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. clear_border drops anything touching an edge ---&quot;)\ndemo_clean = segmentation.clear_border(demo_filled)\nprint(&quot;objects before:&quot;, int(measure.label(demo_filled).max()))\nprint(&quot;objects after :&quot;, int(measure.label(demo_clean).max()))\nprint(&quot;the cell running off the top edge has gone&quot;)\n\ndemo_fig, demo_axes = plt.subplots(1, 4, figsize=(12, 3.2))\nfor demo_ax, demo_im, demo_title in zip(\n        demo_axes, [demo, demo_open, demo_filled, demo_clean],\n        [&quot;raw&quot;, &quot;opened&quot;, &quot;holes filled&quot;, &quot;border cleared&quot;]):\n    demo_ax.imshow(demo_im, cmap=&quot;gray&quot;); demo_ax.set_title(demo_title); demo_ax.axis(&quot;off&quot;)\ndemo_fig.tight_layout()\nplt.show()</code></pre>"

   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Open away the speckle</h2>\n<p><code>mask_raw</code> contains the real cells plus one object per hot pixel. Count what\nyou are starting with, then remove the specks with a morphological opening.</p>\n<p>Use <code>morphology.opening</code> with <code>morphology.disk(2)</code> as the footprint. The\nerosion half deletes anything a radius 2 disc cannot fit inside, which is\nevery isolated pixel and every tiny cluster, and the dilation half restores\nthe survivors.</p>\n<p>Count connected objects before and after with <code>measure.label(...).max()</code>. The\ndrop should be dramatic, from well over a hundred down to something in the\nrange of the number of cells actually present.</p>\n<p>A note on choosing the radius. It has to be large enough to swallow the noise\nand small enough to leave real structure alone. Here the noise is single\npixels, so anything from radius 1 upwards clears it, and in fact radius 1 and\nradius 2 give an identical mask on this field. The binding constraint is the\nother end: the cells are rings whose walls are only a few pixels thick, and at\nradius 3 the opening cuts through those walls and shatters each ring into\nfragments. Try it and watch the object count jump.</p>\n<p>That asymmetry is typical. The lower limit is usually obvious and forgiving;\nthe upper limit is set by the thinnest real structure you care about, and\ncrossing it does visible damage.</p>\n<p>Fill in <code>mask_open</code>, <code>n_obj_raw</code>, <code>n_obj_open</code>.</p>\n<p>Moves: <code>morphology.opening(mask, morphology.disk(2))</code>,\n<code>measure.label(mask).max()</code>.</p><pre class=\"code\"><code># Part a. Remove the hot pixel speckle with an opening.\n\nmask_open = None   # YOUR CODE: mask_raw opened with a disk of radius 2\nn_obj_raw = None   # YOUR CODE: connected objects in mask_raw\nn_obj_open = None  # YOUR CODE: connected objects in mask_open\n\nprint(&quot;objects before opening:&quot;, n_obj_raw)\nprint(&quot;objects after opening :&quot;, n_obj_open)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Fill the holes left by the weak nuclear stain</h2>\n<p>The cells are rings, because the stain is faint where the nucleus sits. Fill\nthose centres in so each cell becomes one solid object.</p>\n<p>Use <code>ndi.binary_fill_holes</code> on <code>mask_open</code>. It finds background regions that\nare entirely enclosed by foreground and turns them on. The background outside\nthe cells connects to the image border, so it is not enclosed and is left\nalone.</p>\n<p>Then measure how much was filled: the number of pixels <code>mask_filled</code> has that\n<code>mask_open</code> did not. Since filling only ever adds pixels, that is just the\ndifference of the two sums.</p>\n<p>Resist reaching for <code>closing</code> here even though it would also close the rings.\nWith a footprint large enough to span the nuclear hole, it would also bridge\nany two cells sitting within that distance of each other, silently merging\nthem into one object. You would not see it in the mask, you would see it later\nas a cell count that is slightly too low and a mean area that is too high.</p>\n<p>Fill in <code>mask_filled</code>, <code>n_hole_px</code>.</p>\n<p>Moves: <code>ndi.binary_fill_holes(mask)</code>, <code>.sum()</code>.</p><pre class=\"code\"><code># Part b. Fill the enclosed holes.\n\nmask_filled = None   # YOUR CODE: mask_open with enclosed holes filled in\nn_hole_px = None     # YOUR CODE: how many pixels that added\n\nprint(&quot;pixels before filling:&quot;, None if mask_open is None else int(mask_open.sum()))\nprint(&quot;pixels after filling :&quot;, None if mask_filled is None else int(mask_filled.sum()))\nprint(&quot;hole pixels filled   :&quot;, n_hole_px)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Drop the cells that run off the edge</h2>\n<p>Four of the cells in this field are only partly in frame. Their area is\nwhatever the crop left, their shape is a truncated disc, and their mean\nintensity is measured over the wrong region. Any per cell statistic computed\nincluding them is biased.</p>\n<p><code>segmentation.clear_border</code> removes every object touching the image boundary.\nApply it to <code>mask_filled</code>, then count what is left and how many objects were\nremoved.</p>\n<p>This is the right call here because the next problem measures per cell\nproperties. It would be the wrong call if you were measuring <strong>density</strong>,\ncells per unit area, because then dropping edge cells undercounts a real\nquantity and the correction is a different one entirely. Same operation,\nopposite verdict, decided by the question rather than by the image.</p>\n<p>Fill in <code>mask_clean</code>, <code>n_obj_clean</code>, <code>n_border_objects</code>.</p>\n<p>Moves: <code>segmentation.clear_border(mask)</code>, <code>measure.label(mask).max()</code>,\nsubtraction.</p><pre class=\"code\"><code># Part c. Remove objects touching the frame edge.\n\nmask_clean = None        # YOUR CODE: mask_filled with edge touching objects removed\nn_obj_clean = None       # YOUR CODE: objects remaining\nn_border_objects = None  # YOUR CODE: how many were removed\n\nprint(&quot;objects before:&quot;, None if mask_filled is None else int(measure.label(mask_filled).max()))\nprint(&quot;objects after :&quot;, n_obj_clean)\nprint(&quot;removed       :&quot;, n_border_objects)\n\nif mask_clean is not None:\n    fig, axes = plt.subplots(1, 4, figsize=(13, 3.6))\n    for a, im, ttl in zip(axes, [mask_raw, mask_open, mask_filled, mask_clean],\n                          [&quot;raw&quot;, &quot;opened&quot;, &quot;holes filled&quot;, &quot;border cleared&quot;]):\n        a.imshow(im, cmap=&quot;gray&quot;); a.set_title(ttl); a.axis(&quot;off&quot;)\n    fig.tight_layout()\n    plt.show()</code></pre>"

  "sections": [
   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>You have a clean binary mask and the original intensity image behind it. Up to\nnow every number has described the whole field: how many foreground pixels,\nwhat fraction of the frame. That is not what anyone wants.</p>\n<p>The question is about <strong>cells</strong>: how many are there, how big are they, how\nround are they, and how bright is each one. To answer any of that, the mask\nhas to stop being a sheet of True and False and become a list of objects, each\nwith an identity you can refer to.</p>\n<p>That step is called <strong>connected component labelling</strong>, and everything per cell\nfollows from it.</p>\n<p>This field also contains two problems that labelling alone will not solve. A\nsmall piece of debris got through the cleanup, and two cells are touching, so\nthey label as a single object with roughly twice the area. Both are visible in\nthe measurements, which is how you deal with them.</p>"

    "key": "concept",
    "label": "From a mask to a table of objects",
    "html": "<h2>From a mask to a table of objects</h2>\n<p><strong>Labelling.</strong> <code>measure.label(mask)</code> returns an integer array the same shape\nas the mask. Background is 0, the first object is 1, the second is 2, and so\non. Pixels get the same number exactly when they are connected to each other\nthrough the foreground. So <code>labels == 3</code> is a boolean mask of the third\nobject, and <code>labels.max()</code> is how many objects there are.</p>\n<p>Connectivity is worth knowing about. In 2D, <code>connectivity=1</code> means pixels\ncount as connected only through their four edge neighbours, while\n<code>connectivity=2</code>, the default, also counts the four diagonals. Diagonal\nconnectivity joins objects that touch only at a corner, which is usually what\nyou want for cells and occasionally not.</p>\n<p><strong>Measuring.</strong> <code>measure.regionprops_table</code> walks the labelled array and\nreturns a dictionary of arrays, one row per object, which goes straight into a\nDataFrame. Pass <code>intensity_image=</code> as well and you also get intensity\nmeasurements taken over each object's own pixels.</p>\n<p>The properties worth knowing here:</p>\n<ul>\n<li><code>area</code>, the pixel count of the object,</li>\n<li><code>eccentricity</code>, from 0 for a perfect circle up to 1 for a line, which is how\n  you tell round cells from elongated ones or from merged pairs,</li>\n<li><code>mean_intensity</code>, the average of the original image over that object,</li>\n<li><code>centroid</code>, which comes back as two columns, <code>centroid-0</code> for the row and\n  <code>centroid-1</code> for the column.</li>\n</ul>\n<p>Note the units. <code>area</code> is in <strong>pixels</strong>, not square microns, until you\nmultiply by the pixel size, and forgetting to is how an area ends up off by a\nfactor of ten thousand.</p>\n<p><strong>Filtering by measurement rather than by morphology.</strong> Yesterday you removed\ndebris geometrically, with an opening. Here you remove it statistically: label\neverything, measure everything, then keep the rows whose area falls in a\nplausible range. This is often better, because the criterion is explicit and\nvisible in a table rather than buried in a footprint radius, and because you\ncan filter on any property, not only size.</p>\n<p>An upper bound matters as much as a lower one. Two cells that touch label as\none object with about double the area and a stretched shape. Dropping those is\nhonest, and it undercounts. Splitting them properly needs a watershed, which\nis a different and larger topic. Knowing that your count is a slight\nunderestimate, and why, beats a number you cannot account for.</p>"

    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom skimage import draw, measure, morphology, segmentation\nfrom scipy import ndimage as ndi\n\nPROBLEM_ID = &quot;W4D3&quot;\nTOPIC = &quot;scikit-image: connected components, regionprops_table, filtering by measurement&quot;\n\nIMG_SIZE = 256\nMIN_AREA = 150      # anything smaller is debris\nMAX_AREA = 900      # anything larger is two cells that touched\n\nrng = np.random.default_rng(4301)\n\n_img = np.full((IMG_SIZE, IMG_SIZE), 40.0)\n_mask = np.zeros((IMG_SIZE, IMG_SIZE), dtype=bool)\n\n# Twelve well separated cells, with brightness varying between them.\n_centres = [(45, 40), (50, 120), (40, 200), (110, 65), (120, 150), (105, 225),\n            (180, 45), (175, 130), (195, 215), (240, 90), (235, 180), (150, 20)]\nfor _cy, _cx in _centres:\n    # real cells are not perfect circles, so draw ellipses at random angles\n    _ra = float(rng.uniform(11.0, 14.5))\n    _rb = float(rng.uniform(8.5, 13.0))\n    _rot = float(rng.uniform(0.0, np.pi))\n    _rr, _cc = draw.ellipse(_cy, _cx, _ra, _rb, shape=_img.shape, rotation=_rot)\n    _mask[_rr, _cc] = True\n    _img[_rr, _cc] += 110.0 * rng.uniform(0.7, 1.35)\n\n# Two cells that happen to touch, so they will label as one object.\nfor _cy, _cx in [(70, 162), (70, 188)]:\n    _rr, _cc = draw.ellipse(_cy, _cx, 12.5, 13.5, shape=_img.shape)\n    _mask[_rr, _cc] = True\n    _img[_rr, _cc] += 120.0\n\n# One piece of debris that survived the cleanup.\n_rr, _cc = draw.disk((205, 140), 5, shape=_img.shape)\n_mask[_rr, _cc] = True\n_img[_rr, _cc] += 95.0\n\n_img += rng.normal(0.0, 5.0, size=_img.shape)\nfield = np.clip(_img, 0, 255).astype(np.uint8)\nmask = _mask\n\nprint(&quot;field:&quot;, field.shape, field.dtype, &quot;   mask foreground px:&quot;, int(mask.sum()))\nprint(&quot;area limits: keep objects between %d and %d pixels&quot; % (MIN_AREA, MAX_AREA))\nprint(&quot;&quot;)\nprint(&quot;twelve separated cells, one touching pair, and one speck of debris&quot;)\n\n_fig, _axes = plt.subplots(1, 2, figsize=(9, 4.3))\n_axes[0].imshow(field, cmap=&quot;gray&quot;, vmin=0, vmax=255); _axes[0].set_title(&quot;field&quot;)\n_axes[1].imshow(mask, cmap=&quot;gray&quot;); _axes[1].set_title(&quot;mask&quot;)\nfor _a in _axes: _a.axis(&quot;off&quot;)\n_fig.tight_layout()\nplt.show()</code></pre>"

mbers the objects ---&quot;)\ndemo_labels = measure.label(demo_mask)\nprint(&quot;labels dtype:&quot;, demo_labels.dtype, &quot; max:&quot;, int(demo_labels.max()))\nprint(&quot;distinct values:&quot;, np.unique(demo_labels).tolist(), &quot; &lt;- 0 is background&quot;)\nprint(&quot;pixels in object 1:&quot;, int((demo_labels == 1).sum()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. regionprops_table measures every object at once ---&quot;)\ndemo_props = pd.DataFrame(measure.regionprops_table(\n    demo_labels, intensity_image=demo_img,\n    properties=(&quot;label&quot;, &quot;area&quot;, &quot;eccentricity&quot;, &quot;mean_intensity&quot;, &quot;centroid&quot;)))\nprint(demo_props.round(3))\nprint(&quot;&quot;)\nprint(&quot;note centroid became two columns, centroid-0 is the ROW and centroid-1 the column&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. eccentricity tells round from stretched ---&quot;)\nfor _, demo_row in demo_props.iterrows():\n    demo_shape = &quot;round&quot; if demo_row[&quot;eccentricity&quot;] &lt; 0.6 else &quot;elongated&quot;\n    print(&quot;  object %d: area %5.0f  ecc %.3f  -&gt; %s&quot;\n          % (demo_row[&quot;label&quot;], demo_row[&quot;area&quot;], demo_row[&quot;eccentricity&quot;], demo_shape))\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. filtering by measurement ---&quot;)\ndemo_keep = demo_props[(demo_props[&quot;area&quot;] &gt;= 50) &amp; (demo_props[&quot;area&quot;] &lt;= 400)]\nprint(&quot;objects before filtering:&quot;, len(demo_props))\nprint(&quot;objects after filtering :&quot;, len(demo_keep))\nprint(&quot;the single pixel speck is gone&quot;)\n\ndemo_fig, demo_ax = plt.subplots(figsize=(3.4, 3.4))\ndemo_ax.imshow(demo_labels, cmap=&quot;nipy_spectral&quot;)\ndemo_ax.set_title(&quot;labels, one colour each&quot;)\ndemo_ax.axis(&quot;off&quot;)\nplt.show()</code></pre>"

    "html": "<h2>Part a. Label the objects and measure them</h2>\n<p><code>measure.label(mask)</code> turns the boolean mask into an integer array: background\n0, first object 1, second object 2, and so on. The number of objects is its\nmaximum.</p>\n<p>Then measure them all at once with <code>measure.regionprops_table</code>. Pass the\nlabelled array, pass <code>intensity_image=field</code> so intensity measurements are\ntaken over each object's own pixels, and ask for these properties:</p>\n<p><code>\"label\"</code>, <code>\"area\"</code>, <code>\"eccentricity\"</code>, <code>\"mean_intensity\"</code></p>\n<p>Wrap the result in <code>pd.DataFrame</code> to get an ordinary table with one row per\nobject.</p>\n<p>Look at the table before moving on. You should see twelve or so rows with\nsimilar areas, one row with a very small area, and one with about double the\ntypical area and a noticeably higher eccentricity. Those last two are the\ndebris and the touching pair, and spotting them in the numbers is the point.</p>\n<p>Fill in <code>labels</code>, <code>n_objects</code>, <code>props</code>.</p>\n<p>Moves: <code>measure.label</code>, <code>.max()</code>, <code>measure.regionprops_table(...,\nintensity_image=..., properties=(...))</code>, <code>pd.DataFrame</code>.</p><pre class=\"code\"><code># Part a. Label the objects, then measure every one of them.\n\nlabels = None      # YOUR CODE: the labelled integer array\nn_objects = None   # YOUR CODE: how many objects there are\nprops = None       # YOUR CODE: DataFrame with label, area, eccentricity, mean_intensity\n\nprint(&quot;n_objects:&quot;, n_objects)\nprint(None if props is None else props.round(3))</code></pre>"

    "html": "<h2>Part b. Filter out the debris and the merged pair</h2>\n<p>Keep only the rows whose <code>area</code> is between <code>MIN_AREA</code> and <code>MAX_AREA</code>\ninclusive. That drops the speck of debris at the bottom and the touching pair\nat the top.</p>\n<p>Two conditions at once needs <code>&amp;</code> between them, with brackets around each,\nbecause the words <code>and</code> and <code>or</code> do not work on columns.</p>\n<p>Then count what survived and what did not.</p>\n<p>Be clear with yourself about what this does to the count. Dropping the merged\nobject removes <strong>two</strong> real cells from the tally while removing one row, so\nyour cell count is now an underestimate by one. That is a defensible choice,\nbecause measuring a merged pair as though it were one cell would corrupt every\nper cell statistic. The alternative is to split them with a watershed, which\nis real work and a topic of its own. What is not defensible is not knowing\nwhich of the two you did.</p>\n<p>Reset the index afterwards so the surviving rows renumber cleanly.</p>\n<p>Fill in <code>cells</code>, <code>n_cells</code>, <code>n_dropped</code>.</p>\n<p>Moves: boolean filtering with <code>&amp;</code>, <code>.reset_index(drop=True)</code>, <code>len()</code>.</p><pre class=\"code\"><code># Part b. Keep only objects with a plausible area.\n\ncells = None       # YOUR CODE: rows of props with MIN_AREA &lt;= area &lt;= MAX_AREA,\n                   #            index renumbered\nn_cells = None     # YOUR CODE: how many survived\nn_dropped = None   # YOUR CODE: how many rows were removed\n\nprint(&quot;objects measured:&quot;, n_objects)\nprint(&quot;cells kept      :&quot;, n_cells)\nprint(&quot;rows dropped    :&quot;, n_dropped)\nprint(cells)</code></pre>"

    "html": "<h2>Part c. Summarise the cells</h2>\n<p>Three numbers describing the surviving cells: the mean area in pixels, the\nmean eccentricity, and the mean of their mean intensities.</p>\n<p>That last one deserves a sentence. <code>mean_intensity</code> is already an average,\ntaken over each cell's own pixels. Averaging those gives every <strong>cell</strong> equal\nweight regardless of how many pixels it has. The alternative, averaging all\nforeground pixels together, gives every <strong>pixel</strong> equal weight, so big cells\ncount more.</p>\n<p>Which is right depends on the question, but notice that this is the same\nchoice you made in week 1 with cells inside animals, one level down. Any time\nyou average things that are themselves averages of different sized groups,\nthat question is waiting for you, and the usual answer in biology is to give\neach unit equal weight rather than each measurement.</p>\n<p>Keep them as plain floats.</p>\n<p>Fill in <code>mean_area</code>, <code>mean_ecc</code>, <code>mean_intensity</code>.</p>\n<p>Moves: <code>float(df[\"COL\"].mean())</code>.</p><pre class=\"code\"><code># Part c. Summarise the surviving cells.\n\nmean_area = None        # YOUR CODE: mean area in pixels\nmean_ecc = None         # YOUR CODE: mean eccentricity\nmean_intensity = None   # YOUR CODE: mean of the per cell mean intensities\n\nprint(&quot;mean area       : %s px&quot; % mean_area)\nprint(&quot;mean eccentricity: %s&quot; % mean_ecc)\nprint(&quot;mean intensity  : %s&quot; % mean_intensity)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The imaging core's existing analysis script is written in OpenCV, because\nOpenCV got there first and is very fast. You have been asked to understand it\nwell enough to check its numbers against your scikit-image pipeline.</p>\n<p>The two libraries do the same job with different conventions, and the places\nthey differ are exactly the places bugs live. OpenCV came out of real time\ncomputer vision, so it is built around 8 bit images, it returns things in\norders that make sense for video and not for arrays, and it describes objects\nby their <strong>outlines</strong> rather than by which pixels belong to them.</p>\n<p>That last difference is the interesting one. A contour is a polygon tracing\nthe boundary of an object, and the area of that polygon is not the same number\nas the count of pixels inside it. Neither is wrong. They answer slightly\ndifferent questions, and a pipeline that mixes them produces numbers that are\nconsistently a few percent off with no obvious cause.</p>"
   },
   {
    "key": "concept",
    "label": "OpenCV conventions, and what a contour actually is",
    "html": "<h2>OpenCV conventions, and what a contour actually is</h2>\n<p><strong>It wants 8 bit arrays.</strong> Most OpenCV functions expect <code>uint8</code>. Hand them\nfloats and you get either an error or silence followed by nonsense. skimage,\nby contrast, is happy with floats and often prefers them. Converting back and\nforth is normal; forgetting to is a classic.</p>\n<p><strong>Sizes come as (width, height).</strong> Numpy shapes are <code>(rows, columns)</code>, which\nis height then width. OpenCV kernel and size arguments are the other way\nround. For a square kernel it makes no difference, which is why the mistake\nsurvives until the day you use a non-square one.</p>\n<p><strong>Kernels must be odd.</strong> <code>cv2.GaussianBlur(img, (5, 5), 0)</code> is fine, <code>(4, 4)</code>\nraises. The zero is sigma, and zero means \"work it out from the kernel size\".</p>\n<p><strong>Thresholding returns two things.</strong> <code>cv2.threshold</code> gives back the threshold\nit used and the thresholded image, in that order. Combining\n<code>cv2.THRESH_BINARY + cv2.THRESH_OTSU</code> tells it to compute the threshold by\nOtsu's method and ignore the value you passed, which is why that argument is\nconventionally written as 0. The output is <code>uint8</code> with values 0 and 255, not\nbooleans, which matters if you then try to use it as a mask.</p>\n<p><strong>findContours traces outlines.</strong> It returns a list of contours, each an array\nof boundary points. <code>cv2.RETR_EXTERNAL</code> keeps only outermost contours and\nignores holes inside objects, which is usually what you want for counting\ncells. <code>cv2.CHAIN_APPROX_SIMPLE</code> compresses straight runs of boundary points,\nwhich saves memory and changes nothing about the shape.</p>\n<p>It returns <strong>two</strong> values in OpenCV 4 and 5, and returned three in OpenCV 3.\nCode written against the old version breaks, which is why you still find\n<code>cv2.findContours(...)[-2]</code> in the wild as a version-proof way to grab the\ncontours whichever it is.</p>\n<p><strong>Why contour area is not pixel count.</strong> <code>cv2.contourArea</code> computes the area\nof the polygon through the boundary pixel centres. The pixels on the boundary\nstraddle that line, so roughly half of each sits outside the polygon. The\nresult is consistently a little <strong>smaller</strong> than the pixel count, and the gap\nis proportional to the perimeter, so it hurts small objects proportionally\nmore than big ones.</p>\n<p>So the honest comparison is not \"which is right\" but \"which question did I\nask\". Pixel count is what skimage's <code>area</code> gives you. Polygon area is what\n<code>contourArea</code> gives you. Pick one, say which, and do not mix them within a\nstudy.</p>"
   },

vmax=255)\n_ax.set_title(&quot;field&quot;); _ax.axis(&quot;off&quot;)\nplt.show()</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>blur, odd kernel only</td>\n<td><code>cv2.GaussianBlur(img, (5, 5), 0)</code></td>\n</tr>\n<tr>\n<td>Otsu threshold</td>\n<td><code>t, binimg = cv2.threshold(img, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)</code></td>\n</tr>\n<tr>\n<td>find outlines</td>\n<td><code>cv2.findContours(binimg, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)</code></td>\n</tr>\n<tr>\n<td>grab the contours safely</td>\n<td>take <code>[-2]</code> of what it returns, which works on OpenCV 3, 4 and 5</td>\n</tr>\n<tr>\n<td>the area of one contour</td>\n<td><code>cv2.contourArea(c)</code></td>\n</tr>\n<tr>\n<td>its perimeter</td>\n<td><code>cv2.arcLength(c, True)</code></td>\n</tr>\n<tr>\n<td>draw them on a copy</td>\n<td><code>cv2.drawContours(img_copy, contours, -1, 255, 1)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>cv2.threshold</code> returns a <strong>pair</strong>, the threshold and the image, so unpack it.\nPassing <code>0</code> as the threshold value is the convention when you add\n<code>THRESH_OTSU</code>, because the value is ignored and computed instead.</p><pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nimport cv2\nfrom skimage import draw, measure\n\n# A tiny made up field. Nothing here is the answer.\ndemo = np.full((60, 60), 40.0)\nfor demo_c in [(18, 18), (40, 40)]:\n    demo_rr, demo_cc = draw.disk(demo_c, 9, shape=demo.shape)\n    demo[demo_rr, demo_cc] += 130.0\ndemo = np.clip(demo + np.random.default_rng(0).normal(0, 5, demo.shape), 0, 255).astype(np.uint8)\n\nprint(&quot;--- 1. OpenCV wants uint8 ---&quot;)\nprint(&quot;demo dtype:&quot;, demo.dtype)\ntry:\n    cv2.GaussianBlur(demo.astype(float) / 255.0, (4, 4), 0)\nexcept Exception as err:\n    print(&quot;a float image with an even kernel:&quot;, type(err).__name__)\nprint(&quot;kernels must be odd, and sizes are given as (width, height)&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. threshold returns TWO things ---&quot;)\ndemo_blur = cv2.GaussianBlur(demo, (5, 5), 0)\ndemo_t, demo_bin = cv2.threshold(demo_blur, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)\nprint(&quot;returned threshold:&quot;, demo_t)\nprint(&quot;returned image    :&quot;, demo_bin.dtype, &quot; unique values:&quot;, np.unique(demo_bin).tolist())\nprint(&quot;note it is uint8 0 and 255, not True and False&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. findContours, and the version trap ---&quot;)\ndemo_found = cv2.findContours(demo_bin, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\nprint(&quot;it returned&quot;, len(demo_found), &quot;values on this OpenCV&quot;)\ndemo_contours = demo_found[-2]      # works whether it returned 2 or 3\nprint(&quot;contours found:&quot;, len(demo_contours))\nprint(&quot;first contour is an array of boundary points, shape:&quot;, demo_contours[0].shape)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. contour area is NOT pixel count ---&quot;)\ndemo_labels = measure.label(demo_bin &gt; 0)\ndemo_px = [int((demo_labels == i).sum()) for i in range(1, demo_labels.max() + 1)]\ndemo_poly = sorted(round(cv2.contourArea(c), 1) for c in demo_contours)\nprint(&quot;skimage pixel counts :&quot;, sorted(demo_px))\nprint(&quot;cv2 polygon areas    :&quot;, demo_poly)\nprint(&quot;ratio                : %.4f&quot; % (sum(demo_poly) / sum(demo_px)))\nprint(&quot;&quot;)\nprint(&quot;the polygon runs through the centres of the boundary pixels, so about half&quot;)\nprint(&quot;of each boundary pixel falls outside it. The gap scales with perimeter,&quot;)\nprint(&quot;which means small objects lose proportionally more than big ones.&quot;)\n\ndemo_vis = cv2.cvtColor(demo, cv2.COLOR_GRAY2BGR)\ncv2.drawContours(demo_vis, demo_contours, -1, (255, 0, 0), 1)\ndemo_fig, demo_ax = plt.subplots(figsize=(3.4, 3.4))\ndemo_ax.imshow(demo_vis)\ndemo_ax.set_title(&quot;contours drawn on the image&quot;); demo_ax.axis(&quot;off&quot;)\nplt.show()</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Blur and threshold, the OpenCV way</h2>\n<p>Blur <code>field</code> with <code>cv2.GaussianBlur</code> using a 5 by 5 kernel and sigma 0, which\nmeans \"derive sigma from the kernel size\". The kernel is passed as a tuple and\nboth entries must be odd.</p>\n<p>Then threshold the blurred image with <code>cv2.threshold</code>. Pass <code>0</code> as the\nthreshold value, <code>255</code> as the maximum, and\n<code>cv2.THRESH_BINARY + cv2.THRESH_OTSU</code> as the mode. That combination tells\nOpenCV to ignore the value you gave and compute one by Otsu instead, which is\nwhy the convention is to pass zero.</p>\n<p>It returns <strong>two</strong> things: the threshold it chose and the thresholded image.\nUnpack both. Forgetting that it returns a pair, and assigning the whole tuple\nto one name, is the single most common OpenCV mistake.</p>\n<p>Note what <code>binary</code> is: a <code>uint8</code> array of 0 and 255, not a boolean mask. If\nyou want to use it with numpy or skimage later, compare it to 0 first.</p>\n<p>Fill in <code>blurred</code>, <code>t_cv</code>, <code>binary</code>.</p>\n<p>Moves: <code>cv2.GaussianBlur(img, (5, 5), 0)</code>,\n<code>t, img = cv2.threshold(img, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)</code>.</p><pre class=\"code\"><code># Part a. Blur, then threshold with Otsu, the OpenCV way.\n\nblurred = None   # YOUR CODE: field blurred with a 5x5 Gaussian, sigma 0\nt_cv = None      # YOUR CODE: the threshold cv2 chose\nbinary = None    # YOUR CODE: the thresholded image\n\nprint(&quot;threshold chosen:&quot;, t_cv)\nprint(&quot;binary dtype    :&quot;, None if binary is None else binary.dtype)\nprint(&quot;unique values   :&quot;, None if binary is None else np.unique(binary).tolist())</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Find the contours</h2>\n<p><code>cv2.findContours</code> traces the outline of every object in the binary image.\nPass <code>cv2.RETR_EXTERNAL</code>, which keeps only outermost contours and ignores any\nholes inside them, and <code>cv2.CHAIN_APPROX_SIMPLE</code>, which compresses straight\nruns of boundary points without changing the shape.</p>\n<p>Take the contours out of what it returns using <code>[-2]</code>. OpenCV 3 returned three\nvalues and OpenCV 4 and 5 return two, so indexing from the end works on all of\nthem. This is genuinely how people write it in production code, and it is\nworth recognising when you meet it.</p>\n<p>Then count them. Compare that count against <code>SK_N_CELLS</code>, the scikit-image\nanswer printed in the setup cell. They may not match exactly, and either\nlibrary may be the one over-counting: the debris specks are near the area\ncutoff, and the two libraries blurred and thresholded slightly differently.\nPart c is where you filter by size and see whether they converge.</p>\n<p>Fill in <code>contours</code>, <code>n_contours</code>.</p>\n<p>Moves: <code>cv2.findContours(binary, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)</code>,\nindexing with <code>[-2]</code>, <code>len()</code>.</p><pre class=\"code\"><code># Part b. Trace the outlines.\n\ncontours = None     # YOUR CODE: the contours, taken with [-2] so it works on any version\nn_contours = None   # YOUR CODE: how many\n\nprint(&quot;contours found   :&quot;, n_contours)\nprint(&quot;skimage found    :&quot;, SK_N_CELLS, &quot;cells after its own area filter&quot;)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Areas, filtering, and the comparison</h2>\n<p>Compute the area of every contour with <code>cv2.contourArea</code>, as a plain list of\nfloats in the order the contours came.</p>\n<p>Filter to the ones at least <code>MIN_AREA</code>, the same cutoff skimage used, and\ncount them. That should drop the debris specks and leave you close to the\nskimage count.</p>\n<p>Then quantify the systematic difference. Sum the areas of the contours that\npassed the filter, and divide by <code>SK_TOTAL_AREA</code>, the total pixel area\nscikit-image measured for its cells. Keep it as a ratio.</p>\n<p>Think about which way that ratio should go before you look. The contour\npolygon runs through the <strong>centres</strong> of the boundary pixels, so roughly half\nof each boundary pixel lies outside it, while skimage counts those pixels in\nfull. So the ratio should come out a little under 1, and it should be nearer 1\nfor larger objects, because the boundary is a smaller share of them.</p>\n<p>A few percent is not a bug, and it does not go away by being careful. It is\nthe two libraries answering slightly different questions. What matters is\npicking one and not mixing them inside a study.</p>\n<p>Fill in <code>areas</code>, <code>n_cells_cv</code>, <code>area_ratio</code>.</p>\n<p>Moves: a list comprehension over <code>contours</code>, <code>cv2.contourArea</code>, filtering,\n<code>sum()</code>, division.</p><pre class=\"code\"><code># Part c. Contour areas, filtered, and compared with skimage.\n\nareas = None         # YOUR CODE: list of cv2.contourArea for every contour\nn_cells_cv = None    # YOUR CODE: how many contours have area &gt;= MIN_AREA\narea_ratio = None    # YOUR CODE: total area of those contours / SK_TOTAL_AREA\n\nprint(&quot;all contour areas :&quot;, None if areas is None else sorted(round(a, 1) for a in areas))\nprint(&quot;cells by OpenCV   :&quot;, n_cells_cv)\nprint(&quot;cells by skimage  :&quot;, SK_N_CELLS)\nprint(&quot;area ratio cv2/skimage: %s&quot; % area_ratio)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The full study. Two groups, four animals in each, and between two and four\nusable fields of view imaged per animal, because some slides had more\nintact tissue than others. Every field contains some cells. The readout is\nthe mean staining intensity of the cells.</p>\n<p>So the data is nested <strong>three</strong> deep: cells inside fields, fields inside\nanimals, animals inside groups.</p>\n<p>This is the week 1 lesson again, with an extra layer and a more convincing\ndisguise. Pooling every cell from every field gives you a number computed\nfrom a few hundred measurements, which feels reassuringly large and is wrong\nfor exactly the same reasons as before: n is inflated, and animals are\nweighted by how much tissue survived sectioning rather than by anything\nbiological.</p>\n<p>The fix is the same, applied twice. Cells up to fields, fields up to animals,\nanimals up to groups. The group SD at the end is across <strong>eight</strong> animals, and\nit is the only n in this study that means anything.</p>"

   {
    "key": "concept",
    "label": "Aggregating up a hierarchy, one level at a time",
    "html": "<h2>Aggregating up a hierarchy, one level at a time</h2>\n<p><strong>The rule.</strong> Summarise at each level before moving to the next, and let every\nunit at a level count once, regardless of how much data sits beneath it.</p>\n<p>Here that is three steps. Each field gives one number, the mean over its\ncells. Each animal gives one number, the mean over its fields. Each group\ngives a mean and an SD over its animals.</p>\n<p><strong>Why not just average all the cells.</strong> Because the number of cells per field\nand the number of fields per animal both vary, and neither variation is\nbiological. An animal whose sections happened to come out well contributes\nfour fields and perhaps two hundred cells; one whose sections tore contributes\ntwo fields and eighty. Pool them and the first animal counts two and a half\ntimes as much as the second. Your group mean is then partly a measurement of\nsectioning quality.</p>\n<p><strong>Why not weight by cell count.</strong> It is tempting, because more cells feels\nlike more information. But the thing you are trying to generalise over is\n<strong>animals</strong>, and you have eight of them whatever happens on the slides.\nWeighting by cells makes your estimate more precise about the animals you\nhappened to image well, which is not the same as being more precise about the\npopulation. Unweighted means at each level is the standard approach, and the\none a reviewer will expect.</p>\n<p><strong>What the final SD must be across.</strong> Animals. Not fields, not cells. With\nfour animals per group, that SD rests on four numbers and is correspondingly\nuncertain, and reporting it honestly rather than reaching for a tighter number\nderived from cells is the whole discipline. A cell level SD would be perhaps\nten times narrower and would describe the spread of cells, which nobody asked\nabout.</p>\n<p><strong>The shape this takes in pandas.</strong> Each level is a <code>groupby</code> on the keys that\nsurvive, aggregating the column produced by the level below. Three small\nsteps, each obvious on its own. The discipline is not technical, it is\nremembering to do it at all when the pooled version is one line shorter and\ngives you a smaller p value.</p>"
   },
   {
    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time, each feeding the next.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>one row per field, from the images</td>\n<td><code>per_field</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>one row per animal</td>\n<td><code>per_animal</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>one row per group, SD across animals</td>\n<td><code>group_stats</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"
   },
   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom skimage import draw, filters, measure, morphology, segmentation\nfrom scipy import ndimage as ndi\n\nPROBLEM_ID = &quot;W4D5&quot;\nTOPIC = &quot;scikit-image pipeline: per field, per animal, per group, with the right n&quot;\n\nIMG_SIZE = 128\nMIN_AREA = 60\nrng = np.random.default_rng(4501)\n\nGROUP_ORDER = [&quot;Vehicle&quot;, &quot;Drug&quot;]\nANIMALS = [(&quot;V%d&quot; % i, &quot;Vehicle&quot;) for i in range(1, 5)] + \\\n          [(&quot;D%d&quot; % i, &quot;Drug&quot;) for i in range(1, 5)]\n_group_level = {&quot;Vehicle&quot;: 128.0, &quot;Drug&quot;: 74.0}\n\n\ndef _make_field(seed, level):\n    &quot;&quot;&quot;One field of view: a few cells on a dim background.&quot;&quot;&quot;\n    r = np.random.default_rng(seed)\n    img = np.full((IMG_SIZE, IMG_SIZE), 35.0)\n    n = int(r.integers(6, 12))\n    for _ in range(n):\n        ra, rb = float(r.uniform(7.0, 10.0)), float(r.uniform(6.0, 9.0))\n        cy = int(r.integers(12, IMG_SIZE - 12))\n        cx = int(r.integers(12, IMG_SIZE - 12))\n        rr, cc = draw.ellipse(cy, cx, ra, rb, shape=img.shape,\n                              rotation=float(r.uniform(0, np.pi)))\n        img[rr, cc] += level * r.uniform(0.80, 1.20)\n    img += r.normal(0.0, 5.0, size=img.shape)\n    return np.clip(img, 0, 255).astype(np.uint8)\n\n\n# Build the study. Animals differ from each other, and the number of usable\n# fields differs too, because some sections tore.\nfields = []\n_seed = 100\nfor _animal, _grp in ANIMALS:\n    _animal_level = _group_level[_grp] * rng.lognormal(0.0, 0.16)\n    _n_fields = int(rng.integers(2, 5))\n    for _f in range(1, _n_fields + 1):\n        fields.append({&quot;ANIMAL&quot;: _animal, &quot;GROUP&quot;: _grp, &quot;FIELD&quot;: _f,\n                       &quot;IMAGE&quot;: _make_field(_seed, _animal_level)})\n        _seed += 1\n\n\ndef segment_field(img):\n    &quot;&quot;&quot;The week 4 pipeline in one function. Returns one row per cell.&quot;&quot;&quot;\n    mask = img &gt; filters.threshold_otsu(img)\n    mask = morphology.opening(mask, morphology.disk(2))\n    mask = ndi.binary_fill_holes(mask)\n    mask = segmentation.clear_border(mask)\n    labels = measure.label(mask)\n    props = pd.DataFrame(measure.regionprops_table(\n        labels, intensity_image=img, properties=(&quot;label&quot;, &quot;area&quot;, &quot;mean_intensity&quot;)))\n    return props[props[&quot;area&quot;] &gt;= MIN_AREA].reset_index(drop=True)\n\n\nprint(&quot;fields imaged:&quot;, len(fields))\nprint(pd.DataFrame([{k: v for k, v in f.items() if k != &quot;IMAGE&quot;} for f in fields])\n      .groupby([&quot;GROUP&quot;, &quot;ANIMAL&quot;]).size().to_string())\nprint(&quot;&quot;)\nprint(&quot;example of what segment_field gives you for one field:&quot;)\nprint(segment_field(fields[0][&quot;IMAGE&quot;]).round(2).to_string(index=False))\n\n_fig, _axes = plt.subplots(1, 4, figsize=(12, 3.2))\nfor _ax, _f in zip(_axes, fields[:4]):\n    _ax.imshow(_f[&quot;IMAGE&quot;], cmap=&quot;gray&quot;, vmin=0, vmax=255)\n    _ax.set_title(&quot;%s field %d&quot; % (_f[&quot;ANIMAL&quot;], _f[&quot;FIELD&quot;]))\n    _ax.axis(&quot;off&quot;)\n_fig.tight_layout()\nplt.show()</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>loop with an index</td>\n<td><code>for f in fields:</code> then <code>f[\"ANIMAL\"]</code>, <code>f[\"IMAGE\"]</code></td>\n</tr>\n<tr>\n<td>segment one field</td>\n<td><code>segment_field(f[\"IMAGE\"])</code></td>\n</tr>\n<tr>\n<td>build rows then a table</td>\n<td>collect dicts in a list, then <code>pd.DataFrame(rows)</code></td>\n</tr>\n<tr>\n<td>a column mean</td>\n<td><code>float(df[\"mean_intensity\"].mean())</code></td>\n</tr>\n<tr>\n<td>one level up</td>\n<td><code>.groupby([...]).agg(NAME=(\"COL\", \"mean\"), ...).reset_index()</code></td>\n</tr>\n<tr>\n<td>count rows in a group</td>\n<td>the aggregation <code>\"size\"</code></td>\n</tr>\n<tr>\n<td>sample SD</td>\n<td>the aggregation <code>\"std\"</code>, already n-1 in pandas</td>\n</tr>\n</tbody>\n</table>\n<p>Building a list of dictionaries and handing it to <code>pd.DataFrame</code> at the end is\nusually clearer than growing a DataFrame row by row, and far faster.</p><pre class=\"code\"><code>import numpy as np\nimport pandas as pd\n\n# A tiny made up three level dataset. Nothing here is the answer.\ndemo_cells = pd.DataFrame({\n    &quot;ANIMAL&quot;: [&quot;a1&quot;] * 7 + [&quot;a2&quot;] * 3,\n    &quot;GROUP&quot;:  [&quot;ctl&quot;] * 10,\n    &quot;FIELD&quot;:  [1, 1, 1, 1, 2, 2, 2, 1, 1, 1],\n    &quot;VALUE&quot;:  [10.0, 12.0, 14.0, 16.0, 40.0, 42.0, 44.0, 70.0, 72.0, 74.0],\n})\nprint(&quot;demo, one row per CELL. a1 gave 2 fields and 7 cells, a2 gave 1 field and 3:&quot;)\nprint(demo_cells)\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. cells up to fields ---&quot;)\ndemo_field = (demo_cells.groupby([&quot;ANIMAL&quot;, &quot;GROUP&quot;, &quot;FIELD&quot;])\n              .agg(N_CELLS=(&quot;VALUE&quot;, &quot;size&quot;), MEAN_VALUE=(&quot;VALUE&quot;, &quot;mean&quot;))\n              .reset_index())\nprint(demo_field)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. fields up to animals ---&quot;)\ndemo_animal = (demo_field.groupby([&quot;ANIMAL&quot;, &quot;GROUP&quot;])\n               .agg(N_FIELDS=(&quot;MEAN_VALUE&quot;, &quot;size&quot;),\n                    TOTAL_CELLS=(&quot;N_CELLS&quot;, &quot;sum&quot;),\n                    MEAN_VALUE=(&quot;MEAN_VALUE&quot;, &quot;mean&quot;))\n               .reset_index())\nprint(demo_animal)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the three answers you could report, and what each weights ---&quot;)\ndemo_pooled = float(demo_cells[&quot;VALUE&quot;].mean())\ndemo_by_field = float(demo_field[&quot;MEAN_VALUE&quot;].mean())\ndemo_by_animal = float(demo_animal[&quot;MEAN_VALUE&quot;].mean())\nprint(&quot;mean of every cell pooled : %.3f   &lt;- weights by cells imaged&quot; % demo_pooled)\nprint(&quot;mean of the field means   : %.3f   &lt;- weights by fields imaged&quot; % demo_by_field)\nprint(&quot;mean of the animal means  : %.3f   &lt;- weights each ANIMAL once&quot; % demo_by_animal)\nprint(&quot;&quot;)\nprint(&quot;all three are different, and only the last one answers a question about animals&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. and what n you would be claiming ---&quot;)\nprint(&quot;n if you count cells  :&quot;, len(demo_cells))\nprint(&quot;n if you count fields :&quot;, len(demo_field))\nprint(&quot;n if you count animals:&quot;, len(demo_animal), &quot; &lt;- the only honest one&quot;)</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Run the pipeline on every field</h2>\n<p>Loop over <code>fields</code>. Each entry is a dictionary with <code>ANIMAL</code>, <code>GROUP</code>,\n<code>FIELD</code> and <code>IMAGE</code>. Hand the image to <code>segment_field</code>, which runs the whole\nweek 4 pipeline and returns one row per surviving cell, with <code>area</code> and\n<code>mean_intensity</code>.</p>\n<p>For each field record four things: the animal, the group, the field number,\nhow many cells were found, and the mean of those cells' <code>mean_intensity</code>\nvalues. That last number is the field's single summary, and it is the first\nlevel of aggregation.</p>\n<p>Collect the rows as a list of dictionaries and build the DataFrame once at the\nend. Growing a DataFrame inside a loop works but is slow and reads worse.</p>\n<p>One thing to watch: a field could in principle yield no cells at all, and the\nmean of nothing is <code>nan</code>. With this data every field does find cells, but\nnoticing that the case exists is the habit worth having.</p>\n<p>Fill in <code>per_field</code>, sorted by <code>ANIMAL</code> then <code>FIELD</code>, index renumbered, with\nexactly:</p>\n<table>\n<thead>\n<tr>\n<th>column</th>\n<th>meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>ANIMAL</code></td>\n<td>animal identifier</td>\n</tr>\n<tr>\n<td><code>GROUP</code></td>\n<td><code>Vehicle</code> or <code>Drug</code></td>\n</tr>\n<tr>\n<td><code>FIELD</code></td>\n<td>field number within that animal</td>\n</tr>\n<tr>\n<td><code>N_CELLS</code></td>\n<td>cells found in that field</td>\n</tr>\n<tr>\n<td><code>MEAN_INTENSITY</code></td>\n<td>mean of that field's cell intensities</td>\n</tr>\n</tbody>\n</table>\n<p>Moves: a <code>for</code> loop, <code>segment_field(...)</code>, <code>len()</code>, <code>.mean()</code>,\n<code>pd.DataFrame(rows)</code>, <code>.sort_values([...]).reset_index(drop=True)</code>.</p><pre class=\"code\"><code># Part a. Segment every field and summarise each one.\n\nrows = []\n# YOUR CODE: loop over fields, segment each image, and append one dict per field\n#            with ANIMAL, GROUP, FIELD, N_CELLS, MEAN_INTENSITY\n\nper_field = None   # YOUR CODE: pd.DataFrame(rows), sorted by ANIMAL then FIELD\n\nprint(per_field)</code></pre>"

   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Fields up to animals</h2>\n<p>One row per animal. Three numbers: how many fields it contributed, how many\ncells in total across those fields, and its mean intensity.</p>\n<p>That last one is the mean of the <strong>field means</strong>, not of the cells. Each field\ncounts once regardless of how many cells it happened to contain, for the same\nreason each animal will count once in part c regardless of how many fields it\ncontributed. You are applying the same rule at a second level.</p>\n<p><code>TOTAL_CELLS</code> is a sum rather than a mean, because it is a count of things\nrather than an average of measurements. It is worth keeping: it is the number\nthat shows how uneven the imaging was, and therefore why the unweighted mean\nmatters.</p>\n<p>Fill in <code>per_animal</code>, sorted by <code>ANIMAL</code>, index renumbered, with exactly:</p>\n<table>\n<thead>\n<tr>\n<th>column</th>\n<th>meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>ANIMAL</code></td>\n<td>animal identifier</td>\n</tr>\n<tr>\n<td><code>GROUP</code></td>\n<td><code>Vehicle</code> or <code>Drug</code></td>\n</tr>\n<tr>\n<td><code>N_FIELDS</code></td>\n<td>fields imaged for that animal</td>\n</tr>\n<tr>\n<td><code>TOTAL_CELLS</code></td>\n<td>cells found across all its fields</td>\n</tr>\n<tr>\n<td><code>MEAN_INTENSITY</code></td>\n<td>mean of that animal's field means</td>\n</tr>\n</tbody>\n</table>\n<p>Moves: <code>.groupby([\"ANIMAL\", \"GROUP\"]).agg(NAME=(\"COL\", \"mean\"), ...)</code>,\n<code>\"size\"</code>, <code>\"sum\"</code>, <code>.reset_index()</code>.</p><pre class=\"code\"><code># Part b. One row per animal.\n\nper_animal = None   # YOUR CODE: ANIMAL, GROUP, N_FIELDS, TOTAL_CELLS, MEAN_INTENSITY\n\nprint(per_animal)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Animals up to groups</h2>\n<p>The last level, and the one that goes in the figure.</p>\n<p>One row per group: the mean of the animal means, the sample SD <strong>across\nanimals</strong>, and the number of animals. Sort so <code>Vehicle</code> comes before <code>Drug</code>,\nwhich is dose order rather than alphabetical order.</p>\n<p>Check <code>N_ANIMALS</code> when you have it. It should be 4 in each group. If you see\nanything in the tens it came from fields, and anything in the hundreds from\ncells, and in either case the SD beside it is describing the wrong thing.</p>\n<p>Look at the SD too. Built from four animals, it will be wide, and that is the\nhonest answer. A cell level SD would be far narrower and would be answering a\nquestion about cells that nobody asked. The temptation to reach for the\nnarrower number is the whole reason this rule needs stating.</p>\n<p>Fill in <code>group_stats</code>, index renumbered, with exactly:</p>\n<table>\n<thead>\n<tr>\n<th>column</th>\n<th>meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>GROUP</code></td>\n<td><code>Vehicle</code> then <code>Drug</code></td>\n</tr>\n<tr>\n<td><code>MEAN</code></td>\n<td>mean of the animal means</td>\n</tr>\n<tr>\n<td><code>SD</code></td>\n<td>sample SD of the animal means</td>\n</tr>\n<tr>\n<td><code>N_ANIMALS</code></td>\n<td>animals in that group</td>\n</tr>\n</tbody>\n</table>\n<p>Moves: <code>.groupby(\"GROUP\").agg(...)</code>, <code>.reset_index()</code>, <code>.map</code> or a sort key\nfor the group order.</p><pre class=\"code\"><code># Part c. One row per group, with the SD across animals.\n\ngroup_stats = None   # YOUR CODE: GROUP, MEAN, SD, N_ANIMALS, Vehicle first\n\nprint(group_stats)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Two hundred subjects from a phase 1 programme, each with an individually\nestimated clearance and a handful of covariates: body weight, age, sex,\ncreatinine clearance and ALT.</p>\n<p>The question is the one every population PK analysis eventually asks. How much\nof the between-subject variability in clearance can these covariates explain,\nand how well could you predict a new subject's clearance before dosing them.</p>\n<p>Those two questions are not the same, and the distance between them is the\nentire subject of this problem. A model can describe the subjects you have\nbeautifully and predict the next one badly, and the only way to find out is to\nhold data back and test on it.</p>"
   },
   {
    "key": "concept",
    "label": "Fit, predict, and the difference between describing and predicting",
    "html": "<h2>Fit, predict, and the difference between describing and predicting</h2>\n<p><strong>The scikit-learn shape.</strong> Every model in the library has the same three\ncalls. <code>model.fit(X, y)</code> learns, <code>model.predict(X)</code> produces predictions, and\n<code>model.score(X, y)</code> gives a default quality measure. <code>X</code> is always a 2D array\nor DataFrame of shape <code>(n_samples, n_features)</code> and <code>y</code> is 1D with one entry\nper sample. Once you know this shape, swapping a linear regression for a\nrandom forest is a one line change, which is a large part of why the library\nis used so widely.</p>\n<p><strong>Why you hold data back.</strong> A model fitted on some data will always describe\nthat data better than it describes new data, because it has been tuned,\npartly, to that data's noise. The more flexible the model and the more\nfeatures it has, the more noise it can absorb and the larger that gap grows.\nEvaluated on the data it learned from, every model looks better than it is.</p>\n<p>So you split once, at the start, before looking at anything. The model sees\nonly the training part. The test part is spent exactly once, at the end, to\nget an honest number. Looking at test performance and then adjusting the model\nquietly turns the test set into training data, and the honest number stops\nbeing honest.</p>\n<p><strong>train_test_split, and random_state.</strong> It shuffles and splits in one call.\n<code>test_size=0.25</code> holds back a quarter. <code>random_state</code> fixes the shuffle so the\nsplit is reproducible, which matters because without it every run gives a\ndifferent answer and you cannot tell a real improvement from a different\nshuffle.</p>\n<p><strong>R2 and RMSE say different things.</strong> R2 is the fraction of variance\nexplained: 1 is perfect, 0 is no better than always predicting the mean, and\nit can go <strong>negative</strong> on held-out data, which simply means your model is\nworse than the mean. It is unitless, so it compares across problems. RMSE is\nthe typical size of an error in the units of the thing you are predicting, so\nfor clearance it is in L/h and you can tell your pharmacologist whether that\nis tolerable. Report both: R2 for whether the model is doing anything, RMSE\nfor whether it is useful.</p>\n<p><strong>What a gap between train and test tells you.</strong> A large gap means the model\nhas fitted noise. A small one means it generalises.</p>\n<p>With a linear model, five covariates and two hundred subjects, expect the gap\nto be very small, and do not be surprised if it comes out slightly\n<strong>negative</strong>, with the test score higher than the training score. That is not\na bug and it does not mean the model predicts new data better than old. It\nmeans the model is far too rigid to memorise anything, so the gap is near\nzero, and a fifty subject test set is small enough that chance decides which\nside of zero it lands on.</p>\n<p>The gap only becomes reliably positive, and large, when the model is flexible\nenough to absorb noise. You will see exactly that on day 3 with a random\nforest. Holding both pictures in mind is the point: the split is not a ritual,\nit measures something that varies with how much freedom you gave the model.</p>"
   },

    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>the split, held back before anything else</td>\n<td><code>X_train</code>, <code>X_test</code>, <code>y_train</code>, <code>y_test</code>, <code>n_train</code>, <code>n_test</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>the fitted model and its honest performance</td>\n<td><code>model</code>, <code>pred_test</code>, <code>r2_test</code>, <code>rmse_test</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>how much better it looks on its own training data</td>\n<td><code>r2_train</code>, <code>rmse_train</code>, <code>optimism</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.metrics import r2_score, mean_squared_error\n\nPROBLEM_ID = &quot;W5D1&quot;\nTOPIC = &quot;scikit-learn: train_test_split, fit and predict, R2 and RMSE, optimism&quot;\n\nrng = np.random.default_rng(5101)\n\nN = 200\nFEATURES = [&quot;WEIGHT_KG&quot;, &quot;AGE_Y&quot;, &quot;SEX_M&quot;, &quot;CRCL_ML_MIN&quot;, &quot;ALT_U_L&quot;]\n\n_weight = np.round(np.clip(rng.normal(74.0, 13.0, N), 45.0, 125.0), 1)\n_age = np.round(np.clip(rng.normal(42.0, 13.0, N), 18.0, 75.0), 0)\n_sex = rng.integers(0, 2, N)\n_crcl = np.round(np.clip(rng.normal(104.0, 24.0, N) - 0.45 * (_age - 42.0), 35.0, 180.0), 1)\n_alt = np.round(np.clip(rng.lognormal(np.log(24.0), 0.42, N), 5.0, 160.0), 1)\n\n# Truth: allometric on weight, renal on CrCl, a mild age effect, nothing on ALT.\n_cl = (4.1 * (_weight / 70.0) ** 0.75\n       * (_crcl / 100.0) ** 0.40\n       * np.exp(-0.0045 * (_age - 42.0))\n       * (1.0 + 0.06 * _sex))\ncl = np.round(_cl * rng.lognormal(0.0, 0.17, N), 3)\n\nsubjects = pd.DataFrame({\n    &quot;WEIGHT_KG&quot;: _weight, &quot;AGE_Y&quot;: _age, &quot;SEX_M&quot;: _sex,\n    &quot;CRCL_ML_MIN&quot;: _crcl, &quot;ALT_U_L&quot;: _alt, &quot;CL_L_H&quot;: cl,\n})\n\nX = subjects[FEATURES]\ny = subjects[&quot;CL_L_H&quot;]\n\nprint(&quot;subjects:&quot;, subjects.shape)\nprint(subjects.head().to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;X:&quot;, X.shape, &quot;  y:&quot;, y.shape)\nprint(&quot;clearance ranges %.2f to %.2f L/h, mean %.2f&quot; % (y.min(), y.max(), y.mean()))</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>split off a test set</td>\n<td><code>train_test_split(X, y, test_size=0.25, random_state=42)</code></td>\n</tr>\n<tr>\n<td>fit a model</td>\n<td><code>model = LinearRegression().fit(X_train, y_train)</code></td>\n</tr>\n<tr>\n<td>predict</td>\n<td><code>model.predict(X_test)</code></td>\n</tr>\n<tr>\n<td>fraction of variance explained</td>\n<td><code>r2_score(y_true, y_pred)</code></td>\n</tr>\n<tr>\n<td>typical error, in real units</td>\n<td><code>np.sqrt(mean_squared_error(y_true, y_pred))</code></td>\n</tr>\n<tr>\n<td>the fitted coefficients</td>\n<td><code>model.coef_</code>, <code>model.intercept_</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>train_test_split</code> returns <strong>four</strong> things in this order: X train, X test, y\ntrain, y test. Getting that order wrong gives shapes that look plausible and\nresults that are nonsense.</p>\n<p>Compute RMSE as <code>np.sqrt(mean_squared_error(...))</code> rather than with a\n<code>squared=False</code> argument, which exists only in some versions.</p><pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.metrics import r2_score, mean_squared_error\n\n# A tiny made up dataset. Nothing here is the answer.\ndemo_rng = np.random.default_rng(0)\ndemo_X = pd.DataFrame({&quot;a&quot;: demo_rng.normal(size=40), &quot;b&quot;: demo_rng.normal(size=40)})\ndemo_y = 3.0 * demo_X[&quot;a&quot;] - 1.5 * demo_X[&quot;b&quot;] + demo_rng.normal(0, 1.0, 40)\n\nprint(&quot;--- 1. the split returns FOUR things, in this order ---&quot;)\ndemo_Xtr, demo_Xte, demo_ytr, demo_yte = train_test_split(\n    demo_X, demo_y, test_size=0.25, random_state=42)\nprint(&quot;X_train&quot;, demo_Xtr.shape, &quot; X_test&quot;, demo_Xte.shape)\nprint(&quot;y_train&quot;, demo_ytr.shape, &quot; y_test&quot;, demo_yte.shape)\nprint(&quot;rows add back up:&quot;, len(demo_Xtr) + len(demo_Xte), &quot;of&quot;, len(demo_X))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. random_state makes the split reproducible ---&quot;)\ndemo_a = train_test_split(demo_X, demo_y, test_size=0.25, random_state=42)[1].index.tolist()\ndemo_b = train_test_split(demo_X, demo_y, test_size=0.25, random_state=42)[1].index.tolist()\ndemo_c = train_test_split(demo_X, demo_y, test_size=0.25, random_state=7)[1].index.tolist()\nprint(&quot;same seed, same test rows:&quot;, demo_a == demo_b)\nprint(&quot;different seed, different:&quot;, demo_a != demo_c)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. fit on train only, then predict ---&quot;)\ndemo_model = LinearRegression().fit(demo_Xtr, demo_ytr)\nprint(&quot;coefficients:&quot;, np.round(demo_model.coef_, 3), &quot; intercept %.3f&quot; % demo_model.intercept_)\ndemo_pred = demo_model.predict(demo_Xte)\nprint(&quot;first three predictions:&quot;, np.round(demo_pred[:3], 3))\nprint(&quot;first three actuals    :&quot;, np.round(demo_yte.to_numpy()[:3], 3))\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. two scores that say different things ---&quot;)\ndemo_r2 = r2_score(demo_yte, demo_pred)\ndemo_rmse = float(np.sqrt(mean_squared_error(demo_yte, demo_pred)))\nprint(&quot;R2   : %.4f   &lt;- fraction of variance explained, unitless&quot; % demo_r2)\nprint(&quot;RMSE : %.4f   &lt;- typical error, in the units of y&quot; % demo_rmse)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. the same model always looks better on its own training data ---&quot;)\ndemo_r2_train = r2_score(demo_ytr, demo_model.predict(demo_Xtr))\nprint(&quot;R2 on train: %.4f&quot; % demo_r2_train)\nprint(&quot;R2 on test : %.4f&quot; % demo_r2)\nprint(&quot;gap        : %.4f  &lt;- optimism, and it grows with model flexibility&quot;\n      % (demo_r2_train - demo_r2))</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Hold out a test set before you look at anything</h2>\n<p>Split <code>X</code> and <code>y</code> into a training set and a test set, holding back 25 percent\nfor testing, with <code>random_state=42</code> so the split is reproducible.</p>\n<p><code>train_test_split</code> returns <strong>four</strong> things and the order is X train, X test, y\ntrain, y test. Unpack them in that order. Swapping the middle two is a classic\nand produces shapes that look fine while the model learns from the wrong\nrows.</p>\n<p>Then record how many subjects ended up in each part. They should add back up\nto 200, and the test set should hold 50.</p>\n<p>The <code>random_state</code> is not decoration. Without it, every run reshuffles and\nyour R2 wobbles by a few hundredths, which is more than enough to make you\nbelieve a change helped when it did not.</p>\n<p>Fill in <code>X_train</code>, <code>X_test</code>, <code>y_train</code>, <code>y_test</code>, <code>n_train</code>, <code>n_test</code>.</p>\n<p>Moves: <code>train_test_split(X, y, test_size=0.25, random_state=42)</code>, <code>len()</code>.</p><pre class=\"code\"><code># Part a. Split off a test set, reproducibly.\n\nX_train = None   # YOUR CODE\nX_test = None    # YOUR CODE\ny_train = None   # YOUR CODE\ny_test = None    # YOUR CODE\nn_train = None   # YOUR CODE: how many subjects train on\nn_test = None    # YOUR CODE: how many are held back\n\nprint(&quot;n_train:&quot;, n_train, &quot;  n_test:&quot;, n_test)\nprint(&quot;X_train shape:&quot;, None if X_train is None else X_train.shape)\nprint(&quot;X_test shape :&quot;, None if X_test is None else X_test.shape)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Fit, predict, and score honestly</h2>\n<p>Fit a <code>LinearRegression</code> on the <strong>training</strong> data only. The test set does not\nexist as far as the model is concerned.</p>\n<p>Then predict on the test set and score those predictions two ways. <code>r2_score</code>\ngives the fraction of variance explained, unitless, where 0 means no better\nthan always guessing the mean. <code>np.sqrt(mean_squared_error(...))</code> gives the\ntypical error in L/h, which is the number to quote to a pharmacologist.</p>\n<p>Compute RMSE that way rather than with a <code>squared=False</code> argument. That\nargument was removed from recent scikit-learn in favour of a separate\nfunction, so the square root of the mean squared error is the form that works\neverywhere.</p>\n<p>Have a look at <code>model.coef_</code> as well. With the features on wildly different\nscales, weight in kilograms against sex as 0 or 1, the coefficients are not\ncomparable to each other and the largest one is not the most important\nfeature. Week 5 day 4 deals with that properly.</p>\n<p>Fill in <code>model</code>, <code>pred_test</code>, <code>r2_test</code>, <code>rmse_test</code>.</p>\n<p>Moves: <code>LinearRegression().fit(X_train, y_train)</code>, <code>.predict(X_test)</code>,\n<code>r2_score</code>, <code>np.sqrt(mean_squared_error(...))</code>.</p><pre class=\"code\"><code># Part b. Fit on train, score on test.\n\nmodel = None       # YOUR CODE: a LinearRegression fitted on the TRAINING data\npred_test = None   # YOUR CODE: its predictions for the test set\nr2_test = None     # YOUR CODE: R2 on the test set\nrmse_test = None   # YOUR CODE: RMSE on the test set, in L/h\n\nprint(&quot;R2 on test   : %s&quot; % r2_test)\nprint(&quot;RMSE on test : %s L/h&quot; % rmse_test)\nif model is not None:\n    print(&quot;coefficients :&quot;, dict(zip(FEATURES, np.round(model.coef_, 4))))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Measure the optimism</h2>\n<p>Score the <strong>same fitted model</strong> on the training data it learned from, and\ncompare.</p>\n<p>Compute <code>r2_train</code> and <code>rmse_train</code> the same way as part b but against\n<code>X_train</code> and <code>y_train</code>, then set <code>optimism</code> to <code>r2_train - r2_test</code>.</p>\n<p>What you should find is a gap very close to zero, and on this particular split\nit actually comes out <strong>negative</strong>: the model scores slightly better on the\nfifty subjects it never saw than on the hundred and fifty it learned from.</p>\n<p>That is worth sitting with rather than explaining away. A linear model with\nfive coefficients has nowhere near enough freedom to memorise a hundred and\nfifty subjects, so there is almost no optimism to find, and what remains is\nswamped by the luck of which fifty subjects landed in the test set. A small\nnegative gap is exactly what \"this model cannot overfit\" looks like.</p>\n<p>Keep the number, because it is the baseline for the rest of the week. On day 3\na random forest on this same data will show a clearly positive gap, not\nbecause it is a worse model but because it is flexible enough to absorb noise.\nThe contrast between the two is the thing to remember.</p>\n<p>What would be alarming is a <strong>large</strong> gap in either direction. Large and\npositive means overfitting. Large and negative usually means the split leaked\nor <code>pred_test</code> was lined up against the wrong rows.</p>\n<p>Fill in <code>r2_train</code>, <code>rmse_train</code>, <code>optimism</code>.</p>\n<p>Moves: <code>model.predict(X_train)</code>, <code>r2_score</code>, <code>np.sqrt(mean_squared_error(...))</code>,\nsubtraction.</p><pre class=\"code\"><code># Part c. How much better does it look on its own training data.\n\nr2_train = None     # YOUR CODE: R2 of the SAME model on the training data\nrmse_train = None   # YOUR CODE: RMSE on the training data\noptimism = None     # YOUR CODE: r2_train - r2_test\n\nprint(&quot;R2   train %s  vs test %s&quot; % (r2_train, r2_test))\nprint(&quot;RMSE train %s  vs test %s&quot; % (rmse_train, rmse_test))\nprint(&quot;optimism   %s&quot; % optimism)</code></pre>"
   }
