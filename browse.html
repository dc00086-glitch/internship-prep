  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>set up the folds</td>\n<td><code>KFold(n_splits=5, shuffle=True, random_state=1)</code></td>\n</tr>\n<tr>\n<td>run cross-validation</td>\n<td><code>cross_val_score(model, X, y, cv=kf, scoring=\"r2\")</code></td>\n</tr>\n<tr>\n<td>summarise the folds</td>\n<td><code>scores.mean()</code>, <code>scores.std(ddof=1)</code></td>\n</tr>\n<tr>\n<td>pick the k best features</td>\n<td><code>SelectKBest(f_regression, k=10)</code></td>\n</tr>\n<tr>\n<td>apply a selector</td>\n<td><code>.fit_transform(X, y)</code></td>\n</tr>\n<tr>\n<td>chain steps into one estimator</td>\n<td><code>Pipeline([(\"sel\", ...), (\"model\", ...)])</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>cross_val_score</code> refits the estimator you hand it on each training fold. If\nthat estimator is a <code>Pipeline</code>, every step inside gets refitted per fold,\nwhich is exactly what stops a selection step from seeing its own test data.</p>",
  "sections": [
   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>A collaborator has run an exploratory biomarker panel on 80 subjects: 150\nanalytes, measured because the platform could measure them, with no prior\nhypothesis attached to any of them. The question is whether any of them\npredict clearance beyond what weight and renal function already explain.</p>\n<p>In truth, <strong>none of the 150 do</strong>. They are noise. This problem is built that\nway on purpose, because it means you know the right answer and can therefore\nrecognise a method that manufactures the wrong one.</p>\n<p>The usual workflow is to screen the panel for the most promising analytes,\nthen cross-validate a model built on those. Done in that order it reports a\nrespectable predictive performance on pure noise, and nothing about the output\nlooks wrong. This is probably the single most common serious error in applied\nmachine learning, and it has put a lot of biomarkers into a lot of papers.</p>"
   },
   {
    "key": "concept",
    "label": "Cross-validation, and what counts as touching the test data",
    "html": "<h2>Cross-validation, and what counts as touching the test data</h2>\n<p><strong>Cross-validation reuses every subject.</strong> A single train/test split spends a\nquarter of your data on one noisy estimate. K-fold splits the data into k\nparts, trains on k-1 and tests on the one left out, and rotates. Every subject\nis tested exactly once, every subject is trained on k-1 times, and you get k\nestimates whose spread tells you how stable the answer is.</p>\n<p><code>KFold(n_splits=5, shuffle=True, random_state=1)</code> is the usual setup. Shuffle\nmatters: without it the folds are consecutive blocks of the file, and if the\nfile is ordered by anything, by site, by cohort, by date, your folds are\nconfounded with it.</p>\n<p><code>cross_val_score(model, X, y, cv=kf, scoring=\"r2\")</code> runs the whole thing and\nreturns the k scores. Report their <strong>mean and SD</strong>, because a mean of 0.4 made\nof folds from 0.1 to 0.7 is a very different claim from one made of folds all\nnear 0.4.</p>\n<p><strong>Leakage is the failure where information from the test fold reaches the\nmodel.</strong> It does not need to be dramatic. Anything fitted on all the data\nbefore cross-validation starts carries information from every fold into every\nother, and that includes steps that feel like data preparation rather than\nmodelling.</p>\n<p><strong>Feature selection is the worst offender, and here is why.</strong> With 150 pure\nnoise analytes and only 80 subjects, some of them will correlate with\nclearance by chance. Screen on all the data, keep the best six, and those six\nwere chosen\n<em>because</em> they happened to match the target in the very rows you will later\nuse for testing. Cross-validation then dutifully holds out a fold, but the\nfeatures it is working with already know about that fold. The reported score\ncomes out clearly positive for data containing no signal at all.</p>\n<p>The tell is that it is invisible. There is no warning, the code is short, and\nthe number that comes out is modest rather than absurd. You should get an R2\naround 0.13 here, which is not a suspicious result at all. For a novel\nbiomarker signature explaining 13 percent of the variance in clearance, that\nis a figure, a paragraph in the discussion, and quite possibly a follow-up\nstudy. From columns of random numbers.</p>\n<p><strong>The fix is Pipeline.</strong> A <code>Pipeline</code> chains steps into a single estimator,\nand when cross-validation refits that estimator on each training fold, every\nstep inside it is refitted too, on that fold only. Selection happens 5 times,\non 5 different subsets, each blind to its own test fold.</p>\n<p>The rule worth memorising: <strong>anything that learns from the data belongs inside\nthe pipeline.</strong> Scaling learns a mean and an SD. Imputation learns a fill\nvalue. Feature selection learns which columns. All of them belong inside. Only\noperations that treat each row independently, such as taking a log, are safe\noutside.</p>"
   },
   {
    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>honest cross-validation on the real covariates</td>\n<td><code>cv_scores</code>, <code>cv_mean</code>, <code>cv_sd</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>the leak: screen first, then cross-validate</td>\n<td><code>X_leaky</code>, <code>cv_leaky_mean</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>the fix: screen inside the pipeline</td>\n<td><code>pipe</code>, <code>cv_clean_mean</code>, <code>leak_inflation</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"
   },
   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import KFold, cross_val_score\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.feature_selection import SelectKBest, f_regression\n\nPROBLEM_ID = &quot;W5D2&quot;\nTOPIC = &quot;scikit-learn: KFold, cross_val_score, Pipeline, and data leakage&quot;\n\nrng = np.random.default_rng(5102)\n\nN = 80\nN_NOISE = 150\nK_SELECT = 6\n\n_weight = np.round(np.clip(rng.normal(74.0, 13.0, N), 45.0, 125.0), 1)\n_crcl = np.round(np.clip(rng.normal(104.0, 24.0, N), 35.0, 180.0), 1)\n_cl = 4.1 * (_weight / 70.0) ** 0.75 * (_crcl / 100.0) ** 0.40\ncl = np.round(_cl * rng.lognormal(0.0, 0.18, N), 3)\n\n# The biomarker panel. Every column is pure noise, unrelated to clearance.\n_panel = rng.normal(0.0, 1.0, size=(N, N_NOISE))\npanel = pd.DataFrame(_panel, columns=[&quot;BM%02d&quot; % i for i in range(1, N_NOISE + 1)])\n\nX_real = pd.DataFrame({&quot;WEIGHT_KG&quot;: _weight, &quot;CRCL_ML_MIN&quot;: _crcl})\nX_panel = panel\ny = pd.Series(cl, name=&quot;CL_L_H&quot;)\n\nprint(&quot;subjects:&quot;, N)\nprint(&quot;real covariates :&quot;, list(X_real.columns))\nprint(&quot;biomarker panel :&quot;, X_panel.shape[1], &quot;analytes, all of them pure noise&quot;)\nprint(&quot;&quot;)\nprint(&quot;strongest single correlation between any analyte and clearance:&quot;)\n_corrs = np.array([abs(np.corrcoef(X_panel.iloc[:, i], y)[0, 1]) for i in range(N_NOISE)])\nprint(&quot;  %.4f  (%s)&quot; % (_corrs.max(), X_panel.columns[int(_corrs.argmax())]))\nprint(&quot;  with %d noise columns and only %d subjects, something always looks promising&quot;\n      % (N_NOISE, N))</code></pre>"
   },
   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>set up the folds</td>\n<td><code>KFold(n_splits=5, shuffle=True, random_state=1)</code></td>\n</tr>\n<tr>\n<td>run cross-validation</td>\n<td><code>cross_val_score(model, X, y, cv=kf, scoring=\"r2\")</code></td>\n</tr>\n<tr>\n<td>summarise the folds</td>\n<td><code>scores.mean()</code>, <code>scores.std(ddof=1)</code></td>\n</tr>\n<tr>\n<td>pick the k best features</td>\n<td><code>SelectKBest(f_regression, k=10)</code></td>\n</tr>\n<tr>\n<td>apply a selector</td>\n<td><code>.fit_transform(X, y)</code></td>\n</tr>\n<tr>\n<td>chain steps into one estimator</td>\n<td><code>Pipeline([(\"sel\", ...), (\"model\", ...)])</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>cross_val_score</code> refits the estimator you hand it on each training fold. If\nthat estimator is a <code>Pipeline</code>, every step inside gets refitted per fold,\nwhich is exactly what stops a selection step from seeing its own test data.</p><pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import KFold, cross_val_score\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.feature_selection import SelectKBest, f_regression\n\n# A tiny made up example with NO signal at all. Nothing here is the answer.\ndemo_rng = np.random.default_rng(3)\ndemo_n, demo_p = 60, 40\ndemo_X = pd.DataFrame(demo_rng.normal(size=(demo_n, demo_p)),\n                      columns=[&quot;f%02d&quot; % i for i in range(demo_p)])\ndemo_y = pd.Series(demo_rng.normal(size=demo_n))      # unrelated to demo_X\ndemo_kf = KFold(n_splits=5, shuffle=True, random_state=1)\n\nprint(&quot;40 random features, 60 samples, and a target that is pure noise.&quot;)\nprint(&quot;The honest answer for any method here is: no predictive power.&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. honest cross-validation on everything ---&quot;)\ndemo_all = cross_val_score(LinearRegression(), demo_X, demo_y, cv=demo_kf, scoring=&quot;r2&quot;)\nprint(&quot;fold scores:&quot;, np.round(demo_all, 3))\nprint(&quot;mean R2    : %.3f   &lt;- negative, which is correct: worse than the mean&quot;\n      % demo_all.mean())\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. the leak: select on ALL the data, then cross-validate ---&quot;)\ndemo_sel = SelectKBest(f_regression, k=5).fit(demo_X, demo_y)\ndemo_leaky = demo_X.loc[:, demo_sel.get_support()]\nprint(&quot;features chosen:&quot;, list(demo_leaky.columns))\ndemo_leak_scores = cross_val_score(LinearRegression(), demo_leaky, demo_y,\n                                   cv=demo_kf, scoring=&quot;r2&quot;)\nprint(&quot;fold scores:&quot;, np.round(demo_leak_scores, 3))\nprint(&quot;mean R2    : %.3f   &lt;- a positive result, from a target that is pure noise&quot;\n      % demo_leak_scores.mean())\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the fix: selection inside the pipeline ---&quot;)\ndemo_pipe = Pipeline([(&quot;sel&quot;, SelectKBest(f_regression, k=5)),\n                      (&quot;model&quot;, LinearRegression())])\ndemo_clean = cross_val_score(demo_pipe, demo_X, demo_y, cv=demo_kf, scoring=&quot;r2&quot;)\nprint(&quot;fold scores:&quot;, np.round(demo_clean, 3))\nprint(&quot;mean R2    : %.3f   &lt;- back to correctly reporting nothing&quot; % demo_clean.mean())\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. the three numbers side by side ---&quot;)\nprint(&quot;  everything, honest        : %+.3f&quot; % demo_all.mean())\nprint(&quot;  selected first, then CV   : %+.3f   &lt;- invented&quot; % demo_leak_scores.mean())\nprint(&quot;  selection inside pipeline : %+.3f&quot; % demo_clean.mean())\nprint(&quot;&quot;)\nprint(&quot;Nothing about the middle one looks wrong from the outside. That is the problem.&quot;)</code></pre>"
   },
   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Honest cross-validation on the real covariates</h2>\n<p>Start with what you know works. Cross-validate a <code>LinearRegression</code> on\n<code>X_real</code>, the two genuine covariates, using <code>KFold</code> with 5 splits, shuffling,\nand <code>random_state=1</code>.</p>\n<p>Keep all five fold scores, then summarise them with a mean and a sample SD.</p>\n<p>Report both. The mean is the headline, but the SD tells you how much to trust\nit. Five folds of 30 subjects each give noticeably variable estimates, and a\nmean of 0.5 built from folds spanning 0.2 to 0.8 is a much weaker claim than\nthe same mean built from folds all near 0.5.</p>\n<p>This number is your reference point. Weight and renal function genuinely drive\nclearance in this dataset, so whatever you get here is roughly what real\nsignal looks like. Parts b and c are about what noise can be made to look\nlike.</p>\n<p>Fill in <code>cv_scores</code>, <code>cv_mean</code>, <code>cv_sd</code>.</p>\n<p>Moves: <code>KFold(n_splits=5, shuffle=True, random_state=1)</code>,\n<code>cross_val_score(model, X, y, cv=kf, scoring=\"r2\")</code>, <code>.mean()</code>,\n<code>.std(ddof=1)</code>.</p><pre class=\"code\"><code># Part a. Cross-validate on the two real covariates.\n\ncv_scores = None   # YOUR CODE: the five fold R2 scores for LinearRegression on X_real\ncv_mean = None     # YOUR CODE: their mean\ncv_sd = None       # YOUR CODE: their sample SD\n\nprint(&quot;fold scores:&quot;, None if cv_scores is None else np.round(cv_scores, 4))\nprint(&quot;mean R2    :&quot;, cv_mean)\nprint(&quot;SD across folds:&quot;, cv_sd)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Do it the way everybody does it, and watch what happens</h2>\n<p>Now the biomarker panel, screened the natural way round.</p>\n<p>Fit a <code>SelectKBest(f_regression, k=K_SELECT)</code> on the <strong>whole</strong> panel and the\nwhole target, to find the ten analytes most associated with clearance. Use\n<code>.get_support()</code> to get a boolean mask of which columns were chosen, and build\n<code>X_leaky</code> from those columns of <code>X_panel</code>.</p>\n<p>Then cross-validate a plain <code>LinearRegression</code> on <code>X_leaky</code>, with the same\nfolds, and take the mean.</p>\n<p>Read the number you get against what you know: every one of those 150 analytes\nis random noise with no relationship to clearance whatsoever. The honest\nanswer is zero or below. Compare it with your part a result, which came from\ngenuine biology.</p>\n<p>Nothing in this code is sloppy-looking. It is two short, readable steps in the\norder that feels natural, screen then validate, and it is wrong because the\nscreening step has already read the answers in every fold it will later be\ntested on.</p>\n<p>Fill in <code>X_leaky</code>, <code>cv_leaky_mean</code>.</p>\n<p>Moves: <code>SelectKBest(f_regression, k=K_SELECT).fit(X_panel, y)</code>,\n<code>.get_support()</code>, <code>X_panel.loc[:, mask]</code>, <code>cross_val_score</code>, <code>.mean()</code>.</p><pre class=\"code\"><code># Part b. Screen on all the data first, then cross-validate. The common mistake.\n\nX_leaky = None         # YOUR CODE: the K_SELECT columns of X_panel that score best\n                       #            against y, chosen using ALL the data\ncv_leaky_mean = None   # YOUR CODE: mean CV R2 of LinearRegression on X_leaky\n\nprint(&quot;columns chosen:&quot;, None if X_leaky is None else list(X_leaky.columns))\nprint(&quot;mean R2, selected first:&quot;, cv_leaky_mean)\nprint(&quot;mean R2, real covariates:&quot;, cv_mean)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Put the selection inside the pipeline</h2>\n<p>Build a <code>Pipeline</code> with two steps: a <code>SelectKBest(f_regression, k=K_SELECT)</code>\nnamed <code>\"sel\"</code>, and a <code>LinearRegression</code> named <code>\"model\"</code>. Cross-validate that\npipeline on the <strong>full</strong> panel, <code>X_panel</code>, with the same folds, and take the\nmean.</p>\n<p>The difference is entirely about <em>when</em> the selection happens.\n<code>cross_val_score</code> refits whatever estimator you give it on each training fold.\nHand it a pipeline and the selection step is refitted five times, each on four\nfifths of the data, each blind to the fold it will be scored on. Different\nanalytes get chosen each time, which is itself the signal that they were never\nreal.</p>\n<p>Then quantify the damage: <code>leak_inflation</code> is <code>cv_leaky_mean -\ncv_clean_mean</code>.</p>\n<p>The clean number should land at or below zero, which is the correct answer for\na panel of pure noise. Negative R2 is not a bug: it means the model does worse\nthan predicting the mean every time, which is exactly what you would expect\nfrom fitting six random columns.</p>\n<p>The gap between the two is the size of a finding you could have published.</p>\n<p>Fill in <code>pipe</code>, <code>cv_clean_mean</code>, <code>leak_inflation</code>.</p>\n<p>Moves: <code>Pipeline([(\"sel\", ...), (\"model\", ...)])</code>, <code>cross_val_score</code>,\n<code>.mean()</code>, subtraction.</p><pre class=\"code\"><code># Part c. Selection inside the pipeline, so each fold is blind to its own test data.\n\npipe = None             # YOUR CODE: Pipeline with steps named &quot;sel&quot; and &quot;model&quot;\ncv_clean_mean = None    # YOUR CODE: mean CV R2 of the pipeline on the FULL X_panel\nleak_inflation = None   # YOUR CODE: cv_leaky_mean - cv_clean_mean\n\nprint(&quot;mean R2, selection leaked  : %s&quot; % cv_leaky_mean)\nprint(&quot;mean R2, selection in pipe : %s&quot; % cv_clean_mean)\nprint(&quot;inflation caused by the leak: %s&quot; % leak_inflation)\nprint(&quot;&quot;)\nprint(&quot;for reference, the real covariates gave: %s&quot; % cv_mean)</code></pre>"
   }
  ]
 },

    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The same 200 subjects and the same five covariates as day 1, so the comparison\nis exact. On day 1 a linear regression explained clearance with almost no gap\nbetween its training and test performance, because five coefficients cannot\nmemorise a hundred and fifty subjects.</p>\n<p>A random forest has no such limitation. It is hundreds of decision trees, each\ngrown until its leaves are nearly pure, each seeing a different bootstrap\nsample and a different random subset of features at every split. Left\nunrestricted it can fit the training data almost perfectly, including its\nnoise.</p>\n<p>That flexibility buys you the ability to capture interactions and curvature\nnobody specified in advance, which matters for allometric scaling and\nthreshold effects. It costs you the comfortable honesty of a model that cannot\noverfit. You will see both in the same set of numbers.</p>"

   {
    "key": "concept",
    "label": "Forests, and why importance has two meanings",
    "html": "<h2>Forests, and why importance has two meanings</h2>\n<p><strong>What a random forest is.</strong> Many decision trees, each trained on a bootstrap\nresample of the rows, each choosing from a random subset of features at every\nsplit. Averaging their predictions cancels most of the variance any single\ndeep tree would have. It needs no feature scaling, handles non-linearity and\ninteractions without being told they exist, and is close to the strongest\nthing you can run without tuning.</p>\n<p>Its main cost is interpretability. There is no coefficient to report, no\n\"clearance rises 0.05 L/h per kilogram\". There is only a prediction and some\nnotion of which inputs mattered.</p>\n<p><strong>Impurity importance</strong>, which is <code>feature_importances_</code>, totals up how much\neach feature reduced the error at the splits where it was used, across all\ntrees. It is free, because it falls out of training, and it has two known\nbiases. It favours features with many distinct values, because a continuous\nvariable offers far more candidate split points than a binary one. And when\ntwo features are correlated, it splits the credit between them more or less\narbitrarily, so each looks half as important as either really is.</p>\n<p><strong>Permutation importance</strong> asks a different and more honest question: if I\nshuffle this one column and leave everything else alone, how much worse do the\npredictions get? Shuffling destroys that feature's relationship with the\ntarget while preserving its distribution, so the drop in score is a direct\nmeasure of how much the fitted model was relying on it.</p>\n<p>Three things make it the better default. It is computed on <strong>held-out</strong> data,\nso it measures reliance on something that generalises rather than on something\nmemorised. It is in units of the score, so a drop of 0.08 R2 means something\nyou can state. And it has no cardinality bias, because every feature gets the\nsame treatment.</p>\n<p>Its own weakness is correlated features: shuffling one of a correlated pair\nleaves the model able to lean on the other, so both can look unimportant even\nwhen the pair together matters a great deal.</p>\n<p><strong>So read them together.</strong> A feature that is high on both is doing real work.\nA feature high on impurity but near zero on permutation is usually being\nrewarded for offering lots of split points rather than for carrying\ninformation. In this dataset one covariate is pure noise by construction, and\nwatching where each method puts it is the exercise.</p>"

train_test_split(\n    demo_X, demo_y, test_size=0.3, random_state=0)\n\nprint(&quot;--- 1. a forest fits its training data very closely ---&quot;)\ndemo_rf = RandomForestRegressor(n_estimators=200, random_state=0).fit(demo_Xtr, demo_ytr)\ndemo_r2_tr = r2_score(demo_ytr, demo_rf.predict(demo_Xtr))\ndemo_r2_te = r2_score(demo_yte, demo_rf.predict(demo_Xte))\nprint(&quot;R2 train: %.4f&quot; % demo_r2_tr)\nprint(&quot;R2 test : %.4f&quot; % demo_r2_te)\nprint(&quot;gap     : %.4f   &lt;- far larger than a linear model would show&quot;\n      % (demo_r2_tr - demo_r2_te))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. impurity importance, free with training ---&quot;)\ndemo_imp = pd.Series(demo_rf.feature_importances_,\n                     index=demo_X.columns).sort_values(ascending=False)\nprint(demo_imp.round(4).to_string())\nprint(&quot;sums to %.4f, because it is a share of total impurity reduction&quot; % demo_imp.sum())\nprint(&quot;&quot;)\nprint(&quot;note how much the two IRRELEVANT features still receive, and that the&quot;)\nprint(&quot;continuous one receives more than the binary one despite both being noise&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. permutation importance, measured on held out data ---&quot;)\ndemo_perm = permutation_importance(demo_rf, demo_Xte, demo_yte,\n                                   n_repeats=20, random_state=0)\ndemo_pi = pd.Series(demo_perm.importances_mean,\n                    index=demo_X.columns).sort_values(ascending=False)\nprint(demo_pi.round(4).to_string())\nprint(&quot;these are drops in R2, so they do not sum to anything in particular&quot;)\nprint(&quot;the irrelevant features sit at or below zero, which is the honest answer&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. the two rankings side by side ---&quot;)\ndemo_cmp = pd.DataFrame({&quot;impurity&quot;: demo_imp, &quot;permutation&quot;: demo_pi}).round(4)\nprint(demo_cmp.to_string())</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>A covariate screen with 24 candidate predictors of clearance across 120\nsubjects. Four of them genuinely matter. The rest are a mixture of noise and\nnear-duplicates of the real ones, which is what a real covariate table looks\nlike: weight, lean body mass, BSA and BMI are four columns carrying roughly\none piece of information.</p>\n<p>Ordinary least squares handles this badly. With 24 columns and 120 subjects it\nhas enough freedom to chase noise, and with several nearly collinear columns\nits coefficients become large, unstable and opposite in sign to each other.</p>\n<p>Regularisation fixes both by charging for coefficient size. The catch, and the\nreason this problem exists, is that the charge is levied on the coefficients\nthemselves, which means it depends entirely on what units your features happen\nto be in.</p>"

   {
    "key": "concept",
    "label": "The penalty is in coefficient units, which is why scale matters",
    "html": "<h2>The penalty is in coefficient units, which is why scale matters</h2>\n<p><strong>What elastic net minimises.</strong> Ordinary least squares minimises the squared\nerror alone. Elastic net minimises the squared error <strong>plus</strong> a penalty on the\ncoefficients:</p>\n<ul>\n<li>an L1 part, the sum of absolute values, which drives coefficients exactly to\n  zero and so performs selection,</li>\n<li>an L2 part, the sum of squares, which shrinks everything smoothly and shares\n  credit between correlated features instead of picking one arbitrarily.</li>\n</ul>\n<p><code>alpha</code> sets the overall strength and <code>l1_ratio</code> the mix, with 1.0 being pure\nL1, or lasso, and 0.0 pure L2, or ridge. A mix around 0.5 gets the selection\nfrom L1 and the stability under collinearity from L2.</p>\n<p><strong>Why standardisation is not optional here.</strong> The penalty is applied to the\ncoefficients. A feature measured in grams has a coefficient a thousand times\nsmaller than the same feature measured in kilograms, for exactly the same\nunderlying effect. So the gram version is charged a thousandth as much, and\nsurvives the penalty while the kilogram version gets shrunk away.</p>\n<p>Put plainly: <strong>without standardisation, which features the model keeps depends\non the units somebody chose to record them in.</strong> That is not a modelling\ndecision, it is an accident, and it is invisible in the output.</p>\n<p>Standardising puts every feature on the same footing, so a unit of penalty\nmeans the same thing everywhere and the coefficients become comparable to each\nother as effect sizes. This is the one place where \"scale your features\" stops\nbeing advice and becomes a correctness requirement.</p>\n<p>And because the scaler learns a mean and an SD, it belongs <strong>inside</strong> the\npipeline, for the reasons day 2 covered.</p>\n<p><strong>Reading a regularisation path.</strong> Sweep <code>alpha</code> from small to large and watch\ntwo things: the number of surviving non-zero coefficients, which falls, and\nthe test score, which typically rises then falls. Too little penalty and you\nare back to overfitting; too much and you have shrunk real effects away. The\nuseful alpha is somewhere in between, and the only honest way to find it is\ncross-validation.</p>\n<p><code>ElasticNetCV</code> does that sweep internally, cross-validating each alpha and\nkeeping the best. Note what it means for your test set: the alpha was chosen\nusing the training data only, so the test set stays clean.</p>"
   },

    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import ElasticNet, ElasticNetCV\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import r2_score\n\nPROBLEM_ID = &quot;W5D4&quot;\nTOPIC = &quot;scikit-learn: ElasticNet, standardisation, regularisation paths, ElasticNetCV&quot;\n\nrng = np.random.default_rng(5104)\n\nN = 120\nL1_RATIO = 0.5\nALPHAS = [0.001, 0.01, 0.05, 0.1, 0.3, 1.0, 3.0]\n\n_weight_kg = np.clip(rng.normal(74.0, 13.0, N), 45.0, 125.0)\n_height_m = np.clip(rng.normal(1.70, 0.09, N), 1.45, 1.98)\n_crcl = np.clip(rng.normal(104.0, 24.0, N), 35.0, 180.0)\n_age = np.clip(rng.normal(42.0, 13.0, N), 18.0, 75.0)\n\ncols = {\n    &quot;WEIGHT_G&quot;: _weight_kg * 1000.0,                 # grams, so a huge scale\n    &quot;HEIGHT_M&quot;: _height_m,                           # metres, a tiny scale\n    &quot;BMI&quot;: _weight_kg / _height_m ** 2,\n    &quot;BSA_M2&quot;: 0.007184 * (_weight_kg ** 0.425) * ((_height_m * 100) ** 0.725),\n    &quot;LBM_KG&quot;: 0.85 * _weight_kg - 4.0 + rng.normal(0, 1.5, N),\n    &quot;CRCL_ML_MIN&quot;: _crcl,\n    &quot;EGFR&quot;: _crcl * 0.95 + rng.normal(0, 6.0, N),\n    &quot;AGE_Y&quot;: _age,\n}\nfor _i in range(1, 17):\n    cols[&quot;NOISE%02d&quot; % _i] = rng.normal(0.0, 1.0, N)\n\nX = pd.DataFrame(cols)\nFEATURES = list(X.columns)\n\n# Truth: clearance depends on weight, CrCl and age. Nothing else.\n_cl = (4.1 * (_weight_kg / 70.0) ** 0.75\n       * (_crcl / 100.0) ** 0.40\n       * np.exp(-0.0045 * (_age - 42.0)))\ny = pd.Series(np.round(_cl * rng.lognormal(0.0, 0.15, N), 3), name=&quot;CL_L_H&quot;)\n\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=7)\n\nprint(&quot;X:&quot;, X.shape, &quot; features:&quot;, len(FEATURES))\nprint(&quot;&quot;)\nprint(&quot;look at the scales these features are on om_state=0).fit(demo_X, demo_y)\nprint(pd.Series(demo_raw.coef_, index=demo_X.columns).round(6).to_string())\nprint(&quot;&quot;)\nprint(&quot;mass_g and mass_kg carry identical information, yet they get wildly&quot;)\nprint(&quot;different coefficients, purely because of the units they were recorded in&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. standardised, they are treated alike ---&quot;)\ndemo_pipe = make_pipeline(StandardScaler(),\n                          ElasticNet(alpha=0.5, l1_ratio=0.5, random_state=0))\ndemo_pipe.fit(demo_X, demo_y)\nprint(pd.Series(demo_pipe[-1].coef_, index=demo_X.columns).round(6).to_string())\nprint(&quot;&quot;)\nprint(&quot;now the two versions of the same measurement get comparable treatment&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. what alpha does ---&quot;)\nfor demo_a in [0.001, 0.05, 0.5, 5.0]:\n    demo_m = make_pipeline(StandardScaler(),\n                           ElasticNet(alpha=demo_a, l1_ratio=0.5, random_state=0))\n    demo_m.fit(demo_X, demo_y)\n    demo_c = demo_m[-1].coef_\n    print(&quot;alpha %7.3f  non-zero %d of %d  coefficients %s&quot;\n          % (demo_a, int((demo_c != 0).sum()), len(demo_c), np.round(demo_c, 4)))\nprint(&quot;&quot;)\nprint(&quot;as alpha rises, coefficients shrink and then hit exactly zero&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. reaching inside a pipeline ---&quot;)\nprint(&quot;steps        :&quot;, list(demo_pipe.named_steps.keys()))\nprint(&quot;pipe[-1] is  :&quot;, type(demo_pipe[-1]).__name__)\nprint(&quot;its coef_ is what you want, not the pipeline&#x27;s, which has none&quot;)</code></pre>"

    "html": "<h2>Part a. The same model, with and without standardising</h2>\n<p>Fit two elastic nets on the training data, both with <code>alpha=0.05</code>,\n<code>l1_ratio=L1_RATIO</code> and <code>random_state=0</code>.</p>\n<p>The first goes straight onto the raw features. The second goes inside\n<code>make_pipeline(StandardScaler(), ElasticNet(...))</code>, so the features are\nstandardised first. Pull the coefficients out of each, remembering that a\npipeline has no <code>coef_</code> of its own, so you need its last step.</p>\n<p>Then count how many coefficients each drove to exactly zero.</p>\n<p>Then look at which features each fit keeps, not just how many.</p>\n<p>The unscaled fit zeroes <code>LBM_KG</code> and <code>BSA_M2</code> outright, while ten of the\nsixteen pure noise columns survive it. Lean body mass and body surface area\nare genuinely informative about clearance; the noise columns are not. The\nstandardised fit reverses that, giving <code>LBM_KG</code> a substantial coefficient.</p>\n<p>The reason is purely arithmetic. <code>LBM_KG</code> has a standard deviation of about 11\nand the noise columns have one of about 1, so for the same real effect\n<code>LBM_KG</code> needs a coefficient roughly eleven times smaller. A penalty on\ncoefficient magnitude therefore charges it almost nothing for being useful and\ncharges the noise columns almost nothing for being useless, and the comparison\nbetween them becomes meaningless. <code>WEIGHT_G</code>, in grams, is the extreme case:\nits coefficient has to be around 0.00005 to do anything at all, so the penalty\nsimply does not see it.</p>\n<p>Which features survive is being decided by the units somebody recorded them\nin. That is the whole lesson, and it is invisible in the output.</p>\n<p>Fill in <code>coef_raw</code>, <code>coef_scaled</code>, <code>n_zero_raw</code>, <code>n_zero_scaled</code>.</p>\n<p>Moves: <code>ElasticNet(...).fit(X_train, y_train)</code>,\n<code>make_pipeline(StandardScaler(), ElasticNet(...))</code>, <code>pipe[-1].coef_</code>,\n<code>(coef == 0).sum()</code>.</p><pre class=\"code\"><code># Part a. Elastic net with and without standardising.\n\ncoef_raw = None        # YOUR CODE: coefficients from ElasticNet on the RAW features\ncoef_scaled = None     # YOUR CODE: coefficients from the same model inside a\n                       #            StandardScaler pipeline\nn_zero_raw = None      # YOUR CODE: how many raw coefficients are exactly zero\nn_zero_scaled = None   # YOUR CODE: how many scaled ones are\n\nprint(&quot;zeros, raw    :&quot;, n_zero_raw, &quot;of&quot;, len(FEATURES))\nprint(&quot;zeros, scaled :&quot;, n_zero_scaled, &quot;of&quot;, len(FEATURES))\nif coef_raw is not None:\n    print(&quot;&quot;)\n    print(pd.DataFrame({&quot;raw&quot;: coef_raw, &quot;scaled&quot;: coef_scaled},\n                       index=FEATURES).head(8).round(6).to_string())</code></pre>"

 and append a dict with ALPHA, N_NONZERO, R2_TRAIN, R2_TEST\n\npath = None   # YOUR CODE: pd.DataFrame(rows)\n\nprint(None if path is None else path.round(4).to_string(index=False))</code></pre>"

    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Let cross-validation choose alpha</h2>\n<p><code>ElasticNetCV</code> runs the sweep internally, cross-validating each candidate\nalpha and keeping the best. Put it inside a <code>StandardScaler</code> pipeline as\nbefore, with <code>l1_ratio=L1_RATIO</code>, <code>cv=5</code> and <code>random_state=0</code>, and fit it on\nthe training data.</p>\n<p>Then read off the alpha it chose, how many coefficients survived at that\nsetting, and the R2 that model gets on the test set.</p>\n<p>Note what makes this legitimate. The alpha was chosen by cross-validation\n<strong>within the training data</strong>. The test set played no part in the choice, so\nscoring on it afterwards is still honest. Had you instead picked the alpha\nwith the best <code>R2_TEST</code> from your part b table, you would have used the test\nset to make a modelling decision, and its score would no longer be an\nunbiased estimate of anything. That is the same leak as day 2, wearing\ndifferent clothes.</p>\n<p>Compare the surviving features against the truth: clearance here was built\nfrom weight, creatinine clearance and age, and the body-size columns are\nnear-duplicates of each other. A sensible fit keeps a couple of the body-size\nfamily, keeps a renal measure, and discards most of the sixteen noise columns.\nDo not expect it to pick exactly the right four. With collinear predictors no\nmethod can, and that is a property of the data rather than a failure of the\nmodel.</p>\n<p>Fill in <code>encv</code>, <code>best_alpha</code>, <code>n_nonzero_cv</code>, <code>r2_cv_test</code>.</p>\n<p>Moves: <code>make_pipeline(StandardScaler(), ElasticNetCV(l1_ratio=..., cv=5,\nrandom_state=0))</code>, <code>.fit</code>, <code>pipe[-1].alpha_</code>, <code>pipe[-1].coef_</code>, <code>r2_score</code>.</p><pre class=\"code\"><code># Part c. ElasticNetCV picks alpha using the training data only.\n\nencv = None           # YOUR CODE: StandardScaler + ElasticNetCV pipeline, fitted on train\nbest_alpha = None     # YOUR CODE: the alpha it chose\nn_nonzero_cv = None   # YOUR CODE: coefficients surviving at that alpha\nr2_cv_test = None     # YOUR CODE: R2 on the test set\n\nprint(&quot;alpha chosen   :&quot;, best_alpha)\nprint(&quot;features kept  :&quot;, n_nonzero_cv, &quot;of&quot;, len(FEATURES))\nprint(&quot;R2 on test     :&quot;, r2_cv_test)\nif encv is not None:\n    kept = pd.Series(encv[-1].coef_, index=FEATURES)\n    print(&quot;&quot;)\n    print(&quot;surviving coefficients:&quot;)\n    print(kept[kept != 0].sort_values(key=abs, ascending=False).round(4).to_string())</code></pre>"

    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Ten laboratory measurements on 180 subjects: liver enzymes, renal markers and\nbody size measures. They are heavily correlated within those three families,\nbecause they are three underlying things measured several ways each. ALT and\nAST move together. Creatinine clearance and eGFR are nearly the same number.\nWeight, BMI and body surface area are three views of body size.</p>\n<p>Ten columns, but nothing like ten independent pieces of information.</p>\n<p>Principal component analysis finds the directions along which the data varies\nmost, and rewrites each subject in terms of those directions instead of the\noriginal columns. The useful outcome here is not compression for its own sake:\nit is finding out <strong>how many</strong> things this panel is really measuring, and\nreading off which measurements move together.</p>"
   },
   {
    "key": "concept",
    "label": "What PCA actually does, and the one thing you must not forget",
    "html": "<h2>What PCA actually does, and the one thing you must not forget</h2>\n<p><strong>The idea.</strong> PCA finds a new set of axes for the data. The first, PC1, points\nalong the direction of greatest variance. PC2 points along the greatest\nremaining variance subject to being perpendicular to PC1, and so on. Each\nsubject then gets a coordinate on each axis, and because the axes are\nperpendicular, those coordinates are uncorrelated with each other.</p>\n<p>Nothing is lost if you keep all the components. The value comes from the\nvariance being concentrated in the first few, so a handful of them carry\nalmost everything.</p>\n<p><strong>Standardise first, and this one is not negotiable.</strong> PCA maximises variance,\nand variance is in squared units of the feature. A measurement in grams has a\nvariance a million times larger than the same measurement in kilograms, so\nPC1 will simply point along whichever column happens to be recorded in the\nlargest units. Without standardisation PCA is a report on your unit choices.</p>\n<p>With standardisation every feature has variance 1, they contribute equally,\nand PCA is working on the correlation structure, which is what you wanted.</p>\n<p><strong>explained_variance_ratio_</strong> gives the share of total variance each component\ncarries, summing to 1 across all of them. Its cumulative sum answers \"how many\ncomponents do I need for 90 percent\", which is the usual way of deciding how\nmany to keep. With ten standardised features and three underlying factors,\nexpect the first three components to carry most of it.</p>\n<p><strong>Loadings</strong> are in <code>components_</code>, one row per component and one column per\noriginal feature, saying how much each feature contributes to that component.\nReading PC1's loadings is how you find out what PC1 <em>is</em>. If the body size\nmeasures all load heavily on it with the same sign, PC1 is body size.</p>\n<p><strong>Two cautions.</strong> First, a sign flip is meaningless: PC1 and its negative are\nthe same axis, and different library versions or platforms can return either.\nNever interpret the sign of a loading on its own, only signs relative to each\nother within the same component. Second, components are built to explain\nvariance in <code>X</code>, with no reference to any outcome. The direction of greatest\nvariance need not be the direction that predicts anything, and a component\ncarrying 2 percent of the variance can be the one that matters clinically.</p>"
   },

    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\n\nPROBLEM_ID = &quot;W5D5&quot;\nTOPIC = &quot;scikit-learn: PCA, explained variance, loadings, projecting onto components&quot;\n\nrng = np.random.default_rng(5105)\n\nN = 180\n\n# Three underlying factors: body size, renal function, hepatic enzymes.\n_size = rng.normal(0.0, 1.0, N)\n_renal = rng.normal(0.0, 1.0, N)\n_hepatic = rng.normal(0.0, 1.0, N)\n\n_weight_kg = 74.0 + 13.0 * _size + rng.normal(0, 1.5, N)\n_height_m = 1.70 + 0.06 * _size + rng.normal(0, 0.03, N)\n\npanel = pd.DataFrame({\n    &quot;WEIGHT_KG&quot;: np.round(_weight_kg, 1),\n    &quot;BMI&quot;: np.round(_weight_kg / _height_m ** 2, 2),\n    &quot;BSA_M2&quot;: np.round(0.007184 * _weight_kg ** 0.425 * (_height_m * 100) ** 0.725, 3),\n    &quot;LBM_KG&quot;: np.round(0.85 * _weight_kg - 4.0 + rng.normal(0, 1.2, N), 1),\n    &quot;CRCL_ML_MIN&quot;: np.round(104.0 + 22.0 * _renal + rng.normal(0, 4.0, N), 1),\n    &quot;EGFR&quot;: np.round(98.0 + 20.0 * _renal + rng.normal(0, 5.0, N), 1),\n    &quot;CYSTATIN_C&quot;: np.round(np.clip(1.0 - 0.18 * _renal + rng.normal(0, 0.05, N), 0.3, 3.0), 3),\n    &quot;ALT_U_L&quot;: np.round(np.clip(26.0 + 9.0 * _hepatic + rng.normal(0, 3.0, N), 5, 200), 1),\n    &quot;AST_U_L&quot;: np.round(np.clip(24.0 + 8.0 * _hepatic + rng.normal(0, 3.5, N), 5, 200), 1),\n    &quot;GGT_U_L&quot;: np.round(np.clip(30.0 + 12.0 * _hepatic + rng.normal(0, 6.0, N), 5, 300), 1),\n})\nFEATURES = list(panel.columns)\n\n# A group label, used only for the plot in part b.\ngroup = pd.Series(np.where(_renal &gt; 0.4, &quot;Normal renal&quot;, &quot;Impaired renal&quot;), name=&quot;GROUP&quot;)\n\nprint(&quot;panel:&quot;, panel.shape)\nprint(panel.head().to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;standard deviations, which differ by orders of magnitude:&quot;)\nprint(panel.std().round(3).to_string())</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>standardise</td>\n<td><code>Z = StandardScaler().fit_transform(X)</code></td>\n</tr>\n<tr>\n<td>fit PCA</td>\n<td><code>pca = PCA().fit(Z)</code></td>\n</tr>\n<tr>\n<td>variance share per component</td>\n<td><code>pca.explained_variance_ratio_</code></td>\n</tr>\n<tr>\n<td>running total</td>\n<td><code>np.cumsum(evr)</code></td>\n</tr>\n<tr>\n<td>first index reaching a level</td>\n<td><code>int(np.argmax(cumulative &gt;= 0.90)) + 1</code></td>\n</tr>\n<tr>\n<td>project the data</td>\n<td><code>scores = pca.transform(Z)</code></td>\n</tr>\n<tr>\n<td>the loadings</td>\n<td><code>pca.components_</code>, one ROW per component</td>\n</tr>\n<tr>\n<td>as a readable table</td>\n<td><code>pd.DataFrame(pca.components_, columns=FEATURES)</code></td>\n</tr>\n<tr>\n<td>the biggest loadings</td>\n<td><code>series.abs().sort_values(ascending=False).head(3)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>np.argmax</code> on a boolean array returns the first True, which is the tidy way\nto ask how many components you need. Add 1 because positions count from zero.</p><pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\n\n# A tiny made up panel: two correlated pairs plus one independent column.\ndemo_rng = np.random.default_rng(0)\ndemo_n = 150\ndemo_a, demo_b = demo_rng.normal(size=demo_n), demo_rng.normal(size=demo_n)\ndemo = pd.DataFrame({\n    &quot;a1&quot;: demo_a * 1000.0 + demo_rng.normal(0, 50, demo_n),   # huge units on purpose\n    &quot;a2&quot;: demo_a + demo_rng.normal(0, 0.1, demo_n),\n    &quot;b1&quot;: demo_b + demo_rng.normal(0, 0.1, demo_n),\n    &quot;b2&quot;: demo_b + demo_rng.normal(0, 0.1, demo_n),\n    &quot;c1&quot;: demo_rng.normal(size=demo_n),\n})\nprint(&quot;standard deviations:&quot;, demo.std().round(2).to_dict())\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. without standardising, PCA just finds the biggest units ---&quot;)\ndemo_raw = PCA().fit(demo)\nprint(&quot;explained variance ratio:&quot;, np.round(demo_raw.explained_variance_ratio_, 4))\nprint(&quot;PC1 loadings            :&quot;,\n      dict(zip(demo.columns, np.round(demo_raw.components_[0], 3))))\nprint(&quot;PC1 is entirely a1, because a1 is recorded in thousands&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. standardised, it finds the correlation structure ---&quot;)\ndemo_Z = StandardScaler().fit_transform(demo)\ndemo_pca = PCA().fit(demo_Z)\ndemo_evr = demo_pca.explained_variance_ratio_\nprint(&quot;explained variance ratio:&quot;, np.round(demo_evr, 4))\nprint(&quot;cumulative              :&quot;, np.round(np.cumsum(demo_evr), 4))\nprint(&quot;components for 90 percent:&quot;, int(np.argmax(np.cumsum(demo_evr) &gt;= 0.90)) + 1)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. loadings say what each component IS ---&quot;)\ndemo_load = pd.DataFrame(demo_pca.components_, columns=demo.columns,\n                         index=[&quot;PC%d&quot; % (i + 1) for i in range(len(demo.columns))])\nprint(demo_load.round(3).to_string())\nprint(&quot;&quot;)\nprint(&quot;the a pair load together on one component and the b pair on another&quot;)\nprint(&quot;signs are arbitrary: PC1 and minus PC1 are the same axis, so only read&quot;)\nprint(&quot;signs RELATIVE to each other within one row&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. projecting the subjects ---&quot;)\ndemo_scores = demo_pca.transform(demo_Z)\nprint(&quot;scores shape:&quot;, demo_scores.shape, &quot; &lt;- one row per subject, one column per PC&quot;)\nprint(&quot;correlation between PC1 and PC2 scores: %.2e  &lt;- zero by construction&quot;\n      % float(np.corrcoef(demo_scores[:, 0], demo_scores[:, 1])[0, 1]))</code></pre>"

    "html": "<h2>Part a. Standardise, then fit</h2>\n<p>Standardise the panel with <code>StandardScaler().fit_transform(panel)</code>, then fit a\n<code>PCA()</code> with no <code>n_components</code> argument, which keeps all ten so you can see\nthe whole variance spectrum.</p>\n<p>Take <code>explained_variance_ratio_</code>, the share of total variance each component\ncarries. It sums to 1.</p>\n<p>Then do the thing the concept section warns about, so you can see it rather\nthan take it on faith. Fit a second PCA on the <strong>raw</strong>, unstandardised panel\nand record the share its first component carries. Look at the standard\ndeviations printed in the setup: <code>GGT_U_L</code> varies by about 12 units while\n<code>CYSTATIN_C</code> varies by about 0.18. Squared, that is a factor of several\nthousand, and PC1 of the unscaled fit will be almost entirely the\nlargest-numbered column.</p>\n<p>Fill in <code>pca</code>, the PCA fitted on standardised data. <code>evr</code>, its explained\nvariance ratios. And <code>evr_unscaled_first</code>, the first component's share when\nfitted on the raw panel.</p>\n<p>Moves: <code>StandardScaler().fit_transform(...)</code>, <code>PCA().fit(...)</code>,\n<code>.explained_variance_ratio_</code>.</p><pre class=\"code\"><code># Part a. PCA on the standardised panel, and what happens without standardising.\n\npca = None                  # YOUR CODE: PCA() fitted on the STANDARDISED panel\nevr = None                  # YOUR CODE: its explained_variance_ratio_\nevr_unscaled_first = None   # YOUR CODE: first component&#x27;s share, fitted on the RAW panel\n\nprint(&quot;explained variance ratio:&quot;, None if evr is None else np.round(evr, 4))\nprint(&quot;sums to                 :&quot;, None if evr is None else round(float(np.sum(evr)), 6))\nprint(&quot;&quot;)\nprint(&quot;PC1 share, standardised :&quot;, None if evr is None else round(float(evr[0]), 4))\nprint(&quot;PC1 share, raw          :&quot;, evr_unscaled_first)</code></pre>"

   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. How many components, and where the subjects land</h2>\n<p>Take the running total of <code>evr</code> with <code>np.cumsum</code>, then find how many\ncomponents you need to reach 90 percent of the variance.</p>\n<p><code>np.argmax</code> on a boolean array returns the position of the first <code>True</code>, so\n<code>np.argmax(cumulative &gt;= 0.90)</code> gives a zero based position and adding 1 turns\nit into a count. That idiom is worth remembering; the obvious loop is three\nlines longer and no clearer.</p>\n<p>Then project the subjects with <code>pca.transform(Z)</code>. The result has one row per\nsubject and one column per component, and those columns are uncorrelated with\neach other by construction.</p>\n<p>Think about the number you get. The panel has ten columns but was built from\nthree underlying factors plus measurement noise, so three components should\ncarry the bulk and the count for 90 percent should be small. That number is\nthe answer to \"how many things is this panel really measuring\", which is a\nmore interesting question than how to compress it.</p>\n<p>Fill in <code>cumulative</code>, <code>n_for_90</code>, <code>scores</code>.</p>\n<p>Moves: <code>np.cumsum</code>, <code>np.argmax(cumulative &gt;= 0.90) + 1</code>, <code>pca.transform(Z)</code>.</p><pre class=\"code\"><code># Part b. How many components carry 90 percent, and the projection.\n\ncumulative = None   # YOUR CODE: running total of evr\nn_for_90 = None     # YOUR CODE: how many components reach 90 percent\nscores = None       # YOUR CODE: the subjects projected onto the components\n\nprint(&quot;cumulative:&quot;, None if cumulative is None else np.round(cumulative, 4))\nprint(&quot;components needed for 90 percent:&quot;, n_for_90)\nprint(&quot;scores shape:&quot;, None if scores is None else scores.shape)\n\nif scores is not None:\n    fig, ax = plt.subplots(figsize=(5.5, 4.5))\n    for name in group.unique():\n        sel = (group == name).to_numpy()\n        ax.scatter(scores[sel, 0], scores[sel, 1], s=28, alpha=0.75, label=name)\n    ax.set_xlabel(&quot;PC1 (%.1f%% of variance)&quot; % (100 * evr[0]))\n    ax.set_ylabel(&quot;PC2 (%.1f%% of variance)&quot; % (100 * evr[1]))\n    ax.set_title(&quot;Subjects in the first two components&quot;)\n    ax.legend(frameon=False)\n    plt.show()</code></pre>"

  const THEMES = {"1": "numpy, pandas and matplotlib", "2": "pandas in depth", "3": "scipy", "4": "scikit-image and OpenCV", "5": "scikit-learn", "6": "PyTorch basics", "7": "PK and PD applications", "8": "PK and PD applications"};

  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const tk = document.getElementById("tk");
  const tkBody = document.getElementById("tk-body");
  const tkTitle = document.getElementById("tk-title");

  const N_WEEKS = new Set(PROBLEMS.map(function (p) { return p.week; })).size;
  document.getElementById("aside-sub").textContent =
    PROBLEMS.length + " problems across " + N_WEEKS + (N_WEEKS === 1 ? " week" : " weeks");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildNav() {
    const weeks = {};
    PROBLEMS.forEach(function (p) { (weeks[p.week] = weeks[p.week] || []).push(p); });
    let html = "";
    Object.keys(weeks).sort(function (a, b) { return a - b; }).forEach(function (wk) {
      const theme = THEMES[wk] ? "<span> &middot; " + esc(THEMES[wk]) + "</span>" : "";
      html += '<div class="wk"><div class="wk-h">Week ' + wk + theme + "</div>";
      weeks[wk].forEach(function (p) {
        html += '<a class="d" data-id="' + p.id + '" href="#' + p.id + '">' +
                "<code>" + esc(p.id) + "</code>" + esc(p.title) + "</a>";
      });
      html += "</div>";
    });
    nav.innerHTML = html;
  }

  function indexOf(id) {
    for (let i = 0; i < PROBLEMS.length; i++) if (PROBLEMS[i].id === id) return i;
    return -1;
  }

  function render(id) {
    const i = indexOf(id);
    if (i < 0) return;
    const p = PROBLEMS[i];

    let html = '<span class="pid">' + esc(p.id) + "</span>" +
      '<h2 class="title">' + esc(p.title) + "</h2>" +
      '<p class="meta">' + esc(p.topic) + "<br>Week " + p.week + ", day " + p.day +
      " &middot; " + esc(p.est) + "</p>" +
      '<div class="btns">' +
        '<a class="btn" href="' + p.colab + '">Open in Colab</a>' +
        '<a class="btn ghost" href="' + p.github + '">View on GitHub</a>' +
        '<a class="btn quiet" href="' + p.solution + '">Solution</a>' +
      "</div>";

    html += '<div class="jump">';
    p.sections.forEach(function (s) {
      html += '<a href="#sec-' + s.key + '">' + esc(s.label) + "</a>";
    });
    html += "</div>";

    p.sections.forEach(function (s) {
      html += '<section class="blk" id="sec-' + s.key + '">' +
              "<h3>" + esc(s.label) + '</h3><div class="body">' + s.html + "</div></section>";
    });

    html += '<div class="pager">';
    html += i > 0
      ? '<a href="#' + PROBLEMS[i - 1].id + '">Previous, ' + esc(PROBLEMS[i - 1].id) + "</a>"
      : "<span>Previous</span>";
    html += i < PROBLEMS.length - 1
      ? '<a href="#' + PROBLEMS[i + 1].id + '">Next, ' + esc(PROBLEMS[i + 1].id) + "</a>"
      : "<span>Next</span>";
    html += "</div>";

    main.innerHTML = html;
    main.scrollTop = 0;
    window.scrollTo(0, 0);

    Array.prototype.forEach.call(nav.querySelectorAll(".d"), function (a) {
      a.classList.toggle("on", a.getAttribute("data-id") === id);
    });

    tkTitle.textContent = "Toolkit, " + p.id;
    tkBody.innerHTML = p.toolkit || "<p>This problem has no toolkit section.</p>";
    document.title = p.id + ", " + p.title;
  }

  function fromHash() {
    const id = location.hash.replace(/^#/, "");
    render(indexOf(id) >= 0 ? id : PROBLEMS[0].id);
  }

  document.getElementById("tk-btn").addEventListener("click", function () {
    tk.classList.toggle("open");
  });
  document.getElementById("tk-close").addEventListener("click", function () {
    tk.classList.remove("open");
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") tk.classList.remove("open");
  });
  window.addEventListener("hashchange", fromHash);

  buildNav();
  fromHash();
</script>
