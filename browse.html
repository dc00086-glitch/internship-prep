   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Accumulation, two ways</h2>\n<p>Take the peak concentration within the <strong>first</strong> dosing interval, so times\nbelow <code>TAU_H</code>, and the peak within the <strong>last</strong> one, so times at or above\n<code>(N_DOSES - 1) * TAU_H</code>. Their ratio is the observed accumulation.</p>\n<p>Then compute the algebraic prediction:</p>\n<pre><code>r_theory = 1 / (1 - exp(-KEL * TAU_H))\n</code></pre>\n<p>They will be close but not identical: expect the simulated Cmax ratio to come\nout a few percent <strong>above</strong> the formula.</p>\n<p>That gap is worth understanding rather than rounding away. The formula is\nderived assuming the dose appears instantly, so concentration starts falling\nimmediately. This drug absorbs over a couple of hours, so at steady state the\npeak is reached while the previous dose is still washing out, which lifts the\nobserved peak ratio slightly. If you instead compare the <strong>trough</strong>\nconcentrations, where absorption is long finished, the simulation lands within\nabout one percent of the formula.</p>\n<p>So the formula is a good answer for troughs and a slight underestimate for\npeaks, and the size of the discrepancy is set by how fast absorption is\nrelative to elimination. Here <code>ka</code> is about eleven times <code>kel</code>, which is fast,\nand even so it moves the answer by four percent. For a slowly absorbed\nformulation it would move it considerably more, and the formula would stop\nbeing usable for Cmax at all.</p>\n<p>This is the general shape of the thing: the algebra is quick and tells you\nwhat to expect, the simulation is what you trust when the assumptions behind\nthe algebra are not quite true. Running both and understanding the gap beats\nrunning either alone.</p>\n<p>Note what <code>r_theory</code> does not contain. There is no dose in it, and no volume,\nand no absorption rate. Accumulation is set entirely by how the dosing\ninterval compares with the half-life. A drug dosed at exactly one half-life\naccumulates two-fold whatever else is true about it.</p>\n<p>Fill in <code>cmax_first</code>, <code>cmax_ss</code>, <code>r_sim</code>, <code>r_theory</code>.</p>\n<p>Moves: boolean masks on <code>times</code>, <code>.max()</code>, division, <code>np.exp</code>.</p><pre class=\"code\"><code># Part b. Accumulation, simulated and predicted.\n\ncmax_first = None   # YOUR CODE: peak within the FIRST dosing interval\ncmax_ss = None      # YOUR CODE: peak within the LAST dosing interval\nr_sim = None        # YOUR CODE: cmax_ss / cmax_first\nr_theory = None     # YOUR CODE: 1 / (1 - exp(-KEL * TAU_H))\n\nprint(&quot;Cmax, first interval : %s mg/L&quot; % cmax_first)\nprint(&quot;Cmax, last interval  : %s mg/L&quot; % cmax_ss)\nprint(&quot;accumulation ratio, simulated : %s&quot; % r_sim)\nprint(&quot;accumulation ratio, algebraic : %s&quot; % r_theory)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Average exposure, and how long it took</h2>\n<p><strong>Average concentration at steady state</strong> has the simple closed form</p>\n<pre><code>cavg_ss = DOSE_MG / (TAU_H * CL_F)\n</code></pre>\n<p>Only dose, interval and clearance. Volume and absorption rate shape the peaks\nand troughs within an interval but cancel out of the average entirely.</p>\n<p><strong>How long it took.</strong> Find the first time the simulated concentration reaches\n90 percent of <code>cmax_ss</code>. A boolean comparison plus <code>np.argmax</code> gives the first\nposition where it becomes true, and that position indexes into <code>times</code>.</p>\n<p>Then express that as a number of half-lives, <code>t_to_90pct / T_HALF</code>.</p>\n<p>The number you get should land near three and a bit, which is what 90 percent\nof the way to steady state costs. Getting to 95 percent takes about four\nhalf-lives and 99 percent about seven, which is where the rule of thumb about\nfive half-lives comes from.</p>\n<p>The thing worth taking away is what that number is <strong>not</strong> a function of. It\ndoes not depend on the dose, and it does not depend on the dosing interval.\nHalve the interval and you reach a higher steady state in the same elapsed\ntime. If you need the effect sooner than the half-life allows, no regimen of\nordinary doses will get you there, which is exactly why loading doses exist.</p>\n<p>Fill in <code>cavg_ss</code>, <code>t_to_90pct</code>, <code>n_half_lives</code>.</p>\n<p>Moves: division, a boolean comparison on <code>conc</code>, <code>np.argmax</code>, indexing\n<code>times</code>.</p><pre class=\"code\"><code># Part c. Average exposure, and time to steady state.\n\ncavg_ss = None       # YOUR CODE: DOSE_MG / (TAU_H * CL_F)\nt_to_90pct = None    # YOUR CODE: first time conc reaches 90 percent of cmax_ss\nn_half_lives = None  # YOUR CODE: t_to_90pct / T_HALF\n\nprint(&quot;Cavg at steady state : %s mg/L&quot; % cavg_ss)\nprint(&quot;time to 90 percent   : %s h&quot; % t_to_90pct)\nprint(&quot;which is             : %s half-lives&quot; % n_half_lives)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>A thorough QT study has produced paired samples: plasma concentration and\nchange from baseline in QTc, at twelve time points after a single oral dose in\none subject.</p>\n<p>The concentration peaks at three hours. The QTc change peaks at six. Somebody\nin the meeting is going to say that the assay must be wrong, and somebody else\nis going to fit a concentration response curve to the pairs, get an EC50, and\nput it on a slide.</p>\n<p>Both are mistakes, and today you will produce the evidence for why. The delay\nis real, it is a property of where the drug has to get to before it acts, and\nignoring it does not just add noise: it biases the Emax and EC50 estimates\nbadly enough to change a dose decision.</p>"
   },
   {
    "key": "concept",
    "label": "Hysteresis, and what to do about it",
    "html": "<h2>Hysteresis, and what to do about it</h2>\n<p><strong>The loop.</strong> Plot effect against concentration, with the points joined in\ntime order. If effect depended only on the concentration in plasma at that\ninstant, the points would lie on a single curve: the same concentration would\nalways give the same effect. Instead they trace a loop, because a concentration\non the way up and the same concentration on the way down produce different\neffects.</p>\n<p>If the effect is larger on the way down, the loop runs <strong>counter clockwise</strong>,\nand the cause is almost always distribution: the drug has to reach a site that\nplasma is not. If the effect is smaller on the way down, the loop runs\nclockwise, and the usual causes are tolerance or an active metabolite being\ncleared.</p>\n<p><strong>Why a direct fit fails.</strong> Fitting <code>E = Emax * C / (EC50 + C)</code> to the pairs\nasks the optimiser to find one curve through a loop. It will succeed, because\nleast squares always returns something, and the answer will be a compromise\nthat over predicts the early points and under predicts the late ones. The\nsignature is unmistakable once you look for it: <strong>the residuals correlate with\ntime</strong>. Negative before the concentration peak, positive after, in a run rather\nthan a scatter.</p>\n<p>That is the single most useful diagnostic in PK/PD work. Plot residuals against\ntime, every time.</p>\n<p><strong>The effect compartment.</strong> The standard fix, from Sheiner and Holford around\n1979, is to add one hypothetical compartment linked to plasma by a single rate\nconstant <code>ke0</code>:</p>\n<pre><code>dCe/dt = ke0 * (C(t) - Ce)\n</code></pre>\n<p><code>Ce</code> is the concentration at the effect site. It has no volume, carries no\nmass, and exists only to delay and smooth the plasma profile. The effect is\nthen driven by <code>Ce</code> instead of <code>C</code>, through the same Emax equation.</p>\n<p>One extra parameter buys you the whole loop. <code>ke0</code> has units of per hour, and\n<code>ln(2) / ke0</code> is the effect site equilibration half life: how long the site\ntakes to catch up with plasma. A large <code>ke0</code> means no delay and the loop\ncollapses to a curve. A small <code>ke0</code> means a slow, heavily smoothed effect that\npeaks long after the concentration.</p>\n<p><strong>On fitting it.</strong> Three parameters, <code>Emax</code>, <code>EC50</code> and <code>ke0</code>, and the model\nneeds an ODE solved for every candidate <code>ke0</code>. <code>curve_fit</code> handles this without\ncomplaint as long as you give it bounds and a sensible starting point. An\nalternative worth knowing is to fix <code>ke0</code> on a grid, fit the two Emax\nparameters at each value, and keep the best: slower, but it shows you the whole\nprofile of the objective function and whether <code>ke0</code> is actually identified.</p>"
   },

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.integrate import solve_ivp\nfrom scipy.optimize import curve_fit\n\nPROBLEM_ID = &quot;W8D1&quot;\nTOPIC = &quot;PK/PD: hysteresis, direct Emax fitting and its residual structure, the effect compartment&quot;\n\nrng = np.random.default_rng(8101)\n\nDOSE = 100.0        # mg, single oral dose\n_VF = 35.0          # L, apparent volume, not known to you\n_KA = 1.0           # per h, absorption, not known to you\n_KE = 0.12          # per h, elimination, not known to you\n_KE0 = 0.25         # per h, effect site equilibration, not known to you\n_EMAX = 30.0        # ms, not known to you\n_EC50 = 0.5         # mg/L, not known to you\n\n_coef = DOSE * _KA / (_VF * (_KA - _KE))\n\n\ndef _true_conc(t):\n    return _coef * (np.exp(-_KE * t) - np.exp(-_KA * t))\n\n\ndef _true_ce(t_eval, ke0):\n    out = solve_ivp(lambda t, y: ke0 * (_true_conc(t) - y[0]),\n                    (0.0, float(np.max(t_eval))), [0.0],\n                    t_eval=np.asarray(t_eval, dtype=float), rtol=1e-9, atol=1e-12)\n    return out.y[0]\n\n\nt_obs = np.array([0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 18.0, 24.0])\nc_obs = np.round(_true_conc(t_obs) * rng.lognormal(0.0, 0.06, t_obs.size), 4)\n_ce = _true_ce(t_obs, _KE0)\ne_obs = np.round(_EMAX * _ce / (_EC50 + _ce) + rng.normal(0.0, 1.5, t_obs.size), 3)\n\nC_PROBE = 1.2       # mg/L, the concentration at which to compare the two limbs\n\nprint(&quot;time (h)      :&quot;, t_obs)\nprint(&quot;conc (mg/L)   :&quot;, c_obs)\nprint(&quot;dQTc (ms)     :&quot;, e_obs)\nprint(&quot;&quot;)\nprint(&quot;concentration peaks at t = %g h&quot; % t_obs[int(np.argmax(c_obs))])\nprint(&quot;effect peaks at        t = %g h&quot; % t_obs[int(np.argmax(e_obs))])\nprint(&quot;probe concentration for the hysteresis comparison: %g mg/L&quot; % C_PROBE)</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>position of a maximum</td>\n<td><code>int(np.argmax(y))</code></td>\n</tr>\n<tr>\n<td>split at the peak</td>\n<td><code>idx = int(np.argmax(c))</code>, then <code>c[:idx + 1]</code> and <code>c[idx:]</code></td>\n</tr>\n<tr>\n<td>reverse an array</td>\n<td><code>a[::-1]</code></td>\n</tr>\n<tr>\n<td>interpolate</td>\n<td><code>np.interp(x_new, x, y)</code> with <code>x</code> increasing</td>\n</tr>\n<tr>\n<td>solve the effect compartment</td>\n<td><code>solve_ivp(lambda t, y: ke0 * (conc(t) - y[0]), (0, tmax), [0.0], t_eval=times)</code></td>\n</tr>\n<tr>\n<td>fit with bounds</td>\n<td><code>curve_fit(f, x, y, p0=[...], bounds=([lo], [hi]))</code></td>\n</tr>\n<tr>\n<td>standard errors</td>\n<td><code>np.sqrt(np.diag(pcov))</code></td>\n</tr>\n<tr>\n<td>mean of a slice</td>\n<td><code>resid[:idx + 1].mean()</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>np.interp</code> is the trap in this problem. It requires its <code>x</code> argument to be\nincreasing and <strong>does not check</strong>: hand it a decreasing array and you get\nnumbers back, silently wrong ones. The falling limb of a concentration curve is\ndecreasing, so it has to be reversed, both arrays together.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy.integrate import solve_ivp\n\nprint(&quot;--- 1. interpolation needs increasing x, and will not tell you otherwise ---&quot;)\ndemo_x = np.array([1.0, 2.0, 3.0, 4.0])\ndemo_y = np.array([10.0, 20.0, 30.0, 40.0])\nprint(&quot;increasing x, interp at 2.5:&quot;, np.interp(2.5, demo_x, demo_y), &quot; correct&quot;)\nprint(&quot;decreasing x, interp at 2.5:&quot;, np.interp(2.5, demo_x[::-1], demo_y[::-1]), &quot; nonsense&quot;)\nprint(&quot;reverse BOTH arrays together:&quot;, np.interp(2.5, demo_x[::-1][::-1], demo_y[::-1][::-1]))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. splitting a curve at its peak ---&quot;)\ndemo_c = np.array([0.5, 1.4, 2.1, 1.8, 1.1, 0.6])\ndemo_e = np.array([1.0, 4.0, 9.0, 12.0, 11.0, 7.0])\ndemo_i = int(np.argmax(demo_c))\nprint(&quot;peak at index&quot;, demo_i, &quot;value&quot;, demo_c[demo_i])\nprint(&quot;rising limb  :&quot;, demo_c[:demo_i + 1], &quot;-&gt;&quot;, demo_e[:demo_i + 1])\nprint(&quot;falling limb :&quot;, demo_c[demo_i:], &quot;-&gt;&quot;, demo_e[demo_i:])\nprint(&quot;the peak sample belongs to both limbs, which is the usual convention&quot;)\ndemo_probe = 1.5\ndemo_rise = np.interp(demo_probe, demo_c[:demo_i + 1], demo_e[:demo_i + 1])\ndemo_fall = np.interp(demo_probe, demo_c[demo_i:][::-1], demo_e[demo_i:][::-1])\nprint(&quot;at c = %.1f the rising limb gives %.3f and the falling limb %.3f&quot;\n      % (demo_probe, demo_rise, demo_fall))\nprint(&quot;effect larger on the way down means a counter clockwise loop&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. a one compartment effect site, driven by an input function ---&quot;)\n\n\ndef demo_input(t):\n    &quot;&quot;&quot;A made up plasma profile: up then down.&quot;&quot;&quot;\n    return 2.0 * (np.exp(-0.2 * t) - np.exp(-1.0 * t))\n\n\ndemo_t = np.linspace(0.0, 24.0, 13)\nfor demo_ke0 in (0.05, 0.5, 5.0):\n    demo_sol = solve_ivp(lambda t, y: demo_ke0 * (demo_input(t) - y[0]),\n                         (0.0, 24.0), [0.0], t_eval=demo_t, rtol=1e-9, atol=1e-12)\n    demo_ce = demo_sol.y[0]\n    print(&quot;ke0 %-5g  half life %5.2f h  Ce peaks at t = %5.2f  (input peaks at %.2f)&quot;\n          % (demo_ke0, np.log(2) / demo_ke0, demo_t[int(np.argmax(demo_ce))],\n             demo_t[int(np.argmax(demo_input(demo_t)))]))\nprint(&quot;a big ke0 means no delay, a small one means a slow smoothed effect&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. residuals in time order are the diagnostic ---&quot;)\ndemo_res_good = np.array([0.4, -0.6, 0.2, -0.3, 0.5, -0.2])\ndemo_res_bad = np.array([-1.8, -1.2, -0.5, 0.6, 1.3, 1.9])\nprint(&quot;scattered :&quot;, demo_res_good, &quot; mean of first half %.2f second half %.2f&quot;\n      % (demo_res_good[:3].mean(), demo_res_good[3:].mean()))\nprint(&quot;structured:&quot;, demo_res_bad, &quot; mean of first half %.2f second half %.2f&quot;\n      % (demo_res_bad[:3].mean(), demo_res_bad[3:].mean()))\nprint(&quot;the second one has the same sum of squares spread very differently&quot;)</code></pre>"

    "html": "<h2>Part a. Measure the loop</h2>\n<p>First establish that there is a delay at all, then measure how wide it is.</p>\n<ul>\n<li><code>tmax_c</code>, the time of the highest observed concentration,</li>\n<li><code>tmax_e</code>, the time of the highest observed effect,</li>\n<li><code>e_rising</code>, the effect you would expect at <code>C_PROBE</code> on the way up, by\n  interpolating the rising limb,</li>\n<li><code>e_falling</code>, the same thing on the way down.</li>\n</ul>\n<p>Split the samples at the observed concentration peak, with the peak sample\nbelonging to both limbs. The rising limb's concentrations are already\nincreasing so <code>np.interp</code> will accept them directly. The falling limb's are\ndecreasing, so reverse both arrays before interpolating, or you will get a\nnumber that looks plausible and is wrong.</p>\n<p>What comes out is a difference of about fifteen milliseconds at the same plasma\nconcentration, which for a QT study is the difference between a drug you can\ndevelop and one you cannot. That is the whole argument for taking the delay\nseriously, and it took four lines of numpy.</p>\n<p>The cell also plots the loop. Look at the direction: the points move left along\nthe bottom as the concentration rises with little effect, climb at the far\nleft, and come back along the top. Counter clockwise, so the effect site lags\nplasma.</p>\n<p>Fill in <code>tmax_c</code>, <code>tmax_e</code>, <code>e_rising</code>, <code>e_falling</code>.</p>\n<p>Moves: <code>np.argmax</code>, slicing at the peak, <code>a[::-1]</code>, <code>np.interp</code>.</p><pre class=\"code\"><code># Part a. The hysteresis loop.\n\npeak_idx = None   # YOUR CODE: index of the highest observed concentration\n\ntmax_c = None     # YOUR CODE: time of the concentration peak\ntmax_e = None     # YOUR CODE: time of the effect peak\n\ne_rising = None   # YOUR CODE: effect at C_PROBE, interpolated on the rising limb\ne_falling = None  # YOUR CODE: effect at C_PROBE, interpolated on the falling limb\n\nprint(&quot;concentration peaks at %r h, effect at %r h&quot; % (tmax_c, tmax_e))\nprint(&quot;at %.2f mg/L: rising limb %r ms, falling limb %r ms&quot; % (C_PROBE, e_rising, e_falling))\nif e_rising is not None and e_falling is not None:\n    print(&quot;difference at the same concentration: %.3f ms&quot; % (e_falling - e_rising))\n\nfig, ax = plt.subplots(figsize=(6, 5))\nax.plot(c_obs, e_obs, &quot;o-&quot;, color=&quot;#333333&quot;)\nfor _i in range(0, len(t_obs), 2):\n    ax.annotate(&quot;%g h&quot; % t_obs[_i], (c_obs[_i], e_obs[_i]),\n                textcoords=&quot;offset points&quot;, xytext=(6, -3), fontsize=8)\nax.axvline(C_PROBE, ls=&quot;:&quot;, color=&quot;grey&quot;)\nax.set_xlabel(&quot;plasma concentration (mg/L)&quot;)\nax.set_ylabel(&quot;change in QTc (ms)&quot;)\nax.set_title(&quot;W8D1 effect against concentration, joined in time order&quot;)\nplt.show()</code></pre>"

    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Fit the wrong model, properly</h2>\n<p>Fit the direct Emax model</p>\n<pre><code>E = Emax * C / (EC50 + C)\n</code></pre>\n<p>to the twelve concentration and effect pairs with <code>curve_fit</code>. Start from\n<code>p0=[20.0, 1.0]</code> and bound both parameters below at something small and\npositive, because a negative EC50 is meaningless and an unbounded fit will\nwander into it.</p>\n<p>Record <code>emax_direct</code>, <code>ec50_direct</code> and <code>sse_direct</code>, the summed squared\nresiduals.</p>\n<p>Then compute the diagnostic that matters. With the residuals as <strong>observed\nminus predicted</strong>, in time order:</p>\n<ul>\n<li><code>resid_early</code>, the mean residual up to and including the concentration peak,</li>\n<li><code>resid_late</code>, the mean residual after it.</li>\n</ul>\n<p>They come out at about minus five and plus five milliseconds. A good fit has\nboth near zero; these are a run of five negative residuals followed by a run of\nseven positive ones, which is not noise, it is the model being wrong in a\nsystematic way.</p>\n<p>Now look at what the fitted parameters say. The Emax came out around 17 ms and\nthe EC50 around 0.1 mg/L, which describes a drug whose effect is almost\nsaturated by the lowest concentration sampled. The truth, which you will\nrecover in part c, is an Emax of 30 ms and an EC50 of 0.5 mg/L. The direct fit\nhas not merely added noise, it has flattened the curve and moved the potency by\na factor of five, and both errors push in the direction of thinking the drug is\nsafer at high doses than it is.</p>\n<p>Fill in <code>emax_direct</code>, <code>ec50_direct</code>, <code>sse_direct</code>, <code>resid_early</code>,\n<code>resid_late</code>.</p>\n<p>Moves: <code>curve_fit</code> with <code>p0</code> and <code>bounds</code>, residuals, slicing at the peak.</p><pre class=\"code\"><code># Part b. The direct Emax fit, and its residuals.\n\ndef direct_emax(c, emax, ec50):\n    &quot;&quot;&quot;Effect as a function of the concentration at that instant.&quot;&quot;&quot;\n    return None  # YOUR CODE: emax * c / (ec50 + c)\n\n\nemax_direct = None  # YOUR CODE: fitted Emax in ms\nec50_direct = None  # YOUR CODE: fitted EC50 in mg/L\nsse_direct = None   # YOUR CODE: summed squared residuals of this fit\n\nresid_early = None  # YOUR CODE: mean residual up to and including the conc peak\nresid_late = None   # YOUR CODE: mean residual after the conc peak\n\nprint(&quot;direct fit: Emax %r ms, EC50 %r mg/L&quot; % (emax_direct, ec50_direct))\nprint(&quot;SSE       : %r&quot; % (sse_direct,))\nprint(&quot;mean residual before the peak: %r&quot; % (resid_early,))\nprint(&quot;mean residual after the peak : %r&quot; % (resid_late,))</code></pre>"

    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Add the effect compartment</h2>\n<p>Write a model that takes the sampling times and three parameters, solves</p>\n<pre><code>dCe/dt = ke0 * (C(t) - Ce)\n</code></pre>\n<p>from zero with <code>Ce(0) = 0</code>, and returns <code>Emax * Ce / (EC50 + Ce)</code> at those\ntimes.</p>\n<p>You need a plasma concentration function <code>C(t)</code> to drive it. You do not have\nthe PK parameters, so use the observations themselves: interpolate <code>c_obs</code>\nagainst <code>t_obs</code> with <code>np.interp</code>, which is legitimate here because the\nconcentrations are measured densely enough over the range that matters. In a\nreal analysis you would fit the PK first and drive the effect compartment with\nthe fitted curve, which avoids feeding assay noise into the PD model.</p>\n<p>Fit <code>Emax</code>, <code>EC50</code> and <code>ke0</code> with <code>curve_fit</code>, starting from\n<code>p0=[20.0, 1.0, 0.3]</code> and bounding all three positive. Record <code>ke0_hat</code>,\n<code>emax_hat</code>, <code>ec50_hat</code>, the predictions in <code>link_pred</code>, and the summed squared\nresiduals in <code>sse_link</code>.</p>\n<p>What you should see:</p>\n<ul>\n<li><code>Emax</code> about 30.3 ms and <code>EC50</code> about 0.50 mg/L, both within a few percent\n  of the truth, where the direct fit gave 17 and 0.1,</li>\n<li><code>ke0</code> about 0.21 per hour, an effect site half life of 3.3 hours, against a\n  true 0.25. That is sixteen percent low, and the standard error from <code>pcov</code>\n  is only 0.008, so the interval does not come close to covering the truth.\n  Do not trust that standard error. The model treats the interpolated\n  concentrations as exact, when they are straight line segments drawn through\n  noisy samples, cutting the corner at the peak. None of that uncertainty is\n  in <code>pcov</code>, and some of it has been absorbed into <code>ke0</code> as bias. This is the\n  concrete reason a real analysis fits the PK model first and drives the\n  effect compartment with the fitted curve rather than with the observations,</li>\n<li>an SSE of about 27 against the direct fit's 567, a twenty one fold reduction\n  for one extra parameter,</li>\n<li>and, in the printout, mean residuals near zero both before and after the\n  peak. The structure is gone, which is the real evidence that the extra\n  parameter belongs there rather than just having absorbed some noise.</li>\n</ul>\n<p>Fill in <code>ke0_hat</code>, <code>emax_hat</code>, <code>ec50_hat</code>, <code>link_pred</code>, <code>sse_link</code>.</p>\n<p>Moves: <code>solve_ivp</code> inside a model function, <code>np.interp</code> as an input function,\n<code>curve_fit</code> with three parameters and bounds.</p><pre class=\"code\"><code># Part c. The effect compartment model.\n\ndef plasma(t):\n    &quot;&quot;&quot;Plasma concentration at arbitrary times, interpolated from the samples.&quot;&quot;&quot;\n    return None  # YOUR CODE: np.interp(t, t_obs, c_obs)\n\n\ndef link_model(t, emax, ec50, ke0):\n    &quot;&quot;&quot;Effect driven by the effect site concentration.&quot;&quot;&quot;\n    # YOUR CODE: solve dCe/dt = ke0 * (plasma(t) - Ce) from 0, with Ce(0) = 0,\n    # evaluated at t, then return emax * ce / (ec50 + ce)\n    return None\n\n\nke0_hat = None    # YOUR CODE: fitted ke0 in per h\nemax_hat = None   # YOUR CODE: fitted Emax in ms\nec50_hat = None   # YOUR CODE: fitted EC50 in mg/L\nlink_pred = None  # YOUR CODE: the fitted effects at t_obs\nsse_link = None   # YOUR CODE: summed squared residuals of this fit\n\nprint(&quot;link fit: Emax %r ms, EC50 %r mg/L, ke0 %r per h&quot; % (emax_hat, ec50_hat, ke0_hat))\nprint(&quot;SSE     : %r   (direct fit was %r)&quot; % (sse_link, sse_direct))\nif ke0_hat is not None:\n    print(&quot;effect site half life: %.3f h&quot; % (np.log(2) / ke0_hat))\nif link_pred is not None:\n    _rl = e_obs - np.asarray(link_pred, dtype=float)\n    print(&quot;mean residual before the peak: %.4f&quot; % _rl[:peak_idx + 1].mean())\n    print(&quot;mean residual after the peak : %.4f&quot; % _rl[peak_idx + 1:].mean())\n    fig, ax = plt.subplots(figsize=(6, 4))\n    ax.plot(t_obs, e_obs, &quot;o&quot;, label=&quot;observed&quot;)\n    ax.plot(t_obs, link_pred, &quot;-&quot;, label=&quot;effect compartment fit&quot;)\n    ax.plot(t_obs, direct_emax(c_obs, emax_direct, ec50_direct), &quot;--&quot;, label=&quot;direct fit&quot;)\n    ax.set_xlabel(&quot;time (h)&quot;)\n    ax.set_ylabel(&quot;change in QTc (ms)&quot;)\n    ax.set_title(&quot;W8D1 two models, one dataset&quot;)\n    ax.legend()\n    plt.show()</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>The drug inhibits an enzyme that produces an inflammatory biomarker. The\nbiomarker sits at a steady baseline because it is made and removed\ncontinuously, and the drug slows the making.</p>\n<p>Yesterday's effect compartment would describe the delay as the drug taking\ntime to reach its site of action. Today's mechanism is different and more\ncommon: the drug reaches its target immediately, and the delay belongs to the\nbiomarker, which cannot fall faster than its own turnover allows. Block\nproduction completely and the level still only falls at the rate it was being\nremoved anyway.</p>\n<p>The practical consequences are large. The effect outlasts the drug by days.\nThe time of maximum effect moves later as the dose goes up, which no effect\ncompartment model can produce. And the quantity that governs the duration of\naction is not a property of the drug at all, it is the biomarker's turnover\nhalf life.</p>"
   },
   {
    "key": "concept",
    "label": "The turnover model",
    "html": "<h2>The turnover model</h2>\n<p><strong>The equation.</strong> One state, the biomarker level <code>R</code>, made at rate <code>kin</code> and\nremoved by a first order process <code>kout</code>:</p>\n<pre><code>dR/dt = kin - kout * R\n</code></pre>\n<p>Before any drug this settles at <code>R(0) = kin / kout</code>, the baseline. That is the\nmost useful fact in the model and the one people forget: <strong>the baseline pins\n<code>kin</code></strong>. If you know the baseline and you know <code>kout</code>, then <code>kin</code> is not a free\nparameter, it is <code>kout * R0</code>. A fit that treats all three as free is fitting\none parameter twice and will not converge cleanly.</p>\n<p><strong>The drug.</strong> Four places it can act, and the four standard models are named\nfor them. Inhibition or stimulation of production, inhibition or stimulation of\nloss. Today is inhibition of production, which multiplies <code>kin</code> by an inhibitory\nEmax term:</p>\n<pre><code>dR/dt = kin * (1 - Imax * C / (IC50 + C)) - kout * R\n</code></pre>\n<p><code>Imax</code> is between 0 and 1 and says how completely production can be shut off.\n<code>Imax = 0.9</code> means that even at infinite concentration, ten percent of\nproduction continues.</p>\n<p><strong>Where the delay comes from.</strong> Set <code>C</code> to something large and hold it there.\nProduction nearly stops, and <code>R</code> decays towards its new steady state with the\nrate constant <code>kout</code>, so the approach has a half life of <code>ln(2) / kout</code>. The\ndrug cannot make the biomarker fall faster than that, however much of it you\ngive. A biomarker with a twelve hour turnover half life takes about two days to\nreach a new steady state no matter what you do to production.</p>\n<p><strong>Why the time of the nadir moves with dose.</strong> The nadir happens when the\nreduced production rate and the removal rate <code>kout * R</code> come back into balance.\nA bigger dose keeps the concentration above <code>IC50</code> for longer, so production\nstays suppressed for longer, so the balance point arrives later. The time the\nconcentration spends above <code>IC50</code> grows roughly with the logarithm of the dose,\nand the time to the nadir follows it.</p>\n<p>This is the clean diagnostic between the two mechanisms. <strong>An effect\ncompartment puts the maximum effect at the same time for every dose.</strong> An\nindirect response model puts it later and later. If you have data at three dose\nlevels, this tells you which model you need, and it is one of the few places in\nPK/PD where the answer is not a matter of taste.</p>"
   },

    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.integrate import solve_ivp\n\nPROBLEM_ID = &quot;W8D2&quot;\nTOPIC = &quot;PK/PD: turnover models, inhibition of production, dose dependent time to nadir&quot;\n\n# Pharmacokinetics, taken as known from an earlier study.\nVF = 35.0            # L, apparent volume of distribution\nKA = 1.0             # per h, first order absorption\nKE = 0.12            # per h, first order elimination\n\n# Pharmacodynamics of the biomarker.\nR_BASE = 100.0       # units/L, the pre dose baseline\nT_HALF_TURNOVER = 12.0   # h, the biomarker&#x27;s own turnover half life\nIMAX = 0.9           # at most 90 pct of production can be blocked\nIC50 = 0.5           # mg/L, concentration for half of that\n\nKOUT = np.log(2.0) / T_HALF_TURNOVER\n\nDOSE = 100.0         # mg, the dose for part a\nDOSES = np.array([25.0, 100.0, 400.0])   # mg, the three dose levels for part b\nKE0_COMPARE = 0.03   # per h, for the effect compartment comparison in part b\n\n# One shared time grid, so that everyone reads the same times off it.\nt_grid = np.linspace(0.0, 168.0, 1681)   # 0 to 7 days in 0.1 h steps\nDT = float(t_grid[1] - t_grid[0])\n\n\ndef conc(t, dose):\n    &quot;&quot;&quot;Plasma concentration after a single oral dose, one compartment.&quot;&quot;&quot;\n    return dose * KA / (VF * (KA - KE)) * (np.exp(-KE * t) - np.exp(-KA * t))\n\n\nprint(&quot;turnover half life %.1f h, so kout = %.6f per h&quot; % (T_HALF_TURNOVER, KOUT))\nprint(&quot;baseline %.1f units/L&quot; % R_BASE)\nprint(&quot;Imax %.2f, IC50 %.2f mg/L&quot; % (IMAX, IC50))\nprint(&quot;&quot;)\nprint(&quot;grid: %d points from %g to %g h, step %.1f h&quot;\n      % (t_grid.size, t_grid[0], t_grid[-1], DT))\nprint(&quot;concentration after %g mg: Cmax %.4f mg/L at %.2f h&quot;\n      % (DOSE, conc(t_grid, DOSE).max(), t_grid[int(np.argmax(conc(t_grid, DOSE)))]))\nprint(&quot;concentration after %g mg at 48 h: %.5f mg/L&quot; % (DOSE, conc(48.0, DOSE)))</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>solve one state</td>\n<td><code>solve_ivp(rhs, (0, tmax), [r0], t_eval=t_grid, rtol=1e-9, atol=1e-10)</code></td>\n</tr>\n<tr>\n<td>the solution values</td>\n<td><code>sol.y[0]</code></td>\n</tr>\n<tr>\n<td>a right hand side with a time varying input</td>\n<td><code>lambda t, y: kin * (1 - imax * c(t) / (ic50 + c(t))) - kout * y[0]</code></td>\n</tr>\n<tr>\n<td>position of a minimum</td>\n<td><code>int(np.argmin(r))</code></td>\n</tr>\n<tr>\n<td>how long a condition held</td>\n<td><code>(c &gt; threshold).sum() * DT</code></td>\n</tr>\n<tr>\n<td>area under a curve</td>\n<td><code>np.trapezoid(y, x)</code>, or <code>np.trapz(y, x)</code> on older numpy</td>\n</tr>\n<tr>\n<td>the first index satisfying a condition</td>\n<td><code>int(np.where(flags)[0][0])</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>np.trapezoid</code> is the current name and <code>np.trapz</code> is the old one. Colab may have\neither, so the safe pattern is to compute the trapezoids yourself, or to try one\nand fall back to the other. The toolkit below shows a version that works on both.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy.integrate import solve_ivp\n\nprint(&quot;--- 1. a turnover system with no drug sits still ---&quot;)\ndemo_kout = 0.2\ndemo_r0 = 50.0\ndemo_kin = demo_kout * demo_r0        # the baseline pins kin\ndemo_t = np.linspace(0.0, 24.0, 241)\ndemo_sol = solve_ivp(lambda t, y: demo_kin - demo_kout * y[0],\n                     (0.0, 24.0), [demo_r0], t_eval=demo_t, rtol=1e-9, atol=1e-10)\nprint(&quot;kin = kout * R0 = %.3f&quot; % demo_kin)\nprint(&quot;R at 0, 12 and 24 h:&quot;, np.round(demo_sol.y[0][[0, 120, 240]], 9))\nprint(&quot;started at the steady state, so nothing moves&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. start it in the wrong place and you get a drift artifact ---&quot;)\ndemo_sol2 = solve_ivp(lambda t, y: demo_kin - demo_kout * y[0],\n                      (0.0, 24.0), [30.0], t_eval=demo_t, rtol=1e-9, atol=1e-10)\nprint(&quot;from R(0) = 30 with no drug at all:&quot;, np.round(demo_sol2.y[0][[0, 12, 60, 240]], 4))\nprint(&quot;it climbs to the baseline on its own, with half life %.2f h&quot; % (np.log(2) / demo_kout))\nprint(&quot;a model started off baseline will blame the drug for that climb&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. production shut off completely: the fastest possible fall ---&quot;)\ndemo_sol3 = solve_ivp(lambda t, y: 0.0 - demo_kout * y[0],\n                      (0.0, 24.0), [demo_r0], t_eval=demo_t, rtol=1e-9, atol=1e-10)\nprint(&quot;R after 0, 1, 2 and 3 turnover half lives:&quot;,\n      np.round(np.interp([0, np.log(2) / demo_kout, 2 * np.log(2) / demo_kout,\n                          3 * np.log(2) / demo_kout], demo_t, demo_sol3.y[0]), 4))\nprint(&quot;no drug can beat that, which is where the delay comes from&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. how long a condition held, on a fixed grid ---&quot;)\ndemo_c = np.array([0.1, 0.8, 1.2, 0.9, 0.3, 0.1])\ndemo_dt = 0.5\nprint(&quot;values:&quot;, demo_c, &quot; threshold 0.5&quot;)\nprint(&quot;samples above:&quot;, int((demo_c &gt; 0.5).sum()), &quot; so about %.1f h&quot; % ((demo_c &gt; 0.5).sum() * demo_dt))\nprint(&quot;that is a grid count, not an interpolation, so it is accurate to one step&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. trapezoidal area that works on old and new numpy ---&quot;)\ndemo_x = np.array([0.0, 1.0, 2.0, 3.0])\ndemo_y = np.array([0.0, 2.0, 2.0, 0.0])\n\n\ndef demo_area(y, x):\n    &quot;&quot;&quot;Trapezoidal area, written out so the numpy version does not matter.&quot;&quot;&quot;\n    return float(np.sum(0.5 * (y[1:] + y[:-1]) * np.diff(x)))\n\n\nprint(&quot;by hand        :&quot;, demo_area(demo_y, demo_x))\nprint(&quot;numpy agrees   :&quot;, float(np.trapezoid(demo_y, demo_x))\n      if hasattr(np, &quot;trapezoid&quot;) else float(np.trapz(demo_y, demo_x)))\n\nprint(&quot;&quot;)\nprint(&quot;--- 6. first index where something becomes true ---&quot;)\ndemo_r = np.array([50.0, 60.0, 80.0, 95.0, 99.0])\ndemo_flags = demo_r &gt;= 90.0\nprint(&quot;flags:&quot;, demo_flags, &quot; first True at index&quot;, int(np.where(demo_flags)[0][0]))\nprint(&quot;np.where returns a tuple, hence the [0][0]&quot;)</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. One dose through the turnover model</h2>\n<p>First work out <code>kin</code>. You know the baseline <code>R_BASE</code> and you know <code>KOUT</code>, and\nat baseline production equals removal, so <code>kin = KOUT * R_BASE</code>. Writing this\ndown rather than fitting it is the whole trick with indirect response models.</p>\n<p>Then solve</p>\n<pre><code>dR/dt = kin * (1 - IMAX * C(t) / (IC50 + C(t))) - KOUT * R\n</code></pre>\n<p>from <code>R(0) = R_BASE</code> over <code>t_grid</code>, with <code>C(t)</code> given by the <code>conc</code> function\nand <code>DOSE</code> of 100 mg. Use <code>rtol=1e-9, atol=1e-10</code>, which matters here: the\ndefault tolerances leave visible error in the tail, and you are about to read a\ntime off this curve to one decimal place.</p>\n<p>From the solution record:</p>\n<ul>\n<li><code>nadir</code>, the lowest biomarker level reached,</li>\n<li><code>t_nadir</code>, the time at which it happened, read off <code>t_grid</code>,</li>\n<li><code>pct_suppression</code>, the maximum suppression as a percentage of baseline,\n  <code>100 * (1 - nadir / R_BASE)</code>.</li>\n</ul>\n<p>The concentration peaks at 2.4 hours. The biomarker bottoms out at 18.8 hours,\nsixteen hours later, and the drug is down to a hundredth of its peak by then.\nNothing is wrong with the simulation. The biomarker is simply still catching up.</p>\n<p>Note also that the suppression is only 36 percent although <code>Imax</code> is 0.9. The\nconcentration is above <code>IC50</code> for about fifteen hours out of a week, so\nproduction is never shut off for long enough to approach the maximum effect.\nImax is an asymptote, not a prediction.</p>\n<p>Fill in <code>kin</code>, <code>nadir</code>, <code>t_nadir</code>, <code>pct_suppression</code>.</p>\n<p>Moves: <code>solve_ivp</code> with a time varying input, <code>np.argmin</code>, indexing <code>t_grid</code>.</p><pre class=\"code\"><code># Part a. The turnover model at one dose.\n\nkin = None  # YOUR CODE: production rate implied by the baseline and KOUT\n\n\ndef rhs(t, y, dose):\n    &quot;&quot;&quot;dR/dt for inhibition of production.&quot;&quot;&quot;\n    c = conc(t, dose)\n    return None  # YOUR CODE: kin * (1 - IMAX * c / (IC50 + c)) - KOUT * y[0]\n\n\nr_single = None  # YOUR CODE: the solved biomarker profile over t_grid, as an array\n\nnadir = None            # YOUR CODE: lowest level reached\nt_nadir = None          # YOUR CODE: time at which it happened\npct_suppression = None  # YOUR CODE: maximum suppression as a percentage of baseline\n\nprint(&quot;kin = %r units/L/h&quot; % (kin,))\nprint(&quot;nadir %r units/L at t = %r h&quot; % (nadir, t_nadir))\nprint(&quot;maximum suppression %r pct of baseline&quot; % (pct_suppression,))\n\nif r_single is not None:\n    fig, ax = plt.subplots(figsize=(7, 4))\n    ax.plot(t_grid, r_single, &quot;-&quot;, color=&quot;#1f4e79&quot;, label=&quot;biomarker&quot;)\n    ax.set_xlabel(&quot;time (h)&quot;)\n    ax.set_ylabel(&quot;biomarker (units/L)&quot;)\n    ax.set_xlim(0, 96)\n    ax2 = ax.twinx()\n    ax2.plot(t_grid, conc(t_grid, DOSE), &quot;--&quot;, color=&quot;#999999&quot;, label=&quot;concentration&quot;)\n    ax2.set_ylabel(&quot;concentration (mg/L)&quot;)\n    ax.set_title(&quot;W8D2 the effect outlasts the drug&quot;)\n    ax.legend(loc=&quot;lower right&quot;)\n    plt.show()</code></pre>"

    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Three doses, and the mechanism diagnostic</h2>\n<p>Run the same model at 25, 100 and 400 mg, and collect, as arrays of three\nnumbers in dose order:</p>\n<ul>\n<li><code>t_nadir_by_dose</code>, the time of the nadir at each dose,</li>\n<li><code>nadir_by_dose</code>, the nadir itself,</li>\n<li><code>t_above_by_dose</code>, how long the concentration stays above <code>IC50</code> at each\n  dose. Count grid points where <code>conc</code> exceeds <code>IC50</code> and multiply by <code>DT</code>.</li>\n</ul>\n<p>Then build the competing explanation and watch it fail. For each dose, solve\nthe effect compartment</p>\n<pre><code>dCe/dt = KE0_COMPARE * (C(t) - Ce)\n</code></pre>\n<p>from <code>Ce(0) = 0</code>, and compute the same inhibitory effect on <code>Ce</code> instead:\n<code>R_BASE * (1 - IMAX * Ce / (IC50 + Ce))</code>. Record the time of its minimum in\n<code>t_link_by_dose</code>.</p>\n<p>Here is the comparison you have just produced.</p>\n<table>\n<thead>\n<tr>\n<th>dose</th>\n<th>time above IC50</th>\n<th>indirect nadir time</th>\n<th>effect compartment nadir time</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>25 mg</td>\n<td>2.2 h</td>\n<td>15.3 h</td>\n<td>16.5 h</td>\n</tr>\n<tr>\n<td>100 mg</td>\n<td>15.4 h</td>\n<td>18.8 h</td>\n<td>16.5 h</td>\n</tr>\n<tr>\n<td>400 mg</td>\n<td>27.1 h</td>\n<td>24.1 h</td>\n<td>16.5 h</td>\n</tr>\n</tbody>\n</table>\n<p>The effect compartment column is constant to the last digit, and it is constant\nfor a reason rather than by accident: <code>Ce</code> is a linear filter of <code>C</code>, so\nmultiplying the dose multiplies <code>Ce</code> by the same factor everywhere and cannot\nmove the position of its peak. The effect is a monotone function of <code>Ce</code>, so its\nextreme sits at the same time too, at every dose, forever.</p>\n<p>The indirect column moves by nine hours across a sixteen fold dose range, and\nit tracks the time above <code>IC50</code>. That is the fingerprint, and it means three\ndose levels of biomarker data are enough to tell you which mechanism you are\nlooking at.</p>\n<p>The nadir depths, 18.6, 36.4 and 53.1 percent suppression, are worth a second\nlook as well. Sixteen times the dose did not get you three times the effect.\nBetween the Emax saturation and the turnover limit, the dose response of an\nindirect biomarker is much flatter than the dose response of a concentration.</p>\n<p>Fill in <code>t_nadir_by_dose</code>, <code>nadir_by_dose</code>, <code>t_above_by_dose</code>,\n<code>t_link_by_dose</code>.</p>\n<p>Moves: a loop over <code>DOSES</code>, <code>solve_ivp</code> twice per dose, <code>np.argmin</code>,\n<code>(c &gt; IC50).sum() * DT</code>.</p><pre class=\"code\"><code># Part b. Dose dependence, and the effect compartment comparison.\n\nt_nadir_by_dose = None  # YOUR CODE: array of 3 nadir times, indirect model\nnadir_by_dose = None    # YOUR CODE: array of 3 nadir levels, indirect model\nt_above_by_dose = None  # YOUR CODE: array of 3 durations above IC50, in h\n\nt_link_by_dose = None   # YOUR CODE: array of 3 nadir times, effect compartment model\n\nprint(&quot;dose (mg)        :&quot;, DOSES)\nprint(&quot;time above IC50  :&quot;, t_above_by_dose)\nprint(&quot;indirect t_nadir :&quot;, t_nadir_by_dose)\nprint(&quot;indirect nadir   :&quot;, nadir_by_dose)\nprint(&quot;link model t_min :&quot;, t_link_by_dose)\n\nif nadir_by_dose is not None:\n    fig, ax = plt.subplots(figsize=(7, 4))\n    for _d in DOSES:\n        _s = solve_ivp(rhs, (float(t_grid[0]), float(t_grid[-1])), [R_BASE],\n                       t_eval=t_grid, args=(_d,), rtol=1e-9, atol=1e-10)\n        ax.plot(t_grid, _s.y[0], &quot;-&quot;, label=&quot;%g mg&quot; % _d)\n    ax.axhline(R_BASE, ls=&quot;:&quot;, color=&quot;grey&quot;)\n    ax.set_xlim(0, 120)\n    ax.set_xlabel(&quot;time (h)&quot;)\n    ax.set_ylabel(&quot;biomarker (units/L)&quot;)\n    ax.set_title(&quot;W8D2 three doses, three different nadir times&quot;)\n    ax.legend()\n    plt.show()</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Duration of action belongs to the biomarker</h2>\n<p>Back to the 100 mg dose and the profile from part a.</p>\n<ul>\n<li><code>auec</code>, the area between the baseline and the curve, in units/L times hours:\n  integrate <code>R_BASE - r_single</code> over <code>t_grid</code>. This is the cumulative\n  suppression, and it is the quantity that usually correlates with clinical\n  benefit, far better than the nadir does,</li>\n<li><code>t_recover</code>, the first time at or after the nadir at which the biomarker has\n  come back to at least 90 percent of baseline.</li>\n</ul>\n<p>Then change the biomarker and leave the drug alone. Re run the simulation with\nthe turnover half life set to 6 hours and then to 24 hours, recomputing <code>kout</code>\nand <code>kin</code> each time, and record the nadir times in <code>t_nadir_fast</code> and\n<code>t_nadir_slow</code>.</p>\n<p>What this shows:</p>\n<ul>\n<li>recovery to 90 percent of baseline takes 54 hours, while the plasma\n  concentration at 48 hours is 0.01 mg/L, one fiftieth of the <code>IC50</code>. For more\n  than a day the biomarker is suppressed by a drug that has effectively gone,</li>\n<li>halving the turnover half life to 6 hours moves the nadir from 18.8 h to\n  14.2 h and makes it deeper, 51.4 against 63.6. Doubling it to 24 hours moves\n  the nadir out to 23.8 h and makes it shallower, 75.5. The drug, its dose and\n  its PK were identical in all three.</li>\n</ul>\n<p>That is the message of the day. For an indirect response, the time course of\nthe effect is a property of the biomarker, and the dose only sets how hard you\npush on it. It is also why dosing intervals for these drugs are often set by\nthe biomarker's turnover and not by the drug's half life, and why a daily dose\ncan be right for a drug with a four hour plasma half life.</p>\n<p>Fill in <code>auec</code>, <code>t_recover</code>, <code>t_nadir_fast</code>, <code>t_nadir_slow</code>.</p>\n<p>Moves: trapezoidal integration, <code>np.where</code> for the first crossing,\nre running <code>solve_ivp</code> with a different <code>kout</code>.</p><pre class=\"code\"><code># Part c. Duration of action, and whose clock it runs on.\n\nauec = None       # YOUR CODE: area between baseline and the 100 mg profile\nt_recover = None  # YOUR CODE: first time at or after the nadir with R &gt;= 90 pct of baseline\n\n\ndef simulate(dose, t_half_turnover):\n    &quot;&quot;&quot;Solve the turnover model for a given dose and turnover half life.&quot;&quot;&quot;\n    kout = np.log(2.0) / t_half_turnover\n    kin_local = kout * R_BASE\n    # YOUR CODE: solve dR/dt = kin_local * (1 - IMAX * c / (IC50 + c)) - kout * R\n    # from R_BASE over t_grid, and return the solution array\n    return None\n\n\nt_nadir_fast = None  # YOUR CODE: nadir time with a 6 h turnover half life\nt_nadir_slow = None  # YOUR CODE: nadir time with a 24 h turnover half life\n\nprint(&quot;AUEC of suppression: %r units/L*h&quot; % (auec,))\nprint(&quot;back to 90 pct of baseline at %r h&quot; % (t_recover,))\nprint(&quot;&quot;)\nprint(&quot;nadir time with a  6 h turnover half life: %r h&quot; % (t_nadir_fast,))\nprint(&quot;nadir time with a 12 h turnover half life: %r h&quot; % (t_nadir,))\nprint(&quot;nadir time with a 24 h turnover half life: %r h&quot; % (t_nadir_slow,))</code></pre>"

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>lognormal draws</td>\n<td><code>rng.lognormal(mean_of_logs, sd_of_logs, size=n)</code></td>\n</tr>\n<tr>\n<td>a matrix of draws</td>\n<td><code>rng.lognormal(0.0, omega, size=(n_studies, n_per_study))</code></td>\n</tr>\n<tr>\n<td>geometric mean</td>\n<td><code>np.exp(np.mean(np.log(x)))</code></td>\n</tr>\n<tr>\n<td>CV from logs</td>\n<td><code>np.sqrt(np.exp(np.var(np.log(x), ddof=1)) - 1)</code></td>\n</tr>\n<tr>\n<td>percentiles</td>\n<td><code>np.percentile(x, [5, 95])</code></td>\n</tr>\n<tr>\n<td>row wise variance</td>\n<td><code>np.var(logs, axis=1, ddof=1)</code></td>\n</tr>\n<tr>\n<td>a histogram</td>\n<td><code>ax.hist(x, bins=40)</code></td>\n</tr>\n</tbody>\n</table>\n<p>Note what <code>rng.lognormal(0.0, 0.3, n)</code> means: the <strong>logs</strong> are Normal with mean\n0 and SD 0.3, so the values themselves have median <code>exp(0) = 1</code>. Multiply by the\ntypical value to centre them where you want. Passing the typical value as the\nfirst argument instead is a common and silent error, because it is interpreted\nas a mean of logs.</p>",

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Before the phase 2 dose is chosen, somebody has to answer this: if we give\n100 mg to five hundred people, what range of exposures do we get, and how many\nof them end up outside the range we consider acceptable.</p>\n<p>You cannot answer it from a mean. A mean exposure of 24 mg*h/L is compatible\nwith everybody getting 24 and with half the population getting 15 and the\nother half 40. The answer has to be a distribution, and simulating one is the\nstandard tool: give every virtual subject their own clearance and volume,\ncompute their exposure, and look at the spread.</p>\n<p>Today you build that population, read the percentiles off it, and then ask a\nquestion people usually skip: how well do you actually know the variability you\njust simulated. The answer, with the sample sizes early clinical pharmacology\nactually has, is sobering.</p>"

   {
    "key": "concept",
    "label": "Lognormal parameters, and three numbers that are not the same",
    "html": "<h2>Lognormal parameters, and three numbers that are not the same</h2>\n<p><strong>Why lognormal.</strong> Clearance cannot be negative, and its distribution across\npeople is right skewed: a few people clear a drug much faster than typical,\nnobody clears it at minus two litres an hour. The standard model is therefore</p>\n<pre><code>CL_i = CL_pop * exp(eta_i),    eta_i ~ Normal(0, omega^2)\n</code></pre>\n<p><code>CL_pop</code> is the typical value, <code>eta_i</code> is that subject's deviation on the log\nscale, and <code>omega</code> is the between subject standard deviation of the logs. In\nNONMEM output <code>omega</code> squared is what you see, and people quote its square root\nas a CV.</p>\n<p><strong>Three different centres.</strong> For a lognormal distribution:</p>\n<ul>\n<li>the <strong>median</strong> is <code>CL_pop</code>, since half the <code>eta</code> values are below zero,</li>\n<li>the <strong>geometric mean</strong> is also <code>CL_pop</code>, which is why PK parameters are\n  reported as geometric means,</li>\n<li>the <strong>arithmetic mean</strong> is <code>CL_pop * exp(omega^2 / 2)</code>, which is larger.</li>\n</ul>\n<p>With <code>omega = 0.3</code> the arithmetic mean is 4.6 percent above the typical value.\nWith <code>omega = 0.6</code> it is 20 percent above. This is a real source of confusion\nin reports: the mean clearance and the typical clearance are different numbers,\nand which one somebody meant is often not stated.</p>\n<p><strong>CV as a percentage.</strong> Two conventions exist and both are in use. The exact\none is</p>\n<pre><code>CV = sqrt(exp(omega^2) - 1)\n</code></pre>\n<p>and the approximation, good to a few percent for small variability, is <code>CV</code> is\nabout <code>omega</code>. For <code>omega = 0.3</code> the exact answer is 30.69 percent and the\napproximation says 30, so it rarely matters, but know which one a number came\nfrom before comparing two reports.</p>\n<p><strong>Reading a simulated population.</strong> Percentiles, not standard deviations.\n<code>np.percentile(auc, [5, 95])</code> gives you the central ninety percent of the\nexposures directly, which is the interval a safety discussion actually wants.\nA standard deviation of a skewed distribution tells you much less.</p>\n<p><strong>How well do you know omega.</strong> This is the part that gets skipped. The sample\nvariance of normally distributed logs follows a chi squared distribution with\n<code>n - 1</code> degrees of freedom, which is a wide distribution for small <code>n</code>. With\ntwelve subjects, a true CV of 31 percent produces estimates between about 18\nand 44 percent, ninety five times out of a hundred. With a hundred and twenty\nsubjects the same range narrows to about 27 to 35 percent.</p>\n<p>So a phase 1 study reporting \"between subject variability in clearance was\n22 percent\" has said something considerably vaguer than it sounds.</p>"

    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>the population, and its three different centres</td>\n<td><code>cl_gm</code>, <code>cl_cv_pct</code>, <code>cl_mean</code>, <code>mean_over_median</code>, <code>mean_over_median_theory</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>the exposure distribution</td>\n<td><code>auc_i</code>, <code>cmax_i</code>, <code>auc_gm</code>, <code>auc_p5</code>, <code>auc_p95</code>, <code>fold_range</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>how precisely variability can be estimated</td>\n<td><code>cv_hat_12</code>, <code>cv_hat_120</code>, <code>cv12_lo</code>, <code>cv12_hi</code>, <code>cv120_lo</code>, <code>cv120_hi</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\n\nPROBLEM_ID = &quot;W8D3&quot;\nTOPIC = &quot;Population PK: lognormal parameters, exposure percentiles, how precisely a CV can be estimated&quot;\n\nN_SUBJ = 500\nDOSE = 100.0          # mg, single oral dose\n\nCL_POP = 4.2          # L/h, typical clearance\nV_POP = 35.0          # L, typical volume\nKA = 1.0              # per h, absorption, taken as the same in everybody\n\nOMEGA_CL = 0.30       # between subject SD of log clearance\nOMEGA_V = 0.25        # between subject SD of log volume\n\n# The virtual population, drawn once here so that everyone works with the\n# same five hundred subjects.\n_rng = np.random.default_rng(8301)\ncl_i = CL_POP * _rng.lognormal(0.0, OMEGA_CL, size=N_SUBJ)\nv_i = V_POP * _rng.lognormal(0.0, OMEGA_V, size=N_SUBJ)\n\n# For part c.\nSEED_C = 8302\nN_STUDIES = 2000\n\nprint(&quot;%d subjects drawn&quot; % N_SUBJ)\nprint(&quot;clearance: first five %s L/h&quot; % np.round(cl_i[:5], 4))\nprint(&quot;volume   : first five %s L&quot; % np.round(v_i[:5], 4))\nprint(&quot;&quot;)\nprint(&quot;typical values: CL %.1f L/h, V %.1f L, ka %.1f per h&quot; % (CL_POP, V_POP, KA))\nprint(&quot;omega: %.2f on log CL, %.2f on log V&quot; % (OMEGA_CL, OMEGA_V))\nprint(&quot;&quot;)\nprint(&quot;elimination rate constants run from %.4f to %.4f per h&quot;\n      % ((cl_i / v_i).min(), (cl_i / v_i).max()))\nprint(&quot;all well below ka = %.1f, so nobody in this population is flip flop&quot; % KA)</code></pre>"

   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>lognormal draws</td>\n<td><code>rng.lognormal(mean_of_logs, sd_of_logs, size=n)</code></td>\n</tr>\n<tr>\n<td>a matrix of draws</td>\n<td><code>rng.lognormal(0.0, omega, size=(n_studies, n_per_study))</code></td>\n</tr>\n<tr>\n<td>geometric mean</td>\n<td><code>np.exp(np.mean(np.log(x)))</code></td>\n</tr>\n<tr>\n<td>CV from logs</td>\n<td><code>np.sqrt(np.exp(np.var(np.log(x), ddof=1)) - 1)</code></td>\n</tr>\n<tr>\n<td>percentiles</td>\n<td><code>np.percentile(x, [5, 95])</code></td>\n</tr>\n<tr>\n<td>row wise variance</td>\n<td><code>np.var(logs, axis=1, ddof=1)</code></td>\n</tr>\n<tr>\n<td>a histogram</td>\n<td><code>ax.hist(x, bins=40)</code></td>\n</tr>\n</tbody>\n</table>\n<p>Note what <code>rng.lognormal(0.0, 0.3, n)</code> means: the <strong>logs</strong> are Normal with mean\n0 and SD 0.3, so the values themselves have median <code>exp(0) = 1</code>. Multiply by the\ntypical value to centre them where you want. Passing the typical value as the\nfirst argument instead is a common and silent error, because it is interpreted\nas a mean of logs.</p><pre class=\"code\"><code>import numpy as np\n\nprint(&quot;--- 1. what the two arguments of lognormal mean ---&quot;)\ndemo_rng = np.random.default_rng(0)\ndemo_a = demo_rng.lognormal(0.0, 0.3, size=100000)\nprint(&quot;lognormal(0.0, 0.3): median %.4f  geometric mean %.4f  arithmetic mean %.4f&quot;\n      % (np.median(demo_a), np.exp(np.mean(np.log(demo_a))), demo_a.mean()))\nprint(&quot;theory             : median 1.0000  geometric mean 1.0000  arithmetic mean %.4f&quot;\n      % np.exp(0.3 ** 2 / 2))\ndemo_b = demo_rng.lognormal(4.2, 0.3, size=5)\nprint(&quot;lognormal(4.2, 0.3) gives&quot;, np.round(demo_b, 2), &quot;&lt;- 4.2 was a mean of LOGS&quot;)\nprint(&quot;what you wanted was 4.2 * lognormal(0.0, 0.3):&quot;,\n      np.round(4.2 * demo_rng.lognormal(0.0, 0.3, size=5), 3))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. the exact CV and the omega approximation ---&quot;)\nfor demo_om in (0.1, 0.3, 0.6, 1.0):\n    print(&quot;omega %.1f  exact CV %6.2f pct  approximation %5.1f pct  mean over median %.4f&quot;\n          % (demo_om, 100 * np.sqrt(np.exp(demo_om ** 2) - 1), 100 * demo_om,\n             np.exp(demo_om ** 2 / 2)))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. percentiles of a skewed distribution ---&quot;)\ndemo_c = 20.0 * demo_rng.lognormal(0.0, 0.4, size=20000)\nprint(&quot;mean %.3f  SD %.3f&quot; % (demo_c.mean(), demo_c.std(ddof=1)))\nprint(&quot;mean minus 2 SD = %.3f, which is below the 2.5th percentile of %.3f&quot;\n      % (demo_c.mean() - 2 * demo_c.std(ddof=1), np.percentile(demo_c, 2.5)))\nprint(&quot;percentiles 5, 50, 95:&quot;, np.round(np.percentile(demo_c, [5, 50, 95]), 3))\nprint(&quot;for a skewed distribution the percentiles are the honest summary&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. many studies at once, with one draw ---&quot;)\ndemo_rng2 = np.random.default_rng(1)\ndemo_draws = demo_rng2.lognormal(0.0, 0.3, size=(5, 12))   # 5 studies of 12 people\nprint(&quot;shape:&quot;, demo_draws.shape)\ndemo_logs = np.log(demo_draws)\ndemo_cvs = 100 * np.sqrt(np.exp(np.var(demo_logs, axis=1, ddof=1)) - 1)\nprint(&quot;CV estimated in each of the 5 studies:&quot;, np.round(demo_cvs, 2))\nprint(&quot;the truth was %.2f pct in every one of them&quot; % (100 * np.sqrt(np.exp(0.09) - 1)))\nprint(&quot;one draw of shape (n_studies, n_per_study) is reproducible in a way that&quot;)\nprint(&quot;a loop of separate draws is not, because the order of the draws is fixed&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. row wise against whole array reductions ---&quot;)\ndemo_m = np.array([[1.0, 2.0, 3.0], [10.0, 20.0, 30.0]])\nprint(&quot;var(axis=1, ddof=1), one per row:&quot;, demo_m.var(axis=1, ddof=1))\nprint(&quot;var(ddof=1) over everything     :&quot;, demo_m.var(ddof=1))\nprint(&quot;forgetting axis=1 gives one number where you wanted n_studies of them&quot;)</code></pre>"

   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Read the population back</h2>\n<p>The five hundred clearances are in <code>cl_i</code>. Summarise them.</p>\n<ul>\n<li><code>cl_gm</code>, the geometric mean,</li>\n<li><code>cl_cv_pct</code>, the between subject CV as a percentage, from the exact formula\n  <code>100 * sqrt(exp(var(log CL)) - 1)</code> with <code>ddof=1</code>,</li>\n<li><code>cl_mean</code>, the plain arithmetic mean,</li>\n<li><code>mean_over_median</code>, the arithmetic mean divided by the median, as observed,</li>\n<li><code>mean_over_median_theory</code>, what that ratio should be in the limit,\n  <code>exp(OMEGA_CL ** 2 / 2)</code>.</li>\n</ul>\n<p>The geometric mean comes out at 4.198 L/h against a typical value of 4.2, and\nthe CV at 30.9 percent against the 30.69 the omega implies. Five hundred\nsubjects is enough to recover both closely, which is worth seeing once so that\npart c lands properly.</p>\n<p>The two ratios are 1.041 observed and 1.046 in theory. Both say the same thing:\nthe arithmetic mean clearance is about four percent higher than the typical\nclearance, because the distribution has a long right tail and the mean follows\nit. If a report gives you a mean clearance and a model gives you a typical\nclearance, they are not the same quantity and the difference grows fast with\nvariability.</p>\n<p>Fill in <code>cl_gm</code>, <code>cl_cv_pct</code>, <code>cl_mean</code>, <code>mean_over_median</code>,\n<code>mean_over_median_theory</code>.</p>\n<p>Moves: <code>np.log</code>, <code>np.exp</code>, <code>np.mean</code>, <code>np.median</code>, <code>np.var(..., ddof=1)</code>.</p><pre class=\"code\"><code># Part a. Three different centres of one distribution.\n\ncl_gm = None                     # YOUR CODE: geometric mean of cl_i\ncl_cv_pct = None                 # YOUR CODE: exact CV as a percentage\ncl_mean = None                   # YOUR CODE: arithmetic mean\nmean_over_median = None          # YOUR CODE: arithmetic mean / median, observed\nmean_over_median_theory = None   # YOUR CODE: exp(OMEGA_CL ** 2 / 2)\n\nprint(&quot;typical clearance in the simulation: %.1f L/h&quot; % CL_POP)\nprint(&quot;geometric mean  : %r L/h&quot; % (cl_gm,))\nprint(&quot;arithmetic mean : %r L/h&quot; % (cl_mean,))\nprint(&quot;CV              : %r pct   (omega %.2f implies %.2f pct)&quot;\n      % (cl_cv_pct, OMEGA_CL, 100 * np.sqrt(np.exp(OMEGA_CL ** 2) - 1)))\nprint(&quot;mean / median   : %r observed, %r in theory&quot;\n      % (mean_over_median, mean_over_median_theory))</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. The exposure distribution</h2>\n<p>For a one compartment model with first order absorption, every subject's\nexposure follows from their own parameters without solving anything:</p>\n<pre><code>AUC(0 to infinity) = DOSE / CL\nk = CL / V\nTmax = ln(ka / k) / (ka - k)\nCmax = DOSE * ka / (V * (ka - k)) * (exp(-k * Tmax) - exp(-ka * Tmax))\n</code></pre>\n<p>The AUC result is the one worth remembering: for first order elimination the\ntotal exposure depends only on dose and clearance. Not on volume, not on\nabsorption rate. Volume and <code>ka</code> decide the shape of the curve, clearance\ndecides its area.</p>\n<p>Compute <code>auc_i</code> and <code>cmax_i</code>, both arrays of five hundred, then summarise the\nexposures:</p>\n<ul>\n<li><code>auc_gm</code>, the geometric mean AUC,</li>\n<li><code>auc_p5</code> and <code>auc_p95</code>, the 5th and 95th percentiles,</li>\n<li><code>fold_range</code>, the 95th divided by the 5th.</li>\n</ul>\n<p>What comes out:</p>\n<ul>\n<li>a geometric mean AUC of 23.82 mg*h/L, which is <code>DOSE / CL_POP</code> to three\n  figures, as it must be since the AUC is an exact function of clearance,</li>\n<li>a central ninety percent interval of 14.9 to 40.5 mg*h/L, a <strong>2.72 fold\n  range</strong>. That is the number a safety argument has to survive. The person at\n  the 95th percentile gets nearly three times the exposure of the person at the\n  5th, from the same tablet,</li>\n<li>a Cmax distribution that is visibly tighter than the AUC one, roughly two\n  fold against nearly three. Cmax depends on clearance only through <code>k</code>, which\n  is a ratio of two correlated quantities, so some of the variability cancels.</li>\n</ul>\n<p>The cell plots both distributions. Note that they are skewed, with a tail to\nthe right, which is what the lognormal parameters guarantee and the reason the\ninterval is not symmetric about the middle.</p>\n<p>Fill in <code>auc_i</code>, <code>cmax_i</code>, <code>auc_gm</code>, <code>auc_p5</code>, <code>auc_p95</code>, <code>fold_range</code>.</p>\n<p>Moves: elementwise arithmetic on arrays, <code>np.log</code>, <code>np.exp</code>,\n<code>np.percentile</code>.</p><pre class=\"code\"><code># Part b. From parameters to exposures.\n\nk_i = None       # YOUR CODE: elimination rate constant for each subject\nauc_i = None     # YOUR CODE: AUC from 0 to infinity for each subject\ntmax_i = None    # YOUR CODE: time of the peak for each subject\ncmax_i = None    # YOUR CODE: peak concentration for each subject\n\nauc_gm = None    # YOUR CODE: geometric mean AUC\nauc_p5 = None    # YOUR CODE: 5th percentile of AUC\nauc_p95 = None   # YOUR CODE: 95th percentile of AUC\nfold_range = None  # YOUR CODE: auc_p95 / auc_p5\n\nprint(&quot;AUC  geometric mean %r mg*h/L   (DOSE / CL_POP = %.4f)&quot; % (auc_gm, DOSE / CL_POP))\nprint(&quot;AUC  5th to 95th percentile: %r to %r mg*h/L&quot; % (auc_p5, auc_p95))\nprint(&quot;AUC  fold range: %r&quot; % (fold_range,))\nif cmax_i is not None:\n    _p = np.percentile(cmax_i, [5, 95])\n    print(&quot;Cmax 5th to 95th percentile: %.4f to %.4f mg/L, fold range %.4f&quot;\n          % (_p[0], _p[1], _p[1] / _p[0]))\n\nif auc_i is not None and cmax_i is not None:\n    fig, axes = plt.subplots(1, 2, figsize=(10, 4))\n    axes[0].hist(auc_i, bins=40, color=&quot;#1f4e79&quot;)\n    axes[0].set_xlabel(&quot;AUC (mg*h/L)&quot;)\n    axes[0].set_ylabel(&quot;subjects&quot;)\n    axes[1].hist(cmax_i, bins=40, color=&quot;#7f3f00&quot;)\n    axes[1].set_xlabel(&quot;Cmax (mg/L)&quot;)\n    for _ax, _x in zip(axes, (auc_i, cmax_i)):\n        for _q in np.percentile(_x, [5, 95]):\n            _ax.axvline(_q, ls=&quot;:&quot;, color=&quot;black&quot;)\n    fig.suptitle(&quot;W8D3 exposure distribution in 500 virtual subjects&quot;)\n    plt.show()</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. How well do you know the variability</h2>\n<p>You simulated with <code>OMEGA_CL = 0.30</code>, so the true CV is 30.69 percent. Now ask\nwhat a study would have told you.</p>\n<p>Simulate <code>N_STUDIES</code> studies of twelve subjects each, and <code>N_STUDIES</code> studies of\na hundred and twenty subjects each, drawing from the same lognormal. Estimate\nthe CV within each study with the same exact formula you used in part a, and\nlook at how much those estimates scatter.</p>\n<p>Do it like this, in this order, so that your numbers match the ones quoted\nbelow:</p>\n<pre><code>rng_c = np.random.default_rng(SEED_C)\ndraws_12 = rng_c.lognormal(0.0, OMEGA_CL, size=(N_STUDIES, 12))\ndraws_120 = rng_c.lognormal(0.0, OMEGA_CL, size=(N_STUDIES, 120))\n</code></pre>\n<p>Two draws, each one call, each a matrix with one row per study. Then take logs,\ncompute the variance <strong>along axis 1</strong> with <code>ddof=1</code>, and convert to a CV\npercentage. That gives <code>cv_hat_12</code> and <code>cv_hat_120</code>, each with <code>N_STUDIES</code>\nentries.</p>\n<p>Record the 2.5th and 97.5th percentiles of each: <code>cv12_lo</code>, <code>cv12_hi</code>,\n<code>cv120_lo</code>, <code>cv120_hi</code>.</p>\n<p>What you get, against a truth of 30.69 percent:</p>\n<table>\n<thead>\n<tr>\n<th>study size</th>\n<th>2.5th percentile</th>\n<th>97.5th percentile</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>12 subjects</td>\n<td>about 17 pct</td>\n<td>about 44 pct</td>\n</tr>\n<tr>\n<td>120 subjects</td>\n<td>about 27 pct</td>\n<td>about 35 pct</td>\n</tr>\n</tbody>\n</table>\n<p>With twelve subjects, the estimate is as likely as not to be wrong by a third\nin either direction. The interval is 27 percentage points wide, more than three\ntimes the width you get from a hundred and twenty, and the median estimate is\nalso slightly low, 29.4 against 30.69, because the variance of the logs is\nunbiased but its square root is not.</p>\n<p>Two things follow, both practical.</p>\n<p>First, do not compare a between subject CV from a twelve subject phase 1 study\nwith one from a large phase 3 population and conclude anything about the\npopulation having changed. The phase 1 number is barely an estimate.</p>\n<p>Second, this is the argument for mixed effects models over the two stage\napproach you used in week 6. They borrow information across subjects, so the\nvariability estimate uses all the data at once instead of being computed from\ntwelve separate numbers each with its own error.</p>\n<p>Fill in <code>cv_hat_12</code>, <code>cv_hat_120</code>, <code>cv12_lo</code>, <code>cv12_hi</code>, <code>cv120_lo</code>,\n<code>cv120_hi</code>.</p>\n<p>Moves: one <code>rng.lognormal</code> call per study size with a 2-D <code>size</code>,\n<code>np.var(..., axis=1, ddof=1)</code>, <code>np.percentile</code>.</p><pre class=\"code\"><code># Part c. The sampling distribution of a CV estimate.\n\nrng_c = np.random.default_rng(SEED_C)\n\ndraws_12 = None   # YOUR CODE: lognormal draws, shape (N_STUDIES, 12)\ndraws_120 = None  # YOUR CODE: lognormal draws, shape (N_STUDIES, 120)\n\ncv_hat_12 = None  # YOUR CODE: CV percentage estimated in each 12 subject study\ncv_hat_120 = None  # YOUR CODE: the same for the 120 subject studies\n\ncv12_lo = None    # YOUR CODE: 2.5th percentile of cv_hat_12\ncv12_hi = None    # YOUR CODE: 97.5th percentile of cv_hat_12\ncv120_lo = None   # YOUR CODE: 2.5th percentile of cv_hat_120\ncv120_hi = None   # YOUR CODE: 97.5th percentile of cv_hat_120\n\nprint(&quot;true CV: %.2f pct&quot; % (100 * np.sqrt(np.exp(OMEGA_CL ** 2) - 1)))\nprint(&quot;&quot;)\nprint(&quot; 12 subjects: 95 pct of estimates between %r and %r&quot; % (cv12_lo, cv12_hi))\nprint(&quot;120 subjects: 95 pct of estimates between %r and %r&quot; % (cv120_lo, cv120_hi))\nif cv_hat_12 is not None and cv_hat_120 is not None:\n    print(&quot;&quot;)\n    print(&quot;median estimate,  12 subjects: %.3f pct&quot; % np.median(cv_hat_12))\n    print(&quot;median estimate, 120 subjects: %.3f pct&quot; % np.median(cv_hat_120))\n    fig, ax = plt.subplots(figsize=(7, 4))\n    ax.hist(cv_hat_12, bins=50, alpha=0.6, label=&quot;studies of 12&quot;)\n    ax.hist(cv_hat_120, bins=50, alpha=0.6, label=&quot;studies of 120&quot;)\n    ax.axvline(100 * np.sqrt(np.exp(OMEGA_CL ** 2) - 1), color=&quot;black&quot;, ls=&quot;--&quot;,\n               label=&quot;truth&quot;)\n    ax.set_xlabel(&quot;estimated between subject CV (pct)&quot;)\n    ax.set_ylabel(&quot;studies&quot;)\n    ax.set_title(&quot;W8D3 what a study would have told you&quot;)\n    ax.legend()\n    plt.show()</code></pre>"
   }

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>add constant columns</td>\n<td><code>df.assign(EVID=1, MDV=1)</code></td>\n</tr>\n<tr>\n<td>a column from a condition</td>\n<td><code>np.where(df[\"CONC\"] &lt; LLOQ, 1, 0)</code></td>\n</tr>\n<tr>\n<td>stack two tables</td>\n<td><code>pd.concat([a, b], ignore_index=True)</code></td>\n</tr>\n<tr>\n<td>choose and order columns</td>\n<td><code>df[NM_COLS]</code></td>\n</tr>\n<tr>\n<td>sort, with one column descending</td>\n<td><code>df.sort_values([...], ascending=[True, True, False])</code></td>\n</tr>\n<tr>\n<td>renumber the index afterwards</td>\n<td><code>.reset_index(drop=True)</code></td>\n</tr>\n<tr>\n<td>rows per group</td>\n<td><code>df.groupby(\"ID\").size()</code></td>\n</tr>\n<tr>\n<td>the first row of each group</td>\n<td><code>df.groupby(\"ID\").first()</code></td>\n</tr>\n<tr>\n<td>is a series sorted</td>\n<td><code>s.is_monotonic_increasing</code></td>\n</tr>\n<tr>\n<td>a per group calculation returning several numbers</td>\n<td><code>df.groupby(\"ID\")[[\"TIME\", \"DV\"]].apply(fn)</code></td>\n</tr>\n<tr>\n<td>join a lookup table</td>\n<td><code>left.merge(right, on=\"ID\", validate=\"many_to_one\")</code></td>\n</tr>\n</tbody>\n</table>\n<p>The <code>groupby(\"ID\")[[\"TIME\", \"DV\"]].apply(fn)</code> form is the one to use. Selecting\nthe columns you need before <code>apply</code> keeps the group key out of the sub frame,\nwhich is what newer pandas wants and older pandas tolerates, so the same line\nworks everywhere.</p>",
