    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. The same derivative twice</h2>\n<p>Treat <code>C0</code> as settled and fit only the elimination rate constant. The model is</p>\n<pre><code>c_pred = C0 * exp(-k * t_obs)\n</code></pre>\n<p>and the loss is the sum of squared residuals, with the residual written in the\norder <code>c_pred - c_obs</code> so the sign of the gradient comes out the way the\nformula below says.</p>\n<p>Do it in this order.</p>\n<ol>\n<li>Make <code>k_a</code>, a float64 tensor holding <code>K_START</code>, with <code>requires_grad=True</code>.</li>\n<li>Compute the predictions, the residuals, and the loss. Record the loss as a\n   plain float in <code>loss_a</code>.</li>\n<li>Call <code>.backward()</code> on the loss and read <code>k_a.grad</code>. Record it as a plain\n   float in <code>grad_auto</code>.</li>\n<li>Now derive the same number yourself. By the chain rule,</li>\n</ol>\n<p><code>dL/dk = sum over samples of 2 * resid_i * d(c_pred_i)/dk</code></p>\n<p>and since <code>c_pred_i = C0 * exp(-k * t_i)</code>, the inner derivative is\n   <code>-t_i * c_pred_i</code>. Put those together, evaluate it, and record the result\n   as a plain float in <code>grad_manual</code>.</p>\n<p>The two should agree to every digit that prints, since they are the same\narithmetic in the same order. That is the point of the exercise: once you have\nseen autograd reproduce a derivative you worked out yourself, you can stop\nchecking and start trusting it, which is what makes the rest of the week\npossible.</p>\n<p>A detail worth noticing: the derivative you wrote by hand took real thought for\na two line model. For a two compartment model with a depot, absorption lag and\nbetween subject variability, nobody writes it by hand.</p>\n<p>Fill in <code>k_a</code>, <code>loss_a</code>, <code>grad_auto</code>, <code>grad_manual</code>.</p>\n<p>Moves: <code>requires_grad=True</code>, <code>torch.exp</code>, <code>.sum()</code>, <code>.backward()</code>, <code>.grad</code>,\n<code>.item()</code>.</p><pre class=\"code\"><code># Part a. One derivative, worked out twice.\n\nk_a = None          # YOUR CODE: float64 tensor holding K_START, requires_grad=True\n\nc_pred = None       # YOUR CODE: C0 * exp(-k_a * t_obs)\nresid = None        # YOUR CODE: c_pred - c_obs\nloss = None         # YOUR CODE: sum of squared residuals\n\nloss_a = None       # YOUR CODE: that loss as a plain float\n\n# YOUR CODE: call .backward() on the loss\n\ngrad_auto = None    # YOUR CODE: k_a.grad as a plain float\ngrad_manual = None  # YOUR CODE: the same derivative from the chain rule formula\n\nprint(&quot;loss at k = %.2f : %r&quot; % (K_START, loss_a))\nprint(&quot;dL/dk autograd  : %r&quot; % (grad_auto,))\nprint(&quot;dL/dk by hand   : %r&quot; % (grad_manual,))</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Two parameters, and the method you are replacing</h2>\n<p>Now let the volume float too, so the model is</p>\n<pre><code>c_pred = (DOSE / v) * exp(-k * t_obs)\n</code></pre>\n<p>with two unknowns starting at <code>V_START</code> and <code>K_START</code>. Keep the same loss and\nthe same residual direction, <code>c_pred - c_obs</code>.</p>\n<p>First the autograd route. Make two tracked float64 tensors, compute the loss,\nrecord it as a plain float in <code>loss_b</code>, call <code>.backward()</code> once, and read both\npartial derivatives out into <code>grad_v</code> and <code>grad_k</code>. Notice that one backward\npass filled in both.</p>\n<p>Then the finite difference route, which is what <code>curve_fit</code> was doing on your\nbehalf all along. For each parameter separately, evaluate the loss at the\nparameter plus <code>FD_STEP</code> and at the parameter minus <code>FD_STEP</code>, holding the\nother parameter fixed, and take</p>\n<pre><code>(loss_plus - loss_minus) / (2 * FD_STEP)\n</code></pre>\n<p>Record those in <code>fd_v</code> and <code>fd_k</code>. Do the finite difference evaluations with\nplain untracked tensors, or inside <code>with torch.no_grad():</code>. There is no reason\nto record history for a calculation you are not differentiating.</p>\n<p>The two routes should agree to about nine or ten significant digits here, and\nevery bit of the remaining disagreement belongs to the finite difference rather\nthan to autograd. Note the cost too: autograd needed one forward pass and one\nbackward pass. The finite difference needed four forward passes for two\nparameters, and would need forty for twenty.</p>\n<p>Note also that the two partial derivatives are not the same size. The volume\none is roughly sixteen times smaller, because one litre of volume and one per\nhour of rate constant are not comparable amounts of change. A factor of sixteen\nis harmless. In a model carrying a clearance in L/h, a volume in L and a lag\ntime in minutes, the same effect reaches factors of thousands, and an optimiser\nstepping on raw parameters has to cope with all of it. That is one reason PK\nfitting is usually done on log parameters.</p>\n<p>Fill in <code>loss_b</code>, <code>grad_v</code>, <code>grad_k</code>, <code>fd_v</code>, <code>fd_k</code>.</p>\n<p>Moves: two tracked tensors, one <code>.backward()</code>, <code>.grad.item()</code>,\n<code>torch.no_grad()</code>, a central difference.</p><pre class=\"code\"><code># Part b. A two parameter gradient, checked against finite differences.\n\nv_b = None       # YOUR CODE: float64 tensor holding V_START, requires_grad=True\nk_b = None       # YOUR CODE: float64 tensor holding K_START, requires_grad=True\n\n# YOUR CODE: predictions, residuals, loss, then one backward pass\n\nloss_b = None    # YOUR CODE: the loss at the starting guesses, as a plain float\ngrad_v = None    # YOUR CODE: dL/dV from autograd, as a plain float\ngrad_k = None    # YOUR CODE: dL/dk from autograd, as a plain float\n\n# YOUR CODE: the same two derivatives by central finite differences.\n# A small helper that takes v and k and returns the loss as a float will\n# save you writing the model four times.\n\nfd_v = None      # YOUR CODE: dL/dV by finite difference\nfd_k = None      # YOUR CODE: dL/dk by finite difference\n\nprint(&quot;loss at the starting guesses: %r&quot; % (loss_b,))\nprint(&quot;dL/dV  autograd %r  finite difference %r&quot; % (grad_v, fd_v))\nprint(&quot;dL/dk  autograd %r  finite difference %r&quot; % (grad_k, fd_k))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. The bookkeeping</h2>\n<p>Two facts about <code>backward()</code> cause most of the confusion in a first week of\ntorch, and the fastest way to stop being confused by them is to make each one\nhappen on purpose.</p>\n<p>The helper <code>sse_of(k)</code> is written for you in the cell below: it is the part a\nloss, as a function of <code>k</code>.</p>\n<p><strong>Fact one: gradients accumulate.</strong> Make <code>k_c</code>, a tracked float64 tensor at\n<code>K_START</code>. Call <code>sse_of(k_c).backward()</code> and record <code>k_c.grad</code> as a float in\n<code>grad_once</code>. Now do it again, exactly the same way, and record the new value of\n<code>k_c.grad</code> in <code>grad_twice</code>. You should find it has doubled, because <code>.grad</code> is\nadded to rather than replaced. Then clear it with <code>k_c.grad.zero_()</code>, run one\nmore backward pass, and record the result in <code>grad_after_zero</code>, which should\nmatch <code>grad_once</code>.</p>\n<p>In a fitting loop this is the difference between converging and marching off to\ninfinity on the second step, and the symptom, a loss that explodes after one\ngood iteration, points nowhere near the cause.</p>\n<p><strong>Fact two: the graph is freed when it is used.</strong> Make a separate tracked\ntensor <code>k_d</code>, compute <code>loss_d = sse_of(k_d)</code>, and call <code>loss_d.backward()</code>.\nThen call <code>loss_d.backward()</code> a second time on that same loss object inside a\n<code>try</code>, catch the <code>RuntimeError</code>, and set <code>second_backward_error</code> to True if it\nwas raised and False if it was not.</p>\n<p>Note what distinguishes the two cases. In fact one you recomputed the loss each\ntime, so there was a fresh graph each time and the gradients simply piled up.\nIn fact two you reused one loss object whose graph had already been consumed.\nRecomputing is cheap and is what a loop does naturally, so <code>retain_graph=True</code>\nis almost never the right answer to this error.</p>\n<p>Fill in <code>grad_once</code>, <code>grad_twice</code>, <code>grad_after_zero</code>, <code>second_backward_error</code>.</p>\n<p>Moves: <code>.backward()</code>, <code>.grad.zero_()</code>, <code>try</code> and <code>except RuntimeError</code>.</p><pre class=\"code\"><code># Part c. Gradient accumulation, and the freed graph.\n\ndef sse_of(k):\n    &quot;&quot;&quot;The part a loss, as a function of k. Written for you.&quot;&quot;&quot;\n    pred = C0 * torch.exp(-k * t_obs)\n    return ((pred - c_obs) ** 2).sum()\n\n\nk_c = None                   # YOUR CODE: float64 tensor at K_START, requires_grad=True\n\ngrad_once = None             # YOUR CODE: k_c.grad as a float after ONE backward pass\ngrad_twice = None            # YOUR CODE: k_c.grad as a float after a SECOND backward pass\ngrad_after_zero = None       # YOUR CODE: k_c.grad as a float after zero_() then one more\n\nk_d = None                   # YOUR CODE: a fresh tracked tensor at K_START\nsecond_backward_error = None # YOUR CODE: True if a second backward() on the SAME\n                             #            loss object raises RuntimeError, else False\n\nprint(&quot;after one backward   : %r&quot; % (grad_once,))\nprint(&quot;after two backwards  : %r&quot; % (grad_twice,))\nprint(&quot;after zero_() and one: %r&quot; % (grad_after_zero,))\nprint(&quot;second backward on one loss raised RuntimeError:&quot;, second_backward_error)</code></pre>"
   }
  ]

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>clear a gradient</td>\n<td><code>p.grad = None</code>, or <code>p.grad.zero_()</code> if it exists</td>\n</tr>\n<tr>\n<td>step downhill</td>\n<td><code>with torch.no_grad(): p -= lr * p.grad</code></td>\n</tr>\n<tr>\n<td>read a tracked tensor as a float</td>\n<td><code>p.item()</code>, or <code>torch.exp(p).item()</code></td>\n</tr>\n<tr>\n<td>fit on a log parameter</td>\n<td>carry <code>log_v</code>, use <code>torch.exp(log_v)</code> in the model</td>\n</tr>\n<tr>\n<td>record a trace</td>\n<td>append <code>loss.item()</code> to a list each iteration</td>\n</tr>\n<tr>\n<td>find the first True in a boolean array</td>\n<td><code>np.argmax(flags)</code></td>\n</tr>\n<tr>\n<td>is anything not a number</td>\n<td><code>np.isnan(arr)</code>, <code>np.isfinite(arr)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>p.grad = None</code> and <code>p.grad.zero_()</code> both clear the gradient. The difference\nonly matters on the very first iteration, where <code>.grad</code> does not exist yet and\n<code>zero_()</code> would fail on <code>None</code>. Setting it to <code>None</code> always works, which is why\nthe loops below do that.</p>",

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>You have a loss and you have its gradient. An optimiser is what turns those\ntwo things into a parameter estimate, and the simplest one that works is four\nlines long.</p>\n<p>Writing it yourself once is worth more than reading about it ten times,\nbecause every failure mode of every fitting tool you will ever use in this\nfield is visible in those four lines. A fit that will not move, a fit that\nexplodes, a fit that reports convergence while sitting on nonsense: all three\nshow up today, on a dataset you can see all of.</p>\n<p>The subject is the same one as yesterday, so the loss and its gradient are\nnumbers you already recognise.</p>"

   {
    "key": "concept",
    "label": "The loop, and the three things that go wrong",
    "html": "<h2>The loop, and the three things that go wrong</h2>\n<p><strong>The loop.</strong> Gradient descent says: the gradient points uphill, so step the\nother way.</p>\n<pre><code>for i in range(n_iter):\n    p.grad = None                 # or p.grad.zero_()\n    loss = model_loss(p)          # forward\n    loss.backward()               # gradients\n    with torch.no_grad():\n        p -= lr * p.grad          # step downhill\n</code></pre>\n<p>Four lines, and three of them are bookkeeping. Note the <code>no_grad()</code> around the\nupdate. Without it torch refuses, with the message <em>a leaf Variable that\nrequires grad is being used in an in-place operation</em>, because you are\nmodifying a tensor whose history it is tracking. The update is not part of the\nmodel, so it should not be recorded.</p>\n<p><strong>Problem one: the learning rate.</strong> The gradient tells you the direction, not\nhow far to go. Too small and you crawl. Too large and you step past the\nminimum to a point that is worse than where you started, and the next step is\nlarger still. There is no universal right answer, which is why every deep\nlearning paper reports its learning rate.</p>\n<p><strong>Problem two: the parameters are not on the same scale.</strong> You saw yesterday\nthat the volume gradient and the rate gradient differ by a factor of sixteen.\nOne learning rate has to serve both, so it ends up too big for one and too\nsmall for the other.</p>\n<p>The standard fix in PK is to fit on <strong>log parameters</strong>. Instead of carrying <code>V</code>\naround, carry <code>log V</code> and use <code>exp(log V)</code> in the model. Three things improve\nat once: a fixed step in log space is a fixed <em>percentage</em> change, so the\nscales stop mattering; the parameter cannot go negative, which a volume must\nnot do; and the loss surface for exponential models becomes a great deal more\npleasant. The cost is that you have to remember to exponentiate at the end.</p>\n<p><strong>Problem three: divergence that looks like convergence.</strong> A diverging fit does\nnot always announce itself with a NaN. Push the learning rate up and the\nparameters can run off to absurd values where the model predicts essentially\nzero at every time point. The loss then settles on the sum of the squared\nobservations and stops changing, so a convergence criterion based on \"the loss\nstopped moving\" is satisfied. You will have a converged fit, a flat loss trace,\nand a volume of distribution of fourteen million litres.</p>\n<p>The lesson is the one habit worth taking from today: <strong>always look at the\nparameter estimates, not just the loss.</strong></p>"
   },

    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>one step downhill, and one step too far</td>\n<td><code>loss_before</code>, <code>loss_after_small</code>, <code>loss_after_big</code>, <code>inplace_error</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>the whole loop, on log parameters, checked against scipy</td>\n<td><code>loss_hist</code>, <code>v_hat</code>, <code>k_hat</code>, <code>v_scipy</code>, <code>k_scipy</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>divergence dressed up as convergence</td>\n<td><code>loss_big</code>, <code>v_big</code>, <code>zero_model_loss</code>, <code>first_nan_index</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport torch\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import curve_fit\n\nPROBLEM_ID = &quot;W6D3&quot;\nTOPIC = &quot;PyTorch: the fitting loop, learning rate, log parameters, divergence&quot;\n\ntorch.manual_seed(0)\nrng = np.random.default_rng(6202)\n\n# The same subject as yesterday: 100 mg IV bolus, sampled over a day.\nDOSE = 100.0                 # mg\nV_TRUE = 35.0                # L, not known to the fit\nK_TRUE = 0.12                # per h, not known to the fit\n\n_t = np.array([0.5, 1.0, 2.0, 4.0, 6.0, 8.0, 12.0, 18.0, 24.0])\n_c = (DOSE / V_TRUE) * np.exp(-K_TRUE * _t)\n_c = np.round(_c * rng.lognormal(0.0, 0.07, size=_t.size), 4)\n\nt_obs = torch.tensor(_t, dtype=torch.float64)\nc_obs = torch.tensor(_c, dtype=torch.float64)\n\n# Starting guesses, the same as yesterday.\nV_START = 30.0               # L\nK_START = 0.15               # per h\n\n# Learning rates and iteration counts, all fixed so that everyone sees the\n# same thing. Part a steps once on the raw parameters.\nLR_SMALL = 1e-3\nLR_BIG = 1e-2\n\n# Part b runs the loop on log parameters.\nLR = 0.01\nN_ITER = 500\n\n# Part c pushes the learning rate until it breaks.\nLR_TOO_BIG = 0.1\nN_TOO_BIG = 300\nLR_HUGE = 0.5\nN_HUGE = 20\n\nprint(&quot;t_obs:&quot;, t_obs)\nprint(&quot;c_obs:&quot;, c_obs)\nprint(&quot;&quot;)\nprint(&quot;starting guesses: V = %.1f L, k = %.2f per h&quot; % (V_START, K_START))\nprint(&quot;part a learning rates: %g and %g&quot; % (LR_SMALL, LR_BIG))\nprint(&quot;part b: lr %g for %d iterations on log parameters&quot; % (LR, N_ITER))\nprint(&quot;part c: lr %g for %d, then lr %g for %d&quot; % (LR_TOO_BIG, N_TOO_BIG, LR_HUGE, N_HUGE))</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>clear a gradient</td>\n<td><code>p.grad = None</code>, or <code>p.grad.zero_()</code> if it exists</td>\n</tr>\n<tr>\n<td>step downhill</td>\n<td><code>with torch.no_grad(): p -= lr * p.grad</code></td>\n</tr>\n<tr>\n<td>read a tracked tensor as a float</td>\n<td><code>p.item()</code>, or <code>torch.exp(p).item()</code></td>\n</tr>\n<tr>\n<td>fit on a log parameter</td>\n<td>carry <code>log_v</code>, use <code>torch.exp(log_v)</code> in the model</td>\n</tr>\n<tr>\n<td>record a trace</td>\n<td>append <code>loss.item()</code> to a list each iteration</td>\n</tr>\n<tr>\n<td>find the first True in a boolean array</td>\n<td><code>np.argmax(flags)</code></td>\n</tr>\n<tr>\n<td>is anything not a number</td>\n<td><code>np.isnan(arr)</code>, <code>np.isfinite(arr)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>p.grad = None</code> and <code>p.grad.zero_()</code> both clear the gradient. The difference\nonly matters on the very first iteration, where <code>.grad</code> does not exist yet and\n<code>zero_()</code> would fail on <code>None</code>. Setting it to <code>None</code> always works, which is why\nthe loops below do that.</p><pre class=\"code\"><code>import numpy as np\nimport torch\n\nprint(&quot;--- 1. the four line loop, on a function whose answer you know ---&quot;)\n# Minimise f(x) = (x - 4) ** 2, whose minimum is obviously at x = 4.\ndemo_x = torch.tensor(0.0, dtype=torch.float64, requires_grad=True)\nfor demo_i in range(25):\n    demo_x.grad = None\n    demo_loss = (demo_x - 4.0) ** 2\n    demo_loss.backward()\n    with torch.no_grad():\n        demo_x -= 0.1 * demo_x.grad\n    if demo_i in (0, 1, 2, 24):\n        print(&quot;iter %2d  x = %.6f  loss = %.6f&quot; % (demo_i + 1, demo_x.item(), demo_loss.item()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. without no_grad, torch refuses the update ---&quot;)\ndemo_y = torch.tensor(0.0, dtype=torch.float64, requires_grad=True)\n((demo_y - 4.0) ** 2).backward()\ntry:\n    demo_y -= 0.1 * demo_y.grad\nexcept RuntimeError as err:\n    print(&quot;RuntimeError:&quot;, str(err)[:80])\nprint(&quot;the update is bookkeeping, not model arithmetic, so it should not be recorded&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the learning rate decides everything ---&quot;)\nfor demo_lr in (0.01, 0.5, 1.01):\n    demo_z = torch.tensor(0.0, dtype=torch.float64, requires_grad=True)\n    demo_trace = []\n    for _ in range(30):\n        demo_z.grad = None\n        demo_l = (demo_z - 4.0) ** 2\n        demo_l.backward()\n        with torch.no_grad():\n            demo_z -= demo_lr * demo_z.grad\n        demo_trace.append(demo_l.item())\n    print(&quot;lr %-5g  x after 30 steps %14.4f  loss %12.4g&quot; % (demo_lr, demo_z.item(), demo_trace[-1]))\nprint(&quot;too small and it crawls, just right and it lands, too large and it leaves&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. a log parameter, so a step is a percentage ---&quot;)\ndemo_log_p = torch.tensor(np.log(2.0), dtype=torch.float64, requires_grad=True)\nprint(&quot;p starts at %.4f&quot; % torch.exp(demo_log_p).item())\nwith torch.no_grad():\n    demo_log_p -= 0.05\nprint(&quot;after subtracting 0.05 from log p, p = %.4f, a change of %.2f pct&quot;\n      % (torch.exp(demo_log_p).item(), 100.0 * (np.exp(-0.05) - 1.0)))\nprint(&quot;the same 0.05 step on a parameter of 2000 would also move it 4.88 pct&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. finding the first True in a boolean array ---&quot;)\ndemo_vals = np.array([1.0, 2.0, np.nan, 4.0])\nprint(&quot;values      :&quot;, demo_vals)\nprint(&quot;isnan       :&quot;, np.isnan(demo_vals))\nprint(&quot;first NaN at:&quot;, int(np.argmax(np.isnan(demo_vals))), &quot;(a 0 based index)&quot;)\nprint(&quot;careful: argmax returns 0 when nothing is True, so check .any() as well&quot;)\nprint(&quot;any NaN     :&quot;, bool(np.isnan(demo_vals).any()))</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. One step, twice</h2>\n<p>The model and loss are yesterday's, with both parameters free:</p>\n<pre><code>c_pred = (DOSE / v) * exp(-k * t_obs)\nloss = ((c_pred - c_obs) ** 2).sum()\n</code></pre>\n<p>Take exactly one gradient descent step on the raw parameters, from <code>V_START</code>\nand <code>K_START</code>, with learning rate <code>LR_SMALL</code>. Record the loss before the step\nin <code>loss_before</code> and the loss after it in <code>loss_after_small</code>. Both as plain\nfloats.</p>\n<p>Then start over from fresh tensors at the same starting values and take one\nstep with <code>LR_BIG</code>, which is ten times larger. Record that loss in\n<code>loss_after_big</code>.</p>\n<p>The small step improves the fit. The big one makes it worse, from the identical\nstarting point, using the identical gradient. The gradient told you the\ndirection and nothing at all about the distance, and ten times too far is past\nthe bottom and up the other side.</p>\n<p>Finally, provoke the error that everybody meets on their first loop. With a\ntracked tensor whose <code>.grad</code> is filled in, try <code>v -= LR_SMALL * v.grad</code>\n<strong>outside</strong> any <code>no_grad()</code> block, inside a <code>try</code>. Catch the <code>RuntimeError</code> and\nset <code>inplace_error</code> to True if it was raised, False if it was not.</p>\n<p>Fill in <code>loss_before</code>, <code>loss_after_small</code>, <code>loss_after_big</code>, <code>inplace_error</code>.</p>\n<p>Moves: <code>.backward()</code>, <code>with torch.no_grad():</code>, an in place update,\n<code>try</code> and <code>except RuntimeError</code>.</p><pre class=\"code\"><code># Part a. One step with a sensible learning rate, one step with a reckless one.\n\nv1 = None            # YOUR CODE: float64 tensor at V_START, requires_grad=True\nk1 = None            # YOUR CODE: float64 tensor at K_START, requires_grad=True\n\nloss_before = None   # YOUR CODE: the loss at the starting guesses, as a float\n\n# YOUR CODE: backward, then one step of size LR_SMALL inside torch.no_grad()\n\nloss_after_small = None  # YOUR CODE: the loss after that step, as a float\n\n# YOUR CODE: fresh tensors at the same starting values, one step of size LR_BIG\n\nloss_after_big = None    # YOUR CODE: the loss after the big step, as a float\n\ninplace_error = None     # YOUR CODE: True if an in place update outside\n                         #            no_grad() raises RuntimeError, else False\n\nprint(&quot;loss before            : %r&quot; % (loss_before,))\nprint(&quot;after one step of %-6s: %r&quot; % (LR_SMALL, loss_after_small))\nprint(&quot;after one step of %-6s: %r&quot; % (LR_BIG, loss_after_big))\nprint(&quot;in place update outside no_grad raises RuntimeError:&quot;, inplace_error)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. The loop, on log parameters, checked against scipy</h2>\n<p>Now run the fit properly, and on log parameters so that one learning rate can\nserve both.</p>\n<p>Make <code>log_v</code> and <code>log_k</code>, tracked float64 tensors holding <code>np.log(V_START)</code> and\n<code>np.log(K_START)</code>. Then loop <code>N_ITER</code> times. Each iteration:</p>\n<ol>\n<li>clear both gradients with <code>log_v.grad = None</code> and the same for <code>log_k</code>,</li>\n<li>build the predictions using <code>torch.exp(log_v)</code> and <code>torch.exp(log_k)</code> in\n   place of the parameters,</li>\n<li>compute the summed squared residuals,</li>\n<li><code>backward()</code>,</li>\n<li>step both parameters downhill by <code>LR</code> inside <code>torch.no_grad()</code>,</li>\n<li>append <code>loss.item()</code> to <code>loss_hist</code>.</li>\n</ol>\n<p>Append the loss <strong>before</strong> the update, which is the loss of the parameters you\njust evaluated. That makes <code>loss_hist[0]</code> the starting loss, so it should equal\nyour <code>loss_before</code> from part a.</p>\n<p>Afterwards put the parameters back on their natural scale into <code>v_hat</code> and\n<code>k_hat</code>, as plain floats.</p>\n<p>Then check your work against a tool you already trust. Fit the same model to\nthe same data with <code>scipy.optimize.curve_fit</code>, starting from the same guesses,\nand record its estimates in <code>v_scipy</code> and <code>k_scipy</code>.</p>\n<p>The two should agree to seven or eight significant figures. Yours is a loop you wrote\nin six lines; <code>curve_fit</code> is Levenberg-Marquardt with numerical derivatives and\ndecades of hardening. On a problem this small they find the same answer, which\nis the reassurance you need before trusting the loop on a problem where you\ncannot check.</p>\n<p>Look at the trace too. The loss falls steeply for the first twenty iterations,\nis within one percent of its final value by about iteration sixty-four, and\nfrom roughly iteration three hundred and forty onward it only jitters in the\nfifteenth decimal place, which is floating point noise rather than progress.\nFour hundred of your five hundred iterations bought you nothing, and that is\nnormal.</p>\n<p>Fill in <code>loss_hist</code>, <code>v_hat</code>, <code>k_hat</code>, <code>v_scipy</code>, <code>k_scipy</code>.</p>\n<p>Moves: the loop, <code>torch.exp</code>, <code>.grad = None</code>, <code>torch.no_grad()</code>, <code>.item()</code>,\n<code>curve_fit</code>.</p><pre class=\"code\"><code># Part b. The whole fit, on log parameters.\n\nlog_v = None     # YOUR CODE: tracked float64 tensor at np.log(V_START)\nlog_k = None     # YOUR CODE: tracked float64 tensor at np.log(K_START)\n\nloss_hist = []   # YOUR CODE: fill this with one loss per iteration\n\n# YOUR CODE: the loop, N_ITER iterations\n\nv_hat = None     # YOUR CODE: exp(log_v) as a plain float\nk_hat = None     # YOUR CODE: exp(log_k) as a plain float\n\n\ndef model(t, v, k):\n    &quot;&quot;&quot;The same model, for curve_fit, in plain numpy.&quot;&quot;&quot;\n    return (DOSE / v) * np.exp(-k * t)\n\n\nv_scipy = None   # YOUR CODE: curve_fit estimate of V, from the same p0\nk_scipy = None   # YOUR CODE: curve_fit estimate of k\n\nprint(&quot;hand written descent: V = %r  k = %r&quot; % (v_hat, k_hat))\nprint(&quot;curve_fit           : V = %r  k = %r&quot; % (v_scipy, k_scipy))\nif loss_hist:\n    print(&quot;&quot;)\n    for _i in (1, 2, 5, 10, 50, 100, N_ITER):\n        print(&quot;iter %3d  loss %.8f&quot; % (_i, loss_hist[_i - 1]))\n    fig, ax = plt.subplots(figsize=(6, 4))\n    ax.plot(range(1, len(loss_hist) + 1), loss_hist)\n    ax.set_yscale(&quot;log&quot;)\n    ax.set_xlabel(&quot;iteration&quot;)\n    ax.set_ylabel(&quot;sum of squared residuals&quot;)\n    ax.set_title(&quot;W6D3 gradient descent trace&quot;)\n    plt.show()</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Divergence dressed up as convergence</h2>\n<p>Run the same log parameter loop again, unchanged except for the learning rate,\nwith <code>LR_TOO_BIG</code> for <code>N_TOO_BIG</code> iterations. Record the final loss in\n<code>loss_big</code> and the final <code>exp(log_v)</code> in <code>v_big</code>, both as plain floats.</p>\n<p>Look at what you get. The loss is flat to ten decimal places over the last\nfifty iterations, which any sensible stopping rule would call convergence. The\nvolume is in the millions of litres.</p>\n<p>To show what has happened, compute <code>zero_model_loss</code>, the loss of a model that\npredicts exactly zero at every time point. That is just the sum of the squared\nobservations, and you do not need a model to work it out. Compare it with\n<code>loss_big</code>: they agree to about one part in ten million. The optimiser has not\nconverged on a fit. It has run the volume off to infinity, where the predicted\nconcentration is zero everywhere, and parked on the flattest part of the\nsurface it could find.</p>\n<p>This is the thing to take away from the week. A loss that stops moving is not\nevidence of a fit. The number that would have told you immediately is the\nvolume of distribution, and the plot that would have told you immediately is\npredicted against observed.</p>\n<p>Then push harder. Run the loop with <code>LR_HUGE</code> for <code>N_HUGE</code> iterations,\nappending every loss including the ones that are not finite, and record in\n<code>first_nan_index</code> the position of the first NaN in that list, as the 0 based\nindex that <code>np.argmax(np.isnan(...))</code> gives you. It arrives within the first\nhandful of iterations. This failure is the kind you want, because it is loud.</p>\n<p>Fill in <code>loss_big</code>, <code>v_big</code>, <code>zero_model_loss</code>, <code>first_nan_index</code>.</p>\n<p>Moves: the same loop with a different learning rate, <code>np.isnan</code>, <code>np.argmax</code>.</p><pre class=\"code\"><code># Part c. A learning rate too large, then one far too large.\n\nloss_big = None         # YOUR CODE: final loss after N_TOO_BIG iterations at LR_TOO_BIG\nv_big = None            # YOUR CODE: exp(log_v) at the end of that run, as a float\n\nzero_model_loss = None  # YOUR CODE: the loss of predicting zero everywhere\n\nloss_hist_huge = []     # YOUR CODE: N_HUGE losses at LR_HUGE, NaNs included\nfirst_nan_index = None  # YOUR CODE: 0 based position of the first NaN in it\n\nprint(&quot;at lr %g after %d iterations:&quot; % (LR_TOO_BIG, N_TOO_BIG))\nprint(&quot;  loss  : %r&quot; % (loss_big,))\nprint(&quot;  V     : %r L&quot; % (v_big,))\nprint(&quot;  loss of predicting zero everywhere: %r&quot; % (zero_model_loss,))\nprint(&quot;&quot;)\nprint(&quot;at lr %g the loss trace starts:&quot; % LR_HUGE)\nprint(&quot; &quot;, [&quot;%.4g&quot; % _x for _x in loss_hist_huge[:8]])\nprint(&quot;  first NaN at index:&quot;, first_nan_index)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Yesterday's loop works, but it has two parameters loose in the global\nnamespace, and every line of it mentions them by name. Add a third parameter\nand you edit the loop in four places. Add between subject variability and the\nwhole thing becomes unmanageable.</p>\n<p>PyTorch's answer is to put the parameters inside the model, where they belong,\nand to put the update rule inside an optimiser object. What is left is a\ntraining loop of five lines that never changes again, no matter how big the\nmodel gets. You will see that exact loop in every PyTorch tutorial, every\nrepository and every paper's code, so it is worth writing once with your own\nhands on a model you understand completely.</p>\n<p>Same subject, same model, same answer. Different machinery.</p>"

   {
    "key": "concept",
    "label": "nn.Module, nn.Parameter, and the five line loop",
    "html": "<h2>nn.Module, nn.Parameter, and the five line loop</h2>\n<p><strong><code>nn.Module</code> is a container that knows what its parameters are.</strong> You subclass\nit, create your parameters in <code>__init__</code>, and define <code>forward</code>, which is the\narithmetic that turns inputs into predictions.</p>\n<pre><code>class OneCompartmentIV(torch.nn.Module):\n    def __init__(self, v_init, k_init):\n        super().__init__()\n        self.log_v = torch.nn.Parameter(torch.tensor(np.log(v_init), dtype=torch.float64))\n        self.log_k = torch.nn.Parameter(torch.tensor(np.log(k_init), dtype=torch.float64))\n\n    def forward(self, t):\n        v = torch.exp(self.log_v)\n        k = torch.exp(self.log_k)\n        return (DOSE / v) * torch.exp(-k * t)\n</code></pre>\n<p>Three things to notice.</p>\n<p><code>super().__init__()</code> comes first. Skip it and torch raises an error about\ncalling <code>__init__</code> before assigning parameters, because the bookkeeping\ndictionary it needs does not exist yet.</p>\n<p><strong><code>nn.Parameter</code> is a tensor that announces itself.</strong> It is an ordinary tensor\nwith <code>requires_grad=True</code> set for you, plus one extra property: assigning one\nto an attribute of a Module registers it, so that <code>model.parameters()</code> can find\nit later. A plain tensor assigned to <code>self.something</code> is invisible to the\noptimiser, which is a silent failure worth knowing about: the fit runs, and\nthat parameter never moves.</p>\n<p><strong>You call the model, not <code>forward</code>.</strong> <code>model(t)</code> runs <code>forward</code> plus the hooks\nthat torch wraps around it. Calling <code>model.forward(t)</code> directly works today and\nwill quietly break something eventually.</p>\n<p><strong>The loop.</strong></p>\n<pre><code>optimiser = torch.optim.Adam(model.parameters(), lr=0.05)\nfor i in range(n_iter):\n    optimiser.zero_grad()            # clear last iteration's gradients\n    loss = ((model(t_obs) - c_obs) ** 2).sum()\n    loss.backward()                  # fill in every parameter's .grad\n    optimiser.step()                 # apply the update rule\n</code></pre>\n<p><code>zero_grad()</code> replaces the <code>p.grad = None</code> you were writing by hand, for every\nparameter at once. <code>step()</code> replaces the <code>with torch.no_grad(): p -= lr *\np.grad</code> block, also for every parameter at once. The optimiser was handed\n<code>model.parameters()</code>, so it knows what to clear and what to step.</p>\n<p><strong>The optimisers.</strong> <code>torch.optim.SGD(params, lr=lr)</code> with nothing else set is\nexactly yesterday's loop, line for line. <code>torch.optim.Adam</code> keeps a running\nestimate of the size of each parameter's recent gradients and divides by it, so\nevery parameter gets its own effective step size, adapted as it goes. That is\nprecisely the problem log parameters were invented to work around, which is why\nAdam makes the badly scaled version survivable too, and why it is the default\nchoice when you have no reason to prefer another.</p>\n<p>Today you fit the same model with both at the same learning rate. One lands on\nthe answer; the other does not.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport torch\nimport matplotlib.pyplot as plt\n\nPROBLEM_ID = &quot;W6D4&quot;\nTOPIC = &quot;PyTorch: nn.Module, nn.Parameter, torch.optim, Adam against plain SGD&quot;\n\ntorch.manual_seed(0)\nrng = np.random.default_rng(6202)\n\n# The same subject as the last two days: 100 mg IV bolus, sampled over a day.\nDOSE = 100.0                 # mg\nV_TRUE = 35.0                # L, not known to the fit\nK_TRUE = 0.12                # per h, not known to the fit\n\n_t = np.array([0.5, 1.0, 2.0, 4.0, 6.0, 8.0, 12.0, 18.0, 24.0])\n_c = (DOSE / V_TRUE) * np.exp(-K_TRUE * _t)\n_c = np.round(_c * rng.lognormal(0.0, 0.07, size=_t.size), 4)\n\nt_obs = torch.tensor(_t, dtype=torch.float64)\nc_obs = torch.tensor(_c, dtype=torch.float64)\n\nV_START = 30.0               # L\nK_START = 0.15               # per h\n\n# One learning rate, used for both optimisers, so the comparison is fair.\nLR = 0.05\nN_ITER = 500\n\n# A fine grid for plotting the fitted curve.\nt_grid = torch.linspace(0.25, 24.0, 96, dtype=torch.float64)\n\nprint(&quot;t_obs:&quot;, t_obs)\nprint(&quot;c_obs:&quot;, c_obs)\nprint(&quot;&quot;)\nprint(&quot;starting guesses: V = %.1f L, k = %.2f per h&quot; % (V_START, K_START))\nprint(&quot;both optimisers get lr = %g and %d iterations&quot; % (LR, N_ITER))</code></pre>"

   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>start a model</td>\n<td><code>class M(torch.nn.Module):</code> then <code>def __init__</code> and <code>def forward</code></td>\n</tr>\n<tr>\n<td>the first line of <code>__init__</code></td>\n<td><code>super().__init__()</code></td>\n</tr>\n<tr>\n<td>make a fittable parameter</td>\n<td><code>torch.nn.Parameter(torch.tensor(x, dtype=torch.float64))</code></td>\n</tr>\n<tr>\n<td>list the parameters</td>\n<td><code>list(model.parameters())</code></td>\n</tr>\n<tr>\n<td>list them with names</td>\n<td><code>model.named_parameters()</code></td>\n</tr>\n<tr>\n<td>predict</td>\n<td><code>model(t)</code>, never <code>model.forward(t)</code></td>\n</tr>\n<tr>\n<td>build an optimiser</td>\n<td><code>torch.optim.Adam(model.parameters(), lr=LR)</code></td>\n</tr>\n<tr>\n<td>clear all gradients</td>\n<td><code>optimiser.zero_grad()</code></td>\n</tr>\n<tr>\n<td>apply the update</td>\n<td><code>optimiser.step()</code></td>\n</tr>\n<tr>\n<td>save the fitted values</td>\n<td><code>model.state_dict()</code></td>\n</tr>\n<tr>\n<td>predict without recording</td>\n<td><code>with torch.no_grad(): model(t_grid)</code></td>\n</tr>\n</tbody>\n</table>\n<p>The demo below fits a straight line, so that the only new things on screen are\nthe Module and the optimiser.</p><pre class=\"code\"><code>import numpy as np\nimport torch\n\nprint(&quot;--- 1. a Module with two parameters ---&quot;)\n\n\nclass DemoLine(torch.nn.Module):\n    &quot;&quot;&quot;y = a * x + b. Nothing here is the answer to the problem.&quot;&quot;&quot;\n\n    def __init__(self, a_init, b_init):\n        super().__init__()\n        self.a = torch.nn.Parameter(torch.tensor(a_init, dtype=torch.float64))\n        self.b = torch.nn.Parameter(torch.tensor(b_init, dtype=torch.float64))\n\n    def forward(self, x):\n        return self.a * x + self.b\n\n\ndemo_line = DemoLine(0.0, 0.0)\nprint(&quot;parameters      :&quot;, [p.item() for p in demo_line.parameters()])\nprint(&quot;named           :&quot;, [(n, p.item()) for n, p in demo_line.named_parameters()])\nprint(&quot;requires_grad   :&quot;, [p.requires_grad for p in demo_line.parameters()])\nprint(&quot;state_dict keys :&quot;, list(demo_line.state_dict().keys()))\nprint(&quot;nn.Parameter sets requires_grad for you, and registers itself with the Module&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. a plain tensor attribute is INVISIBLE to the optimiser ---&quot;)\n\n\nclass DemoBroken(torch.nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.good = torch.nn.Parameter(torch.tensor(1.0, dtype=torch.float64))\n        self.bad = torch.tensor(1.0, dtype=torch.float64, requires_grad=True)\n\n    def forward(self, x):\n        return self.good * x + self.bad\n\n\ndemo_broken = DemoBroken()\nprint(&quot;parameters found:&quot;, [n for n, _ in demo_broken.named_parameters()])\nprint(&quot;`bad` tracks gradients but is not registered, so no optimiser will ever move it&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the five line loop ---&quot;)\ndemo_x = torch.tensor([0.0, 1.0, 2.0, 3.0, 4.0], dtype=torch.float64)\ndemo_y = 2.5 * demo_x + 1.0          # the answer is a = 2.5, b = 1.0\ndemo_model = DemoLine(0.0, 0.0)\ndemo_opt = torch.optim.Adam(demo_model.parameters(), lr=0.1)\nfor demo_i in range(800):\n    demo_opt.zero_grad()\n    demo_loss = ((demo_model(demo_x) - demo_y) ** 2).sum()\n    demo_loss.backward()\n    demo_opt.step()\nprint(&quot;fitted a = %.6f (true 2.5), b = %.6f (true 1.0)&quot;\n      % (demo_model.a.item(), demo_model.b.item()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. optim.SGD with nothing set is the loop you wrote yesterday ---&quot;)\n# By hand.\ndemo_p = torch.tensor(0.0, dtype=torch.float64, requires_grad=True)\nfor _ in range(25):\n    demo_p.grad = None\n    demo_l = (demo_p - 4.0) ** 2\n    demo_l.backward()\n    with torch.no_grad():\n        demo_p -= 0.1 * demo_p.grad\n# With an optimiser.\ndemo_q = torch.tensor(0.0, dtype=torch.float64, requires_grad=True)\ndemo_sgd = torch.optim.SGD([demo_q], lr=0.1)\nfor _ in range(25):\n    demo_sgd.zero_grad()\n    demo_l2 = (demo_q - 4.0) ** 2\n    demo_l2.backward()\n    demo_sgd.step()\nprint(&quot;by hand   : %.15f&quot; % demo_p.item())\nprint(&quot;optim.SGD : %.15f&quot; % demo_q.item())\nprint(&quot;identical :&quot;, demo_p.item() == demo_q.item())\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. predicting afterwards, without recording ---&quot;)\nwith torch.no_grad():\n    demo_pred = demo_model(torch.tensor([10.0], dtype=torch.float64))\nprint(&quot;prediction at x = 10:&quot;, demo_pred.item(), &quot; grad_fn:&quot;, demo_pred.grad_fn)</code></pre>"

   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. The model as a Module</h2>\n<p>Fill in the class below. Two parameters, named exactly <code>log_v</code> and <code>log_k</code> so\nthat the check can find them, each an <code>nn.Parameter</code> holding the log of the\nstarting value as a float64 tensor. <code>forward</code> exponentiates them and returns</p>\n<pre><code>(DOSE / v) * exp(-k * t)\n</code></pre>\n<p>Then make one instance at the starting guesses and inspect it, which is how you\nconfirm a model is wired up before wasting an hour on a fit that cannot move.</p>\n<ul>\n<li><code>n_params</code>, how many entries <code>list(model0.parameters())</code> has,</li>\n<li><code>param_names</code>, the parameter names from <code>model0.named_parameters()</code>, sorted\n  alphabetically, as a list of strings,</li>\n<li><code>all_require_grad</code>, True if every parameter has <code>requires_grad</code> set. You will\n  not have set it anywhere. <code>nn.Parameter</code> does that for you, which is the\n  main reason it exists,</li>\n<li><code>loss_start</code>, the summed squared residuals of the fresh model, as a plain\n  float.</li>\n</ul>\n<p><code>loss_start</code> is the same number you have computed on each of the last two days,\nwhich is the point of recomputing it here: the machinery changed and the\narithmetic did not.</p>\n<p>Fill in the class, then <code>n_params</code>, <code>param_names</code>, <code>all_require_grad</code>,\n<code>loss_start</code>.</p>\n<p>Moves: <code>torch.nn.Module</code>, <code>super().__init__()</code>, <code>torch.nn.Parameter</code>,\n<code>model.named_parameters()</code>, <code>model(t)</code>.</p><pre class=\"code\"><code># Part a. The model as a Module.\n\nclass OneCompartmentIV(torch.nn.Module):\n    &quot;&quot;&quot;One compartment IV bolus, fitted on log parameters.&quot;&quot;&quot;\n\n    def __init__(self, v_init, k_init):\n        super().__init__()\n        self.log_v = None   # YOUR CODE: nn.Parameter holding np.log(v_init), float64\n        self.log_k = None   # YOUR CODE: nn.Parameter holding np.log(k_init), float64\n\n    def forward(self, t):\n        v = None            # YOUR CODE: exp of log_v\n        k = None            # YOUR CODE: exp of log_k\n        return None         # YOUR CODE: (DOSE / v) * exp(-k * t)\n\n\nmodel0 = OneCompartmentIV(V_START, K_START)\n\nn_params = None          # YOUR CODE: how many parameters the Module reports\nparam_names = None       # YOUR CODE: their names, sorted, as a list of strings\nall_require_grad = None  # YOUR CODE: True if every parameter requires grad\nloss_start = None        # YOUR CODE: summed squared residuals of the fresh model\n\nprint(&quot;parameters reported:&quot;, n_params)\nprint(&quot;names              :&quot;, param_names)\nprint(&quot;all require grad   :&quot;, all_require_grad)\nprint(&quot;loss at the start  : %r&quot; % (loss_start,))</code></pre>"

   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. The five line loop, twice</h2>\n<p>Fit the model with <code>torch.optim.Adam</code> at learning rate <code>LR</code> for <code>N_ITER</code>\niterations. Build a fresh <code>OneCompartmentIV</code> at the starting guesses first, so\nthat neither fit inherits the other's progress.</p>\n<p>The loop is the five lines from the concept section: <code>zero_grad</code>, forward and\nloss, <code>backward</code>, <code>step</code>, and record <code>loss.item()</code> in <code>loss_hist_adam</code>. Record\nthe loss before the step, as you did yesterday, so the first entry is the\nstarting loss.</p>\n<p>Afterwards read the fitted parameters back onto their natural scale into\n<code>v_hat</code> and <code>k_hat</code>, as plain floats.</p>\n<p>Then do the whole thing again with <code>torch.optim.SGD</code> at the <strong>same</strong> learning\nrate, into <code>loss_hist_sgd</code>.</p>\n<p>Adam lands on the optimum: the same volume and rate constant you reached\nyesterday, and the same loss to ten decimal places. Plain SGD at this learning\nrate does not converge at all. Watch its column in the printout: the loss goes\nup before it comes down, sits above the starting loss at iteration ten, is\nworse still at a hundred, and the value it happens to show at five hundred, ten\ntimes the Adam loss, is a point on a bouncing trace rather than an estimate.\nIts steps in the volume direction are larger than the curvature of the surface\ntolerates, so it overshoots, overshoots back, and never settles.</p>\n<p>That is not a criticism of SGD. Yesterday the same algorithm at a fifth of this\nlearning rate converged perfectly. It is an illustration of the one real\ndifficulty in gradient based fitting: the step size that works depends on the\nproblem, the parameterisation and the point you are standing on, and Adam's\ncontribution is to work most of that out for itself.</p>\n<p>Fill in <code>loss_hist_adam</code>, <code>loss_hist_sgd</code>, <code>v_hat</code>, <code>k_hat</code>.</p>\n<p>Moves: <code>torch.optim.Adam</code>, <code>torch.optim.SGD</code>, <code>zero_grad</code>, <code>backward</code>, <code>step</code>.</p><pre class=\"code\"><code># Part b. The loop, with Adam and then with plain SGD.\n\nmodel = OneCompartmentIV(V_START, K_START)\nopt = None             # YOUR CODE: torch.optim.Adam over model.parameters(), lr = LR\n\nloss_hist_adam = []    # YOUR CODE: one loss per iteration, filled in by the loop\n\n# YOUR CODE: the loop. N_ITER iterations of\n#   opt.zero_grad() / loss = ... / loss.backward() / opt.step() / record the loss\n\nv_hat = None           # YOUR CODE: exp(model.log_v) as a plain float\nk_hat = None           # YOUR CODE: exp(model.log_k) as a plain float\n\nmodel_sgd = OneCompartmentIV(V_START, K_START)\nloss_hist_sgd = []     # YOUR CODE: the same loop with torch.optim.SGD at the same LR\n\nprint(&quot;Adam: V = %r  k = %r&quot; % (v_hat, k_hat))\nif loss_hist_adam and loss_hist_sgd:\n    print(&quot;&quot;)\n    print(&quot;iter     Adam loss      SGD loss&quot;)\n    for _i in (1, 2, 10, 50, 100, N_ITER):\n        print(&quot;%4d  %13.8f %13.8f&quot; % (_i, loss_hist_adam[_i - 1], loss_hist_sgd[_i - 1]))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. The numbers a pharmacologist would ask for</h2>\n<p>Nobody wants <code>log_v</code>. Turn the Adam fit into the four numbers that would go\ninto a report, all as plain floats, all computed under <code>torch.no_grad()</code>\nbecause none of this is being differentiated.</p>\n<ul>\n<li><code>cl_hat</code>, the clearance in L/h, which for this model is <code>k * V</code>,</li>\n<li><code>t_half_hat</code>, the terminal half life in hours, <code>ln(2) / k</code>,</li>\n<li><code>auc_inf</code>, the area under the curve from zero to infinity in mg*h/L. For an\n  IV bolus with first order elimination the whole curve integrates exactly, so\n  this is <code>DOSE / CL</code> and needs no trapezoids,</li>\n<li><code>resid_sd</code>, the residual standard deviation on the observed scale, as\n  <code>sqrt(SSE / (n - p))</code> where SSE is the summed squared residuals at the fitted\n  parameters, <code>n</code> is the number of samples and <code>p</code> is the number of fitted\n  parameters, which is 2.</li>\n</ul>\n<p>The <code>n - p</code> matters. Dividing by <code>n</code> gives you a number that is too small by\ntwelve percent here, and the habit of ignoring degrees of freedom is how people\nend up quoting confidence intervals that do not cover.</p>\n<p>Sanity check what comes out. The clearance should be a few L/h, the half life\naround six hours, the AUC in the low twenties, and the residual standard\ndeviation under a tenth of a mg/L.</p>\n<p>Then be suspicious of that last one. It is a single absolute number describing\na model whose error is plainly proportional: the largest residual is 0.116 mg/L\nat 4 h, where the concentration is 1.7, and the smallest is 0.002 mg/L at 24 h,\nwhere the concentration is 0.16. One standard deviation cannot describe both.\nDivide each residual by its own prediction instead and the spread is 6.6\npercent, which is a close match to the 7 percent the data was built with. That\nis the argument for fitting PK data on log concentrations, or with a\nproportional error model, rather than on the additive scale used here.</p>\n<p>The cell also plots the fitted curve through the observations, which is the\ncheck that no number can replace. Note that the predictions for the plot are\ncomputed inside <code>no_grad</code> and then pulled out with <code>.numpy()</code>. Without the\n<code>no_grad</code>, <code>.numpy()</code> would refuse, because the tensor would be carrying a\ngradient history.</p>\n<p>Fill in <code>cl_hat</code>, <code>t_half_hat</code>, <code>auc_inf</code>, <code>resid_sd</code>.</p>\n<p>Moves: <code>torch.no_grad()</code>, <code>.item()</code>, <code>np.log(2)</code>, <code>np.sqrt</code>.</p><pre class=\"code\"><code># Part c. From log parameters to a report.\n\ncl_hat = None       # YOUR CODE: clearance in L/h\nt_half_hat = None   # YOUR CODE: terminal half life in h\nauc_inf = None      # YOUR CODE: AUC from 0 to infinity in mg*h/L\nresid_sd = None     # YOUR CODE: sqrt(SSE / (n - 2)) at the fitted parameters\n\nprint(&quot;V      = %r L&quot; % (v_hat,))\nprint(&quot;k      = %r per h&quot; % (k_hat,))\nprint(&quot;CL     = %r L/h&quot; % (cl_hat,))\nprint(&quot;t half = %r h&quot; % (t_half_hat,))\nprint(&quot;AUC    = %r mg*h/L&quot; % (auc_inf,))\nprint(&quot;residual SD = %r mg/L&quot; % (resid_sd,))\n\nif v_hat is not None:\n    with torch.no_grad():\n        fitted = model(t_grid).numpy()\n    fig, ax = plt.subplots(figsize=(6, 4))\n    ax.plot(t_obs.numpy(), c_obs.numpy(), &quot;o&quot;, label=&quot;observed&quot;)\n    ax.plot(t_grid.numpy(), fitted, &quot;-&quot;, label=&quot;fitted&quot;)\n    ax.set_xlabel(&quot;time (h)&quot;)\n    ax.set_ylabel(&quot;concentration (mg/L)&quot;)\n    ax.set_title(&quot;W6D4 one compartment fit&quot;)\n    ax.legend()\n    plt.show()</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>A first in human single ascending dose study has produced twelve subjects at\none dose level, each with a full profile. The question on the table is the one\nthat is always on the table: what are the typical PK parameters, and how much do\nthey vary between people.</p>\n<p>You have two ways to answer it with what you now know. You can throw all the\ndata into one fit and get one volume and one rate constant for everybody, which\nis called naive pooling and is what a spreadsheet would do. Or you can give\nevery subject their own parameters and fit all twenty four at once, which is\nthe two stage approach and the direct ancestor of the mixed effects models in\nweek 8.</p>\n<p>Both are three lines of difference in the same torch code, because a parameter\nand a vector of parameters are the same thing to an optimiser. That is what\ntoday demonstrates, and it is the reason this week exists: <code>curve_fit</code> would\nneed a loop and a reshape to do the second fit, and in week 8 when the\nparameters become a hierarchy, it could not do it at all.</p>"
   },
   {
    "key": "concept",
    "label": "One model, two shapes",
    "html": "<h2>One model, two shapes</h2>\n<p><strong>The parameters become vectors.</strong> Instead of a scalar <code>log_v</code>, carry a tensor\nof shape <code>(n_subjects,)</code>. Everything else about the machinery is unchanged:\n<code>nn.Parameter</code> registers it, <code>backward()</code> fills in a gradient for every\nelement, <code>Adam</code> steps every element with its own adapted step size. There is no\nloop over subjects anywhere.</p>\n<p><strong>The predictions become a matrix, by broadcasting.</strong> With <code>n</code> subjects and <code>m</code>\nsampling times, you want an <code>(n, m)</code> matrix of predictions. The parameters are\n<code>(n,)</code> and the times are <code>(m,)</code>, so insert axes to line them up:</p>\n<pre><code>v = torch.exp(self.log_v)[:, None]     # (n, 1)\nk = torch.exp(self.log_k)[:, None]     # (n, 1)\nreturn (DOSE / v) * torch.exp(-k * t[None, :])   # (n, 1) with (1, m) -&gt; (n, m)\n</code></pre>\n<p>This is the numpy broadcasting from week 1, in torch, with <code>None</code> doing the\nwork that <code>np.newaxis</code> did. Get an axis wrong and you will not get an error,\nyou will get a <code>(12, 12)</code> or a <code>(9, 9)</code> of nonsense, so check <code>.shape</code> before\nyou check anything else.</p>\n<p><strong>And the pooled fit is the same class with <code>n = 1</code>.</strong> A <code>(1, m)</code> prediction\nmatrix broadcasts against a <code>(12, m)</code> observation matrix, giving every subject\nthe same predicted curve and summing the residuals over all of them. One class,\none loop, two models.</p>\n<p><strong>What the comparison shows.</strong> The pooled fit gives you a single typical curve.\nIts residuals will not be scattered around zero at random: each subject will sit\nmostly above or mostly below the common curve, because real people differ. That\npattern in the residuals is between subject variability, and the pooled fit\ncannot represent it, so it hides it in the error term.</p>\n<p>The individual fits represent it exactly, and now you can measure it. Take the\ntwelve fitted volumes, work on the log scale, and the standard deviation of\nthose logs is the between subject variability. The usual way to report it is as\na coefficient of variation:</p>\n<pre><code>CV = sqrt(exp(var(log V)) - 1)\n</code></pre>\n<p>which for small variability is close to the standard deviation of the logs\nitself, and is the number you see in every population PK report.</p>\n<p><strong>What it does not show.</strong> Each of these twelve estimates carries its own\nuncertainty, and the spread of noisy estimates is wider than the spread of the\ntruth. Two stage estimates of variability are therefore biased upward, which is\nexactly the problem mixed effects models solve, and that is week 8.</p>"
   },

    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>the pooled fit, and the structure it leaves in the residuals</td>\n<td><code>v_pool</code>, <code>k_pool</code>, <code>sse_pool</code>, <code>subject_bias</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>twenty four parameters at once, checked against a curve_fit loop</td>\n<td><code>v_ind</code>, <code>k_ind</code>, <code>sse_ind</code>, <code>v_scipy</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>the population summary the study was run to produce</td>\n<td><code>v_gm</code>, <code>cv_v_pct</code>, <code>cv_k_pct</code>, <code>sse_ratio</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport torch\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import curve_fit\n\nPROBLEM_ID = &quot;W6D5&quot;\nTOPIC = &quot;PyTorch: vectorised parameters, pooled against individual fitting, recovering between subject variability&quot;\n\ntorch.manual_seed(0)\nrng = np.random.default_rng(6505)\n\nDOSE = 100.0                 # mg, IV bolus, the same dose for everyone\nN_SUBJ = 12\n\n# The truth, which the fits do not get to see.\nV_POP_TRUE = 35.0            # L, population typical value\nK_POP_TRUE = 0.12            # per h, population typical value\nCV_V_TRUE = 0.25             # between subject variability in V, 25 pct\nCV_K_TRUE = 0.20             # between subject variability in k, 20 pct\n\n_times = np.array([0.5, 1.0, 2.0, 4.0, 6.0, 8.0, 12.0, 18.0, 24.0])\n_v_i = V_POP_TRUE * rng.lognormal(0.0, CV_V_TRUE, size=N_SUBJ)\n_k_i = K_POP_TRUE * rng.lognormal(0.0, CV_K_TRUE, size=N_SUBJ)\n_c = (DOSE / _v_i)[:, None] * np.exp(-_k_i[:, None] * _times[None, :])\n_c = np.round(_c * rng.lognormal(0.0, 0.07, size=_c.shape), 4)\n\nt_obs = torch.tensor(_times, dtype=torch.float64)          # shape (9,)\nc_obs = torch.tensor(_c, dtype=torch.float64)              # shape (12, 9)\n\nV_START = 30.0               # L, starting guess for every subject\nK_START = 0.15               # per h, starting guess for every subject\n\nLR = 0.05\nN_ITER = 2000\n\nprint(&quot;t_obs shape:&quot;, tuple(t_obs.shape), &quot; c_obs shape:&quot;, tuple(c_obs.shape))\nprint(&quot;&quot;)\nprint(&quot;subject 1 profile:&quot;, c_obs[0].numpy())\nprint(&quot;subject 2 profile:&quot;, c_obs[1].numpy())\nprint(&quot;concentrations run from %.4f to %.4f mg/L&quot; % (c_obs.min().item(), c_obs.max().item()))\nprint(&quot;&quot;)\nprint(&quot;every subject starts the fit at V = %.1f L, k = %.2f per h&quot; % (V_START, K_START))\nprint(&quot;Adam, lr = %g, %d iterations&quot; % (LR, N_ITER))</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a vector of parameters</td>\n<td><code>torch.nn.Parameter(torch.full((n,), value, dtype=torch.float64))</code></td>\n</tr>\n<tr>\n<td>add a trailing axis</td>\n<td><code>x[:, None]</code>, giving shape <code>(n, 1)</code></td>\n</tr>\n<tr>\n<td>add a leading axis</td>\n<td><code>t[None, :]</code>, giving shape <code>(1, m)</code></td>\n</tr>\n<tr>\n<td>check what you built</td>\n<td><code>tuple(x.shape)</code></td>\n</tr>\n<tr>\n<td>sum over times, keep subjects</td>\n<td><code>.sum(dim=1)</code>, or <code>.mean(dim=1)</code></td>\n</tr>\n<tr>\n<td>sum everything</td>\n<td><code>.sum()</code></td>\n</tr>\n<tr>\n<td>tensor to numpy, after fitting</td>\n<td><code>x.detach().numpy()</code></td>\n</tr>\n<tr>\n<td>geometric mean</td>\n<td><code>np.exp(np.mean(np.log(x)))</code></td>\n</tr>\n<tr>\n<td>variance of logs, sample version</td>\n<td><code>np.var(np.log(x), ddof=1)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>dim=1</code> in torch is <code>axis=1</code> in numpy. With a <code>(12, 9)</code> matrix of subjects by\ntimes, <code>dim=1</code> collapses the times and leaves you one number per subject, and\n<code>dim=0</code> collapses the subjects and leaves you one number per time. Which one you\nwant is the difference between a per subject summary and a per timepoint one,\nand the shapes will not tell you which you asked for, since 12 and 9 are both\nplausible answers.</p><pre class=\"code\"><code>import numpy as np\nimport torch\n\nprint(&quot;--- 1. broadcasting a parameter vector against a time vector ---&quot;)\ndemo_p = torch.tensor([1.0, 2.0, 3.0], dtype=torch.float64)      # 3 subjects\ndemo_t = torch.tensor([0.0, 1.0, 2.0, 3.0], dtype=torch.float64)  # 4 times\nprint(&quot;p shape&quot;, tuple(demo_p.shape), &quot; t shape&quot;, tuple(demo_t.shape))\nprint(&quot;p[:, None] shape:&quot;, tuple(demo_p[:, None].shape))\nprint(&quot;t[None, :] shape:&quot;, tuple(demo_t[None, :].shape))\ndemo_grid = demo_p[:, None] * demo_t[None, :]\nprint(&quot;product shape   :&quot;, tuple(demo_grid.shape), &quot;  one row per subject&quot;)\nprint(demo_grid)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. the axis mistake does not raise, it just gives nonsense ---&quot;)\ntry:\n    demo_bad = demo_p[:, None] * demo_t[:, None]\n    print(&quot;that worked and gave shape&quot;, tuple(demo_bad.shape))\nexcept RuntimeError as err:\n    print(&quot;shapes (3,1) and (4,1) do not broadcast:&quot;, str(err)[:70])\ndemo_same = torch.tensor([1.0, 2.0, 3.0], dtype=torch.float64)\nprint(&quot;but (3,1) times (3,) gives shape&quot;, tuple((demo_p[:, None] * demo_same).shape),\n      &quot;which is a 3 by 3 of something you did not ask for&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. a vector of parameters fits exactly like a scalar one ---&quot;)\n# Three independent straight lines through three different slopes.\ndemo_x = torch.tensor([0.0, 1.0, 2.0, 3.0], dtype=torch.float64)\ndemo_y = torch.tensor([[0.0, 1.0, 2.0, 3.0],\n                       [0.0, 2.0, 4.0, 6.0],\n                       [0.0, 5.0, 10.0, 15.0]], dtype=torch.float64)\ndemo_slope = torch.nn.Parameter(torch.full((3,), 0.0, dtype=torch.float64))\ndemo_opt = torch.optim.Adam([demo_slope], lr=0.1)\nfor _ in range(800):\n    demo_opt.zero_grad()\n    demo_loss = ((demo_slope[:, None] * demo_x[None, :] - demo_y) ** 2).sum()\n    demo_loss.backward()\n    demo_opt.step()\nprint(&quot;fitted slopes:&quot;, np.round(demo_slope.detach().numpy(), 6), &quot; true 1, 2, 5&quot;)\nprint(&quot;three parameters, one loss, one backward pass, no loop over the three&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. a (1, m) prediction broadcasts against (n, m) observations ---&quot;)\ndemo_one = torch.nn.Parameter(torch.full((1,), 0.0, dtype=torch.float64))\ndemo_opt2 = torch.optim.Adam([demo_one], lr=0.1)\nfor _ in range(800):\n    demo_opt2.zero_grad()\n    demo_loss2 = ((demo_one[:, None] * demo_x[None, :] - demo_y) ** 2).sum()\n    demo_loss2.backward()\n    demo_opt2.step()\nprint(&quot;one slope for all three series:&quot;, np.round(demo_one.detach().numpy(), 6))\nprint(&quot;that is the pooled fit, from the same code with n = 1&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. dim=1 against dim=0 ---&quot;)\ndemo_m = torch.tensor([[1.0, 2.0, 3.0], [10.0, 20.0, 30.0]], dtype=torch.float64)\nprint(demo_m)\nprint(&quot;mean(dim=1), one per row   :&quot;, demo_m.mean(dim=1))\nprint(&quot;mean(dim=0), one per column:&quot;, demo_m.mean(dim=0))\n\nprint(&quot;&quot;)\nprint(&quot;--- 6. variability on the log scale ---&quot;)\ndemo_vals = np.array([20.0, 30.0, 45.0, 28.0, 36.0])\nprint(&quot;values         :&quot;, demo_vals)\nprint(&quot;geometric mean : %.4f&quot; % np.exp(np.mean(np.log(demo_vals))))\nprint(&quot;sd of the logs : %.4f&quot; % np.std(np.log(demo_vals), ddof=1))\nprint(&quot;CV from logs   : %.2f pct&quot; % (100 * np.sqrt(np.exp(np.var(np.log(demo_vals), ddof=1)) - 1)))</code></pre>"

    "html": "<h2>Part a. The pooled fit, and what it leaves behind</h2>\n<p>Fill in the class below so that it carries <code>n_subjects</code> volumes and\n<code>n_subjects</code> rate constants, and returns an <code>(n_subjects, n_times)</code> matrix of\npredictions. The parameters must be named <code>log_v</code> and <code>log_k</code> so the check can\nfind them.</p>\n<p>Then make one with <code>n_subjects=1</code> and fit it with Adam at <code>LR</code> for <code>N_ITER</code>\niterations, against all twelve subjects at once. The <code>(1, 9)</code> predictions\nbroadcast against the <code>(12, 9)</code> observations, so the loss is the total squared\nresidual of one common curve across the whole study. Record:</p>\n<ul>\n<li><code>v_pool</code> and <code>k_pool</code>, the fitted values as plain floats,</li>\n<li><code>sse_pool</code>, the final loss as a plain float,</li>\n<li><code>subject_bias</code>, the mean residual for each subject, as a numpy array of\n  twelve numbers, with the residual taken as <strong>observed minus predicted</strong>.</li>\n</ul>\n<p>That order matters here. For a squared loss it makes no difference, which is why\nthe earlier days were relaxed about it, but a mean residual has a sign, and\neverywhere in pharmacometrics the residual is observed minus predicted, so a\npositive value means the model is under predicting that subject.</p>\n<p>Look at <code>subject_bias</code> when you have it. Eight of the twelve subjects sit\nmostly below the common curve and four sit mostly above it, and the largest of\nthe twelve is 0.84 mg/L against a mean concentration across the whole study of\n1.41 mg/L. Those are not random residuals\naround a good fit, they are twelve people with twelve different volumes being\ndescribed by one number. Nothing is wrong with the optimiser. The model is\nwrong.</p>\n<p>Fill in the class, then <code>v_pool</code>, <code>k_pool</code>, <code>sse_pool</code>, <code>subject_bias</code>.</p>\n<p>Moves: <code>torch.nn.Parameter</code>, <code>torch.full</code>, <code>[:, None]</code>, <code>[None, :]</code>,\n<code>torch.optim.Adam</code>, the five line loop, <code>.mean(dim=1)</code>, <code>.detach().numpy()</code>.</p><pre class=\"code\"><code># Part a. The pooled fit: one curve for everybody.\n\nclass PopulationPK(torch.nn.Module):\n    &quot;&quot;&quot;One compartment IV bolus for n_subjects subjects, on log parameters.&quot;&quot;&quot;\n\n    def __init__(self, n_subjects, v_init, k_init):\n        super().__init__()\n        self.log_v = None   # YOUR CODE: nn.Parameter, shape (n_subjects,), log(v_init)\n        self.log_k = None   # YOUR CODE: nn.Parameter, shape (n_subjects,), log(k_init)\n\n    def forward(self, t):\n        v = None            # YOUR CODE: exp(log_v) with a trailing axis, shape (n, 1)\n        k = None            # YOUR CODE: exp(log_k) with a trailing axis, shape (n, 1)\n        return None         # YOUR CODE: (DOSE / v) * exp(-k * t[None, :])\n\n\nmodel_pool = PopulationPK(1, V_START, K_START)\n\n# YOUR CODE: an Adam optimiser over model_pool.parameters() at lr = LR, then\n# the five line loop for N_ITER iterations against c_obs.\n\nv_pool = None         # YOUR CODE: the fitted volume, as a plain float\nk_pool = None         # YOUR CODE: the fitted rate constant, as a plain float\nsse_pool = None       # YOUR CODE: the final loss, as a plain float\nsubject_bias = None   # YOUR CODE: mean residual per subject, observed minus\n                      #            predicted, as an array of 12 numbers\n\nprint(&quot;pooled fit: V = %r L, k = %r per h&quot; % (v_pool, k_pool))\nprint(&quot;total SSE : %r&quot; % (sse_pool,))\nprint(&quot;&quot;)\nprint(&quot;mean residual by subject (observed minus predicted):&quot;)\nprint(np.round(subject_bias, 4) if subject_bias is not None else &quot;not set yet&quot;)</code></pre>"

    "label": "Part b",
    "html": "<h2>Part b. Twenty four parameters, one backward pass</h2>\n<p>Now make a <code>PopulationPK</code> with <code>n_subjects=N_SUBJ</code> and fit it exactly the same\nway, with the same learning rate and the same number of iterations. The only\nchange is the shape of the parameters.</p>\n<p>Record <code>v_ind</code> and <code>k_ind</code>, the twelve fitted volumes and rate constants as\nnumpy arrays, and <code>sse_ind</code>, the final total loss.</p>\n<p>Then check the whole thing against the tool you already trust, one subject at a\ntime. Loop over the twelve rows of <code>c_obs</code>, call <code>curve_fit</code> on each with the\nsame model and the same starting guesses, collect the twelve volume estimates\ninto <code>v_scipy</code> as a numpy array.</p>\n<p>The two should agree to six significant figures, subject by subject. Twelve\nseparate Levenberg-Marquardt fits with numerical derivatives, and one torch fit\nof twenty four parameters, find the same twelve answers.</p>\n<p>This is the point of the whole week. There was no loop over subjects in your\ntorch code, the shape of the parameter did all the work, and the same code would\nhandle a hundred and twenty subjects without a line changing. The curve_fit\nversion needs a Python loop, which is fine for twelve independent fits and\nimpossible once the subjects stop being independent, which is what happens the\nmoment you put a population distribution over them in week 8.</p>\n<p>One thing to notice in the numbers: subject 5's fitted volume is 29.1 L against\na true 27.4, and subject 9's is 37.0 against 34.0. Individual estimates from\nnine samples with seven percent noise are good but not exact, and that\nestimation error is what inflates the variability estimate in part c.</p>\n<p>Fill in <code>v_ind</code>, <code>k_ind</code>, <code>sse_ind</code>, <code>v_scipy</code>.</p>\n<p>Moves: the same class with a different <code>n_subjects</code>, the same loop,\n<code>.detach().numpy()</code>, a <code>curve_fit</code> loop over rows.</p><pre class=\"code\"><code># Part b. One set of parameters per subject.\n\nmodel_ind = PopulationPK(N_SUBJ, V_START, K_START)\n\n# YOUR CODE: fit it the same way you fitted the pooled model. If you wrote the\n# loop as a function in part a, this is one line.\n\nv_ind = None     # YOUR CODE: the 12 fitted volumes, as a numpy array\nk_ind = None     # YOUR CODE: the 12 fitted rate constants, as a numpy array\nsse_ind = None   # YOUR CODE: the final total loss, as a plain float\n\n\ndef one_subject(t, v, k):\n    &quot;&quot;&quot;The same model for a single subject, in numpy, for curve_fit.&quot;&quot;&quot;\n    return (DOSE / v) * np.exp(-k * t)\n\n\nv_scipy = None   # YOUR CODE: the 12 volume estimates from a curve_fit loop\n\nprint(&quot;torch     V:&quot;, np.round(v_ind, 4) if v_ind is not None else &quot;not set&quot;)\nprint(&quot;curve_fit V:&quot;, np.round(v_scipy, 4) if v_scipy is not None else &quot;not set&quot;)\nprint(&quot;&quot;)\nprint(&quot;torch     k:&quot;, np.round(k_ind, 5) if k_ind is not None else &quot;not set&quot;)\nprint(&quot;&quot;)\nprint(&quot;total SSE, individual fits: %r&quot; % (sse_ind,))\nprint(&quot;total SSE, pooled fit     : %r&quot; % (sse_pool,))</code></pre>"

    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. The population summary</h2>\n<p>Turn the twelve individual fits into the three numbers a study report would\ncarry, plus one that tells you whether the extra parameters earned their place.</p>\n<ul>\n<li><code>v_gm</code>, the geometric mean of the twelve fitted volumes. PK parameters are\n  reported as geometric means because they are approximately lognormal, and the\n  geometric mean of a lognormal is its median,</li>\n<li><code>cv_v_pct</code>, the between subject variability in volume as a percentage, from\n  <code>100 * sqrt(exp(var(log V)) - 1)</code> with the sample variance, <code>ddof=1</code>,</li>\n<li><code>cv_k_pct</code>, the same for the rate constants,</li>\n<li><code>sse_ratio</code>, <code>sse_pool</code> divided by <code>sse_ind</code>.</li>\n</ul>\n<p>Then read what you have produced.</p>\n<p><strong>The ratio is about 23.</strong> Twenty two extra parameters bought a twenty three\nfold reduction in squared error, which in a study of twelve people is not a\nclose call. Between subject variability is the dominant source of structure in\nthis dataset, and a model without it is not describing the data.</p>\n<p><strong>The pooled volume is biased low.</strong> <code>v_pool</code> came out at 35.3 L against a\ngeometric mean of 36.7 L from the individual fits, 3.6 percent lower.\nPooling on the additive scale weights the subjects with the highest\nconcentrations most heavily, and the highest concentrations belong to the\nsubjects with the smallest volumes. The bias is modest here because the design\nis balanced, with every subject sampled identically. It is not modest when it\nis not.</p>\n<p><strong>The variability estimate needs a caveat.</strong> You will get about 31 percent for\nvolume, against the 25 percent the data was simulated with. Before concluding\nthe method is biased, note that these particular twelve subjects happen to have\na spread of 30.4 percent, so your estimate recovered the sample almost exactly.\nA sample of twelve simply does not pin down a population standard deviation,\nand this one came out high. The remaining gap, 30.6 against 30.4, is the upward\nbias of the two stage approach, which is small here because nine samples per\nsubject with seven percent noise make for precise individual estimates. With\nthree samples per subject it would not be small.</p>\n<p>That caveat is the handover to week 8. Mixed effects models estimate the\ntypical value and the variability simultaneously instead of in two stages, which\nremoves this bias and lets you fit subjects who have only two usable samples\neach.</p>\n<p>Fill in <code>v_gm</code>, <code>cv_v_pct</code>, <code>cv_k_pct</code>, <code>sse_ratio</code>.</p>\n<p>Moves: <code>np.log</code>, <code>np.exp</code>, <code>np.mean</code>, <code>np.var(..., ddof=1)</code>, division.</p><pre class=\"code\"><code># Part c. From twelve fits to a population summary.\n\nv_gm = None       # YOUR CODE: geometric mean of the 12 fitted volumes\ncv_v_pct = None   # YOUR CODE: between subject CV of V, as a percentage\ncv_k_pct = None   # YOUR CODE: between subject CV of k, as a percentage\nsse_ratio = None  # YOUR CODE: sse_pool / sse_ind\n\nprint(&quot;individual fits, n = %d&quot; % N_SUBJ)\nprint(&quot;  V geometric mean : %r L&quot; % (v_gm,))\nprint(&quot;  V between subject CV: %r pct&quot; % (cv_v_pct,))\nprint(&quot;  k between subject CV: %r pct&quot; % (cv_k_pct,))\nprint(&quot;&quot;)\nprint(&quot;pooled V for comparison: %r L&quot; % (v_pool,))\nprint(&quot;SSE pooled / SSE individual: %r&quot; % (sse_ratio,))\nprint(&quot;&quot;)\nprint(&quot;the truth, which the fits never saw:&quot;)\nprint(&quot;  V %.1f L with %.0f pct CV, k %.2f per h with %.0f pct CV&quot;\n      % (V_POP_TRUE, 100 * CV_V_TRUE, K_POP_TRUE, 100 * CV_K_TRUE))\n\nif v_ind is not None:\n    with torch.no_grad():\n        fitted = model_ind(t_obs).numpy()\n    fig, ax = plt.subplots(figsize=(7, 5))\n    for _i in range(N_SUBJ):\n        ax.plot(t_obs.numpy(), c_obs[_i].numpy(), &quot;o&quot;, ms=4, alpha=0.6)\n        ax.plot(t_obs.numpy(), fitted[_i], &quot;-&quot;, lw=1)\n    ax.set_yscale(&quot;log&quot;)\n    ax.set_xlabel(&quot;time (h)&quot;)\n    ax.set_ylabel(&quot;concentration (mg/L)&quot;)\n    ax.set_title(&quot;W6D5 twelve individual fits&quot;)\n    plt.show()</code></pre>"

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>gaps between samples</td>\n<td><code>np.diff(t)</code></td>\n</tr>\n<tr>\n<td>average of neighbouring values</td>\n<td><code>(c[:-1] + c[1:]) / 2</code></td>\n</tr>\n<tr>\n<td>linear trapezoid area</td>\n<td><code>np.sum(np.diff(t) * (c[:-1] + c[1:]) / 2)</code></td>\n</tr>\n<tr>\n<td>which intervals are falling</td>\n<td><code>c[1:] &lt; c[:-1]</code></td>\n</tr>\n<tr>\n<td>log-down area for one interval</td>\n<td><code>(c1 - c2) * (t2 - t1) / np.log(c1 / c2)</code></td>\n</tr>\n<tr>\n<td>choose per interval</td>\n<td><code>np.where(condition, log_form, linear_form)</code></td>\n</tr>\n<tr>\n<td>guard a division</td>\n<td>compute both, then select, or use <code>np.errstate</code></td>\n</tr>\n<tr>\n<td>peak and its time</td>\n<td><code>np.max(c)</code>, <code>t[np.argmax(c)]</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>np.diff</code> returns one fewer element than it was given, so <code>c[:-1]</code> and <code>c[1:]</code>\nline up with it: each entry is the start and the end of one interval.</p>",
