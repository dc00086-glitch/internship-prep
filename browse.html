    "html": "<h2>Part a. Describe the data before you test it</h2>\n<p>Never run a test on a dataset you have not looked at. The descriptive table\nis what tells you which test is defensible, and you build it first so the\nchoice is not influenced by the p value.</p>\n<p>For each group give the count, the arithmetic mean, the sample SD, the median,\nand the interquartile range. Round everything to 2 decimals so the table is\nreadable.</p>\n<p>Look at what comes out. The mean sitting noticeably above the median is the\nsignature of right skew. The two SDs being far apart is the signature that\nStudent's equal variance assumption does not hold. Both are visible before any\ntest has been run.</p>\n<p>Fill in <code>desc</code>, a DataFrame with one row per group, sorted with <code>Vehicle</code>\nfirst then <code>Treated</code>, index renumbered, with exactly:</p>\n<table>\n<thead>\n<tr>\n<th>column</th>\n<th>meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>GROUP</code></td>\n<td><code>Vehicle</code> or <code>Treated</code></td>\n</tr>\n<tr>\n<td><code>N</code></td>\n<td>how many mice</td>\n</tr>\n<tr>\n<td><code>MEAN</code></td>\n<td>arithmetic mean volume</td>\n</tr>\n<tr>\n<td><code>SD</code></td>\n<td>sample SD</td>\n</tr>\n<tr>\n<td><code>MEDIAN</code></td>\n<td>median volume</td>\n</tr>\n<tr>\n<td><code>IQR</code></td>\n<td>interquartile range</td>\n</tr>\n</tbody>\n</table>\n<p>Moves: <code>np.mean</code>, <code>np.std(..., ddof=1)</code>, <code>np.median</code>, <code>stats.iqr</code>,\n<code>pd.DataFrame([...])</code>, <code>.round(2)</code>.</p><pre class=\"code\"><code># Part a. Descriptive statistics for each group.\n\ndesc = None   # YOUR CODE: one row per group, Vehicle first, columns\n              #            GROUP, N, MEAN, SD, MEDIAN, IQR, rounded to 2 dp\n\nprint(desc)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Student's t and Welch's t</h2>\n<p>Run both forms of the two sample t-test on the raw volumes, and keep the\nstatistic and the p value from each.</p>\n<p><code>stats.ttest_ind(a, b)</code> gives you Student's version, which pools the two\nvariances into one estimate. Adding <code>equal_var=False</code> gives Welch's version,\nwhich keeps them separate. Note which way round the default goes: you get\nStudent unless you ask for Welch, which is the opposite of what most people\nshould want.</p>\n<p>Compare the two p values against the SDs you computed in part a. When the\nspreads are similar the two tests agree closely. When they are not, they\ndiverge, and Welch is the one that is still telling the truth.</p>\n<p>Pass <code>vehicle</code> first and <code>treated</code> second, so the sign of the statistic is\npositive when vehicle tumours are larger.</p>\n<p>Fill in <code>t_student</code>, <code>p_student</code>, <code>t_welch</code>, <code>p_welch</code>, all plain floats.</p>\n<p>Moves: <code>stats.ttest_ind(a, b)</code>, <code>stats.ttest_ind(a, b, equal_var=False)</code>,\n<code>res.statistic</code>, <code>res.pvalue</code>, <code>float(...)</code>.</p><pre class=\"code\"><code># Part b. Student&#x27;s t-test and Welch&#x27;s t-test on the raw volumes.\n\nt_student = None   # YOUR CODE: statistic, equal variance assumed\np_student = None   # YOUR CODE: its p value\nt_welch = None     # YOUR CODE: statistic, equal variance NOT assumed\np_welch = None     # YOUR CODE: its p value\n\nprint(&quot;Student t = %s  p = %s&quot; % (t_student, p_student))\nprint(&quot;Welch   t = %s  p = %s&quot; % (t_welch, p_welch))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Mann-Whitney, and a t-test on the logs</h2>\n<p>Two ways of handling the skew rather than ignoring it.</p>\n<p><code>stats.mannwhitneyu</code> ranks all twenty values together and asks whether the\nvehicle ranks run higher. Pass <code>alternative=\"two-sided\"</code> explicitly: it is the\nsensible default for a comparison with no prespecified direction, and writing\nit down makes the choice visible to whoever reads your code.</p>\n<p>Then take natural logs of both groups and run Welch's t-test on those. Because\nthe data is lognormal, the logs are close to normal, and comparing their means\nis comparing the <strong>geometric</strong> means of the original volumes. This is exactly\nwhat bioequivalence analysis does to AUC and Cmax, for the same reason.</p>\n<p>Vehicle first, treated second, as in part b.</p>\n<p>When you have all three, look at them together. They will not be identical,\nand the useful question is not which is smallest but whether they agree on the\nconclusion. If they do, the finding is robust to how you analysed it. If they\ndisagree sharply, that disagreement is itself the result, and the honest move\nis to say so rather than to pick.</p>\n<p>Fill in <code>u_stat</code>, <code>p_mw</code>, <code>t_log</code>, <code>p_log</code>, all plain floats.</p>\n<p>Moves: <code>stats.mannwhitneyu(a, b, alternative=\"two-sided\")</code>, <code>np.log</code>,\n<code>stats.ttest_ind(..., equal_var=False)</code>, <code>.statistic</code>, <code>.pvalue</code>.</p><pre class=\"code\"><code># Part c. Mann-Whitney on the raw data, and Welch&#x27;s t-test on the logs.\n\nu_stat = None   # YOUR CODE: Mann-Whitney U statistic\np_mw = None     # YOUR CODE: its p value, two sided\nt_log = None    # YOUR CODE: Welch t statistic on log transformed volumes\np_log = None    # YOUR CODE: its p value\n\nprint(&quot;Mann-Whitney U = %s  p = %s&quot; % (u_stat, p_mw))\nprint(&quot;Welch on logs  t = %s  p = %s&quot; % (t_log, p_log))</code></pre>"

  "solution": "https://github.com/dc00086-glitch/internship-prep/blob/main/solutions/week03/w3d2_scipy_geometric_stats_solution.ipynb",
  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>natural log of an array</td>\n<td><code>np.log(x)</code>, and back with <code>np.exp(x)</code></td>\n</tr>\n<tr>\n<td>arithmetic mean and sample SD</td>\n<td><code>np.mean(x)</code>, <code>np.std(x, ddof=1)</code></td>\n</tr>\n<tr>\n<td>ordinary CV as a percent</td>\n<td><code>100 * np.std(x, ddof=1) / np.mean(x)</code></td>\n</tr>\n<tr>\n<td>geometric mean</td>\n<td><code>np.exp(np.mean(np.log(x)))</code></td>\n</tr>\n<tr>\n<td>SD of the logs</td>\n<td><code>np.std(np.log(x), ddof=1)</code></td>\n</tr>\n<tr>\n<td>geometric CV as a percent</td>\n<td><code>100 * np.sqrt(np.exp(sd_log ** 2) - 1)</code></td>\n</tr>\n<tr>\n<td>test for normality</td>\n<td><code>stats.shapiro(x)</code>, then <code>.pvalue</code></td>\n</tr>\n</tbody>\n</table>\n<p>The geometric CV comes from the SD <strong>of the logs</strong>, not from the raw SD. There\nis no way to get it from the arithmetic mean and SD alone, which is why the\ntwo summaries have to be computed separately.</p>",
  "sections": [
   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>Twenty-four subjects took a single oral dose and you have each one's AUC, the\ntotal exposure in mg*h/L. You have been asked for a one line summary of\ncentral tendency and variability to go at the top of the report.</p>\n<p>Exposure parameters are almost always lognormal. Clearance and volume vary\nmultiplicatively between people, not additively: one subject does not have\n\"20 units more clearance\" than another, they have \"30 percent more\". Divide\nthrough and the ratios are symmetric even though the raw values are not.</p>\n<p>That is why regulatory PK summaries report the <strong>geometric</strong> mean and the\n<strong>geometric CV</strong>, and why bioequivalence is assessed on log-transformed AUC\nand Cmax. Reporting an arithmetic mean and SD for this data is not quite\nwrong, but it describes a bell curve that is not the one you have.</p>"
   },
   {
    "key": "concept",
    "label": "Multiplicative variability, and the statistics that match it",
    "html": "<h2>Multiplicative variability, and the statistics that match it</h2>\n<p><strong>What lognormal means.</strong> A quantity is lognormal when its <strong>logarithm</strong> is\nnormal. Equivalently, it is what you get when many small effects multiply\nrather than add. Clearance depends on liver blood flow times enzyme content\ntimes free fraction, each varying by some percentage, so the product is\nlognormal almost by construction. The result is strictly positive, has a long\nright tail, and has a spread that grows with the magnitude.</p>\n<p><strong>The geometric mean</strong> is the mean computed in log space and brought back:</p>\n<pre><code class=\"language-python\">gm = np.exp(np.mean(np.log(x)))\n</code></pre>\n<p>It equals the median of a perfect lognormal distribution, it is always less\nthan or equal to the arithmetic mean, and it is the value a ratio based\ncomparison is actually about. When a label says exposure increased 1.8 fold,\nthat is a ratio of geometric means.</p>\n<p><strong>The geometric CV</strong> is the one people get wrong, because it is not the\nordinary CV of anything. It is derived from the SD <strong>of the logs</strong>:</p>\n<pre><code class=\"language-python\">sd_log = np.std(np.log(x), ddof=1)\ngeo_cv = 100 * np.sqrt(np.exp(sd_log ** 2) - 1)\n</code></pre>\n<p>Taking <code>100 * SD / mean</code> on the raw values gives you a different number and\ndoes not have the interpretation of a percentage spread on the ratio scale. If\nyou have ever wondered why a PK table shows a CV of 45 percent that does not\nmatch anything you can compute from the mean and SD, this is why.</p>\n<p><strong>Testing normality, and what the test is worth.</strong> <code>stats.shapiro</code> tests the\nnull hypothesis that a sample came from a normal distribution. A small p value\nis evidence against normality. Two cautions that matter more than the test\nitself. With a small sample it has almost no power, so a large p means \"not\nenough data to object\", not \"normal\". With a very large sample it rejects on\ntrivial, harmless departures. So treat it as one input alongside a look at the\ndata, not as a gate that decides your analysis.</p>\n<p>Here it will do its job: the raw AUCs should fail and the logs should pass,\nwhich is the expected signature of lognormal data and a tidy confirmation of\nwhat the biology already told you.</p>"
   },

    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>the arithmetic summary, the one people reach for</td>\n<td><code>arith_mean</code>, <code>arith_sd</code>, <code>arith_cv</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>the geometric summary, the one that fits</td>\n<td><code>geo_mean</code>, <code>sd_log</code>, <code>geo_cv</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>whether the data backs that up</td>\n<td><code>p_raw</code>, <code>p_log</code>, <code>use_log</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

   {
    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nPROBLEM_ID = &quot;W3D2&quot;\nTOPIC = &quot;scipy.stats: lognormal data, geometric mean and CV, normality testing&quot;\n\nrng = np.random.default_rng(3102)\n\nN_SUBJECTS = 24\n# True geometric mean 48 mg*h/L, with 45 percent geometric CV.\n_sd_log_true = np.sqrt(np.log(1.0 + 0.45 ** 2))\nauc = np.round(rng.lognormal(mean=np.log(48.0), sigma=_sd_log_true, size=N_SUBJECTS), 2)\n\npk = pd.DataFrame({\n    &quot;SUBJECT&quot;: [&quot;B%02d&quot; % i for i in range(1, N_SUBJECTS + 1)],\n    &quot;AUC&quot;: auc,\n})\n\nprint(&quot;pk:&quot;, pk.shape)\nprint(pk.to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;sorted AUC:&quot;, np.sort(auc))\nprint(&quot;&quot;)\nprint(&quot;notice the long right tail: a few subjects sit far above the rest&quot;)</code></pre>"
   },
   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>natural log of an array</td>\n<td><code>np.log(x)</code>, and back with <code>np.exp(x)</code></td>\n</tr>\n<tr>\n<td>arithmetic mean and sample SD</td>\n<td><code>np.mean(x)</code>, <code>np.std(x, ddof=1)</code></td>\n</tr>\n<tr>\n<td>ordinary CV as a percent</td>\n<td><code>100 * np.std(x, ddof=1) / np.mean(x)</code></td>\n</tr>\n<tr>\n<td>geometric mean</td>\n<td><code>np.exp(np.mean(np.log(x)))</code></td>\n</tr>\n<tr>\n<td>SD of the logs</td>\n<td><code>np.std(np.log(x), ddof=1)</code></td>\n</tr>\n<tr>\n<td>geometric CV as a percent</td>\n<td><code>100 * np.sqrt(np.exp(sd_log ** 2) - 1)</code></td>\n</tr>\n<tr>\n<td>test for normality</td>\n<td><code>stats.shapiro(x)</code>, then <code>.pvalue</code></td>\n</tr>\n</tbody>\n</table>\n<p>The geometric CV comes from the SD <strong>of the logs</strong>, not from the raw SD. There\nis no way to get it from the arithmetic mean and SD alone, which is why the\ntwo summaries have to be computed separately.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy import stats\n\n# A tiny made up right skewed sample. Nothing here is the answer.\ndemo = np.array([10.0, 12.0, 14.0, 15.0, 18.0, 22.0, 30.0, 61.0])\nprint(&quot;demo       :&quot;, demo)\nprint(&quot;sorted, the tail is on the right&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. arithmetic summary ---&quot;)\ndemo_m = float(np.mean(demo))\ndemo_sd = float(np.std(demo, ddof=1))\nprint(&quot;mean       : %.3f&quot; % demo_m)\nprint(&quot;SD         : %.3f&quot; % demo_sd)\nprint(&quot;CV percent : %.2f&quot; % (100.0 * demo_sd / demo_m))\nprint(&quot;median     : %.3f   &lt;- well below the mean, which is what skew does&quot; % float(np.median(demo)))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. working in log space ---&quot;)\ndemo_log = np.log(demo)\nprint(&quot;np.log(demo):&quot;, np.round(demo_log, 3))\nprint(&quot;mean of logs: %.4f&quot; % float(np.mean(demo_log)))\nprint(&quot;exp of that : %.3f   &lt;- the geometric mean&quot; % float(np.exp(np.mean(demo_log))))\nprint(&quot;&quot;)\nprint(&quot;geometric mean is always &lt;= arithmetic mean:&quot;)\nprint(&quot;  %.3f &lt;= %.3f&quot; % (float(np.exp(np.mean(demo_log))), demo_m))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. geometric CV comes from the SD of the LOGS ---&quot;)\ndemo_sdlog = float(np.std(demo_log, ddof=1))\ndemo_gcv = 100.0 * np.sqrt(np.exp(demo_sdlog ** 2) - 1.0)\nprint(&quot;SD of logs     : %.4f&quot; % demo_sdlog)\nprint(&quot;geometric CV   : %.2f percent&quot; % demo_gcv)\nprint(&quot;ordinary CV    : %.2f percent   &lt;- a different number entirely&quot;\n      % (100.0 * demo_sd / demo_m))\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. shapiro tests normality, small p means NOT normal ---&quot;)\ndemo_raw = stats.shapiro(demo)\ndemo_logged = stats.shapiro(demo_log)\nprint(&quot;raw  : W = %.4f  p = %.4f&quot; % (demo_raw.statistic, demo_raw.pvalue))\nprint(&quot;logs : W = %.4f  p = %.4f&quot; % (demo_logged.statistic, demo_logged.pvalue))\nprint(&quot;&quot;)\nprint(&quot;with only 8 values this test has very little power, so do not read too&quot;)\nprint(&quot;much into either number. It is one input, not a decision procedure.&quot;)</code></pre>"
   },
   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. The arithmetic summary</h2>\n<p>Start with the summary most people would write without thinking, so you have\nsomething to compare against.</p>\n<p>Compute the arithmetic mean of the AUC values, the sample SD with <code>n - 1</code>, and\nthe ordinary coefficient of variation as a <strong>percent</strong>, which is\n<code>100 * SD / mean</code>.</p>\n<p>Keep these as plain Python floats rather than numpy scalars, which is what\n<code>float(...)</code> around the result does. It matters less than it used to, but it\nkeeps the printed output clean.</p>\n<p>Compare the mean you get against the median of the same data. The gap between\nthem is the skew, and it is the reason the rest of this problem exists.</p>\n<p>Fill in <code>arith_mean</code>, <code>arith_sd</code>, <code>arith_cv</code>, all plain floats.</p>\n<p>Moves: <code>np.mean</code>, <code>np.std(..., ddof=1)</code>, arithmetic, <code>float(...)</code>.</p><pre class=\"code\"><code># Part a. The arithmetic summary.\n\narith_mean = None   # YOUR CODE: arithmetic mean of auc\narith_sd = None     # YOUR CODE: sample SD, so ddof=1\narith_cv = None     # YOUR CODE: 100 * SD / mean\n\nprint(&quot;arithmetic mean : %s&quot; % arith_mean)\nprint(&quot;arithmetic SD   : %s&quot; % arith_sd)\nprint(&quot;CV percent      : %s&quot; % arith_cv)\nprint(&quot;median for comparison: %.3f&quot; % float(np.median(auc)))</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. The geometric summary</h2>\n<p>Now the summary that matches the shape of the data.</p>\n<p>The geometric mean is the arithmetic mean computed on the logs and then\nexponentiated back. The SD of the logs is a plain sample SD, computed on\n<code>np.log(auc)</code> rather than on <code>auc</code>. The geometric CV as a percent is\n<code>100 * sqrt(exp(sd_log**2) - 1)</code>.</p>\n<p>Two sanity checks once you have them. The geometric mean must come out at or\nbelow the arithmetic mean from part a, always, for any data with any spread in\nit. And it should land close to the median, because for lognormal data those\ntwo coincide.</p>\n<p>Note that the geometric CV cannot be obtained from <code>arith_mean</code> and\n<code>arith_sd</code>. It needs the SD of the logs, which is why this part computes\n<code>sd_log</code> explicitly rather than reusing anything from part a.</p>\n<p>Fill in <code>geo_mean</code>, <code>sd_log</code>, <code>geo_cv</code>, all plain floats.</p>\n<p>Moves: <code>np.log</code>, <code>np.exp</code>, <code>np.mean</code>, <code>np.std(..., ddof=1)</code>, <code>np.sqrt</code>.</p><pre class=\"code\"><code># Part b. The geometric summary.\n\ngeo_mean = None   # YOUR CODE: exp of the mean of the logs\nsd_log = None     # YOUR CODE: sample SD of the logs\ngeo_cv = None     # YOUR CODE: 100 * sqrt(exp(sd_log ** 2) - 1)\n\nprint(&quot;geometric mean : %s&quot; % geo_mean)\nprint(&quot;SD of logs     : %s&quot; % sd_log)\nprint(&quot;geometric CV   : %s&quot; % geo_cv)\nif geo_mean is not None and arith_mean is not None:\n    print(&quot;&quot;)\n    print(&quot;geometric %.3f &lt;= arithmetic %.3f ?&quot; % (geo_mean, arith_mean),\n          geo_mean &lt;= arith_mean)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Does the data actually back this up</h2>\n<p>You have asserted that AUC is lognormal because the biology says so. Check it\nagainst the data rather than leaving it as an article of faith.</p>\n<p>Run <code>stats.shapiro</code> twice: once on the raw AUC values and once on their logs.\nKeep the p value from each. Remember the direction: a <strong>small</strong> p is evidence\n<strong>against</strong> normality, so you expect the raw values to produce a small p and\nthe logs a large one.</p>\n<p>Then make the decision explicit. Set <code>use_log</code> to <code>True</code> if the logs look more\nnormal than the raw values do, judged by the p values being on opposite sides\nof 0.05, and <code>False</code> otherwise. Writing the rule down as code, before you see\nwhether you like the answer, is the discipline this part is really teaching.</p>\n<p>One caveat worth carrying forward. Twenty-four values is not many. Had this\ntest come back ambiguous, the right response would be to fall back on what is\nknown about exposure parameters rather than to let an underpowered test\noverrule the pharmacology.</p>\n<p>Fill in <code>p_raw</code>, <code>p_log</code>, both plain floats, and <code>use_log</code>, a single True or\nFalse.</p>\n<p>Moves: <code>stats.shapiro(x)</code>, <code>.pvalue</code>, <code>np.log</code>, a comparison.</p><pre class=\"code\"><code># Part c. Test normality on the raw values and on the logs.\n\np_raw = None    # YOUR CODE: shapiro p value for the raw AUC\np_log = None    # YOUR CODE: shapiro p value for the logged AUC\nuse_log = None  # YOUR CODE: True if the raw fails and the logs pass at 0.05\n\nprint(&quot;shapiro p, raw  : %s&quot; % p_raw)\nprint(&quot;shapiro p, logs : %s&quot; % p_log)\nprint(&quot;work on the log scale?&quot;, use_log)</code></pre>"
   }

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>import the fitter</td>\n<td><code>from scipy.optimize import curve_fit</code></td>\n</tr>\n<tr>\n<td>define a model</td>\n<td><code>def f(x, a, b): return a * np.exp(-b * x)</code>, x first</td>\n</tr>\n<tr>\n<td>fit it</td>\n<td><code>popt, pcov = curve_fit(f, xdata, ydata, p0=[guess_a, guess_b])</code></td>\n</tr>\n<tr>\n<td>the fitted parameters</td>\n<td><code>popt</code>, in the order of the function signature</td>\n</tr>\n<tr>\n<td>standard errors</td>\n<td><code>np.sqrt(np.diag(pcov))</code></td>\n</tr>\n<tr>\n<td>the diagonal of a matrix</td>\n<td><code>np.diag(m)</code></td>\n</tr>\n<tr>\n<td>predictions at the data points</td>\n<td><code>f(xdata, *popt)</code></td>\n</tr>\n<tr>\n<td>root mean squared error</td>\n<td><code>np.sqrt(np.mean(resid ** 2))</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>f(xdata, *popt)</code> unpacks the fitted array into the function's arguments, so\nit works whatever the number of parameters.</p>",

    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>One subject received a 500 mg intravenous bolus and was sampled nine times\nover 24 hours. An IV bolus into a single compartment gives the simplest curve\nin all of pharmacokinetics:</p>\n<pre><code>C(t) = C0 * exp(-k * t)\n</code></pre>\n<p>Two parameters. <code>C0</code> is the concentration the drug would have had at time zero\nif mixing were instant, and <code>k</code> is the elimination rate constant.</p>\n<p>In week 1 you got a rate constant by taking logs and fitting a straight line.\nThat works, but it quietly assumes the error is constant <strong>on the log scale</strong>,\nand it cannot give you an uncertainty on <code>C0</code> in the original units. Fitting\nthe curve directly by least squares is the general tool, and it comes with the\nthing a straight line fit on logs does not hand you: a standard error for each\nparameter.</p>"
   },
   {
    "key": "concept",
    "label": "curve_fit, starting values, and the covariance matrix",
    "html": "<h2>curve_fit, starting values, and the covariance matrix</h2>\n<p><strong>What curve_fit does.</strong> You hand it a model function, your x values and your\ny values, and it searches for the parameter values that minimise the sum of\nsquared differences between model and data. The model function must take the\nindependent variable <strong>first</strong> and the parameters after it:</p>\n<pre><code class=\"language-python\">def decay(t, c0, k):\n    return c0 * np.exp(-k * t)\n</code></pre>\n<p>curve_fit reads the parameter names and count from that signature, so the\norder you write them in is the order they come back in.</p>\n<p><strong>Why p0 matters more than people expect.</strong> The search is local. It walks\ndownhill from wherever you start, and if you do not say where to start it\nassumes every parameter is 1.0. For this model that means starting at\n<code>C0 = 1 mg/L</code> when the truth is near 50, and <code>k = 1 /h</code> when the truth is near\n0.1. Sometimes it recovers. Sometimes it walks into a flat region and returns\nsomething absurd, or raises <code>RuntimeError: Optimal parameters not found</code>.</p>\n<p>A starting guess does not need to be good, only the right order of magnitude,\nand you can almost always read one off the data: <code>C0</code> is roughly the first\nconcentration, and <code>k</code> is roughly <code>ln(2)</code> over an eyeballed half-life. Thirty\nseconds of looking saves a confusing failure.</p>\n<p><strong>The second return value is the useful one.</strong> <code>curve_fit</code> returns <code>popt</code>, the\nfitted parameters, and <code>pcov</code>, their covariance matrix. The diagonal of <code>pcov</code>\nholds the variance of each parameter, so</p>\n<pre><code class=\"language-python\">perr = np.sqrt(np.diag(pcov))\n</code></pre>\n<p>gives one standard error per parameter, in the parameter's own units. That is\nwhat turns \"k is 0.104\" into \"k is 0.104 with a standard error of 0.004\",\nwhich is the difference between a number and a result.</p>\n<p>The off-diagonal entries matter too: they say how much the parameters trade\noff against each other. A strong correlation between <code>C0</code> and <code>k</code> means the\ndata cannot separate them well, and that many different pairs fit almost as\nwell as the best one.</p>\n<p><strong>When to distrust <code>pcov</code>.</strong> If it comes back full of <code>inf</code>, the fit did not\nconverge properly or the model has more parameters than the data can support.\nThat is information, not a nuisance to round away.</p>"
   },

   {
    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>import the fitter</td>\n<td><code>from scipy.optimize import curve_fit</code></td>\n</tr>\n<tr>\n<td>define a model</td>\n<td><code>def f(x, a, b): return a * np.exp(-b * x)</code>, x first</td>\n</tr>\n<tr>\n<td>fit it</td>\n<td><code>popt, pcov = curve_fit(f, xdata, ydata, p0=[guess_a, guess_b])</code></td>\n</tr>\n<tr>\n<td>the fitted parameters</td>\n<td><code>popt</code>, in the order of the function signature</td>\n</tr>\n<tr>\n<td>standard errors</td>\n<td><code>np.sqrt(np.diag(pcov))</code></td>\n</tr>\n<tr>\n<td>the diagonal of a matrix</td>\n<td><code>np.diag(m)</code></td>\n</tr>\n<tr>\n<td>predictions at the data points</td>\n<td><code>f(xdata, *popt)</code></td>\n</tr>\n<tr>\n<td>root mean squared error</td>\n<td><code>np.sqrt(np.mean(resid ** 2))</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>f(xdata, *popt)</code> unpacks the fitted array into the function's arguments, so\nit works whatever the number of parameters.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy.optimize import curve_fit\n\n# A tiny made up decay. Nothing here is the answer.\ndemo_x = np.array([0.0, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0])\ndemo_y = np.array([9.8, 7.3, 5.3, 4.1, 3.0, 1.6, 0.9])\nprint(&quot;demo_x:&quot;, demo_x)\nprint(&quot;demo_y:&quot;, demo_y)\n\n\ndef demo_model(x, a, b):\n    &quot;&quot;&quot;The independent variable comes FIRST, then the parameters.&quot;&quot;&quot;\n    return a * np.exp(-b * x)\n\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. a fit with sensible starting values ---&quot;)\ndemo_popt, demo_pcov = curve_fit(demo_model, demo_x, demo_y, p0=[10.0, 0.3])\nprint(&quot;popt :&quot;, np.round(demo_popt, 5), &quot; &lt;- in the order (a, b) from the signature&quot;)\nprint(&quot;pcov shape:&quot;, demo_pcov.shape, &quot; &lt;- one row and column per parameter&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. standard errors come from the diagonal ---&quot;)\ndemo_perr = np.sqrt(np.diag(demo_pcov))\nprint(&quot;np.diag(pcov) :&quot;, np.round(np.diag(demo_pcov), 8))\nprint(&quot;standard errors:&quot;, np.round(demo_perr, 5))\nprint(&quot;so a = %.4f +/- %.4f and b = %.4f +/- %.4f&quot;\n      % (demo_popt[0], demo_perr[0], demo_popt[1], demo_perr[1]))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the off diagonal says how the parameters trade off ---&quot;)\ndemo_corr = demo_pcov[0, 1] / np.sqrt(demo_pcov[0, 0] * demo_pcov[1, 1])\nprint(&quot;correlation between a and b: %.3f&quot; % demo_corr)\nprint(&quot;close to zero means the data separates them well&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. what a bad starting guess can do ---&quot;)\ntry:\n    demo_bad, _ = curve_fit(demo_model, demo_x, demo_y, p0=[1.0, 50.0], maxfev=2000)\n    print(&quot;from p0=[1, 50] it returned:&quot;, np.round(demo_bad, 5))\n    print(&quot;compare with the good fit    :&quot;, np.round(demo_popt, 5))\nexcept RuntimeError as err:\n    print(&quot;from p0=[1, 50] it failed outright:&quot;, err)\nprint(&quot;&quot;)\nprint(&quot;the default p0 is all ones, which is rarely the right order of magnitude&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 5. predictions and residuals ---&quot;)\ndemo_pred = demo_model(demo_x, *demo_popt)\ndemo_resid = demo_y - demo_pred\nprint(&quot;predicted :&quot;, np.round(demo_pred, 3))\nprint(&quot;residuals :&quot;, np.round(demo_resid, 3))\nprint(&quot;rmse      : %.4f&quot; % float(np.sqrt(np.mean(demo_resid ** 2))))</code></pre>"
   },
   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Write the model and fit it</h2>\n<p>Define <code>decay(t, c0, k)</code> returning <code>c0 * np.exp(-k * t)</code>. The independent\nvariable has to come first and the parameters after it, in the order you want\nthem returned.</p>\n<p>Then fit it to the observed data with <code>curve_fit</code>, passing a starting guess.\nRead the guess off the data rather than inventing one: the first observed\nconcentration is a fair stand-in for <code>C0</code>, and the profile looks like it\nroughly halves every seven hours or so, which gives <code>k</code> near <code>ln(2) / 7</code>.\nAnything in the right order of magnitude will do.</p>\n<p>Keep both return values. The second one, <code>pcov</code>, is what part b needs, and\ndiscarding it is the most common way people end up reporting a parameter with\nno uncertainty attached.</p>\n<p>Fill in <code>decay</code>, the model function. <code>popt</code>, the fitted parameters. And\n<code>pcov</code>, the covariance matrix.</p>\n<p>Moves: <code>def</code>, <code>np.exp</code>, <code>curve_fit(f, xdata, ydata, p0=[...])</code>.</p><pre class=\"code\"><code># Part a. Define the model, then fit it.\n\ndef decay(t, c0, k):\n    &quot;&quot;&quot;Concentration after an IV bolus into one compartment.&quot;&quot;&quot;\n    return None   # YOUR CODE: c0 * exp(-k * t)\n\n\npopt = None   # YOUR CODE: fitted parameters from curve_fit, with a sensible p0\npcov = None   # YOUR CODE: the covariance matrix curve_fit also returns\n\nprint(&quot;popt:&quot;, popt)\nprint(&quot;pcov:&quot;, pcov)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Pull out the parameters and their standard errors</h2>\n<p><code>popt</code> holds the two fitted values in the order of your function signature, so\n<code>popt[0]</code> is <code>C0</code> and <code>popt[1]</code> is <code>k</code>.</p>\n<p>The standard errors are the square roots of the diagonal of <code>pcov</code>. Take the\ndiagonal with <code>np.diag</code>, then <code>np.sqrt</code> it, and you get one standard error per\nparameter in that parameter's own units: mg/L for <code>C0</code>, per hour for <code>k</code>.</p>\n<p>Look at the ratio of each estimate to its standard error when you have them.\nA parameter whose estimate is many times its standard error is well determined\nby the data. One whose standard error is a sizeable fraction of the estimate\nis not, and quoting it to three decimal places would be false precision.</p>\n<p>Fill in <code>c0_hat</code>, <code>k_hat</code>, <code>se_c0</code>, <code>se_k</code>, all plain floats.</p>\n<p>Moves: indexing <code>popt</code>, <code>np.diag</code>, <code>np.sqrt</code>, <code>float(...)</code>.</p><pre class=\"code\"><code># Part b. The fitted parameters and their standard errors.\n\nc0_hat = None   # YOUR CODE: fitted C0, mg/L\nk_hat = None    # YOUR CODE: fitted k, 1/h\nse_c0 = None    # YOUR CODE: standard error of C0\nse_k = None     # YOUR CODE: standard error of k\n\nif None not in (c0_hat, k_hat, se_c0, se_k):\n    print(&quot;C0 = %.4f +/- %.4f mg/L&quot; % (c0_hat, se_c0))\n    print(&quot;k  = %.5f +/- %.5f 1/h&quot; % (k_hat, se_k))\n    print(&quot;estimate over standard error: C0 %.1f, k %.1f&quot;\n          % (c0_hat / se_c0, k_hat / se_k))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. What the fit implies, and how well it fits</h2>\n<p>Two different questions, and it is worth keeping them apart.</p>\n<p><strong>What it implies.</strong> The half-life follows from <code>k</code> exactly as it did in week\n1: <code>ln(2) / k</code>. This is the number that goes in a report.</p>\n<p><strong>How well it fits.</strong> Predict the concentration at each observed time by\ncalling your model with the fitted parameters, <code>decay(times, *popt)</code>, which\nunpacks the array into the function's arguments. Subtract to get residuals,\nand summarise them with the root mean squared error, <code>sqrt(mean(resid**2))</code>.</p>\n<p>A small RMSE alone does not mean the model is right, which is worth saying\nplainly. Residuals should also look like noise: scattered either side of zero\nwith no pattern. A model that is systematically high early and low late can\nstill post a respectable RMSE while being the wrong shape, and the way you\ncatch that is by looking at the residuals rather than at their summary.</p>\n<p>Fill in <code>t_half</code> in hours, <code>pred</code>, the predicted concentration at each\nobserved time, and <code>rmse</code>, a plain float.</p>\n<p>Moves: <code>np.log(2) / k</code>, <code>decay(times, *popt)</code>, <code>np.sqrt</code>, <code>np.mean</code>.</p><pre class=\"code\"><code># Part c. Half-life, predictions, and the residual summary.\n\nt_half = None   # YOUR CODE: ln(2) / k, in hours\npred = None     # YOUR CODE: predicted concentration at each observed time\nrmse = None     # YOUR CODE: root mean squared error of the residuals\n\nprint(&quot;half-life : %s h&quot; % t_half)\nprint(&quot;predicted :&quot;, None if pred is None else np.round(pred, 3))\nprint(&quot;observed  :&quot;, obs[&quot;CONC_MG_L&quot;].to_numpy())\nprint(&quot;rmse      : %s&quot; % rmse)</code></pre>"
   }

  "toolkit": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>import the solver</td>\n<td><code>from scipy.integrate import solve_ivp</code></td>\n</tr>\n<tr>\n<td>write a derivative</td>\n<td><code>def rhs(t, y, a): return [-a * y[0]]</code>, t first, y an array</td>\n</tr>\n<tr>\n<td>solve it</td>\n<td><code>solve_ivp(rhs, (0, 24), [y0], t_eval=grid, args=(a,))</code></td>\n</tr>\n<tr>\n<td>the times it reported at</td>\n<td><code>sol.t</code></td>\n</tr>\n<tr>\n<td>the first state over time</td>\n<td><code>sol.y[0]</code>, one row per state</td>\n</tr>\n<tr>\n<td>did it work</td>\n<td><code>sol.success</code></td>\n</tr>\n<tr>\n<td>stop it striding over a jump</td>\n<td><code>max_step=0.05</code></td>\n</tr>\n<tr>\n<td>largest absolute difference</td>\n<td><code>np.max(np.abs(a - b))</code></td>\n</tr>\n<tr>\n<td>where the maximum is</td>\n<td><code>np.argmax(x)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>y0</code> must be a sequence even with one compartment, so <code>[500.0]</code>, not <code>500.0</code>.\n<code>sol.y</code> is always two dimensional, so <code>sol.y[0]</code> is how you get the first\ncompartment out.</p>",

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>So far every profile you have worked with was a formula you could evaluate\ndirectly. That stops being possible very quickly: add a second compartment,\nsaturable elimination, a transit absorption chain or a PD effect feeding back\non clearance, and there is no closed form left to write down.</p>\n<p>What there always is, is a differential equation. A one compartment model says\nsomething simple about <strong>rates</strong>: the amount in the body falls at a rate\nproportional to how much is there.</p>\n<pre><code>dA/dt = -(CL / V) * A\n</code></pre>\n<p>Numerical integration turns that statement into a curve. This problem works\nthrough it on a case you can check, an IV bolus, where the exact answer is\nknown, so you can confirm the machinery before trusting it somewhere you\ncannot check. Then you do an infusion, where the dosing rate switches off part\nway through, which is where naive integration quietly goes wrong.</p>"
   },
   {
    "key": "concept",
    "label": "solve_ivp, and why discontinuities need care",
    "html": "<h2>solve_ivp, and why discontinuities need care</h2>\n<p><strong>The shape of the call.</strong> <code>solve_ivp(fun, t_span, y0, ...)</code> needs three\nthings: a function giving the derivative, the interval to integrate over as a\npair, and the starting state as a <strong>sequence</strong>, even with one compartment, so\n<code>[500.0]</code> rather than <code>500.0</code>.</p>\n<p>The derivative function takes <code>(t, y)</code> in that order, with <code>y</code> an array of\nstates, and returns the derivatives in the same order. For one compartment:</p>\n<pre><code class=\"language-python\">def rhs(t, y, cl, v):\n    amount = y[0]\n    return [-(cl / v) * amount]\n</code></pre>\n<p>Extra parameters are passed through with <code>args=(cl, v)</code>.</p>\n<p><strong><code>t_eval</code> controls output, not accuracy.</strong> By default the solver returns the\npoints it happened to step through, which are chosen for efficiency and are\nnot evenly spaced. Passing <code>t_eval=np.linspace(...)</code> makes it report at the\ntimes you want. It does not make the answer more accurate, it only changes\nwhere it is sampled.</p>\n<p><strong>Accuracy is controlled by <code>rtol</code> and <code>atol</code>, and the defaults are loose.</strong>\n<code>rtol=1e-3</code> means the solver is content with roughly three correct digits,\nwhich is fine for a quick sketch and not fine for anything you will compare\nagainst data or integrate to get an AUC. For PK work pass something like\n<code>rtol=1e-8, atol=1e-10</code>. It costs a few milliseconds and removes solver error\nas a thing you have to think about. You will see the difference in part b: on\nthe defaults the numerical and exact curves differ in the third decimal, and\nwith tight tolerances they agree to about eight.</p>\n<p>The result carries <code>sol.t</code>, <code>sol.y</code> with one <strong>row per state</strong>, so\n<code>sol.y[0]</code> is the first compartment, and <code>sol.success</code>, which is worth\nchecking rather than assuming.</p>\n<p><strong>Amounts versus concentrations.</strong> The state is an amount in mg, because that\nis what mass balance is written in. Concentration is amount divided by volume.\nMixing the two up is the single most common error in writing PK models, and\nit does not announce itself: the curve looks perfectly plausible, just scaled\nwrong by a factor of V.</p>\n<p><strong>The discontinuity problem.</strong> An infusion that stops at 2 hours makes the\nderivative jump. Adaptive solvers choose their step size by looking at how\nsmooth the solution has been, so a solver happily taking one hour steps can\nstep straight over the moment the infusion ended, never sampling the jump, and\nreturn a curve that keeps rising past the end of the infusion.</p>\n<p>Nothing errors. <code>sol.success</code> is still <code>True</code>. The answer is just wrong.</p>\n<p>Two fixes. Cap the step size with <code>max_step</code> so the solver cannot stride over\nthe event, which is the blunt and reliable option. Or integrate each phase\nseparately and hand the end state of one in as the start of the next, which is\nexact and is what real PK software does. You will use <code>max_step</code> here, but\nknowing why it is needed matters more than the argument itself.</p>"
   },

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom scipy.integrate import solve_ivp\n\nPROBLEM_ID = &quot;W3D4&quot;\nTOPIC = &quot;scipy.integrate: solve_ivp, t_eval, checking against an analytic solution&quot;\n\n# A one compartment model. No noise anywhere: this problem is about the\n# machinery being right, so everything is exactly checkable.\nCL_L_H = 4.20      # clearance, L/h\nV_L = 40.0         # volume of distribution, L\nK_EL = CL_L_H / V_L\n\nDOSE_MG = 500.0            # IV bolus\nT_GRID = np.linspace(0.0, 24.0, 97)        # every 15 minutes\n\nINF_DOSE_MG = 500.0        # the same dose, given as an infusion\nINF_DURATION_H = 2.0\nINF_RATE_MG_H = INF_DOSE_MG / INF_DURATION_H\nT_GRID_INF = np.linspace(0.0, 12.0, 241)   # every 3 minutes\n\nprint(&quot;CL = %.2f L/h   V = %.1f L   k = CL/V = %.5f 1/h&quot; % (CL_L_H, V_L, K_EL))\nprint(&quot;bolus    : %.0f mg at t = 0&quot; % DOSE_MG)\nprint(&quot;infusion : %.0f mg over %.0f h, so %.1f mg/h&quot;\n      % (INF_DOSE_MG, INF_DURATION_H, INF_RATE_MG_H))\nprint(&quot;&quot;)\nprint(&quot;bolus output grid :&quot;, T_GRID[:4], &quot;...&quot;, T_GRID[-1], &quot; (%d points)&quot; % T_GRID.size)\nprint(&quot;infusion grid     :&quot;, T_GRID_INF[:4], &quot;...&quot;, T_GRID_INF[-1],\n      &quot; (%d points)&quot; % T_GRID_INF.size)</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>import the solver</td>\n<td><code>from scipy.integrate import solve_ivp</code></td>\n</tr>\n<tr>\n<td>write a derivative</td>\n<td><code>def rhs(t, y, a): return [-a * y[0]]</code>, t first, y an array</td>\n</tr>\n<tr>\n<td>solve it</td>\n<td><code>solve_ivp(rhs, (0, 24), [y0], t_eval=grid, args=(a,))</code></td>\n</tr>\n<tr>\n<td>the times it reported at</td>\n<td><code>sol.t</code></td>\n</tr>\n<tr>\n<td>the first state over time</td>\n<td><code>sol.y[0]</code>, one row per state</td>\n</tr>\n<tr>\n<td>did it work</td>\n<td><code>sol.success</code></td>\n</tr>\n<tr>\n<td>stop it striding over a jump</td>\n<td><code>max_step=0.05</code></td>\n</tr>\n<tr>\n<td>largest absolute difference</td>\n<td><code>np.max(np.abs(a - b))</code></td>\n</tr>\n<tr>\n<td>where the maximum is</td>\n<td><code>np.argmax(x)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>y0</code> must be a sequence even with one compartment, so <code>[500.0]</code>, not <code>500.0</code>.\n<code>sol.y</code> is always two dimensional, so <code>sol.y[0]</code> is how you get the first\ncompartment out.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy.integrate import solve_ivp\n\n# A tiny made up decay, nothing to do with the real parameters.\ndemo_k = 0.4\n\n\ndef demo_rhs(t, y, k):\n    &quot;&quot;&quot;dy/dt = -k * y. t first, y is an ARRAY, return a sequence.&quot;&quot;&quot;\n    return [-k * y[0]]\n\n\nprint(&quot;--- 1. a basic solve ---&quot;)\ndemo_grid = np.linspace(0.0, 5.0, 6)\ndemo_sol = solve_ivp(demo_rhs, (0.0, 5.0), [100.0], t_eval=demo_grid, args=(demo_k,))\nprint(&quot;success :&quot;, demo_sol.success)\nprint(&quot;sol.t   :&quot;, demo_sol.t)\nprint(&quot;sol.y shape:&quot;, demo_sol.y.shape, &quot; &lt;- one ROW per state&quot;)\nprint(&quot;sol.y[0]:&quot;, np.round(demo_sol.y[0], 4))\nprint(&quot;exact   :&quot;, np.round(100.0 * np.exp(-demo_k * demo_grid), 4))\nprint(&quot;max abs error: %.3e&quot; % float(np.max(np.abs(demo_sol.y[0]\n                                                  - 100.0 * np.exp(-demo_k * demo_grid)))))\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. without t_eval you get the solver&#x27;s own steps ---&quot;)\ndemo_bare = solve_ivp(demo_rhs, (0.0, 5.0), [100.0], args=(demo_k,))\nprint(&quot;times chosen by the solver:&quot;, np.round(demo_bare.t, 3))\nprint(&quot;they are not evenly spaced, which is fine for accuracy but awkward to plot&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. a discontinuous input, and what goes wrong ---&quot;)\n\n\ndef demo_inf_rhs(t, y, k, rate, t_off):\n    &quot;&quot;&quot;Zero order input that stops at t_off.&quot;&quot;&quot;\n    r = rate if t &lt; t_off else 0.0\n    return [r - k * y[0]]\n\n\ndemo_t = np.linspace(0.0, 6.0, 61)\ndemo_loose = solve_ivp(demo_inf_rhs, (0.0, 6.0), [0.0], t_eval=demo_t,\n                       args=(demo_k, 50.0, 2.0))\ndemo_tight = solve_ivp(demo_inf_rhs, (0.0, 6.0), [0.0], t_eval=demo_t,\n                       args=(demo_k, 50.0, 2.0), max_step=0.05)\nprint(&quot;both report success:&quot;, demo_loose.success, demo_tight.success)\nprint(&quot;peak without max_step: %.4f at t = %.2f&quot;\n      % (demo_loose.y[0].max(), demo_t[int(np.argmax(demo_loose.y[0]))]))\nprint(&quot;peak with max_step   : %.4f at t = %.2f&quot;\n      % (demo_tight.y[0].max(), demo_t[int(np.argmax(demo_tight.y[0]))]))\nprint(&quot;the true peak is at t = 2.00, when the input stops&quot;)\nprint(&quot;&quot;)\nprint(&quot;the loose solve can keep climbing past the switch off, because its step&quot;)\nprint(&quot;size was chosen while the solution was smooth and nothing told it a jump&quot;)\nprint(&quot;was coming. No error, no warning, just a wrong curve.&quot;)</code></pre>"

e:\n    print(&quot;conc at 0, 6, 12, 24 h:&quot;, np.round(conc_num[[0, 24, 48, 96]], 4))</code></pre>"

    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Check it against the answer you already know</h2>\n<p>An IV bolus into one compartment has an exact solution, so you can measure how\nwell the integration did rather than hoping.</p>\n<pre><code>C(t) = (dose / V) * exp(-(CL / V) * t)\n</code></pre>\n<p>Compute that on the same <code>T_GRID</code>, then take the largest absolute difference\nbetween the two curves across all 97 points.</p>\n<p>You should get something tiny, around ten to the minus eight. That number is\nthe whole point of this part: it is evidence the machinery is assembled\ncorrectly. If instead you get something near five thousandths, your solve ran\non the default tolerances and <code>rtol</code> never got passed. When you move to a two compartment model next week, there\nis no exact answer to compare against, and the only reason to trust the result\nis that you checked the method somewhere you could.</p>\n<p>If the error comes out large and roughly proportional to the values\nthemselves, suspect the volume division rather than the solver.</p>\n<p>Fill in <code>conc_exact</code>, the analytic concentration at each time in <code>T_GRID</code>, and\n<code>max_abs_err</code>, a single number.</p>\n<p>Moves: <code>np.exp</code>, <code>np.abs</code>, <code>np.max</code>.</p><pre class=\"code\"><code># Part b. The exact solution, and how far the numerical one strayed.\n\nconc_exact = None    # YOUR CODE: (dose / V) * exp(-(CL/V) * t) on T_GRID\nmax_abs_err = None   # YOUR CODE: largest absolute difference from conc_num\n\nprint(&quot;exact at 0, 6, 12, 24 h:&quot;,\n      None if conc_exact is None else np.round(conc_exact[[0, 24, 48, 96]], 4))\nprint(&quot;max absolute error:&quot;, max_abs_err)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>An in vitro assay measured percent inhibition of a target enzyme across ten\ncompound concentrations spanning four orders of magnitude, three replicate\nwells at each concentration.</p>\n<p>The relationship between concentration and effect is not a straight line and\nnever will be. There is a floor, because zero drug gives zero effect, and a\nceiling, because once every enzyme molecule is occupied there is nothing left\nto inhibit. In between the curve rises. That shape is the Emax model, and it\nis the most used equation in pharmacology:</p>\n<pre><code>E = Emax * C / (EC50 + C)\n</code></pre>\n<p><code>Emax</code> is the ceiling and <code>EC50</code> is the concentration giving half of it. Many\nreal curves rise more steeply than this allows, so a third parameter is added,\nthe Hill coefficient, giving the sigmoid Emax model. Your job is to fit both\nand work out whether the extra parameter earns its place.</p>"
   },
   {
    "key": "concept",
    "label": "Two curves, three parameters, and the trap in comparing them",
    "html": "<h2>Two curves, three parameters, and the trap in comparing them</h2>\n<p><strong>The Emax model.</strong> <code>E = Emax * C / (EC50 + C)</code> is the same hyperbola as\nMichaelis-Menten kinetics and as simple receptor occupancy, which is not a\ncoincidence: all three describe a fixed number of binding sites filling up.\nAt <code>C = EC50</code> the effect is exactly half of <code>Emax</code>, which is what makes EC50\ninterpretable. Note it is a <strong>concentration</strong>, in the same units as <code>C</code>, so it\nbelongs on a log axis and is reported as a single number, not a percentage.</p>\n<p><strong>The sigmoid Emax model</strong> adds a Hill coefficient <code>h</code>:</p>\n<pre><code>E = Emax * C**h / (EC50**h + C**h)\n</code></pre>\n<p>With <code>h = 1</code> it collapses back to the plain Emax model, which makes the two\n<strong>nested</strong>: the simpler one is a special case of the richer one. <code>h</code> controls\nsteepness. Above 1 the curve switches on more abruptly, which can come from\ncooperative binding, from several binding events being needed, or simply from\nthe assay compressing its own dynamic range. Below 1 it is shallower than mass\naction alone would give.</p>\n<p><strong>Why fitting this needs care.</strong> Concentrations spanning four orders of\nmagnitude mean <code>C**h</code> spans sixteen, and the optimiser can easily wander\nsomewhere <code>EC50</code> goes negative, which is meaningless, or <code>h</code> explodes.\n<code>bounds=</code> keeps the search in the region where the parameters mean something:\nall three are positive, <code>Emax</code> cannot sensibly exceed 100 percent inhibition\nby much. Bounds are not cheating, they are stating what you already know.</p>\n<p>Start <code>EC50</code> near the concentration where the response passes half its\nmaximum, read off the data by eye. Starting it at the default 1.0 when the\ntruth is 0.0008 is how fits fail.</p>\n<p><strong>The trap in comparing them.</strong> A model with more parameters <strong>always</strong> fits\nthe data it was fitted to at least as well. The sigmoid will never have a\nlarger residual sum of squares than the plain Emax, so \"the RMSE went down\"\nis not evidence of anything, it is arithmetic. Judging an extra parameter\nneeds something that charges for it: an F test for nested models, an\ninformation criterion like AIC, or held-out data. You will compute both RMSEs\nhere so you can see the improvement, and the point of the exercise is knowing\nthat the improvement alone does not settle the question.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport pandas as pd\nfrom scipy.optimize import curve_fit\n\nPROBLEM_ID = &quot;W3D5&quot;\nTOPIC = &quot;scipy.optimize: Emax models, bounds, and comparing nested fits&quot;\n\nrng = np.random.default_rng(3105)\n\n# Ten concentrations, evenly spaced on a log scale, three wells each.\nCONCS = np.round(np.logspace(-2.0, 2.0, 10), 4)      # micromolar\nN_REPLICATES = 3\n\n# The truth: a ceiling near 96 percent, EC50 of 0.8 uM, and a steep Hill slope.\n_TRUE_EMAX, _TRUE_EC50, _TRUE_H = 96.0, 0.80, 1.7\n_signal = _TRUE_EMAX * CONCS ** _TRUE_H / (_TRUE_EC50 ** _TRUE_H + CONCS ** _TRUE_H)\n\n_rows = []\nfor _c, _mu in zip(CONCS, _signal):\n    for _rep in range(1, N_REPLICATES + 1):\n        _rows.append((_c, _rep, round(float(np.clip(_mu + rng.normal(0.0, 3.2), 0.0, 100.0)), 2)))\n\nassay = pd.DataFrame(_rows, columns=[&quot;CONC_UM&quot;, &quot;REPLICATE&quot;, &quot;INHIB_PCT&quot;])\n\nprint(&quot;assay:&quot;, assay.shape, &quot; ten concentrations, three wells each&quot;)\nprint(assay.head(9).to_string(index=False))\nprint(&quot;&quot;)\nprint(&quot;concentrations:&quot;, CONCS)</code></pre>"

    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>mean and SD per concentration</td>\n<td><code>.groupby(\"CONC_UM\").agg(M=(\"E\", \"mean\"), S=(\"E\", \"std\"))</code></td>\n</tr>\n<tr>\n<td>the Emax model</td>\n<td><code>emax * c / (ec50 + c)</code></td>\n</tr>\n<tr>\n<td>the sigmoid Emax model</td>\n<td><code>emax * c ** h / (ec50 ** h + c ** h)</code></td>\n</tr>\n<tr>\n<td>fit with a starting guess</td>\n<td><code>curve_fit(f, x, y, p0=[...])</code></td>\n</tr>\n<tr>\n<td>keep parameters sensible</td>\n<td><code>curve_fit(..., bounds=([0, 0], [200, 1000]))</code></td>\n</tr>\n<tr>\n<td>predictions</td>\n<td><code>f(x, *popt)</code></td>\n</tr>\n<tr>\n<td>root mean squared error</td>\n<td><code>np.sqrt(np.mean((y - pred) ** 2))</code></td>\n</tr>\n<tr>\n<td>log spaced values</td>\n<td><code>np.logspace(-2, 2, 10)</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>bounds</code> takes a pair of sequences, lower bounds then upper bounds, one entry\nper parameter in signature order. Use <code>np.inf</code> for an upper bound you do not\nwant to set.</p><pre class=\"code\"><code>import numpy as np\nfrom scipy.optimize import curve_fit\n\n# A tiny made up concentration response. Nothing here is the answer.\ndemo_c = np.array([0.01, 0.1, 0.3, 1.0, 3.0, 10.0, 100.0])\ndemo_e = np.array([0.4, 4.0, 11.0, 29.0, 52.0, 68.0, 74.0])\nprint(&quot;demo_c:&quot;, demo_c)\nprint(&quot;demo_e:&quot;, demo_e)\n\n\ndef demo_emax(c, emax, ec50):\n    &quot;&quot;&quot;Plain Emax. Half the ceiling is reached at c = ec50.&quot;&quot;&quot;\n    return emax * c / (ec50 + c)\n\n\ndef demo_sigmoid(c, emax, ec50, h):\n    &quot;&quot;&quot;Sigmoid Emax. h = 1 gives the plain model back.&quot;&quot;&quot;\n    return emax * c ** h / (ec50 ** h + c ** h)\n\n\nprint(&quot;&quot;)\nprint(&quot;--- 1. reading starting values off the data ---&quot;)\ndemo_top = demo_e.max()\ndemo_half = demo_c[int(np.argmin(np.abs(demo_e - demo_top / 2.0)))]\nprint(&quot;highest response seen : %.1f  &lt;- a guess for Emax&quot; % demo_top)\nprint(&quot;concentration nearest half of that: %.3f  &lt;- a guess for EC50&quot; % demo_half)\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. fitting both models ---&quot;)\ndemo_p1, _ = curve_fit(demo_emax, demo_c, demo_e, p0=[demo_top, demo_half],\n                       bounds=([0.0, 1e-6], [200.0, 1e4]))\ndemo_p2, _ = curve_fit(demo_sigmoid, demo_c, demo_e, p0=[demo_top, demo_half, 1.0],\n                       bounds=([0.0, 1e-6, 0.1], [200.0, 1e4, 10.0]))\nprint(&quot;Emax model   : Emax = %.2f  EC50 = %.4f&quot; % (demo_p1[0], demo_p1[1]))\nprint(&quot;sigmoid model: Emax = %.2f  EC50 = %.4f  h = %.3f&quot; % (demo_p2[0], demo_p2[1], demo_p2[2]))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. the extra parameter ALWAYS fits at least as well ---&quot;)\ndemo_r1 = float(np.sqrt(np.mean((demo_e - demo_emax(demo_c, *demo_p1)) ** 2)))\ndemo_r2 = float(np.sqrt(np.mean((demo_e - demo_sigmoid(demo_c, *demo_p2)) ** 2)))\nprint(&quot;rmse, Emax model    : %.4f&quot; % demo_r1)\nprint(&quot;rmse, sigmoid model : %.4f&quot; % demo_r2)\nprint(&quot;sigmoid is never worse: %s&quot; % (demo_r2 &lt;= demo_r1 + 1e-9))\nprint(&quot;&quot;)\nprint(&quot;that is guaranteed by the models being nested, so it is not evidence&quot;)\nprint(&quot;that the third parameter is real&quot;)\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. what bounds are for ---&quot;)\ntry:\n    demo_bad, _ = curve_fit(demo_sigmoid, demo_c, demo_e, p0=[1.0, 1.0, 1.0], maxfev=4000)\n    print(&quot;unbounded from a poor p0:&quot;, np.round(demo_bad, 4))\n    print(&quot;an EC50 at or below zero would be meaningless, which bounds prevent&quot;)\nexcept RuntimeError as err:\n    print(&quot;unbounded from a poor p0 failed:&quot;, err)</code></pre>"

    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. Aggregate the replicate wells</h2>\n<p>Three wells were run at each concentration, so there are three rows per\nconcentration. Reduce them to one point each before fitting.</p>\n<p>This is the same unit-of-replication idea as week 1, in a different costume.\nThe wells are technical replicates of one condition, not independent samples\nof the concentration response, so the curve is fitted through the ten\ncondition means rather than through thirty wells. Fitting all thirty would\nweight each concentration by how many wells happened to survive, and would\nmake the fit look more certain than it is.</p>\n<p>Keep the SD as well. You are not using it in the fit here, but a concentration\nwhose replicates disagree wildly is one you want to notice.</p>\n<p>Fill in <code>agg</code>, sorted by concentration, index renumbered, with exactly:</p>\n<table>\n<thead>\n<tr>\n<th>column</th>\n<th>meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>CONC_UM</code></td>\n<td>concentration in micromolar</td>\n</tr>\n<tr>\n<td><code>MEAN_PCT</code></td>\n<td>mean percent inhibition across the wells</td>\n</tr>\n<tr>\n<td><code>SD_PCT</code></td>\n<td>sample SD across the wells</td>\n</tr>\n<tr>\n<td><code>N</code></td>\n<td>how many wells</td>\n</tr>\n</tbody>\n</table>\n<p>Moves: <code>.groupby(\"CONC_UM\").agg(NAME=(\"COL\", \"mean\"), ...)</code>,\n<code>.reset_index()</code>, <code>.sort_values(...)</code>.</p><pre class=\"code\"><code># Part a. One point per concentration.\n\nagg = None   # YOUR CODE: CONC_UM, MEAN_PCT, SD_PCT, N\n\nprint(agg)</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. Fit the plain Emax model</h2>\n<p>Define <code>emax_model(c, emax, ec50)</code> returning <code>emax * c / (ec50 + c)</code>.\nConcentration first, parameters after, as always.</p>\n<p>Fit it to the aggregated means. Read the starting values off the data rather\nthan guessing blind: the largest mean response is a fair guess for <code>Emax</code>, and\nthe concentration whose response is nearest half of that is a fair guess for\n<code>EC50</code>. Both are one line each.</p>\n<p>Pass <code>bounds</code> too. Both parameters are physically positive, and an <code>Emax</code>\nabove about 200 percent inhibition is not a thing, so\n<code>bounds=([0, 1e-6], [200, 1e4])</code> states what you already know and keeps the\noptimiser out of nonsense. A lower bound of exactly zero on <code>EC50</code> would let\nit sit on the boundary and divide badly, which is why the tiny positive floor\nis there.</p>\n<p>Then measure the fit: predict at the ten concentrations and compute the RMSE\nagainst the observed means.</p>\n<p>Fill in <code>emax_model</code>, <code>emax1</code>, <code>ec50_1</code>, <code>rmse1</code>.</p>\n<p>Moves: <code>def</code>, <code>curve_fit(f, x, y, p0=[...], bounds=(...))</code>, <code>f(x, *popt)</code>,\n<code>np.sqrt(np.mean(resid ** 2))</code>.</p><pre class=\"code\"><code># Part b. The plain Emax model.\n\ndef emax_model(c, emax, ec50):\n    &quot;&quot;&quot;Plain Emax: half of emax is reached at c = ec50.&quot;&quot;&quot;\n    return None   # YOUR CODE\n\n\nemax1 = None    # YOUR CODE: fitted Emax, percent\nec50_1 = None   # YOUR CODE: fitted EC50, micromolar\nrmse1 = None    # YOUR CODE: RMSE of this fit against MEAN_PCT\n\nprint(&quot;Emax model: Emax = %s  EC50 = %s  rmse = %s&quot; % (emax1, ec50_1, rmse1))</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Fit the sigmoid, and compare honestly</h2>\n<p>Define <code>sigmoid_model(c, emax, ec50, h)</code> returning\n<code>emax * c ** h / (ec50 ** h + c ** h)</code>.</p>\n<p>Fit it the same way, with a third starting value of <code>1.0</code> for <code>h</code>, which is\nthe plain model, so you are starting from \"no extra steepness\" and letting the\ndata move it if it wants to. Extend the bounds with a sensible range for <code>h</code>,\nsay 0.1 to 10: below 0.1 the curve is barely a curve, above 10 it is a step\nfunction and the fit stops being identifiable.</p>\n<p>Compute the RMSE the same way as part b.</p>\n<p>Then look at the two numbers together, and keep your head. <code>rmse2</code> will be\nless than or equal to <code>rmse1</code>. That is guaranteed, because <code>h = 1</code> is\navailable to the sigmoid, so it can always reproduce the simpler fit and will\nonly move away if doing so helps. The question worth asking is whether the\nfitted <code>h</code> is far enough from 1, relative to its own uncertainty, to be worth\ncarrying, and the RMSE comparison on its own cannot answer that.</p>\n<p>Fill in <code>sigmoid_model</code>, <code>emax2</code>, <code>ec50_2</code>, <code>hill</code>, <code>rmse2</code>.</p>\n<p>Moves: <code>def</code>, <code>curve_fit(f, x, y, p0=[...], bounds=(...))</code>, <code>f(x, *popt)</code>,\n<code>np.sqrt(np.mean(resid ** 2))</code>.</p><pre class=\"code\"><code># Part c. The sigmoid Emax model, and the comparison.\n\ndef sigmoid_model(c, emax, ec50, h):\n    &quot;&quot;&quot;Sigmoid Emax. h = 1 gives the plain model back.&quot;&quot;&quot;\n    return None   # YOUR CODE\n\n\nemax2 = None    # YOUR CODE: fitted Emax\nec50_2 = None   # YOUR CODE: fitted EC50\nhill = None     # YOUR CODE: fitted Hill coefficient\nrmse2 = None    # YOUR CODE: RMSE of this fit\n\nprint(&quot;sigmoid: Emax = %s  EC50 = %s  h = %s  rmse = %s&quot; % (emax2, ec50_2, hill, rmse2))\nif None not in (rmse1, rmse2):\n    print(&quot;&quot;)\n    print(&quot;rmse went from %.4f to %.4f&quot; % (rmse1, rmse2))\n    print(&quot;the richer model is never worse, which is why this alone proves nothing&quot;)</code></pre>"

   {
    "key": "scenario",
    "label": "Scenario",
    "html": "<h2>Scenario</h2>\n<p>You have two fields of view from a fluorescence experiment. Same slide, same\nantibody, same cells. The second one was imaged after the lamp had warmed up\nand drifted, so it is noticeably brighter overall.</p>\n<p>An image is just an array of numbers, so every tool from week 1 applies\nunchanged. What is new is the question: which pixels are cell and which are\nbackground. That decision is called <strong>segmentation</strong>, and everything\ndownstream, every count and every intensity measurement, inherits whatever you\ndecide here.</p>\n<p>The naive approach is to pick a brightness number and call anything above it a\ncell. It works beautifully on the image you tuned it on, and falls apart on\nthe next one, which is exactly the situation these two fields are set up to\ndemonstrate.</p>"
   },
   {
    "key": "concept",
    "label": "Images are arrays, and thresholds should be computed rather than chosen",
    "html": "<h2>Images are arrays, and thresholds should be computed rather than chosen</h2>\n<p><strong>An image is a numpy array.</strong> A greyscale image is 2D, indexed <code>[row,\ncolumn]</code>, with row 0 at the <strong>top</strong>. <code>img.shape</code> is <code>(height, width)</code>.\nMicroscope images usually arrive as <code>uint8</code>, whole numbers from 0 to 255, or\n<code>uint16</code> for a better camera. Everything you know about slicing, masking and\n<code>axis</code> works without modification, because there is nothing special about an\nimage other than what it depicts.</p>\n<p>One trap worth knowing: <code>uint8</code> arithmetic <strong>wraps around</strong>. <code>np.uint8(250) +\nnp.uint8(10)</code> gives 4, not 260. Convert to float before doing arithmetic you\ncare about.</p>\n<p><strong>A threshold turns an image into a mask.</strong> <code>img &gt; t</code> gives a boolean array of\nthe same shape, True where the pixel is bright enough. That boolean array is\nthe mask, and <code>mask.sum()</code> counts foreground pixels because True counts as 1.\nThe fraction of the field that is foreground is <code>mask.mean()</code>.</p>\n<p><strong>Why a hard-coded threshold is a trap.</strong> A fixed number encodes the exposure,\nthe lamp intensity and the gain of the one image you tuned it on. Lamps drift,\ngain gets adjusted, a different day gives a different background. The number\nthat gave a perfect mask on Monday silently includes half the background on\nTuesday, and nothing errors. You just get more cells.</p>\n<p><strong>Otsu computes the threshold from the image itself.</strong> It assumes the\nhistogram has two humps, background and foreground, and picks the cut that\nbest separates them, formally the one minimising the variance within each\ngroup. Because it is derived from each image separately, it moves when the\nillumination moves, which is the entire point.</p>\n<p>Otsu's assumption matters: it expects two populations. On an image that is\nalmost all background, with only a handful of cells, the histogram has one\nhump and Otsu will cut it somewhere arbitrary. Always look at what you got.</p>\n<p><strong>Smooth before you threshold.</strong> Camera noise is pixel-level and independent,\nso thresholding raw data scatters isolated bright pixels across the\nbackground, and each one becomes a tiny spurious object. A small Gaussian blur\naverages each pixel with its neighbours, which flattens that noise while\nleaving real objects, because real objects are many pixels across. The cost is\nslightly blurred edges, which is a good trade. The rule of thumb is a sigma\nwell below the size of the things you are measuring.</p>"
   },

    "key": "task",
    "label": "Your task",
    "html": "<h2>Your task</h2>\n<p>Three parts, worked one at a time.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What you work out</th>\n<th>Variables to fill in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a</td>\n<td>an Otsu threshold and the mask it gives</td>\n<td><code>otsu_t</code>, <code>mask</code>, <code>n_fg</code>, <code>frac_fg</code></td>\n</tr>\n<tr>\n<td>b</td>\n<td>what a fixed threshold does on a brighter field</td>\n<td><code>otsu_t2</code>, <code>frac_otsu_2</code>, <code>frac_fixed_2</code></td>\n</tr>\n<tr>\n<td>c</td>\n<td>smoothing first, and the speckle it removes</td>\n<td><code>smoothed</code>, <code>mask_smooth</code>, <code>n_obj_raw</code>, <code>n_obj_smooth</code></td>\n</tr>\n</tbody>\n</table>\n<p>Below this you will find the <strong>Setup</strong> cell, then a <strong>Toolkit</strong> cell that\ndemonstrates every move on a tiny made up example, then <strong>Part a</strong>, <strong>Part b</strong>\nand <strong>Part c</strong>, each with its own explanation and a cell to write in.</p>"

    "key": "setup",
    "label": "Setup",
    "html": "<pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nfrom skimage import draw, filters, measure\n\nPROBLEM_ID = &quot;W4D1&quot;\nTOPIC = &quot;scikit-image: images as arrays, Otsu thresholding, smoothing before you threshold&quot;\n\nIMG_SIZE = 256\nFIXED_T = 110          # a threshold someone tuned on field 1 and wrote into a script\n\n\ndef make_field(seed, n_cells=26, background=42.0, cell_peak=150.0, noise=9.0,\n               n_hot=130):\n    &quot;&quot;&quot;Build one synthetic fluorescence field of view, as uint8.\n\n    n_hot adds isolated very bright pixels, which is what a real sensor gives\n    you from hot pixels and photon shot noise.\n    &quot;&quot;&quot;\n    rng = np.random.default_rng(seed)\n    img = np.full((IMG_SIZE, IMG_SIZE), background, dtype=float)\n\n    # gentle uneven illumination, brighter towards one corner\n    yy, xx = np.mgrid[0:IMG_SIZE, 0:IMG_SIZE]\n    img += 14.0 * (yy / IMG_SIZE) + 9.0 * (xx / IMG_SIZE)\n\n    for _ in range(n_cells):\n        r = int(rng.integers(6, 12))\n        cy = int(rng.integers(r + 2, IMG_SIZE - r - 2))\n        cx = int(rng.integers(r + 2, IMG_SIZE - r - 2))\n        rr, cc = draw.disk((cy, cx), r, shape=img.shape)\n        img[rr, cc] += cell_peak * rng.uniform(0.75, 1.25)\n\n    img += rng.normal(0.0, noise, size=img.shape)\n\n    # isolated hot pixels, scattered over the whole frame\n    hot_y = rng.integers(0, IMG_SIZE, size=n_hot)\n    hot_x = rng.integers(0, IMG_SIZE, size=n_hot)\n    img[hot_y, hot_x] = 255.0\n\n    return np.clip(img, 0, 255).astype(np.uint8)\n\n\n# Field 1, and field 2 after the lamp drifted brighter.\nfield1 = make_field(seed=4101)\nfield2 = make_field(seed=4102, background=100.0, cell_peak=150.0)\n\nprint(&quot;field1:&quot;, field1.shape, field1.dtype,\n      &quot; min %d  max %d  mean %.1f&quot; % (field1.min(), field1.max(), field1.mean()))\nprint(&quot;field2:&quot;, field2.shape, field2.dtype,\n      &quot; min %d  max %d  mean %.1f&quot; % (field2.min(), field2.max(), field2.mean()))\nprint(&quot;&quot;)\nprint(&quot;someone tuned a fixed threshold of %d on field 1&quot; % FIXED_T)\n\n_fig, _axes = plt.subplots(1, 2, figsize=(9, 4.2))\nfor _ax, _im, _name in zip(_axes, [field1, field2], [&quot;field1&quot;, &quot;field2&quot;]):\n    _ax.imshow(_im, cmap=&quot;gray&quot;, vmin=0, vmax=255)\n    _ax.set_title(&quot;%s (mean %.0f)&quot; % (_name, _im.mean()))\n    _ax.axis(&quot;off&quot;)\n_fig.tight_layout()\nplt.show()</code></pre>"

    "key": "toolkit",
    "label": "Toolkit",
    "html": "<h2>Toolkit for this problem</h2>\n<table>\n<thead>\n<tr>\n<th>What you want to do</th>\n<th>How</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>look at an image</td>\n<td><code>ax.imshow(img, cmap=\"gray\", vmin=0, vmax=255)</code></td>\n</tr>\n<tr>\n<td>its size and type</td>\n<td><code>img.shape</code>, <code>img.dtype</code></td>\n</tr>\n<tr>\n<td>compute a threshold from the image</td>\n<td><code>filters.threshold_otsu(img)</code></td>\n</tr>\n<tr>\n<td>turn it into a mask</td>\n<td><code>mask = img &gt; t</code></td>\n</tr>\n<tr>\n<td>count foreground pixels</td>\n<td><code>int(mask.sum())</code></td>\n</tr>\n<tr>\n<td>the foreground fraction</td>\n<td><code>float(mask.mean())</code></td>\n</tr>\n<tr>\n<td>blur away pixel noise</td>\n<td><code>filters.gaussian(img, sigma=1.5)</code></td>\n</tr>\n<tr>\n<td>count separate objects</td>\n<td><code>measure.label(mask).max()</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>filters.gaussian</code> returns <strong>floats scaled to 0 to 1</strong>, not <code>uint8</code>. That does\nnot matter here, because Otsu is computed on whatever you hand it and the\ncomparison stays consistent, but it does mean the smoothed image will not look\nlike the original if you print its values.</p><pre class=\"code\"><code>import numpy as np\nimport matplotlib.pyplot as plt\nfrom skimage import draw, filters, measure\n\n# A tiny made up field. Nothing here is the answer.\ndemo_rng = np.random.default_rng(1)\ndemo = np.full((60, 60), 40.0)\nfor demo_c in [(15, 15), (40, 42), (20, 45)]:\n    demo_rr, demo_cc = draw.disk(demo_c, 7, shape=demo.shape)\n    demo[demo_rr, demo_cc] += 120.0\ndemo += demo_rng.normal(0.0, 12.0, size=demo.shape)       # heavy noise on purpose\ndemo = np.clip(demo, 0, 255).astype(np.uint8)\n\nprint(&quot;--- 1. an image is just an array ---&quot;)\nprint(&quot;shape :&quot;, demo.shape, &quot; dtype:&quot;, demo.dtype)\nprint(&quot;min %d  max %d  mean %.1f&quot; % (demo.min(), demo.max(), demo.mean()))\nprint(&quot;top left 4x4 corner:&quot;)\nprint(demo[:4, :4])\n\nprint(&quot;&quot;)\nprint(&quot;--- 2. a threshold gives a boolean mask ---&quot;)\ndemo_t = filters.threshold_otsu(demo)\ndemo_mask = demo &gt; demo_t\nprint(&quot;otsu threshold   :&quot;, demo_t)\nprint(&quot;mask dtype       :&quot;, demo_mask.dtype)\nprint(&quot;foreground pixels:&quot;, int(demo_mask.sum()))\nprint(&quot;foreground frac  : %.4f  &lt;- same as mask.mean()&quot; % float(demo_mask.mean()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 3. a fixed threshold does not travel ---&quot;)\ndemo_bright = np.clip(demo.astype(float) + 35.0, 0, 255).astype(np.uint8)\nprint(&quot;original, fixed t=90 : %.4f foreground&quot; % float((demo &gt; 90).mean()))\nprint(&quot;brighter, fixed t=90 : %.4f foreground  &lt;- the background crossed the line&quot;\n      % float((demo_bright &gt; 90).mean()))\nprint(&quot;brighter, otsu       : %.4f foreground  &lt;- otsu moved with the image&quot;\n      % float((demo_bright &gt; filters.threshold_otsu(demo_bright)).mean()))\n\nprint(&quot;&quot;)\nprint(&quot;--- 4. smoothing before thresholding removes speckle ---&quot;)\ndemo_smooth = filters.gaussian(demo, sigma=1.5)\nprint(&quot;gaussian output dtype:&quot;, demo_smooth.dtype,\n      &quot; range %.3f to %.3f  &lt;- rescaled to 0..1&quot; % (demo_smooth.min(), demo_smooth.max()))\ndemo_mask_s = demo_smooth &gt; filters.threshold_otsu(demo_smooth)\nprint(&quot;objects found on raw     :&quot;, int(measure.label(demo_mask).max()))\nprint(&quot;objects found on smoothed:&quot;, int(measure.label(demo_mask_s).max()))\nprint(&quot;there are really only 3; the extras are single noisy pixels&quot;)\n\ndemo_fig, demo_axes = plt.subplots(1, 3, figsize=(10, 3.4))\nfor demo_ax, demo_im, demo_title in zip(\n        demo_axes, [demo, demo_mask, demo_mask_s],\n        [&quot;raw&quot;, &quot;mask from raw&quot;, &quot;mask after blur&quot;]):\n    demo_ax.imshow(demo_im, cmap=&quot;gray&quot;)\n    demo_ax.set_title(demo_title)\n    demo_ax.axis(&quot;off&quot;)\ndemo_fig.tight_layout()\nplt.show()</code></pre>"
   },
   {
    "key": "parta",
    "label": "Part a",
    "html": "<h2>Part a. An Otsu threshold on field 1</h2>\n<p>Compute the threshold from the image rather than choosing one.\n<code>filters.threshold_otsu</code> looks at the histogram of <code>field1</code> and returns the\ngrey level that best separates its two populations.</p>\n<p>Turn that into a mask by comparing: <code>field1 &gt; otsu_t</code> gives a boolean array of\nthe same shape, True where the pixel is bright enough to be cell.</p>\n<p>Then two summaries of it. The number of foreground pixels is the sum of the\nmask, because True counts as 1. The fraction of the field that is foreground\nis its mean. Wrap them in <code>int</code> and <code>float</code> so they print cleanly.</p>\n<p>Have a look at the number you get for <code>frac_fg</code>. For a field with a couple of\ndozen cells on a plain background, a few percent is about right. Something\nnear a half would mean the threshold landed inside the background rather than\nbetween the two populations.</p>\n<p>Fill in <code>otsu_t</code>, <code>mask</code>, <code>n_fg</code>, <code>frac_fg</code>.</p>\n<p>Moves: <code>filters.threshold_otsu</code>, a comparison, <code>.sum()</code>, <code>.mean()</code>.</p><pre class=\"code\"><code># Part a. Threshold field 1 with Otsu.\n\notsu_t = None    # YOUR CODE: the Otsu threshold for field1\nmask = None      # YOUR CODE: boolean array, True where field1 is above it\nn_fg = None      # YOUR CODE: how many foreground pixels\nfrac_fg = None   # YOUR CODE: what fraction of the field is foreground\n\nprint(&quot;otsu threshold :&quot;, otsu_t)\nprint(&quot;foreground px  :&quot;, n_fg)\nprint(&quot;foreground frac:&quot;, frac_fg)\nif mask is not None:\n    fig, axes = plt.subplots(1, 2, figsize=(9, 4.2))\n    axes[0].imshow(field1, cmap=&quot;gray&quot;, vmin=0, vmax=255); axes[0].set_title(&quot;field1&quot;)\n    axes[1].imshow(mask, cmap=&quot;gray&quot;); axes[1].set_title(&quot;mask&quot;)\n    for a in axes: a.axis(&quot;off&quot;)\n    plt.show()</code></pre>"
   },
   {
    "key": "partb",
    "label": "Part b",
    "html": "<h2>Part b. What the fixed threshold does on the brighter field</h2>\n<p><code>field2</code> is the same kind of sample imaged after the lamp drifted, so its\nbackground sits much higher. Someone has already written <code>FIXED_T</code> into a\nprocessing script, tuned on field 1.</p>\n<p>Compute three numbers on <code>field2</code>: its own Otsu threshold, the foreground\nfraction that threshold gives, and the foreground fraction the fixed threshold\ngives.</p>\n<p>Then compare them against <code>frac_fg</code> from part a. Both fields contain a similar\nnumber of similar cells, so the honest answer is that both should come out at\na similar foreground fraction. One of these two approaches manages that and\nthe other does not, and the gap between them is the size of the error a fixed\nthreshold introduces when conditions move.</p>\n<p>Nothing about this failure is detectable from inside the script. No warning,\nno exception. The counts just change, and if you were not expecting them to,\nyou would read it as biology.</p>\n<p>Fill in <code>otsu_t2</code>, <code>frac_otsu_2</code>, <code>frac_fixed_2</code>.</p>\n<p>Moves: <code>filters.threshold_otsu</code>, comparisons, <code>.mean()</code>.</p><pre class=\"code\"><code># Part b. Field 2, thresholded two ways.\n\notsu_t2 = None       # YOUR CODE: the Otsu threshold computed from field2\nfrac_otsu_2 = None   # YOUR CODE: foreground fraction of field2 using its own Otsu\nfrac_fixed_2 = None  # YOUR CODE: foreground fraction of field2 using FIXED_T\n\nprint(&quot;field1 foreground frac (part a) :&quot;, frac_fg)\nprint(&quot;field2 otsu threshold           :&quot;, otsu_t2)\nprint(&quot;field2 foreground frac, otsu    :&quot;, frac_otsu_2)\nprint(&quot;field2 foreground frac, FIXED_T :&quot;, frac_fixed_2)</code></pre>"
   },
   {
    "key": "partc",
    "label": "Part c",
    "html": "<h2>Part c. Smooth first, and count what the noise was inventing</h2>\n<p>Camera noise is independent from pixel to pixel, so thresholding raw data\nscatters isolated bright pixels across the background. Each of those becomes\nits own tiny object, and anything that counts objects counts them as cells.</p>\n<p>Blur <code>field1</code> with <code>filters.gaussian</code> at <code>sigma=1.5</code>, which averages each\npixel with its immediate neighbours. Real cells are ten or more pixels across\nand survive this easily; single-pixel noise does not.</p>\n<p>Then threshold the smoothed image with its own Otsu value, since the blur\nchanges the histogram and the old threshold no longer applies. Note that\n<code>filters.gaussian</code> returns floats rescaled to 0 to 1, so <code>otsu_t</code> from part a\nis meaningless on it.</p>\n<p>Finally count connected objects in both masks with <code>measure.label(...).max()</code>,\nwhich labels each separate blob with its own integer and so tells you how many\nthere are. Compare the two counts against the couple of dozen cells actually\nin the field.</p>\n<p>Fill in <code>smoothed</code>, <code>mask_smooth</code>, <code>n_obj_raw</code>, <code>n_obj_smooth</code>.</p>\n<p>Moves: <code>filters.gaussian(img, sigma=1.5)</code>, <code>filters.threshold_otsu</code>,\n<code>measure.label(mask).max()</code>.</p><pre class=\"code\"><code># Part c. Blur first, then threshold, and count objects both ways.\n\nsmoothed = None       # YOUR CODE: field1 blurred with sigma=1.5\nmask_smooth = None    # YOUR CODE: smoothed, thresholded with ITS OWN otsu value\nn_obj_raw = None      # YOUR CODE: connected objects in the part a mask\nn_obj_smooth = None   # YOUR CODE: connected objects in mask_smooth\n\nprint(&quot;objects from the raw mask     :&quot;, n_obj_raw)\nprint(&quot;objects after blurring first  :&quot;, n_obj_smooth)\nif mask_smooth is not None:\n    fig, axes = plt.subplots(1, 2, figsize=(9, 4.2))\n    axes[0].imshow(mask, cmap=&quot;gray&quot;); axes[0].set_title(&quot;mask from raw&quot;)\n    axes[1].imshow(mask_smooth, cmap=&quot;gray&quot;); axes[1].set_title(&quot;mask after blur&quot;)\n    for a in axes: a.axis(&quot;off&quot;)\n    plt.show()</code></pre>"
